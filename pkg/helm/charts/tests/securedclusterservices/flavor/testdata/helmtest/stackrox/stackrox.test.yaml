tests:
- name: collector image
  expect: |
    assertMainIs("stackrox.io/main:3.0.99.0")
    assertCollectorIs("collector.stackrox.io/collector:3.0.99.0")

- name: scanner image
  server:
    visibleSchemas:
    - openshift-4.12
    availableSchemas:
    - openshift-4.12
  set:
    scannerV4.disable: false
  expect: |
    assertScannerIs("stackrox.io/scanner-v4:3.0.99.0")
    assertScannerDBIs("stackrox.io/scanner-v4-db:3.0.99.0")
