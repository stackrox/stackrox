tests:
- name: collector image
  expect: |
    assertMainIs("quay.io/stackrox-io/main:3.0.99.0")
    assertCollectorIs("quay.io/stackrox-io/collector:3.0.99.0")

- name: scanner image
  server:
    visibleSchemas:
    - openshift-4.12
    availableSchemas:
    - openshift-4.12
  set:
    scanner.disable: false
  expect: |
    # StackRox Scanner (Scanner V2, slim) is retired: it is never rendered even when
    # scanner.disable is explicitly set to false.
    .deployments["scanner"] | assertThat(. == null)
    .deployments["scanner-db"] | assertThat(. == null)
    assertScannerV4IndexerIs("quay.io/stackrox-io/scanner-v4:3.0.99.0")
    assertScannerV4DBIs("quay.io/stackrox-io/scanner-v4-db:3.0.99.0")
