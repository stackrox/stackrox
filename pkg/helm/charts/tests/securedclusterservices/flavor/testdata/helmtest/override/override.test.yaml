tests:
- name: collector image
  expect: |
    assertMainIs("test.registry/main:custom-main")
    assertCollectorIs("test.registry/collector:custom-collector")

- name: scanner image
  server:
    visibleSchemas:
    - openshift-4.12
    availableSchemas:
    - openshift-4.12
  set:
    scanner.disable: false
  expect: |
    # The legacy StackRox Scanner (slim) is retired: it is never rendered even when
    # scanner.disable is explicitly set to false. Local image scanning is provided by the
    # Scanner V4 indexer instead.
    .deployments["scanner"] | assertThat(. == null)
    .deployments["scanner-db"] | assertThat(. == null)
    assertScannerV4IndexerIs("test.registry/scanner-v4:custom-scanner-v4")
    assertScannerV4DBIs("test.registry/scanner-v4-db:custom-scanner-v4")
