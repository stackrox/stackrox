tests:
- name: collector image
  expect: |
    assertMainIs("quay.io/rhacs-eng/main:3.0.99.0")
    assertCollectorIs("quay.io/rhacs-eng/collector:99.9.9")
- name: slim mode ignored
  set:
    collector.slimMode: true
  expect: |
    assertMainIs("quay.io/rhacs-eng/main:3.0.99.0")
    assertCollectorIs("quay.io/rhacs-eng/collector:99.9.9")

- name: scanner image
  server:
    visibleSchemas:
    - openshift-4.12
    availableSchemas:
    - openshift-4.12
  set:
    scannerV4.disable: false
  expect: |
    assertScannerIs("quay.io/rhacs-eng/scanner-v4:3.0.99.0")
    assertScannerDBIs("quay.io/rhacs-eng/scanner-v4-db:3.0.99.0")
