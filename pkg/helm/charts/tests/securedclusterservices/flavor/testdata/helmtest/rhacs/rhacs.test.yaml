tests:
- name: collector image
  expect: |
    assertMainIs("registry.redhat.io/advanced-cluster-security/rhacs-main-rhel9:3.0.99.0")
    assertCollectorIs("registry.redhat.io/advanced-cluster-security/rhacs-collector-rhel9:3.0.99.0")

- name: scanner image
  server:
    visibleSchemas:
    - openshift-4.12
    availableSchemas:
    - openshift-4.12
  set:
    scanner.disable: false
  expect: |
    # The legacy StackRox Scanner (slim) is retired: it is never rendered even when
    # scanner.disable is explicitly set to false. Local image scanning is provided by the
    # Scanner V4 indexer instead.
    .deployments["scanner"] | assertThat(. == null)
    .deployments["scanner-db"] | assertThat(. == null)
    assertScannerV4IndexerIs("registry.redhat.io/advanced-cluster-security/rhacs-scanner-v4-rhel9:3.0.99.0")
    assertScannerV4DBIs("registry.redhat.io/advanced-cluster-security/rhacs-scanner-v4-db-rhel9:3.0.99.0")
