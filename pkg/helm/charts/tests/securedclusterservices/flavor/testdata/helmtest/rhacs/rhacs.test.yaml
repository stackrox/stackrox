tests:
- name: collector image
  expect: |
    assertMainIs("registry.redhat.io/advanced-cluster-security/rhacs-main-rhel9:3.0.99.0")
    assertCollectorIs("registry.redhat.io/advanced-cluster-security/rhacs-collector-rhel9:3.0.99.0")

- name: scanner image
  server:
    visibleSchemas:
    - openshift-4.12
    availableSchemas:
    - openshift-4.12
  set:
    scannerV4.disable: false
  expect: |
    assertScannerIs("registry.redhat.io/advanced-cluster-security/rhacs-scanner-v4-rhel9:3.0.99.0")
    assertScannerDBIs("registry.redhat.io/advanced-cluster-security/rhacs-scanner-v4-db-rhel9:3.0.99.0")
