# StackRox Scanner (Scanner V2, slim) is retired and is never installed by the
# secured-cluster chart, regardless of the scanner.* settings. These tests assert the V2
# slim scanner is never rendered (even when explicitly enabled), while local image
# scanning continues to work via Scanner V4.
values:
  monitoring:
    openshift:
      enabled: false
server:
  visibleSchemas:
  - openshift-4.12
  availableSchemas:
  - openshift-4.12
tests:
- name: "Scanner V2 slim is never rendered, even when explicitly enabled"
  set:
    imagePullSecrets.allowNone: true
    scanner.disable: false
    scanner.mode: "slim"
  expect: |
    .deployments["scanner"] | assertThat(. == null)
    .deployments["scanner-db"] | assertThat(. == null)
    .serviceaccounts["scanner"] | assertThat(. == null)
  tests:
  - name: "on openshift 4"

- name: "Scanner V2 slim is not enabled by default"
  set:
    imagePullSecrets.allowNone: true
  expect: |
    .deployments["scanner"] | assertThat(. == null)
    .deployments["scanner-db"] | assertThat(. == null)
    .serviceaccounts["scanner"] | assertThat(. == null)

- name: "scanner V4 is enabled by default"
  set:
    imagePullSecrets.allowNone: true
  expect: |
    .deployments["scanner-v4-indexer"] | assertThat(. != null)
    .deployments["scanner-v4-db"] | assertThat(. != null)
    .serviceaccounts["scanner-v4"] | assertThat(. != null)

- name: "sensor only connects to local scanner when it is enabled"
  set:
    imagePullSecrets.allowNone: true
  tests:
  - name: "local scanning enabled via Scanner V4 default"
    expect: |
      envVars(.deployments.sensor; "sensor")["ROX_LOCAL_IMAGE_SCANNING_ENABLED"] | assertThat(. == "true")
  - name: "local scanning enabled when Scanner V4 explicitly enabled"
    set:
      scannerV4.disable: false
    expect: |
      envVars(.deployments.sensor; "sensor")["ROX_LOCAL_IMAGE_SCANNING_ENABLED"] | assertThat(. == "true")
  - name: "local scanning disabled when Scanner V4 disabled"
    set:
      scannerV4.disable: true
    expect: |
      envVars(.deployments.sensor; "sensor")| assertThat(has("ROX_LOCAL_IMAGE_SCANNING_ENABLED") == false)

- name: "Installation fails in full mode"
  values:
    imagePullSecrets:
      allowNone: true
    scanner:
      disable: false
      mode: full
  expectError: true
  expect: |
    .error | assertThat(contains("set to slim mode: scanner.mode=slim"))
