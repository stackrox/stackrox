values:
  imagePullSecrets:
    allowNone: true
server:
  availableSchemas:
  - openshift-4.12
  - com.coreos
tests:
- name: "Central custom metrics are default off"
  set:
    env.openshift: 4
  expect: |
    .servicemonitors["sensor-central-metrics-stackrox"] | assertThat(. == null)
    [.deployments.sensor.spec.template.spec.containers[0].env[] | select(.name == "ROX_SECURED_CLUSTER_METRICS_ENABLED")] | length | assertThat(. == 0)

- name: "Central custom metrics are explicitly opted in without other OpenShift monitoring"
  set:
    env.openshift: 4
    monitoring.openshift.enabled: false
    monitoring.openshift.custom.enabled: true
  expect: |
    .servicemonitors["sensor-monitor-stackrox"] | assertThat(. == null)
    .servicemonitors["sensor-central-metrics-stackrox"].metadata.namespace | assertThat(. == "openshift-monitoring")
    .servicemonitors["sensor-central-metrics-stackrox"].spec.endpoints[].path | assertThat(. == "/proxy/central/metrics")
    .servicemonitors["sensor-central-metrics-stackrox"].spec.endpoints[].tlsConfig.serverName | assertThat(. == "sensor-proxy.stackrox.svc")
    .servicemonitors["sensor-central-metrics-stackrox"].spec.selector.matchLabels["stackrox.io/sensor-proxy"] | assertThat(. == "true")
    .rolebindings["rhacs-sensor-auth-reader-stackrox"] | assertThat(. != null)
    .roles["secured-cluster-prometheus-k8s"] | assertThat(. != null)
    .rolebindings["secured-cluster-prometheus-k8s"] | assertThat(. != null)
    .services["sensor-proxy"].metadata.labels["stackrox.io/sensor-proxy"] | assertThat(. == "true")
    .services.sensor.metadata.labels["stackrox.io/sensor-proxy"] | assertThat(. == null)
    .services["sensor-webhook"].metadata.labels["stackrox.io/sensor-proxy"] | assertThat(. == null)
    .networkpolicys["sensor-proxy"] | assertThat(. != null)
    .deployments.sensor.spec.template.spec.containers[0].env[] |
      select(.name == "ROX_SECURED_CLUSTER_METRICS_ENABLED") | assertThat(.value == "true")

- name: "Central custom metrics opt-in is ignored outside OpenShift"
  set:
    env.openshift: false
    monitoring.openshift.custom.enabled: true
  expect: |
    .servicemonitors["sensor-central-metrics-stackrox"] | assertThat(. == null)
    [.deployments.sensor.spec.template.spec.containers[0].env[] | select(.name == "ROX_SECURED_CLUSTER_METRICS_ENABLED")] | length | assertThat(. == 0)

- name: "When enabled (legacy)"
  set:
    enableOpenShiftMonitoring: true
    env.openshift: 4
  tests: &enabled-test
    - name: "resources are created for prometheus-operator"
      expect: |
        .roles["secured-cluster-prometheus-k8s"] | assertThat(. != null)
        .rolebindings["secured-cluster-prometheus-k8s"] | assertThat(. != null)
        .rolebindings["rhacs-sensor-auth-reader-stackrox"] | assertThat(. != null)
        .rolebindings["rhacs-admission-control-auth-reader-stackrox"] | assertThat(. != null)
        .servicemonitors["sensor-monitor-stackrox"] | [
            assertThat(.metadata.namespace == "openshift-monitoring"),
            assertThat(.spec.endpoints[].port == "monitoring-tls")
          ]
        .servicemonitors["admission-control-monitor-stackrox"] | [
            assertThat(.metadata.namespace == "openshift-monitoring"),
            assertThat(.spec.endpoints[].port == "monitoring-tls"),
            assertThat(.spec.selector.matchLabels["app.kubernetes.io/component"] == "admission-control")
          ]

    - name: "secure metrics endpoint is enabled"
      expect: |
        .deployments.sensor.spec.template.spec.containers[0].env[] |
          select(.name == "ROX_ENABLE_SECURE_METRICS") | assertThat(.value == "true")
        .deployments.sensor.spec.template.spec.containers[0].ports[] |
          select(.name == "monitoring-tls") | assertThat(.containerPort == 9091)
        .deployments.sensor.spec.template.spec.containers[0].volumeMounts[] |
          select(.name == "monitoring-tls") | assertThat(.mountPath == "/run/secrets/stackrox.io/monitoring-tls")
        .services.sensor.spec.ports[] | select(.name == "monitoring-tls") | [
            assertThat(.targetPort == "monitoring-tls"),
            assertThat(.port == 9091)
          ]
        .networkpolicys["sensor-monitoring-tls"] | assertThat(. != null)
        .deployments["admission-control"].spec.template.spec.containers[0].env[] |
          select(.name == "ROX_ENABLE_SECURE_METRICS") | assertThat(.value == "true")
        .deployments["admission-control"].spec.template.spec.containers[0].ports[] |
          select(.name == "monitoring-tls") | assertThat(.containerPort == 9091)
        .deployments["admission-control"].spec.template.spec.containers[0].volumeMounts[] |
          select(.name == "monitoring-tls") | assertThat(.mountPath == "/run/secrets/stackrox.io/monitoring-tls")
        .services["admission-control"].spec.ports[] | select(.name == "monitoring-tls") | [
            assertThat(.targetPort == "monitoring-tls"),
            assertThat(.port == 9091)
          ]
        .networkpolicys["admission-control-monitoring-tls"] | assertThat(. != null)

- name: "When enabled"
  set:
    monitoring.openshift.enabled: true
    env.openshift: 4
  tests: *enabled-test

- name: "When enabled with Scanner V4"
  set:
    monitoring.openshift.enabled: true
    env.openshift: 4
    scannerV4:
      disable: false
  tests:
    - name: "resources are created for prometheus-operator"
      expect: |
        .roles["secured-cluster-prometheus-k8s"] | assertThat(. != null)
        .rolebindings["secured-cluster-prometheus-k8s"] | assertThat(. != null)
        .rolebindings["rhacs-sensor-auth-reader-stackrox"] | assertThat(. != null)
        .rolebindings["rhacs-admission-control-auth-reader-stackrox"] | assertThat(. != null)
        .servicemonitors["sensor-monitor-stackrox"] | [
            assertThat(.metadata.namespace == "openshift-monitoring"),
            assertThat(.spec.endpoints[].port == "monitoring-tls")
          ]
        .servicemonitors["admission-control-monitor-stackrox"] | [
            assertThat(.metadata.namespace == "openshift-monitoring"),
            assertThat(.spec.endpoints[].port == "monitoring-tls"),
            assertThat(.spec.selector.matchLabels["app.kubernetes.io/component"] == "admission-control")
          ]
        .rolebindings["rhacs-scanner-v4-auth-reader-stackrox"] | assertThat(. != null)
        .servicemonitors["scanner-v4-monitor-stackrox"] | [
            assertThat(.metadata.namespace == "openshift-monitoring"),
            assertThat(.spec.endpoints[].port == "indexer-monitoring-tls")
          ]

    - name: "secure metrics endpoint is enabled"
      expect: |
        .deployments.sensor.spec.template.spec.containers[0].env[] |
          select(.name == "ROX_ENABLE_SECURE_METRICS") | assertThat(.value == "true")
        .deployments.sensor.spec.template.spec.containers[0].ports[] |
          select(.name == "monitoring-tls") | assertThat(.containerPort == 9091)
        .deployments.sensor.spec.template.spec.containers[0].volumeMounts[] |
          select(.name == "monitoring-tls") | assertThat(.mountPath == "/run/secrets/stackrox.io/monitoring-tls")
        .services.sensor.spec.ports[] | select(.name == "monitoring-tls") | [
            assertThat(.targetPort == "monitoring-tls"),
            assertThat(.port == 9091)
          ]
        .networkpolicys["sensor-monitoring-tls"] | assertThat(. != null)
        .deployments["admission-control"].spec.template.spec.containers[0].env[] |
          select(.name == "ROX_ENABLE_SECURE_METRICS") | assertThat(.value == "true")
        .deployments["admission-control"].spec.template.spec.containers[0].ports[] |
          select(.name == "monitoring-tls") | assertThat(.containerPort == 9091)
        .deployments["admission-control"].spec.template.spec.containers[0].volumeMounts[] |
          select(.name == "monitoring-tls") | assertThat(.mountPath == "/run/secrets/stackrox.io/monitoring-tls")
        .services["admission-control"].spec.ports[] | select(.name == "monitoring-tls") | [
            assertThat(.targetPort == "monitoring-tls"),
            assertThat(.port == 9091)
          ]
        .networkpolicys["admission-control-monitoring-tls"] | assertThat(. != null)
        .deployments["scanner-v4-indexer"].spec.template.spec.containers[0].env[] |
          select(.name == "ROX_ENABLE_SECURE_METRICS") | assertThat(.value == "true")
        .deployments["scanner-v4-indexer"].spec.template.spec.containers[0].env[] |
          select(.name == "ROX_SECURE_METRICS_PORT") | assertThat(.value == ":9091")
        .deployments["scanner-v4-indexer"].spec.template.spec.containers[0].ports[] |
          select(.name == "monitoring-tls") | assertThat(.containerPort == 9091)
        .deployments["scanner-v4-indexer"].spec.template.spec.containers[0].volumeMounts[] |
          select(.name == "monitoring-tls") | assertThat(.mountPath == "/run/secrets/stackrox.io/monitoring-tls")
        .services["scanner-v4-indexer"].spec.ports[] | select(.name == "indexer-monitoring-tls") | [
            assertThat(.targetPort == "monitoring-tls"),
            assertThat(.port == 9091)
          ]
        .networkpolicys["scanner-v4-indexer-monitoring-tls"] | assertThat(. != null)

- name: "Scanner V4 DB PVC space alerts"
  set:
    monitoring.openshift.enabled: true
    env.openshift: 4
    scannerV4.disable: false
  tests:
    # Scanner V4 DB in the secured cluster only uses a PVC when a default
    # StorageClass is present; otherwise it falls back to emptyDir and no PVC
    # alert should be emitted.
    - name: "warning and critical alerts are created when PVC-backed"
      server:
        objects:
        - apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: def-sc
            annotations:
              storageclass.kubernetes.io/is-default-class: true
      expect: |
        .prometheusrules["scanner-v4-db-stackrox"].spec.groups |
          assertThat(any(.[]; .name == "rhacs.scanner-v4-db"))
        .prometheusrules["scanner-v4-db-stackrox"].spec.groups[] |
          select(.name == "rhacs.scanner-v4-db") | .rules | [
            assertThat(length == 2),
            assertThat(all(.[]; .alert == "ScannerV4DBPersistentVolumeFillingUp")),
            assertThat(any(.[]; .labels.severity == "warning")),
            assertThat(any(.[]; .labels.severity == "critical"))
          ]
        .prometheusrules["scanner-v4-db-stackrox"].spec.groups[] |
          select(.name == "rhacs.scanner-v4-db") | .rules[] |
          select(.labels.severity == "warning") |
          assertThat(.expr | contains("persistentvolumeclaim=\"scanner-v4-db\"") and contains("> 0.8"))

    - name: "alerts target the PVC namespace when overridden"
      release:
        namespace: default
      set:
        meta.namespaceOverride: my-stackrox
        allowNonstandardNamespace: true
      server:
        objects:
        - apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: def-sc
            annotations:
              storageclass.kubernetes.io/is-default-class: true
      expect: |
        .persistentvolumeclaims["scanner-v4-db"].metadata.namespace | assertThat(. == "my-stackrox")
        .prometheusrules["scanner-v4-db-default"].spec.groups[] |
          select(.name == "rhacs.scanner-v4-db") | .rules[] | [
            assertThat(.expr | contains("kubelet_volume_stats_used_bytes{namespace=\"my-stackrox\"")),
            assertThat(.expr | contains("kubelet_volume_stats_capacity_bytes{namespace=\"my-stackrox\"")),
            assertThat(.annotations.description | contains("in namespace my-stackrox"))
          ]

    - name: "omitted when scanner-v4-db falls back to emptyDir (no default StorageClass)"
      expect: |
        .prometheusrules["scanner-v4-db-stackrox"] | assertThat(. == null)

    - name: "omitted when Scanner V4 is disabled"
      set:
        scannerV4.disable: true
      expect: |
        .prometheusrules["scanner-v4-db-stackrox"] | assertThat(. == null)

- name: "When enabled via default value"
  set:
    env.openshift: 4
  tests: *enabled-test

- name: "When disabled"
  set:
    monitoring.openshift.enabled: false
    env.openshift: 4
  tests: &disabled-test
    - name: "resources are not created for prometheus-operator"
      expect: |
        .roles["secured-cluster-prometheus-k8s"] | assertThat(. == null)
        .rolebindings["secured-cluster-prometheus-k8s"] | assertThat(. == null)
        .rolebindings["rhacs-sensor-auth-reader-stackrox"] | assertThat(. == null)
        .rolebindings["rhacs-admission-control-auth-reader-stackrox"] | assertThat(. == null)
        .servicemonitors["sensor-monitor-stackrox"] | assertThat(. == null)
        .servicemonitors["admission-control-monitor-stackrox"] | assertThat(. == null)

    - name: "secure metrics endpoint is disabled"
      expect: |
        .networkpolicys["sensor-monitoring-tls"] | assertThat(. == null)
        .networkpolicys["admission-control-monitoring-tls"] | assertThat(. == null)

- name: "Disable override when on non-OpenShift environment"
  set:
    monitoring.openshift.enabled: true
    env.openshift: false
  tests: *disabled-test

- name: "Disable override when on non-OpenShift environment (legacy)"
  set:
    enableOpenShiftMonitoring: true
    env.openshift: false
  tests: *disabled-test

- name: "Network policy is enabled"
  set:
    env.openshift: 4
    scannerV4.disable: false
    monitoring.openshift.enabled: true
    network.enableNetworkPolicies: true
  expect: |
    .networkpolicys["sensor-monitoring-tls"] | assertThat(. != null)
    .networkpolicys["admission-control-monitoring-tls"] | assertThat(. != null)
    .networkpolicys["scanner-v4-indexer-monitoring-tls"] | assertThat(. != null)

- name: "Network policy is disabled"
  set:
    env.openshift: 4
    scannerV4.disable: false
    monitoring.openshift.enabled: true
    network.enableNetworkPolicies: false
  expect: |
    .networkpolicys["sensor-monitoring-tls"] | assertThat(. == null)
    .networkpolicys["admission-control-monitoring-tls"] | assertThat(. == null)
    .networkpolicys["scanner-v4-indexer-monitoring-tls"] | assertThat(. == null)
