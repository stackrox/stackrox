values:
  imagePullSecrets:
    allowNone: true
tests:
- name: "with default settings"
  expect: |
    .deployments.central.spec.template.spec.tolerations | assertThat(. == null)
    .deployments["config-controller"].spec.template.spec.tolerations | assertThat(. == null)

- name: "with empty string settings"
  values:
    central:
      tolerations: ""
    configController:
      tolerations: ""
    scanner:
      tolerations: ""
      dbTolerations: ""
  expect: |
    .deployments.central.spec.template.spec.tolerations | assertThat(. == null)
    .deployments["config-controller"].spec.template.spec.tolerations | assertThat(. == null)

- name: "with empty dict settings"
  values:
    central:
      tolerations: {}
    configController:
      tolerations: {}
    scanner:
      tolerations: {}
      dbTolerations: {}
  expect: |
    .deployments.central.spec.template.spec.tolerations | assertThat(length == 0)
    .deployments["config-controller"].spec.template.spec.tolerations | assertThat(length == 0)

- name: "with populated settings via dictionary"
  values:
    central:
      tolerations:
      - key: "node-role.kubernetes.io/infra"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
    configController:
      tolerations:
      - key: "node-role.kubernetes.io/infra"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
    scanner:
      tolerations:
      - key: "node-role.kubernetes.io/infra"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
      dbTolerations:
      - key: "node-role.kubernetes.io/infra"
        operator: "Exists"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
  expect: |
    .deployments.central.spec.template.spec.tolerations | assertThat(length == 2)
    .deployments["config-controller"].spec.template.spec.tolerations | assertThat(length == 2)

# Scanner V4 (the current scanner) tolerations propagation to its components.
- name: "with scannerV4 component tolerations"
  values:
    scannerV4:
      disable: false
      indexer:
        tolerations:
        - key: "node-role.kubernetes.io/infra"
          operator: "Exists"
      matcher:
        tolerations:
        - key: "node-role.kubernetes.io/infra"
          operator: "Exists"
      db:
        tolerations:
        - key: "node-role.kubernetes.io/infra"
          operator: "Exists"
  expect: |
    .deployments["scanner-v4-indexer"].spec.template.spec.tolerations | assertThat(length == 1)
    .deployments["scanner-v4-matcher"].spec.template.spec.tolerations | assertThat(length == 1)
    .deployments["scanner-v4-db"].spec.template.spec.tolerations | assertThat(length == 1)
