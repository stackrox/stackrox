# StackRox Scanner (Scanner V2) is retired and is never installed by the central-services
# chart, regardless of the scanner.* settings. These tests assert that none of the V2
# scanner / scanner-db resources are rendered, even when a user explicitly requests them
# (in which case the chart emits a warning and coerces the component off). Scanner V4
# (see scanner-v4.test.yaml) provides image scanning instead.
values:
  ca:
    cert: ""
    key: ""
  imagePullSecrets:
    allowNone: true
  scanner:
    serviceTLS:
      cert: ""
      key: ""
    dbServiceTLS:
      cert: ""
      key: ""
  monitoring:
    openshift:
      enabled: false
tests:
- name: "StackRox Scanner (V2) is never rendered"
  expect: |
    .serviceaccounts["scanner"] | assertThat(. == null)
    .secrets["scanner-db-password"] | assertThat(. == null)
    .configmaps["scanner-config"] | assertThat(. == null)
    .deployments["scanner"] | assertThat(. == null)
    .deployments["scanner-db"] | assertThat(. == null)
    .services["scanner"] | assertThat(. == null)
    .services["scanner-db"] | assertThat(. == null)
    .networkpolicys["scanner"] | assertThat(. == null)
    .networkpolicys["scanner-db"] | assertThat(. == null)
    .secrets["scanner-tls"] | assertThat(. == null)
    .secrets["scanner-db-tls"] | assertThat(. == null)
    .horizontalpodautoscalers["scanner"] | assertThat(. == null)
  tests:
  - name: "with default settings"
  - name: "even when explicitly enabled"
    set:
      scanner.disable: false
  - name: "even when explicitly enabled in full mode"
    set:
      scanner.disable: false
      scanner.mode: full
  - name: "even when explicitly enabled in slim mode"
    set:
      scanner.disable: false
      scanner.mode: slim

- name: "StackRox Scanner (V2) PodSecurityPolicies are never rendered"
  values:
    system:
      enablePodSecurityPolicies: true
  expect: |
    .podsecuritypolicys["stackrox-scanner"] | assertThat(. == null)
    .rolebindings["stackrox-scanner-psp"] | assertThat(. == null)
    .clusterroles["stackrox-scanner-psp"] | assertThat(. == null)

- name: "StackRox Scanner (V2) SCC resources are never rendered on OpenShift 4"
  server:
    visibleSchemas:
    - openshift-4.12
    availableSchemas:
    - openshift-4.12
  values:
    env:
      openshift: 4
  expect: |
    .roles["use-scanner-scc"] | assertThat(. == null)
    .rolebindings["scanner-use-scc"] | assertThat(. == null)
