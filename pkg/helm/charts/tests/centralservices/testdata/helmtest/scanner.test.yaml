values:
  ca:
    cert: ""
    key: ""
  imagePullSecrets:
    allowNone: true
  monitoring:
    openshift:
      enabled: false
tests:
- name: "scanner v2 is not deployed"
  expect: |
    .deployments["scanner"] | assertThat(. == null)
    .deployments["scanner-db"] | assertThat(. == null)
    .services["scanner"] | assertThat(. == null)
    .services["scanner-db"] | assertThat(. == null)
    .serviceaccounts["scanner"] | assertThat(. == null)
    .networkpolicys["scanner"] | assertThat(. == null)
    .networkpolicys["scanner-db"] | assertThat(. == null)
  tests:
  - name: "with default settings"
  - name: "when scanner.disable is explicitly set to false"
    set:
      scanner.disable: false
  - name: "when scanner.disable is explicitly set to true"
    set:
      scanner.disable: true
