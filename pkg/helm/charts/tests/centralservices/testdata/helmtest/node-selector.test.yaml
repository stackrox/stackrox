values:
  imagePullSecrets:
    allowNone: true
tests:
- name: "with default settings"
  expect: |
    .deployments.central.spec.template.spec.nodeSelector | assertThat(. == null)
    .deployments["config-controller"].spec.template.spec.nodeSelector | assertThat(. == null)
    .deployments.scanner.spec.template.spec.nodeSelector | assertThat(. == null)
    .deployments["scanner-db"].spec.template.spec.nodeSelector | assertThat(. == null)

- name: "with empty string settings"
  values:
    central:
      nodeSelector: ""
    configController:
      nodeSelector: ""
    scanner:
      nodeSelector: ""
      dbNodeSelector: ""
  expect: |
    .deployments.central.spec.template.spec.nodeSelector | assertThat(. == null)
    .deployments["config-controller"].spec.template.spec.nodeSelector | assertThat(. == null)
    .deployments.scanner.spec.template.spec.nodeSelector | assertThat(. == null)
    .deployments["scanner-db"].spec.template.spec.nodeSelector | assertThat(. == null)

- name: "with empty dict settings"
  values:
    central:
      nodeSelector: {}
    configController:
      nodeSelector: {}
    scanner:
      nodeSelector: {}
      dbNodeSelector: {}
  expect: |
    .deployments.central.spec.template.spec.nodeSelector | assertThat(length == 0)
    .deployments["config-controller"].spec.template.spec.nodeSelector | assertThat(length == 0)

# Scanner V2 (scanner/scanner-db) is retired and never rendered, so it is omitted here.
- name: "with populated settings"
  expect: |
    .deployments.central.spec.template.spec.nodeSelector | assertThat(.role == "central")
    .deployments["config-controller"].spec.template.spec.nodeSelector | assertThat(.role == "config-controller")
    [.deployments.central, .deployments["config-controller"]][] |
      .spec.template.spec.nodeSelector | assertThat(.foo == "bar")

  tests:
  - name: "via dictionary"
    values:
      central:
        nodeSelector:
          foo: bar
          role: central
      configController:
        nodeSelector:
          foo: bar
          role: "config-controller"
      scanner:
        nodeSelector:
          foo: bar
          role: scanner
        dbNodeSelector:
          foo: bar
          role: "scanner-db"
  - name: "via strings"
    values:
      central:
        nodeSelector: |
          foo: bar
          role: central
      configController:
        nodeSelector: |
          foo: bar
          role: "config-controller"
      scanner:
        nodeSelector: |
          foo: bar
          role: scanner
        dbNodeSelector: |
          foo: bar
          role: "scanner-db"

# Scanner V4 (the current scanner) node-selector propagation to its components.
- name: "with scannerV4 component node selectors"
  values:
    scannerV4:
      disable: false
      indexer:
        nodeSelector:
          role: scanner-v4-indexer
      matcher:
        nodeSelector:
          role: scanner-v4-matcher
      db:
        nodeSelector:
          role: scanner-v4-db
  expect: |
    .deployments["scanner-v4-indexer"].spec.template.spec.nodeSelector | assertThat(.role == "scanner-v4-indexer")
    .deployments["scanner-v4-matcher"].spec.template.spec.nodeSelector | assertThat(.role == "scanner-v4-matcher")
    .deployments["scanner-v4-db"].spec.template.spec.nodeSelector | assertThat(.role == "scanner-v4-db")
