values:
  imagePullSecrets:
    allowNone: true
tests:
- name: "central-worker is enabled by default"
  expect: |
    .deployments["central-worker"] | assertThat(. != null)
    .serviceaccounts["central-worker"] | assertThat(. != null)
    container(.deployments["central-worker"]; "central-worker") | .command | assertThat(. == ["/stackrox/central-worker"])
    container(.deployments["central-worker"]; "central-worker") | .env[] | select(.name == "ROX_CENTRAL_WORKER_ENABLED") | assertThat(.value == "true")
    [container(.deployments["central-worker"]; "central-worker") | .env[] | select(.name == "ROX_CENTRAL_WORKER_ENABLED")] | assertThat(length == 1)
    container(.deployments.central; "central") | .env[] | select(.name == "ROX_CENTRAL_WORKER_ENABLED") | assertThat(.value == "true")
    [container(.deployments.central; "central") | .env[] | select(.name == "ROX_CENTRAL_WORKER_ENABLED")] | assertThat(length == 1)
  tests:
  - name: "with network policies"
    values:
      network:
        enableNetworkPolicies: true
    expect: |
      .networkpolicys["central-worker"] | assertThat(. != null)
      .networkpolicys["central-db"].spec.ingress[].from[].podSelector.matchLabels.app | select(. == "central-worker") | assertThat(. == "central-worker")

- name: "central-worker can be disabled"
  values:
    centralWorker:
      enabled: false
  expect: |
    .deployments["central-worker"] | assertThat(. == null)
    .serviceaccounts["central-worker"] | assertThat(. == null)
    .networkpolicys["central-worker"] | assertThat(. == null)
    [container(.deployments.central; "central") | .env[] | select(.name == "ROX_CENTRAL_WORKER_ENABLED")] | assertThat(length == 0)
