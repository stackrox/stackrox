{{- include "srox.init" . -}}

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "srox.globalResourceName" (list . "stackrox:lightspeed-query-access") }}
  labels:
    {{- include "srox.labels" (list . "clusterrolebinding" "stackrox:lightspeed-query-access") | nindent 4 }}
  annotations:
    {{- include "srox.annotations" (list . "clusterrolebinding" "stackrox:lightspeed-query-access") | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: sensor
  namespace: {{ ._rox._namespace }}
roleRef:
  kind: ClusterRole
  name: lightspeed-operator-query-access
  apiGroup: rbac.authorization.k8s.io
