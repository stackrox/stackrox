{{- include "srox.init" . -}}

{{- if ._rox.monitoring.openshift.enabled -}}

apiVersion: v1
kind: Service
metadata:
  name: central-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srox.labels" (list . "service" "central-monitoring") | nindent 4 }}
    stackrox.io/monitoring-api: "true"
  annotations:
    {{- include "srox.annotations" (list . "service" "central-monitoring") | nindent 4 }}
    service.beta.openshift.io/serving-cert-secret-name: central-api-monitoring-tls
spec:
  ports:
  - name: https
    port: 443
    targetPort: api
  selector:
    app: central
  type: ClusterIP

{{- end -}}
