# Disposable label/check aggregation experiment. Do not merge.
---
name: e2e-qa-tests
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qa-e2e-tests:
    if: inputs.should-run
    runs-on: ubuntu-24.04
    timeout-minutes: "${{ inputs.job-timeout-minutes }}"
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ github.event_name == 'workflow_dispatch' && 'run' ||
          inputs.ci-action }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: steps.ci-decision.outputs.action != 'skip'
'on':
  workflow_call:
    inputs:
      ci-action:
        description: Applied CI selection decision; missing or invalid values run.
        type: string
        default: run
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the
          job should be skipped.
        required: true
        type: boolean
      tag:
        description: Image tag to test.
        required: true
        type: string
      ci-job-name:
        description: Unique job name, e.g. e2e-qa-tests-<cluster flavor>. Used to
          configure the image prefetcher and name uploaded artifacts. Propagated to
          tests as CI_JOB_NAME for test dispatching.
        required: true
        type: string
      cluster-name-prefix:
        description: Used as prefix in provisioned cluster names. Maximum 20 characters.
        required: true
        type: string
      cluster-provisioning-method:
        description: 'Selects cluster provisioning method to use (supported: direct-gke,
          infra).'
        type: string
        default: direct-gke
      extra-env-vars:
        description: Environment variables for this flavor of QA E2E tests, as multi-line
          KEY=VALUE pairs
        required: false
        type: string
      infra-flavor:
        description: Infra cluster flavor, e.g. gke-default, ocp-4.
        type: string
        default: gke-default
      infra-args:
        description: Infra cluster args as multi-line KEY=VALUE pairs, one per line.
        type: string
        default: |
          nodes=3
          machine-type=e2-standard-8
      infra-lifespan:
        description: Infra cluster lifespan (auto-deleted after expiry).
        type: string
        default: 5h
      cluster-wait-timeout-minutes:
        description: Timeout for waiting on cluster provisioning (OCP needs longer).
        type: number
        default: 25
      job-timeout-minutes:
        description: Overall job timeout.
        type: number
        default: 361
      part1-timeout-minutes:
        description: Part 1 test timeout.
        type: number
        default: 245
      part2-timeout-minutes:
        description: Part 2 test timeout.
        type: number
        default: 35
      db-backup-restore-timeout-minutes:
        description: DB backup and restore test timeout.
        type: number
        default: 30
