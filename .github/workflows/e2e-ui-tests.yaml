name: e2e-ui-tests

on:
  workflow_call:
    inputs:
      ci-action:
        description: Applied CI selection decision; missing or invalid values run.
        type: string
        default: run
      should-run:
        description: "true if should really run the job. false - otherwise, i.e. the job should be skipped."
        required: true
        type: boolean
      tag:
        description: "Image tag to test."
        required: true
        type: string
      ci-job-name:
        description: "Unique job name, e.g. gke-ui-e2e-tests-<variant>. Used to configure the image prefetcher and name uploaded artifacts. Propagated to tests as CI_JOB_NAME."
        required: true
        type: string
      cluster-name-prefix:
        description: "Used as prefix in provisioned cluster names. Maximum 20 characters."
        required: true
        type: string
      extra-env-vars:
        description: "Environment variables for this flavor of UI E2E tests, as multi-line KEY=VALUE pairs"
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gke-ui-e2e-tests:
    if: inputs.should-run
    runs-on: ubuntu-24.04
    env:
      MAIN_IMAGE_TAG: ${{ inputs.tag }}
      BUILD_TAG: ${{ inputs.tag }}
      CI_JOB_NAME: ${{ inputs.ci-job-name }}
      ARTIFACT_DIR: ./junit-reports
      LOAD_BALANCER: lb
      ORCHESTRATOR_FLAVOR: k8s
      KUBERNETES_PROVIDER: gke
      STORAGE_CLASS: stackrox-gke-ssd
      SCANNER_V4_DB_STORAGE_CLASS: stackrox-gke-ssd
      USE_ROXIE_DEPLOY: "true"
      PYTHONUNBUFFERED: "1"
      GCP_SERVICE_ACCOUNT_STACKROX_CI: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
      CLUSTER_NAME_PREFIX: ${{ inputs.cluster-name-prefix }}
    timeout-minutes: 150
    steps:

    - name: Read CI selection
      id: ci-decision
      shell: bash
      env:
        CI_SELECT_ACTION: ${{ github.event_name == 'workflow_dispatch' && 'run' || inputs.ci-action }}
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"

    - name: Checkout repo
      if: steps.ci-decision.outputs.action != 'skip'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - uses: ./.github/actions/job-preamble
      if: steps.ci-decision.outputs.action != 'skip'
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Set extra environment variables
      if: steps.ci-decision.outputs.action != 'skip'
      env:
        EXTRA_ENV_VARS: ${{ inputs.extra-env-vars }}
      run: |
        printf '%s\n' "$EXTRA_ENV_VARS" >> "$GITHUB_ENV"

    - name: Docker login to Quay.io
      if: steps.ci-decision.outputs.action != 'skip'
      env:
        REGISTRY_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
      run: docker login -u "${REGISTRY_USERNAME}" --password-stdin quay.io <<<"${REGISTRY_PASSWORD}"

    - name: Set up Cloud SDK
      if: steps.ci-decision.outputs.action != 'skip'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3
      with:
        install_components: "gke-gcloud-auth-plugin,beta"

    - name: Create GKE cluster
      if: steps.ci-decision.outputs.action != 'skip'
      env:
        MACHINE_TYPE: e2-standard-8
        NUM_NODES: "3"
        GKE_SPOT: "false"
      timeout-minutes: 20
      run: |
        scripts/ci/gke.sh provision_gke_cluster "$CLUSTER_NAME_PREFIX"
        echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

    - name: Retrieving roxie version from repository
      if: steps.ci-decision.outputs.action != 'skip'
      id: roxie-version
      run: echo "version=$(cat ROXIE_VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install roxie
      if: steps.ci-decision.outputs.action != 'skip'
      uses: stackrox/actions/roxie/install-cli@43bb707aa4f32ead5bfb8d5ab11fb409f971ffc8 # ratchet:stackrox/actions/roxie/install-cli@v1
      with:
        version: "v${{ steps.roxie-version.outputs.version }}"

    - name: Verify kubectl access and wait for cluster to stabilize
      if: steps.ci-decision.outputs.action != 'skip'
      timeout-minutes: 5
      run: |
        kubectl cluster-info
        kubectl get nodes
        scripts/ci/gke.sh wait_for_cluster

    - name: Create artifact directory
      if: steps.ci-decision.outputs.action != 'skip'
      run: mkdir -p "$ARTIFACT_DIR"

    - name: Run pre-test
      if: steps.ci-decision.outputs.action != 'skip'
      shell: python
      env:
        QUAY_RHACS_ENG_BEARER_TOKEN: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
        QUAY_RHACS_ENG_RO_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        QUAY_RHACS_ENG_RO_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from pre_tests import PreSystemTests
        PreSystemTests().run()

    - name: Run UI E2E tests
      if: steps.ci-decision.outputs.action != 'skip'
      env:
        QUAY_RHACS_ENG_RO_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        QUAY_RHACS_ENG_RO_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
        REGISTRY_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
      timeout-minutes: 120
      run: tests/e2e/run-ui-e2e.sh

    - name: Run post-test
      if: (always() && env.KUBECONFIG != '') && steps.ci-decision.outputs.action != 'skip'
      continue-on-error: true
      shell: python
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from post_tests import PostClusterTest
        post = PostClusterTest(
            check_stackrox_logs=True,
        )
        post.run(['${{ env.ARTIFACT_DIR }}'])

    - name: Run final-post
      if: (always() && env.KUBECONFIG != '') && steps.ci-decision.outputs.action != 'skip'
      continue-on-error: true
      shell: python
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from post_tests import FinalPost
        FinalPost(store_qa_tests_data=False).run()

    - name: Teardown GKE cluster
      if: always() && steps.ci-decision.outputs.action != 'skip'
      continue-on-error: true
      run: |
        if [[ -z "${CLUSTER_NAME:-}" ]]; then
          echo "No cluster to teardown"
          exit 0
        fi
        if ! scripts/ci/gke.sh teardown_gke_cluster false; then
          echo "::warning::WARNING: Could not tear down cluster ${CLUSTER_NAME}. See Teardown step logs for details."
          exit 6
        fi

    - name: Publish summary for failed tests
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && steps.ci-decision.outputs.action != 'skip'
      with:
        paths: ${{ env.ARTIFACT_DIR }}/**/*.xml
        show: "fail"

    - name: Publish summary for passed and skipped tests
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && steps.ci-decision.outputs.action != 'skip'
      with:
        paths: ${{ env.ARTIFACT_DIR }}/**/*.xml
        show: "pass, skip"

    - name: Report junit failures in jira
      if: (!cancelled()) && steps.ci-decision.outputs.action != 'skip'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: ${{ env.ARTIFACT_DIR }}
