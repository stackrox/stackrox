name: Scanner updater schedule

# Temporary branch-only experiment; do not merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.repository_owner == 'stackrox' && github.ref == 'refs/heads/jvdm/experiment-rhel-vex-no-kernel'
    permissions:
      contents: read
      checks: read
      actions: read
    uses: ./.github/workflows/scanner-updater-export.yaml
    with:
      source: rhel-vex
      ref: ${{ github.sha }}
      object: gs://scanner-v4-test/v4/vulnerability-bundles/no-kernel-${{ github.sha }}/sources/rhel-vex.json.zst
      manual_url: https://raw.githubusercontent.com/stackrox/stackrox/${{ github.sha }}/scanner/updater/manual/vulns.yaml
      skip_freshness_check: true
    secrets:
      GCP_SERVICE_ACCOUNT_STACKROX_CI: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
      GOOGLE_SA_CIRCLECI_SCANNER: ${{ secrets.GOOGLE_SA_CIRCLECI_SCANNER }}
      GOOGLE_SA_STACKROX_HUB_VULN_DUMP_UPLOADER: ${{ secrets.GOOGLE_SA_STACKROX_HUB_VULN_DUMP_UPLOADER }}
      SLACK_ONCALL_SCANNER_WEBHOOK: ${{ secrets.SLACK_ONCALL_SCANNER_WEBHOOK }}
