name: Create Central DB backup
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (A.B.C)
        required: true
        default: 0.0.0
        type: string
      previous-version:
        description: Previous release version to migrate forward from (A.B.C)
        required: true
        type: string
      dry-run:
        description: Dry-run
        required: false
        default: false
        type: boolean
  pull_request: # Only for testing, remove before merge

# Ensure that only a single automation workflow can run at a time for each release.
concurrency: Central DB backup ${{ inputs.version }}

jobs:
  variables:
    name: Setup variables
    uses: ./.github/workflows/variables.yml
    with:
      # Remove the 4.11.0 fallback before merging
      version: ${{ github.event.inputs.version || '4.11.0' }}
      assert-format: A.B.C

  create-backup:
    runs-on: ubuntu-latest
    needs:
    - variables
    env:
      KUBECONFIG: "/tmp/kubeconfig"
      RELEASE: ${{ needs.variables.outputs.release }}
      PATCH: ${{ needs.variables.outputs.patch }}
      # Remove the fallback before merging
      PREVIOUS_VERSION: ${{ github.event.inputs.previous-version || '4.10.0' }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Login to Quay.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

    - name: Install roxctl
      uses: stackrox/roxctl-installer-action@47fb4f5b275066b8322369e6e33fa010915b0d13 # ratchet:stackrox/roxctl-installer-action@v1
      with:
        roxctl-release: latest

    - name: Retrieving roxie version from repository
      id: roxie-version
      run: echo "version=$(cat ROXIE_VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install roxie
      uses: stackrox/actions/roxie/install-cli@6691d5c300d4af17546145bdbbb9862c53975af4 # ratchet:stackrox/actions@v1
      with:
        version: "v${{ steps.roxie-version.outputs.version }}"

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # ratchet:helm/kind-action@v1
      with:
        kubeconfig: "${{ env.KUBECONFIG }}"

    - name: Deploy previous Central version
      id: deploy-previous
      run: |
          envrc="$(mktemp)"
          echo "envrc=${envrc}" >> "$GITHUB_OUTPUT"

          # Adjust resource requests so they fit within a GHA runner.
          roxie deploy central \
            --tag "${PREVIOUS_VERSION}" \
            --resources small \
            --set central.spec.central.resources.requests.cpu=300m \
            --set central.spec.central.resources.requests.memory=1Gi \
            --set central.spec.central.db.resources.requests.cpu=300m \
            --set central.spec.central.db.resources.requests.memory=1Gi \
            --set central.spec.scannerV4.db.resources.requests.cpu=200m \
            --set central.spec.scannerV4.db.resources.requests.memory=512Mi \
            --set central.spec.scannerV4.indexer.resources.requests.cpu=150m \
            --set central.spec.scannerV4.indexer.resources.requests.memory=512Mi \
            --set central.spec.scannerV4.matcher.resources.requests.cpu=150m \
            --set central.spec.scannerV4.matcher.resources.requests.memory=512Mi \
            --port-forwarding \
            --envrc "${envrc}" \
            --central-wait 5m

    - name: Restore previous backup
      run: |
        source "${{ steps.deploy-previous.outputs.envrc }}"
        source scripts/lib.sh

        gsutil cp "gs://stackrox-ci-upgrade-test-fixtures/upgrade-test-dbs/postgres_db_${PREVIOUS_VERSION}.sql.zip" .

        roxctl -e "$API_ENDPOINT" --ca "" --insecure-skip-tls-verify \
          central db restore --timeout 5m "postgres_db_${PREVIOUS_VERSION}.sql.zip"

        # The restore bounces Central; wait for it to come back before continuing.
        deadline=$((SECONDS + 300))
        until roxcurl /v1/ping | grep -q ok; do
          if (( SECONDS > deadline )); then
            echo "Central did not come back within 5m after restore" >&2
            exit 1
          fi
          sleep 2
        done

    - name: Add authenticated Docker Hub integration
      run: |
        source "${{ steps.deploy-previous.outputs.envrc }}"
        source scripts/lib.sh

        # Central's default "Public DockerHub" integration is anonymous and
        # gets rate-limited (429) almost immediately when the image reprocessor
        # tries to re-scan hundreds of images in a burst. An authenticated
        # integration has a much higher rate limit.
        payload=$(jq -n \
          --arg username "$DOCKERHUB_USERNAME" \
          --arg password "$DOCKERHUB_PASSWORD" \
          '{
            name: "Authenticated Docker Hub",
            type: "docker",
            categories: ["REGISTRY"],
            docker: {
              endpoint: "registry-1.docker.io",
              username: $username,
              password: $password
            }
          }')

        roxcurl /v1/imageintegrations -X POST -d "$payload"
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_ACCOUNT_USERNAME }}
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_CI_ACCOUNT_PASSWORD }}

    - name: Upgrade operator to target version
      run: |
        source "${{ steps.deploy-previous.outputs.envrc }}"

        # Upgrade operator only, otherwise roxie tears down the entire
        # ACS deployment and recreates it.
        roxie deploy operator --tag "${RELEASE}.${PATCH}"

        # Wait for central to be updated
        deadline=$((SECONDS + 300))
        until kubectl -n acs-central get deploy/central \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="central")].image}' \
          | grep -q ":${RELEASE}.${PATCH}$"; do
          if (( SECONDS > deadline )); then
            echo "Central was not upgraded to ${RELEASE}.${PATCH} within 5m" >&2
            kubectl -n acs-central get deploy/central \
              -o jsonpath='{.spec.template.spec.containers[*].name}{"\n"}' >&2
            exit 1
          fi
          sleep 5
        done
        kubectl -n acs-central rollout status deploy/central --timeout=5m

    - name: Wait for image reprocessing
      run: |
        source "${{ steps.deploy-previous.outputs.envrc }}"
        source scripts/lib.sh
        # Central's image reprocessor runs immediately on every startup, racing
        # Scanner V4's own readiness after the same operator-driven restart. A
        # failed pass doesn't retry for another 4 hours (ReprocessInterval), so
        # force one more Central restart once Scanner V4 is confirmed ready,
        # giving the reprocessor a clean run before taking the final backup.
        wait_for_deploy() {
          local deploy="$1"
          local label="$2"
          if kubectl -n acs-central wait "deploy/${deploy}" --for=condition=available --timeout=10m; then
            return 0
          fi
          echo "${deploy} did not become available within 10m" >&2
          kubectl -n acs-central get pods -l "${label}" -o wide >&2
          kubectl -n acs-central describe "deploy/${deploy}" >&2
          kubectl -n acs-central describe pods -l "${label}" >&2
          for pod in $(kubectl -n acs-central get pods -l "${label}" -o jsonpath='{.items[*].metadata.name}'); do
            echo "=== logs: $pod (current) ===" >&2
            kubectl -n acs-central logs "$pod" --all-containers --tail=200 >&2 || true
            echo "=== logs: $pod (previous) ===" >&2
            kubectl -n acs-central logs "$pod" --all-containers --previous --tail=200 >&2 || true
          done
          return 1
        }

        wait_for_deploy scanner-v4-db app=scanner-v4-db || exit 1
        wait_for_deploy scanner-v4-indexer app=scanner-v4-indexer || exit 1

        kubectl -n acs-central delete pod -l app=central --grace-period=0
        kubectl -n acs-central rollout status deploy/central --timeout=5m

        # Recreate the port-forward
        if [[ -n "${ROXIE_PORT_FORWARD_PID:-}" ]]; then
          kill -9 "$ROXIE_PORT_FORWARD_PID" 2>/dev/null || true
        fi
        local_port="${API_ENDPOINT##*:}"
        nohup kubectl -n acs-central port-forward svc/central "${local_port}:443" \
          > /tmp/central-port-forward.log 2>&1 &

        deadline=$((SECONDS + 300))
        until roxcurl /v1/ping | grep -q ok; do
          if (( SECONDS > deadline )); then
            echo "Central did not come back within 5m after operator upgrade" >&2
            cat /tmp/central-port-forward.log >&2
            exit 1
          fi
          sleep 2
        done

        # Poll /v1/imagescount until it stabilizes across two consecutive
        # checks, as a proxy for the reprocessor having finished its pass.
        count_images() {
          roxcurl /v1/imagescount | jq -r '.count'
        }

        previous=-1
        stabilized=0
        deadline=$((SECONDS + 600))
        while true; do
          current=$(count_images)
          echo "images count: ${current}"
          if [[ "$current" != "0" && "$current" == "$previous" ]]; then
            stabilized=1
            break
          fi
          previous="$current"
          if (( SECONDS > deadline )); then
            echo "image count did not stabilize at a nonzero value within 10m (last seen: ${current})" >&2
            break
          fi
          sleep 20
        done

        if [[ "$stabilized" != "1" ]]; then
          echo "Image reprocessing did not populate images_v2; dumping reprocessor logs" >&2
          kubectl -n acs-central logs deploy/central -c central --tail=500 2>&1 \
            | grep -i "reprocess" >&2 || true
          exit 1
        fi

    - name: Wait for background migrations
      run: |
        source "${{ steps.deploy-previous.outputs.envrc }}"

        target=$(git show "${RELEASE}.${PATCH}:central/backgroundmigrations/seq_num.go" 2>/dev/null \
          | sed -n 's/^const CurrentBgMigrationSeqNum = \([0-9]*\)$/\1/p')

        if [[ -z "$target" ]]; then
          echo "No background migration seqnum found for ${RELEASE}.${PATCH} (feature may not exist at this version); skipping wait"
        else
          db_password=$(kubectl -n acs-central get secret central-db-password -o jsonpath='{.data.password}' | base64 -d)
          for _ in $(seq 1 20); do
            seqnum=$(kubectl -n acs-central exec deploy/central-db -c central-db -- \
              bash -c "PGPASSWORD='${db_password}' psql -U postgres -d central_active -tAc 'SELECT seqnum FROM background_migration_versions LIMIT 1'" | tr -d '[:space:]')
            [[ "$seqnum" -ge "$target" ]] 2>/dev/null && break
            sleep 15
          done
        fi

    - name: Strip transient cluster auth config
      run: |
        source "${{ steps.deploy-previous.outputs.envrc }}"
        source scripts/lib.sh

        # Central recreates this config for its own cluster on startup. Keeping the
        # snapshot cluster's issuer would make restores depend on that cluster.
        query='
          .configs[]?
          | select(.type == "KUBE_SERVICE_ACCOUNT")
          | select(.mappings == [{
              "key": "sub",
              "valueExpression": "system:serviceaccount:acs-central:config-controller",
              "role": "Configuration Controller"
            }])
          | .id
        '

        ids=$(roxcurl /v1/auth/m2m | jq -r "$query")
        for id in $ids; do
          [[ -n "$id" ]] || continue
          roxcurl "/v1/auth/m2m/$id" -X DELETE > /dev/null
        done

    - name: Grab a central backup
      run: |
        source "${{ steps.deploy-previous.outputs.envrc }}"
        roxctl central backup --output "postgres_db_${RELEASE}.${PATCH}.sql.zip"

    - name: Upload backup as an artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
      with:
        # Remove the 4.11.0 fallback before merging
        name: postgres-db-${{ inputs.version || '4.11.0' }}-backup
        path: postgres_db_*.sql.zip

    - name: Upload backup to GCS
      # Remove fallback before merging
      if: ${{ !(inputs.dry-run || true) }}
      run: |
        gsutil cp "postgres_db_${RELEASE}.${PATCH}.sql.zip" gs://stackrox-ci-upgrade-test-fixtures/upgrade-test-dbs/
