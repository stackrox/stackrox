name: Create Central DB backup
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (A.B.C)
        required: true
        default: 0.0.0
        type: string
      previous-version:
        description: Previous release version to migrate forward from (A.B.C)
        required: true
        type: string
      dry-run:
        description: Dry-run
        required: false
        default: false
        type: boolean
  pull_request: # Only for testing, remove before merge

# Ensure that only a single automation workflow can run at a time for each release.
concurrency: Central DB backup ${{ inputs.version }}

jobs:
  variables:
    name: Setup variables
    uses: ./.github/workflows/variables.yml
    with:
      # Remove the 4.11.0 fallback before merging
      version: ${{ github.event.inputs.version || '4.11.0' }}
      assert-format: A.B.C

  create-backup:
    runs-on: ubuntu-latest
    needs:
    - variables
    env:
      RELEASE: ${{ needs.variables.outputs.release }}
      PATCH: ${{ needs.variables.outputs.patch }}
      # Remove the fallback before merging
      PREVIOUS_VERSION: ${{ github.event.inputs.previous-version || '4.10.0' }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Create GKE cluster
      timeout-minutes: 20
      run: |
        scripts/ci/gke.sh provision_gke_cluster db-backup
        echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

    - name: Login to Quay.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3
      with:
        install_components: "gke-gcloud-auth-plugin"

    - name: Install roxctl
      uses: stackrox/roxctl-installer-action@47fb4f5b275066b8322369e6e33fa010915b0d13 # ratchet:stackrox/roxctl-installer-action@v1
      with:
        roxctl-release: latest

    - name: Retrieving roxie version from repository
      id: roxie-version
      run: echo "version=$(cat ROXIE_VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install roxie
      uses: stackrox/actions/roxie/install-cli@6691d5c300d4af17546145bdbbb9862c53975af4 # ratchet:stackrox/actions@v1
      with:
        version: "v${{ steps.roxie-version.outputs.version }}"

    - name: Verify kubectl access and wait for cluster to stabilize
      timeout-minutes: 5
      run: |
        kubectl cluster-info
        kubectl get nodes
        scripts/ci/gke.sh wait_for_cluster

    - name: Create new central backup
      run: scripts/ci/db-backup.sh
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_ACCOUNT_USERNAME }}
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_CI_ACCOUNT_PASSWORD }}

    - name: Teardown GKE cluster
      if: always()
      continue-on-error: true
      run: |
        if [[ -z "${CLUSTER_NAME:-}" ]]; then
          echo "No cluster to teardown"
          exit 0
        fi
        if ! scripts/ci/gke.sh teardown_gke_cluster false; then
          echo "::warning::WARNING: Could not tear down cluster ${CLUSTER_NAME}. See Teardown step logs for details."
          exit 6
        fi

    - name: Upload backup as an artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
      with:
        # Remove the 4.11.0 fallback before merging
        name: postgres-db-${{ inputs.version || '4.11.0' }}-backup
        path: postgres_db_*.sql.zip

    - name: Upload backup to GCS
      # Remove fallback before merging
      if: ${{ !(inputs.dry-run || true) }}
      run: scripts/ci/db-backup.sh upload_backup_to_gcs
