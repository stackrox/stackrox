name: Cache Go Dependencies Regression

# Guards against a recurrence of the golang-jwt v4->v5 incident: Go's module
# index caches each package's parsed imports by (filename, mtime, size), and
# cache-go-dependencies stamps fixed mtimes for GOCACHE/test-cache stability.
# A same-size source change restored against a stale prior GOCACHE can
# produce a false "could not import ... (open : no such file or directory)".
# See tools/cicachetest/README.md for the fixture this exercises.
#
# Triggered on changes to the action itself, AND on a schedule — the
# original incident was caused by a routine go.mod bump, not an edit to the
# action, so path-filtering alone would not have caught it.
on:
  pull_request:
    paths:
      - '.github/actions/cache-go-dependencies/**'
      - '.github/workflows/cache-go-dependencies-regression.yaml'
      - 'tools/cicachetest/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prime-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6

      - name: Cache Go dependencies
        uses: ./.github/actions/cache-go-dependencies
        with:
          # force-save: this job must save even though it isn't a push to the
          # default branch, so verify-restore has a cache to restore.
          force-save: 'true'
          # cache-scope: shared with verify-restore so both jobs (which
          # necessarily have different job ids) produce the same cache key.
          cache-scope: 'cicachetest'
          # This workflow verifies test-cache hits on schedule/dispatch runs
          # too, not just pull_request runs, so the production
          # non-PR-runs-always-clear-testcache behavior must be bypassed.
          skip-test-cache-clear: 'true'

      - name: Build and test fixture (variantfoo state)
        run: |
          go build -C tools/cicachetest ./...
          # -v must match Assertion 3's invocation exactly — Go's test
          # result cache treats verbose mode as part of the cache key, so a
          # flag mismatch here would look like a cache miss for the wrong
          # reason (confirmed the hard way while building this test).
          go test -C tools/cicachetest ./testcache/... -v

  verify-restore:
    needs: prime-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6

      - name: Swap consumer to variantbar
        run: |
          # Equal-length identifier swap (variantfoo/variantbar, both 10
          # chars) keeps consumer.go's byte size identical — the crux of the
          # dirHash collision this test reproduces.
          sed -i 's/variantfoo/variantbar/g' tools/cicachetest/consumer/consumer.go
          # `git add` so the index reflects this change like a real commit
          # would (a genuine incident is always a real commit, checked out
          # fresh -- index and working tree always agree). Without this,
          # a blob-hash-based mtime scheme keys on the stale pre-swap index
          # entry instead of the actual on-disk content, which reproduces
          # this test's failure mode for the wrong reason (an unstaged
          # local edit, not a realistic same-size content change).
          git add tools/cicachetest/consumer/consumer.go

      - name: Cache Go dependencies
        uses: ./.github/actions/cache-go-dependencies
        with:
          cache-scope: 'cicachetest'
          skip-test-cache-clear: 'true'

      - name: 'Assertion 1: module-index staleness must not recur'
        run: |
          set +e
          go vet -C tools/cicachetest ./consumer/... > vet.log 2>&1
          status=$?
          cat vet.log
          if [[ $status -ne 0 ]] || grep -qE 'could not import|can.t resolve import|no such file or directory' vet.log; then
            echo "::error::Module-index staleness regression detected — go vet failed to resolve the swapped import after a cache restore. This is the exact golang-jwt v4->v5 failure mode; see tools/cicachetest/README.md."
            exit 1
          fi
          echo "Assertion 1 passed: no stale-import errors"

      - name: 'Assertion 2: build cache must be genuinely hit'
        run: |
          # variantfoo was never touched between jobs. A correctly-working
          # GOCACHE restore must recompile it zero times.
          count=$(go build -C tools/cicachetest -x ./variantfoo/... 2>&1 | grep -c '/compile ' || true)
          echo "compile invocations for untouched variantfoo: $count"
          if [[ "$count" -ne 0 ]]; then
            echo "::error::Build cache is not being hit after restore — variantfoo was never touched between jobs but was recompiled ($count times). The GOCACHE restore is silently not working."
            exit 1
          fi
          echo "Assertion 2 passed: build cache hit (zero recompiles)"

      - name: 'Assertion 3: test cache must be genuinely hit'
        run: |
          # testcache_test.go and its testdata are byte-identical to what
          # prime-cache ran, with matching flags (-v both sides — Go's test
          # result cache treats verbose mode as part of the cache key).
          # This is the exact scenario the discarded
          # whole-tree-single-commit-timestamp mtime approach broke earlier.
          go test -C tools/cicachetest ./testcache/... -v > test.log 2>&1
          cat test.log
          if ! grep -q '(cached)' test.log; then
            echo "::error::Test cache is not being hit after restore — testcache_test.go and its testdata were byte-identical to prime-cache's run but re-executed instead of showing (cached)."
            exit 1
          fi
          echo "Assertion 3 passed: test cache hit"
