name: e2e-db-backup-restore-tests-gke

on:
  workflow_call:
    inputs:
      ci-action:
        description: Applied CI selection decision; missing or invalid values run.
        type: string
        default: run
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the job should be skipped.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    uses: ./.github/workflows/e2e-db-backup-restore-tests.yaml
    with:
      ci-action: ${{ inputs.ci-action }}
      tag: ${{ inputs.tag }}
      should-run: ${{ github.event_name == 'workflow_dispatch' || inputs.should-run }}
    secrets: inherit
