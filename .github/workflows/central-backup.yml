name: Create Central DB backup
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (A.B.C)
        required: true
        default: 0.0.0
        type: string
      previous-version:
        description: Previous release version to migrate forward from (A.B.C)
        required: true
        type: string
      dry-run:
        description: Dry-run
        required: false
        default: true
        type: boolean

# Ensure that only a single automation workflow can run at a time for each release.
concurrency: Central DB backup ${{ inputs.version }}

jobs:
  variables:
    name: Setup variables
    uses: ./.github/workflows/variables.yml
    with:
      version: ${{ github.event.inputs.version }}
      assert-format: A.B.C

  create-backup:
    runs-on: ubuntu-26.04
    needs:
    - variables
    env:
      KUBECONFIG: "/tmp/kubeconfig"
      RELEASE: ${{ needs.variables.outputs.release }}
      PATCH: ${{ needs.variables.outputs.patch }}
      PREVIOUS_VERSION: ${{ github.event.inputs.previous-version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # ratchet:helm/kind-action@v1.15.0
      with:
        kubeconfig: "${{ env.KUBECONFIG }}"

    - name: Login to Quay.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

    - name: Install roxctl
      uses: stackrox/roxctl-installer-action@47fb4f5b275066b8322369e6e33fa010915b0d13 # ratchet:stackrox/roxctl-installer-action@v1
      with:
        roxctl-release: latest

    - name: Retrieving roxie version from repository
      id: roxie-version
      run: echo "version=$(cat ROXIE_VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install roxie
      uses: stackrox/actions/roxie/install-cli@6691d5c300d4af17546145bdbbb9862c53975af4 # ratchet:stackrox/actions@v1
      with:
        version: "v${{ steps.roxie-version.outputs.version }}"

    - name: Create new central backup
      run: scripts/ci/central-backup.sh

    - name: Upload backup as an artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
      with:
        name: postgres-db-${{ inputs.version }}-backup
        path: postgres_db_${{ inputs.version }}.sql.zip

    - name: Upload backup to GCS
      if: ${{ ! inputs.dry-run }}
      run: |
        backup="postgres_db_${RELEASE}.${PATCH}.sql.zip"
        gsutil cp "$backup" "gs://stackrox-ci-upgrade-test-fixtures/upgrade-test-dbs/$backup"

    - name: Preserve logs on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
      with:
        name: stackrox-logs
        path: /tmp/stackrox-logs
        if-no-files-found: ignore
