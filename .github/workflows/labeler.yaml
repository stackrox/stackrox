name: Label pull requests based on changed files
on:
  pull_request:
    types:
    - ready_for_review
    - opened
    - synchronize

jobs:
  label-pr:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
    steps:
    - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # ratchet:actions/labeler@v6
      with:
        repo-token: "${{ github.token }}"
        sync-labels: False

  report-ci-timing:
    name: CI timing report
    needs: [label-pr]
    if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/report-ci-timing.yaml
