name: e2e-operator-tests-gke-konflux

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the job should be skipped.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true

jobs:
  run:
    uses: ./.github/workflows/e2e-operator-tests.yaml
    with:
      should-run: ${{ github.event_name == 'workflow_dispatch' || inputs.should-run }}
      tag: ${{ inputs.tag }}
      ci-job-name: e2e-operator-tests-gke-konflux
      dbg-existing-cluster-name: mc-09-28-property-farmer-nex
      cluster-provisioning-method: dbg-existing-infra
      extra-env-vars: |
        ORCHESTRATOR_FLAVOR=k8s
        KUBERNETES_PROVIDER=gke
        USE_KONFLUX_IMAGES=true
    secrets: inherit
