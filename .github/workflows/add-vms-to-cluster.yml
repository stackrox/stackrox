name: "Ensure VMs on Cluster"
run-name: "Ensure ${{ inputs.num-vms }} ${{ inputs.vm-os }} VMs on ${{ inputs.cluster-name }}"

on:
  workflow_dispatch:
    inputs:
      cluster-name:
        description: "Infra cluster name (from `infractl list`)"
        required: true
        type: string
      num-vms:
        description: "Desired count of {os}-1..N, not how many to add. Existing VMs are reused; 2 is a no-op if rhel9-1 and rhel9-2 already exist."
        required: false
        default: 1
        type: number
      vm-os:
        description: "VM OS"
        required: false
        default: "rhel9"
        type: choice
        options:
          - rhel8
          - rhel9
          - rhel10
      ssh-public-key:
        description: "Optional SSH public key for human access to VMs"
        required: false
        default: ""
        type: string

jobs:
  add-vms:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Add VMs to cluster
        uses: ./scripts/ci/add-vms
        with:
          cluster-name: ${{ inputs.cluster-name }}
          num-vms: ${{ inputs.num-vms }}
          vm-os: ${{ inputs.vm-os }}
          ssh-public-key: ${{ inputs.ssh-public-key }}
          infra-token: ${{ secrets.INFRA_TOKEN }}
          quay-username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
          quay-password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
