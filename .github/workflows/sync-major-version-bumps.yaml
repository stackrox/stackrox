name: Sync major version bumps to release branches

on:
  push:
    branches:
      - master
    paths:
      - pkg/version/productstreams/major_version_bumps.yaml
  pull_request:
    paths:
      - .github/workflows/sync-major-version-bumps.yaml
      - .github/workflows/scripts/sync-major-version-bumps.py
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log what would be updated without creating PRs'
        type: boolean
        default: true
      supported-versions:
        description: 'Comma-separated list of versions to sync (e.g. "4.10,4.11,5.0"). Overrides the RH API lookup. Useful for testing or when the API is unavailable.'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: ${{ github.repository_owner == 'stackrox' }}
    name: Sync version bumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Sync major version bumps to release branches
        env:
          PYTHONUNBUFFERED: "1"
          # For push/schedule triggers, inputs.dry-run is empty string → dry_run=False (create real PRs).
          DRY_RUN: ${{ inputs.dry-run }}
          SUPPORTED_VERSIONS_OVERRIDE: ${{ inputs.supported-versions }}
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.RHACS_BOT_GITHUB_USERNAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.RHACS_BOT_GITHUB_EMAIL }}
        run: ./.github/workflows/scripts/sync-major-version-bumps.py

      - name: Notify Slack on failure
        # TODO(lvm): restore to `failure() && github.event_name != 'pull_request'` after testing
        if: failure()
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # ratchet:slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ fromJSON(format('["{0}","{1}"]', 'C03KSV3N6N8', 'C05AZF8T7GW'))[inputs.dry-run != true && github.event_name != 'pull_request'] }}"
            text: "Version bump sync to release branches has failed."
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: *Version bump sync failed*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
