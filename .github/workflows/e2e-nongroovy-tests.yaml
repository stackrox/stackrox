# Disposable label/check aggregation experiment. Do not merge.
---
name: e2e-nongroovy-tests
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  gke-nongroovy-e2e-tests:
    if: inputs.should-run
    runs-on: ubuntu-24.04
    timeout-minutes: 361
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ github.event_name == 'workflow_dispatch' && 'run' ||
          inputs.ci-action }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: 'Label/check probe: fail'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: fail"
        echo "This failure is intentional."
        exit 1
      if: steps.ci-decision.outputs.action != 'skip'
'on':
  workflow_call:
    inputs:
      ci-action:
        description: Applied CI selection decision; missing or invalid values run.
        type: string
        default: run
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the
          job should be skipped.
        type: boolean
        required: true
      ci-job-name:
        description: Unique job name, e.g. gke-nongroovy-e2e-tests-konflux. Propagated
          to tests as CI_JOB_NAME for test dispatching.
        type: string
        required: true
      extra-env-vars:
        description: Additional environment variables as multi-line KEY=VALUE pairs
          (e.g., USE_ROXIE_DEPLOY=true)
        type: string
        required: false
