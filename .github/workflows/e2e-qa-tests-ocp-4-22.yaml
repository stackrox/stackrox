name: qa-e2e-tests-ocp-4-22

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the job should be skipped.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true

jobs:
  run:
    if: inputs.should-run
    uses: ./.github/workflows/e2e-qa-tests.yaml
    with:
      tag: ${{ inputs.tag }}
      ci-job-name: ocp-4-22-qa-e2e-tests
      ci-job-short-name: ocp422-qa-e2e
      cluster-provisioning-method: infra
      cluster-wait-timeout-minutes: 50
      infra-flavor: openshift-4
      infra-args: |
        openshift-version=ocp/stable-4.22
        master-node-type=e2-standard-4
        master-node-count=3
        worker-node-type=e2-standard-8
        worker-node-count=3
        ssd-storage-class=true
      infra-lifespan: 5h
      # To address later:
      #   SETUP_WORKLOAD_IDENTITIES=true
      extra-env-vars: |
        ORCHESTRATOR_FLAVOR=openshift
        KUBERNETES_PROVIDER=ocp
        SFA_AGENT=true
    secrets: inherit
