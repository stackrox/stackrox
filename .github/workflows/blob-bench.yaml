name: Blob Storage Scalability Bench

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Comma-separated concurrency levels'
        default: '1,5,10,25,50,100'
        type: string
      duration:
        description: 'Per-level duration'
        default: '45s'
        type: string
      container:
        description: 'Container to bench'
        default: 'ci-gocache'
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Record runner region (IMDS)
        run: |
          region=$(curl -s -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" || echo unknown)
          echo "runner region: $region"

      - name: Run blob-bench
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_STORAGE_ACCOUNT: cigocache
          GOCACHE_SERVE_CONTAINER: ${{ inputs.container }}
        run: |
          cd tools/blob-bench
          go run . -concurrency "${{ inputs.concurrency }}" -duration "${{ inputs.duration }}"
