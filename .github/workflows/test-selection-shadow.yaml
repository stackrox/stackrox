name: Test selection (shadow)

# Prints the plan for this pull request.
# The jobs that actually run live in their own workflows. The label
# ci-dispatcher-enforce is what makes those workflows obey the plan.
# Without the label they keep their own pull_request triggers.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/dispatcher-plan.yaml
