name: Scanner updater bundle (disposable T1 tests)
# Downloads per-source vulnerability data from GCS, validates each source,
# and assembles vulnerabilities.zip for each bundle stream defined in
# VULNERABILITY_BUNDLE_VERSION. Invalid sources fail the job before publication.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if no sources are newer than the bundle"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Upload validated bundles to the test bucket; send failures to the test Slack channel"
        required: false
        type: boolean
        default: false
      t1_case:
        description: "Temporary test-branch scenario; never merge this input"
        required: true
        type: choice
        default: healthy
        options:
        - healthy
        - gate-control
        - W5
        - W6
        - W7
        - W9

permissions:
  contents: read

jobs:
  build-matrix:
    if: github.repository_owner == 'stackrox' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      streams: ${{ steps.emit.outputs.streams }}
    steps:
    - name: Enforce disposable-test safety
      env:
        TEST_REF: ${{ github.ref }}
        DRY_RUN: ${{ inputs.dry_run == true }}
        FORCE: ${{ inputs.force == true }}
        TEST_CASE: ${{ inputs.t1_case }}
      run: |
        set -euo pipefail
        [[ "$TEST_REF" == "refs/heads/alkmim/ROX-36961-t1-negative-tests" ]]
        [[ "$DRY_RUN" == "true" && "$FORCE" == "true" ]]
        case "$TEST_CASE" in
          healthy|gate-control|W5|W6|W7|W9) ;;
          *) echo "Unsupported disposable test case" >&2; exit 1 ;;
        esac

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Build stream matrix
      id: emit
      run: |
        set -euo pipefail
        streams=$(./.github/workflows/scripts/scanner-get-released-tags.sh | jq -c '[.[].version]')
        echo "streams=${streams}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: build-matrix
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    container:
      image: quay.io/stackrox-io/apollo-ci:scanner-test-0.5.11@sha256:cea78f2b3a5a38c9ccda678712daaed90b7c372d6b5df963feb758b32dccebe1
      volumes:
      - /tmp:/tmp
      - /usr:/mnt/usr
      - /opt:/mnt/opt
    services:
      postgres:
        image: docker.io/library/postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: matcher
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        stream: ${{ fromJson(needs.build-matrix.outputs.streams) }}
    concurrency:
      group: scanner-updater-bundle-${{ matrix.stream }}${{ inputs.dry_run == true && '-dry-run' || '' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      STREAM: ${{ matrix.stream }}
      SOURCE_CONFIG: scanner/updater/ci/source-config.yaml
      T1_CASE: ${{ inputs.t1_case }}
      T1_DRY_RUN: ${{ inputs.dry_run == true }}
      T1_FORCE: ${{ inputs.force == true }}
      T1_EVIDENCE: /tmp/t1-evidence
      T1_ISOLATED_DATABASE: "true"
      PGHOST: postgres
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Preserve disposable test helpers
      id: t1_prepare
      run: |
        set -euo pipefail
        mkdir -p /tmp/opencode
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        python3 .github/workflows/scripts/t1-tests/prepare-run.py

    - name: Authenticate with GCS
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets[inputs.dry_run == true && 'GOOGLE_SA_CIRCLECI_SCANNER' || 'GOOGLE_SA_STACKROX_HUB_VULN_DUMP_UPLOADER'] }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3

    - name: Check for changes
      id: check-changes
      env:
        FORCE: ${{ inputs.force == true }}
      run: |
        set -euo pipefail

        sc=./.github/workflows/scripts/scanner-updater-config.sh
        bucket=$("$sc" bucket)
        prefix=$("$sc" prefix)

        echo "GCS_BUCKET=$bucket" >> "$GITHUB_ENV"
        echo "GCS_PREFIX=$prefix" >> "$GITHUB_ENV"

        if [[ "$FORCE" == "true" ]]; then
            echo "Force rebuild requested"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
        fi

        bundle_obj=$("$sc" bundle-object "$STREAM")

        # Get the bundle's creation timestamp. If the bundle does not
        # exist or the query fails, assume changes and proceed.
        if ! bundle_ts=$(gcloud storage objects describe "$bundle_obj" \
            --format="value(creation_time)" 2>/dev/null) || [ -z "$bundle_ts" ]; then
            echo "Bundle not found or query failed; assuming changes"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
        fi
        bundle_epoch=$(date -d "$bundle_ts" +%s)
        echo "Bundle created: $bundle_ts (epoch: $bundle_epoch)"

        # Check if any source has been updated after the bundle.
        changed=false
        while IFS= read -r source; do
            object="gs://${bucket}/${prefix}/${STREAM}/sources/${source}.json.zst"
            newer=$(GCS_OBJECT="$object" \
                ./.github/workflows/scripts/scanner-updater-check-freshness.sh --newer-than "$bundle_epoch") || {
                echo "Source '${source}': check failed; assuming changes"
                changed=true; break
            }
            if [[ "$newer" == "true" ]]; then
                echo "Source '${source}' is newer than bundle"
                changed=true; break
            fi
        done < <("$sc" sources "$STREAM")

        echo "changed=${changed}" >> "$GITHUB_OUTPUT"
        if [ "$changed" = "false" ]; then
            echo "No sources newer than bundle; skipping"
        fi

    - name: Download sources
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euxo pipefail

        sc=./.github/workflows/scripts/scanner-updater-config.sh
        mkdir -p bundles

        while IFS= read -r source; do
            object="gs://${GCS_BUCKET}/${GCS_PREFIX}/${STREAM}/sources/${source}.json.zst"
            dest="bundles/${source}.json.zst"

            # Retry if the source is overwritten between describe and cp.
            downloaded=false
            for attempt in 1 2 3; do
                meta=$(gcloud storage objects describe "$object" --format=json)
                gen=$(jq -r '.generation' <<< "$meta")
                timestamp=$(jq -re '.custom_fields["refresh-completed-at"]' <<< "$meta")

                if gcloud storage cp "$object" "$dest" --if-generation-match="$gen"; then
                    touch -d "$timestamp" "$dest"
                    downloaded=true
                    break
                fi
                echo "Source '${source}': download attempt ${attempt} failed, retrying"
            done

            if [[ "$downloaded" != "true" ]]; then
                echo "::error::${source}: download failed after 3 attempts"
                exit 1
            fi
        done < <("$sc" sources "$STREAM")

    - name: Inject W6 empty source
      id: t1_fault_source
      if: steps.check-changes.outputs.changed == 'true' && inputs.t1_case == 'W6'
      run: python3 /tmp/t1-tests/inject.py W6

    - name: Validate source content
      id: download-validate
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euo pipefail

        sc=./.github/workflows/scripts/scanner-updater-config.sh
        valid_files=()
        failed_sources=()

        while IFS= read -r source; do
            dest="bundles/${source}.json.zst"
            if ! record_count=$(./.github/workflows/scripts/scanner-updater-validate-source.sh "$dest"); then
                echo "::error::${source}: invalid vulnerability source"
                failed_sources+=("$source")
            else
                echo "source '${source}': OK (${record_count} records)"
                valid_files+=("$dest")
            fi
        done < <("$sc" sources "$STREAM")

        ( IFS=','; echo "failed=${failed_sources[*]}" >> "$GITHUB_OUTPUT" )

        if [ "${#failed_sources[@]}" -gt 0 ]; then
            echo "::error::${#failed_sources[@]} invalid source(s) for stream '${STREAM}'; refusing to replace the existing bundle"
            exit 1
        fi

        printf '%s\n' "${valid_files[@]}" > valid-files.txt
        echo "Validated: ${#valid_files[@]} of $(( ${#valid_files[@]} + ${#failed_sources[@]} )) source(s) OK"

    - name: Assemble bundle
      id: assemble
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euo pipefail
        zip vulnerabilities.zip -@ < valid-files.txt
        echo "Assembled vulnerabilities.zip ($(stat -c%s vulnerabilities.zip) bytes)"

    - name: Inject W5 unexpected ZIP entry
      id: t1_fault_zip
      if: steps.check-changes.outputs.changed == 'true' && inputs.t1_case == 'W5'
      run: python3 /tmp/t1-tests/inject.py W5

    - name: Validate ZIP entries
      id: t1_zip
      if: steps.check-changes.outputs.changed == 'true'
      env:
        FAILED_SOURCES: ${{ steps.download-validate.outputs.failed }}
      run: |
        set -euo pipefail

        sc=./.github/workflows/scripts/scanner-updater-config.sh

        # Normalize ZIP entries to source names (strip bundles/ prefix and .json.zst suffix).
        mapfile -t zip_entries < <(zipinfo -1 vulnerabilities.zip \
          | sed 's|^bundles/||; s|\.json\.zst$||')
        mapfile -t expected < <("$sc" sources "$STREAM")
        IFS=',' read -ra excluded <<< "${FAILED_SOURCES:-}"

        errors=0

        dupes=$(printf '%s\n' "${zip_entries[@]}" | sort | uniq -d)
        if [ -n "$dupes" ]; then
            while IFS= read -r d; do
                echo "::error::duplicate ZIP entry: ${d}"
            done <<< "$dupes"
            (( errors++ )) || true
        fi

        for entry in "${zip_entries[@]}"; do
            found=false
            for exp in "${expected[@]}"; do
                [[ "$entry" == "$exp" ]] && found=true && break
            done
            if [[ "$found" == "false" ]]; then
                echo "::error::unexpected ZIP entry: ${entry}"
                (( errors++ )) || true
            fi
        done

        for exp in "${expected[@]}"; do
            # Skip sources already excluded during content validation.
            is_excluded=false
            for exc in "${excluded[@]}"; do
                [[ "$exp" == "$exc" ]] && is_excluded=true && break
            done
            [[ "$is_excluded" == "true" ]] && continue

            found=false
            for entry in "${zip_entries[@]}"; do
                [[ "$entry" == "$exp" ]] && found=true && break
            done
            if [[ "$found" == "false" ]]; then
                echo "::error::missing ZIP entry without prior exclusion: ${exp}"
                (( errors++ )) || true
            fi
        done

        if (( errors > 0 )); then
            echo "::error::ZIP entry validation failed with ${errors} error(s)"
            exit 1
        fi
        echo "ZIP entries validated: ${#zip_entries[@]} entries match expected sources"

    - name: Save bundle for import validation
      if: steps.check-changes.outputs.changed == 'true'
      run: cp vulnerabilities.zip /tmp/vulnerabilities.zip

    - name: Resolve stream ref
      id: resolve-ref
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euo pipefail
        ref=$(awk -v s="$STREAM" '$1 == s {print $2}' scanner/updater/version/VULNERABILITY_BUNDLE_VERSION)
        if [ -z "$ref" ]; then
            echo "::error::no ref found for stream '${STREAM}' in VULNERABILITY_BUNDLE_VERSION"
            exit 1
        fi
        case "$ref" in
            heads/*) ref="${ref#heads/}" ;;
            tags/*)  ref="${ref#tags/}" ;;
        esac
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"
        echo "Resolved stream '${STREAM}' -> ref '${ref}'"

    - name: Checkout stream ref
      if: steps.check-changes.outputs.changed == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ steps.resolve-ref.outputs.ref }}

    - name: Build updater
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euo pipefail
        echo "Building updater for stream '${STREAM}' from ref '${{ steps.resolve-ref.outputs.ref }}'..."
        make tag
        make -C scanner bin/updater
        cp scanner/bin/updater /tmp/updater

    - name: Record actual stream build
      if: steps.check-changes.outputs.changed == 'true'
      env:
        T1_RESOLVED_REF: ${{ steps.resolve-ref.outputs.ref }}
      run: python3 /tmp/t1-tests/record-build.py

    - name: Checkout master
      if: steps.check-changes.outputs.changed == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Restore bundle for import validation
      if: steps.check-changes.outputs.changed == 'true'
      run: cp /tmp/vulnerabilities.zip vulnerabilities.zip

    - name: Inject W7 malformed import data
      id: t1_fault_import
      if: steps.check-changes.outputs.changed == 'true' && inputs.t1_case == 'W7'
      run: python3 /tmp/t1-tests/inject.py W7

    - name: Validate bundle import
      id: t1_import
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euo pipefail

        if [[ "$T1_CASE" == "W9" || "$T1_CASE" == "gate-control" ]]; then
            mode=fail
            [[ "$T1_CASE" != "gate-control" ]] || mode=release
            python3 /tmp/t1-tests/mid-import.py \
                --mode "$mode" \
                --script /tmp/t1-tests/Validate-bundle-import.sh \
                --evidence "$T1_EVIDENCE"
        else
            python3 /tmp/t1-tests/run-import.py
        fi

    - name: Record validated candidate
      if: steps.check-changes.outputs.changed == 'true'
      run: python3 /tmp/t1-tests/candidate.py

    - name: Authenticate with GCS for upload
      id: t1_upload_auth
      if: steps.check-changes.outputs.changed == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets[inputs.dry_run == true && 'GOOGLE_SA_CIRCLECI_SCANNER' || 'GOOGLE_SA_STACKROX_HUB_VULN_DUMP_UPLOADER'] }}

    - name: Upload bundle
      id: t1_upload
      if: steps.check-changes.outputs.changed == 'true'
      env:
        DRY_RUN: ${{ inputs.dry_run == true }}
      run: |
        set -euo pipefail
        bundle_obj="gs://${GCS_BUCKET}/${GCS_PREFIX}/${STREAM}/vulnerabilities.zip"
        if [[ "$DRY_RUN" == "true" ]]; then
            bundle_obj="gs://scanner-v4-test/${GCS_PREFIX}/test-runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${STREAM}/vulnerabilities.zip"
        fi
        gcloud storage cp vulnerabilities.zip "$bundle_obj"
        echo "Uploaded bundle for stream '${STREAM}' -> ${bundle_obj}"

    - name: Authenticate for evidence reads only
      if: always() && steps.t1_prepare.outcome == 'success'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GOOGLE_SA_CIRCLECI_SCANNER }}

    - name: Verify real test object or authenticated absence
      if: always() && steps.t1_prepare.outcome == 'success'
      env:
        T1_CONTENT_OUTCOME: ${{ steps.download-validate.outcome }}
        T1_ZIP_OUTCOME: ${{ steps.t1_zip.outcome }}
        T1_IMPORT_OUTCOME: ${{ steps.t1_import.outcome }}
        T1_UPLOAD_AUTH_OUTCOME: ${{ steps.t1_upload_auth.outcome }}
        T1_UPLOAD_OUTCOME: ${{ steps.t1_upload.outcome }}
        T1_FAULT_OUTCOME: ${{ inputs.t1_case == 'W5' && steps.t1_fault_zip.outcome || inputs.t1_case == 'W6' && steps.t1_fault_source.outcome || steps.t1_fault_import.outcome }}
      run: python3 /tmp/t1-tests/verify-object.py

    - name: Retain disposable test evidence
      if: always() && steps.t1_prepare.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
      with:
        name: t1-${{ inputs.t1_case }}-${{ matrix.stream }}-${{ github.run_attempt }}
        path: /tmp/t1-evidence/
        if-no-files-found: error
        retention-days: 7

  notify:
    needs: [bundle]
    if: always() && needs.bundle.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
    - uses: ./.github/actions/notify-slack-on-failure
      with:
        slack-webhook: ${{ secrets[inputs.dry_run == true && 'SLACK_CI_INTEGRATION_TESTING_WEBHOOK' || 'SLACK_ONCALL_SCANNER_WEBHOOK'] }}
        context: ${{ inputs.dry_run == true && 'Dry run (test-bucket upload; no production publication)' || '' }}
