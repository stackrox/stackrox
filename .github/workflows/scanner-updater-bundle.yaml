name: Scanner updater bundle
# Downloads per-source vulnerability data from GCS, validates each source,
# and assembles vulnerabilities.zip for each bundle stream defined in
# VULNERABILITY_BUNDLE_VERSION. Missing or empty sources are skipped with a
# Slack notification; if no sources are valid the job fails.

on:
  schedule:
  - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      test-mode:
        description: "Use scanner-v4-test instead of the production GCS bucket"
        required: false
        type: boolean
        default: false
      force-stage:
        description: "Replace the staged candidate regardless of validation or freshness"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-matrix:
    if: github.repository_owner == 'stackrox'
    runs-on: ubuntu-24.04
    outputs:
      streams: ${{ steps.emit.outputs.streams }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Build stream matrix
      id: emit
      run: |
        set -euo pipefail
        streams=$(./.github/workflows/scripts/scanner-get-released-tags.sh | jq -c '[.[].version]')
        echo "streams=${streams}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: build-matrix
    runs-on: ubuntu-24.04
    container:
      image: quay.io/stackrox-io/apollo-ci:scanner-test-0.5.11@sha256:cea78f2b3a5a38c9ccda678712daaed90b7c372d6b5df963feb758b32dccebe1
      volumes:
      - /tmp:/tmp
      - /usr:/mnt/usr
      - /opt:/mnt/opt
    strategy:
      fail-fast: false
      matrix:
        stream: ${{ fromJson(needs.build-matrix.outputs.streams) }}
    concurrency:
      group: scanner-updater-bundle-${{ matrix.stream }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      STREAM: ${{ matrix.stream }}
      SOURCE_CONFIG: scanner/updater/ci/source-config.yaml
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Configure test bucket
      if: inputs['test-mode'] == true
      run: |
        set -euo pipefail
        test_config="${GITHUB_WORKSPACE}/scanner-updater-source-config-test.yaml"
        sed -E 's/^([[:space:]]*bucket:)[[:space:]]*.*/\1 scanner-v4-test/' "$SOURCE_CONFIG" > "$test_config"
        [[ "$(grep -Ec '^[[:space:]]*bucket:[[:space:]]*scanner-v4-test$' "$test_config")" -eq 1 ]]
        echo "SOURCE_CONFIG=$test_config" >> "$GITHUB_ENV"

    # The scanner CI service account can write to scanner-v4-test; the production
    # vulnerability dump uploader cannot. Keep production credentials unchanged.
    - name: Authenticate with test GCS
      if: inputs['test-mode'] == true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GOOGLE_SA_CIRCLECI_SCANNER }}

    - name: Authenticate with production GCS
      if: inputs['test-mode'] != true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GOOGLE_SA_STACKROX_HUB_VULN_DUMP_UPLOADER }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3

    # ROX-36961: evaluate the previous staged candidate before freshness.
    - name: Evaluate staged bundle
      id: staging
      env:
        FORCE_STAGE: ${{ inputs['force-stage'] == true }}
      run: |
        ./.github/workflows/scripts/scanner-updater-bundle-staging.sh evaluate "$STREAM"

    # Publish only the exact generation evaluated above; no second health check.
    - name: Publish staged bundle
      id: publish
      if: steps.staging.outputs.action == 'publish'
      run: |
        set -euo pipefail
        sc=./.github/workflows/scripts/scanner-updater-config.sh
        staging_obj=$("$sc" bundle-object "${STREAM}-staging")
        bundle_obj=$("$sc" bundle-object "$STREAM")
        generation="${{ steps.staging.outputs.generation }}"

        # Read the pre-download baseline from the evaluated staging generation.
        staging_ts=$(gcloud storage objects describe "${staging_obj}#${generation}" \
            --format="value(custom_fields.source-baseline)")
        [[ "$staging_ts" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::Missing or invalid staging source baseline" >&2; exit 1; }

        # Pin the source version; a replacement cannot be promoted by accident.
        gcloud storage cp "${staging_obj}#${generation}" "$bundle_obj"
        echo "source_baseline=$staging_ts" >> "$GITHUB_OUTPUT"
        echo "Published bundle for stream '${STREAM}' -> ${bundle_obj}"
        # Remove only the generation just published, not a newer candidate.
        gcloud storage rm "$staging_obj" --if-generation-match="$generation"

    # After promotion, compare sources with the pre-download baseline rather
    # than the newer production object's creation time.
    - name: Check for changes
      if: >-
        steps.staging.outputs.should_stage == 'true' &&
        (steps.staging.outputs.action != 'publish' || steps.publish.outcome == 'success')
      id: check-changes
      env:
        FORCE: ${{ inputs['force-stage'] == true }}
      run: |
        set -euo pipefail

        sc=./.github/workflows/scripts/scanner-updater-config.sh
        bucket=$("$sc" bucket)
        prefix=$("$sc" prefix)

        echo "GCS_BUCKET=$bucket" >> "$GITHUB_ENV"
        echo "GCS_PREFIX=$prefix" >> "$GITHUB_ENV"

        if [[ "$FORCE" == "true" ]]; then
            echo "Force rebuild requested"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
        fi

        if [[ "${{ steps.staging.outputs.action }}" == "publish" ]]; then
            bundle_ts="${{ steps.publish.outputs.source_baseline }}"
            [[ -n "$bundle_ts" ]] || { echo "::error::Missing published source baseline" >&2; exit 1; }
        else
            bundle_obj=$("$sc" bundle-object "$STREAM")
            # Without a promotion, retain the existing production baseline.
            # If the object is missing or unreadable, rebuild.
            if ! bundle_ts=$(gcloud storage objects describe "$bundle_obj" \
                --format="value(creation_time)" 2>/dev/null) || [ -z "$bundle_ts" ]; then
                echo "Bundle not found or query failed; assuming changes"
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
            fi
        fi
        bundle_epoch=$(date -d "$bundle_ts" +%s)
        echo "Freshness baseline: $bundle_ts (epoch: $bundle_epoch)"

        # Check if any source has been updated after the bundle.
        changed=false
        while IFS= read -r source; do
            object="gs://${bucket}/${prefix}/${STREAM}/sources/${source}.json.zst"
            newer=$(GCS_OBJECT="$object" \
                ./.github/workflows/scripts/scanner-updater-check-freshness.sh --newer-than "$bundle_epoch") || {
                echo "Source '${source}': check failed; assuming changes"
                changed=true; break
            }
            if [[ "$newer" == "true" ]]; then
                echo "Source '${source}' is newer than bundle"
                changed=true; break
            fi
        done < <("$sc" sources "$STREAM")

        echo "changed=${changed}" >> "$GITHUB_OUTPUT"
        if [ "$changed" = "false" ]; then
            echo "No sources newer than bundle; skipping"
        fi

    - name: Download sources
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euxo pipefail
        # Persist a conservative baseline across workflow runs via GCS metadata.
        echo "SOURCE_BASELINE=$(date -u -d '1 second ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

        sc=./.github/workflows/scripts/scanner-updater-config.sh
        mkdir -p bundles

        while IFS= read -r source; do
            object="gs://${GCS_BUCKET}/${GCS_PREFIX}/${STREAM}/sources/${source}.json.zst"
            dest="bundles/${source}.json.zst"

            # Retry if the source is overwritten between describe and cp.
            downloaded=false
            for attempt in 1 2 3; do
                meta=$(gcloud storage objects describe "$object" --format=json)
                gen=$(jq -r '.generation' <<< "$meta")
                timestamp=$(jq -re '.custom_fields["refresh-completed-at"]' <<< "$meta")

                if gcloud storage cp "$object" "$dest" --if-generation-match="$gen"; then
                    touch -d "$timestamp" "$dest"
                    downloaded=true
                    break
                fi
                echo "Source '${source}': download attempt ${attempt} failed, retrying"
            done

            if [[ "$downloaded" != "true" ]]; then
                echo "::error::${source}: download failed after 3 attempts"
                exit 1
            fi
        done < <("$sc" sources "$STREAM")

    - name: Validate sources
      id: download-validate
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euo pipefail

        valid_files=()
        failed_sources=()
        while IFS= read -r source; do
            dest="bundles/${source}.json.zst"
            if [ ! -f "$dest" ] || [ ! -s "$dest" ]; then
                echo "::error::${source}: missing or empty"
                failed_sources+=("$source")
            else
                echo "source '${source}': OK"
                valid_files+=("$dest")
            fi
        done < <(./.github/workflows/scripts/scanner-updater-config.sh sources "$STREAM")

        ( IFS=','; echo "failed=${failed_sources[*]}" >> "$GITHUB_OUTPUT" )

        if [ "${#valid_files[@]}" -eq 0 ]; then
            echo "::error::no valid source files found for stream '${STREAM}'; cannot assemble bundle"
            exit 1
        fi

        printf '%s\n' "${valid_files[@]}" > valid-files.txt
        echo "Validated: ${#valid_files[@]} of $(( ${#valid_files[@]} + ${#failed_sources[@]} )) source(s) OK"

    - name: Assemble bundle
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        set -euo pipefail
        zip vulnerabilities.zip -@ < valid-files.txt

    - name: Stage assembled bundle
      if: steps.check-changes.outputs.changed == 'true'
      env:
        FORCE_STAGE: ${{ inputs['force-stage'] == true }}
      run: |
        ./.github/workflows/scripts/scanner-updater-bundle-staging.sh stage "$STREAM" vulnerabilities.zip

    - name: Notify on partial failure
      if: >-
        always() && inputs['test-mode'] != true &&
        steps.download-validate.outcome == 'success' &&
        steps.download-validate.outputs.failed != ''
      uses: ./.github/actions/notify-slack-on-failure
      with:
        slack-webhook: ${{ secrets.SLACK_ONCALL_SCANNER_WEBHOOK }}
        message: >-
          Vulnerability bundler: validation failures for stream '${{ env.STREAM }}'
          (sources: ${{ steps.download-validate.outputs.failed }}):
          <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>

  notify:
    needs: [bundle]
    if: always() && inputs['test-mode'] != true && needs.bundle.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
    - uses: ./.github/actions/notify-slack-on-failure
      with:
        slack-webhook: ${{ secrets.SLACK_ONCALL_SCANNER_WEBHOOK }}
