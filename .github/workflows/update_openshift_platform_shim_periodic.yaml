# Keeps tests/e2e/kind-compliance/assets/openshift-platform-shim's
# upstream-sourced content (sccs.yaml, and the apiServerArguments/
# extendedArguments fields in objects.yaml) in sync with the latest commit on
# each upstream operator repo's default branch, instead of relying on someone
# remembering to re-run curl commands by hand.
#
# This follows the same pattern as update_collector_periodic.yaml /
# update_fact_periodic.yaml (not Renovate/MintMaker: .github/renovate.json5
# scopes that bot to Konflux-only managers (tekton/dockerfile/rpm-lockfile),
# and even its upstream base config restricts postUpgradeTasks to a fixed
# allowlist of commands that a repo-level config cannot extend, so a custom
# regex manager that shells out to regenerate.sh isn't an option here).
name: Update OpenShift platform shim pins
on:
  workflow_dispatch:
  schedule:
    - cron: 0 6 * * 1
jobs:
  update-openshift-platform-shim:
    if: ${{ github.repository_owner == 'stackrox' }}
    runs-on: ubuntu-24.04
    env:
      SHIM_DIR: tests/e2e/kind-compliance/assets/openshift-platform-shim
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        ref: master # this is our target branch

    - name: Resolve latest upstream commits
      id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        kas_sha="$(gh api repos/openshift/cluster-kube-apiserver-operator/commits/main --jq .sha)"
        kcm_sha="$(gh api repos/openshift/cluster-kube-controller-manager-operator/commits/main --jq .sha)"
        echo "kas_sha=$kas_sha" >> "$GITHUB_OUTPUT"
        echo "kcm_sha=$kcm_sha" >> "$GITHUB_OUTPUT"

    - name: Bump pins and regenerate
      run: |
        set -euo pipefail
        today="$(date -u +%F)"
        sed -i "s/^KAS_OPERATOR_SHA=.*/KAS_OPERATOR_SHA=${{ steps.resolve.outputs.kas_sha }}  # cluster-kube-apiserver-operator@main HEAD as of ${today}/" "$SHIM_DIR/regenerate.sh"
        sed -i "s/^KCM_OPERATOR_SHA=.*/KCM_OPERATOR_SHA=${{ steps.resolve.outputs.kcm_sha }}  # cluster-kube-controller-manager-operator@main HEAD as of ${today}/" "$SHIM_DIR/regenerate.sh"
        python3 -m pip install --quiet pyyaml
        "$SHIM_DIR/regenerate.sh"

    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8
      with:
        token: '${{ secrets.RHACS_BOT_GITHUB_TOKEN }}'
        commit-message: 'chore(compliance): bump openshift-platform-shim upstream pins'
        committer: '${{ secrets.RHACS_BOT_GITHUB_USERNAME }} <${{ secrets.RHACS_BOT_GITHUB_EMAIL }}>'
        author: '${{ secrets.RHACS_BOT_GITHUB_USERNAME }} <${{ secrets.RHACS_BOT_GITHUB_EMAIL }}>'
        branch: update-openshift-platform-shim
        signoff: false
        delete-branch: true
        title: 'chore(compliance): bump openshift-platform-shim upstream pins'
        body: |
          Weekly re-sync of the kind-compliance OpenShift-API shim's
          upstream-sourced content against the latest commit on each upstream
          operator repo's default branch:
          - `sccs.yaml` (verbatim from `cluster-kube-apiserver-operator`)
          - the `apiServerArguments`/`extendedArguments` fields in
            `objects.yaml` (from `cluster-kube-apiserver-operator` /
            `cluster-kube-controller-manager-operator`)

          Generated by `tests/e2e/kind-compliance/assets/openshift-platform-shim/regenerate.sh`.
          Review the diff for any behavior-affecting changes (new/changed
          default flags, new SCC fields, etc.) before merging -- this can
          change which `ocp4-cis` checks PASS/FAIL.
        labels: |
          dependencies
        draft: false
