name: Auto /retest
on:
  workflow_dispatch:
  schedule:
  - cron: 5,15,25,35,45,55 * * * *
concurrency:
  group: Auto /retest
  cancel-in-progress: false
jobs:
  retest:
    if:  ${{ github.repository_owner == 'stackrox' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      with:
        sparse-checkout: |
          .github
          tools/retest

    - name: Setup Go environment
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Retest
      env:
        GITHUB_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
      run: cd tools/retest && go run ./...
