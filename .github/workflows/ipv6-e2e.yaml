# IPv6-only E2E smoke tests on KinD
#
# Validates that ACS deploys and operates correctly on a single-stack
# IPv6 Kubernetes cluster. Runs on GHA runners (no cloud infra needed).
#
# Triggered by label 'e2e-ipv6' on PRs, or manually via workflow_dispatch.

name: IPv6 E2E

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to test"
        required: true
        type: string
  pull_request:
    types: [labeled]

defaults:
  run:
    shell: bash

jobs:
  ipv6-e2e:
    name: IPv6 KinD e2e
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'e2e-ipv6'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CLUSTER_NAME: ipv6-e2e-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Resolve image tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(make tag)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create IPv6-only KinD cluster (background)
        uses: ./.github/actions/create-kind-cluster
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          tag: ${{ steps.tag.outputs.tag }}
          ip-family: ipv6
          quay-user: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
          quay-pass: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

      - name: Deploy StackRox
        uses: ./.github/actions/deploy-stackrox
        with:
          tag: ${{ steps.tag.outputs.tag }}
          exposure: none
          github-token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          registry-username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
          registry-password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

      - name: Verify IPv6-only networking
        run: |
          echo "=== Cluster network config ==="
          kubectl get nodes -o wide
          echo ""
          echo "=== Pod CIDRs ==="
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.podCIDR}{"\n"}{end}'
          echo ""
          echo "=== Service CIDRs ==="
          kubectl cluster-info dump | grep -i service-cluster-ip-range || true
          echo ""
          echo "=== Central pod IPs ==="
          kubectl -n stackrox get pods -o wide
          echo ""
          # Verify no IPv4 addresses on pods
          ipv4_pods=$(kubectl -n stackrox get pods -o jsonpath='{.items[*].status.podIP}' | tr ' ' '\n' | grep -c '\.' || true)
          if [[ "$ipv4_pods" -gt 0 ]]; then
            echo "ERROR: Found $ipv4_pods pods with IPv4 addresses on an IPv6-only cluster"
            exit 1
          fi
          echo "All pods are using IPv6 addresses"

      - name: Smoke test — Central API
        run: |
          ROX_ADMIN_PASSWORD=$(cat /tmp/rox-admin-password)
          API_ENDPOINT=$(cat /tmp/rox-api-endpoint)
          echo "Testing Central API at ${API_ENDPOINT}..."

          # Basic API health
          curl -sk "https://${API_ENDPOINT}/v1/metadata" \
            -u "admin:${ROX_ADMIN_PASSWORD}" | jq .

          # Cluster health
          curl -sk "https://${API_ENDPOINT}/v1/clusters" \
            -u "admin:${ROX_ADMIN_PASSWORD}" | jq '.clusters | length'

      - name: Smoke test — Sensor connection
        run: |
          echo "Checking sensor health..."
          kubectl -n stackrox rollout status deploy/sensor --timeout=5m
          # Verify sensor connected to central
          ROX_ADMIN_PASSWORD=$(cat /tmp/rox-admin-password)
          API_ENDPOINT=$(cat /tmp/rox-api-endpoint)
          for i in $(seq 1 30); do
            status=$(curl -sk "https://${API_ENDPOINT}/v1/clusters" \
              -u "admin:${ROX_ADMIN_PASSWORD}" | jq -r '.clusters[0].healthStatus.sensorHealthStatus // "UNKNOWN"')
            echo "Attempt $i: sensor status = $status"
            if [[ "$status" == "HEALTHY" ]]; then
              echo "Sensor connected and healthy"
              break
            fi
            sleep 10
          done
          [[ "$status" == "HEALTHY" ]] || { echo "Sensor not healthy after 5 minutes"; exit 1; }

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p test-artifacts
          kubectl -n stackrox get pods -o wide > test-artifacts/pods.txt 2>&1 || true
          kubectl -n stackrox describe pods > test-artifacts/pod-descriptions.txt 2>&1 || true
          kubectl -n stackrox logs deploy/central --tail=200 > test-artifacts/central.log 2>&1 || true
          kubectl -n stackrox logs deploy/sensor --tail=200 > test-artifacts/sensor.log 2>&1 || true
          kubectl -n stackrox get svc -o wide > test-artifacts/services.txt 2>&1 || true
          kubectl get nodes -o wide > test-artifacts/nodes.txt 2>&1 || true
          cat /tmp/kind-create.log > test-artifacts/kind-create.log 2>&1 || true
          cat /tmp/deploy-stackrox.log > test-artifacts/deploy-stackrox.log 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: ipv6-e2e-${{ github.run_id }}
          path: test-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: kind delete cluster --name "${{ env.CLUSTER_NAME }}" || true
