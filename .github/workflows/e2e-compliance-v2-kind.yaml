# Single-cluster compliance v2 e2e on kind.
#
# Stands up StackRox Central + one secured cluster on kind, with a real
# Compliance Operator at FIDELITY=platform (real ocp4/rhcos4 ProfileBundles +
# the OpenShift-API shim, so ocp4-* PLATFORM checks produce real PASS/FAIL
# instead of NOT-APPLICABLE), then runs the full
# tests/compliance_operator_v2_test.go suite (the suite Prow runs on real
# OpenShift via tests/e2e/run-compliance-e2e.sh) unmodified: all 11
# single-cluster TestComplianceV2* tests pass as-is on kind (the only change
# needed anywhere was a harness-side one — see SECURED1_NAME below). The 4
# TestComplianceV2MultiCluster* tests in the sibling file skip automatically
# with SECURED_COUNT=1. See tests/e2e/kind-compliance/README.md for the
# known-limitations caveat (rhcos4 NODE-scan result *correctness* and
# MachineConfig remediation are not validated, since kind nodes are not RHCOS
# and there are no MachineConfigPools).
#
# Why a dedicated workflow: compliance e2e currently runs on OpenShift only
# (Prow, ~2.5h incl. cluster provisioning). This proves the single-cluster
# subset can be gated far more cheaply on kind in GitHub Actions. See
# tests/e2e/kind-compliance/ (built on top of the multi-cluster workflow,
# e2e-multicluster-compliance-kind.yaml) and tests/compliance_operator_v2_test.go.
#
# Dispatched by .github/workflows/e2e-dispatch.yaml (opt-in via the
# e2e-compliance-v2-kind PR label), or directly via workflow_dispatch.
name: e2e-compliance-v2-kind

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the job should be skipped.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

env:
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  KUBECTL_VERSION: v1.36.4
  HELM_VERSION: v3.16.4
  # Pinned Compliance Operator image.
  CO_OPERATOR_IMAGE: quay.io/redhat-user-workloads/ocp-isc-tenant/compliance-operator-dev@sha256:70d2176520624cf5215a1f3b73b8fd64bbcf3278aacb5971409c99095ec35d2e
  PREFIX: cv2-ci
  SECURED_COUNT: "1"
  # TestComplianceV2Integration asserts exactly one integration named "remote".
  SECURED1_NAME: remote
  # Pin the script's work dir so the setup and test steps agree (script otherwise
  # derives it from $TMPDIR, which GitHub sets on the runner).
  WORK: /tmp/kind-cv2-ci/cv2-ci

jobs:
  compliance-v2-kind:
    if: github.event_name == 'workflow_dispatch' || inputs.should-run
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAIN_IMAGE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          # Full history + tags so `make tag` / status.sh can `git describe`.
          fetch-depth: 0
          # Check out the PR head (not the merge commit) so the diagnostics and
          # checked-out test code match the PR whose images we were given.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/job-preamble
        with:
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
          free-disk-space: "40"

      - uses: ./.github/actions/cache-go-dependencies

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
          password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

      - name: Install kind, kubectl, helm
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          sudo curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo install -m0755 linux-amd64/helm /usr/local/bin/helm
          kind version && kubectl version --client && helm version --short

      - name: Build roxctl
        run: |
          make cli_host-arch
          echo "ROXCTL=$PWD/bin/linux_amd64/roxctl" >> "$GITHUB_ENV"

      - name: Stand up Central + 1 secured cluster with Compliance Operator (platform fidelity)
        env:
          # Use the PUBLIC opensource registry (quay.io/stackrox-io) so the kind
          # nodes can pull without registry credentials (imagePullSecrets.allowNone).
          # build.yaml publishes the PR's main+central-db there too (STACKROX_BRANDING).
          IMAGE_DEFAULTS: opensource
          MAIN_IMAGE_REGISTRY: quay.io/stackrox-io
          ROX_ADMIN_PASSWORD: ci-${{ github.run_id }}
          TIMEOUT_ROLLOUT: "1200"
          # platform = real ocp4/rhcos4 ProfileBundles + OpenShift-API shim, so
          # ocp4-* PLATFORM checks (e.g. ocp4-cis/ocp4-e8) produce real
          # PASS/FAIL/MANUAL instead of NOT-APPLICABLE. The migrated tests
          # reference real profiles (ocp4-cis, ocp4-pci-dss, rhcos4-e8, ...), so
          # unlike the multi-cluster workflow's default `cel`, this job needs it.
          FIDELITY: platform
        run: |
          set -euo pipefail
          # The cluster deploy (~10-15 min) and the Go test binary compile share
          # no dependency, so overlap them: warm GOCACHE here in the background
          # and let the later `make -C tests compliance-v2-tests` step reuse it,
          # instead of paying the compile cost twice in series.
          go test -c -tags "test,compliance" -o /tmp/cv2.test ./tests/ &
          compile_pid=$!
          tests/e2e/kind-compliance/setup-multicluster-compliance-ci.sh up
          wait "$compile_pid"

      - name: Install go-junit-report (for the tests Makefile report target)
        run: |
          cd tools/test && go install github.com/jstemmer/go-junit-report/v2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run compliance-v2 Go tests
        env:
          API_ENDPOINT: localhost:28443
          ROX_USERNAME: admin
        run: |
          set -euo pipefail
          ROX_ADMIN_PASSWORD="$(cat "$WORK/state/admin-password")"
          export ROX_ADMIN_PASSWORD
          KUBECONFIG="$HOME/.kube/config"
          export KUBECONFIG
          kubectl config use-context "kind-${PREFIX}"
          kubectl --context "kind-${PREFIX}" -n stackrox port-forward svc/central 28443:443 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          sleep 6
          make -C tests compliance-v2-tests

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p /tmp/diag
          cp -f "$WORK/state/proof.json" /tmp/diag/ 2>/dev/null || true
          cp -f tests/test.log /tmp/diag/ 2>/dev/null || true
          for ctx in $(kubectl config get-contexts -o name | grep "^kind-${PREFIX}"); do
            ns_out="/tmp/diag/${ctx//\//_}"
            mkdir -p "$ns_out"
            kubectl --context "$ctx" get pods -A -o wide > "$ns_out/pods.txt" 2>&1 || true
            kubectl --context "$ctx" -n stackrox describe pods > "$ns_out/stackrox-describe.txt" 2>&1 || true
            kubectl --context "$ctx" -n stackrox get events --sort-by=.lastTimestamp > "$ns_out/stackrox-events.txt" 2>&1 || true
            kubectl --context "$ctx" -n openshift-compliance describe pods > "$ns_out/co-describe.txt" 2>&1 || true
            kubectl --context "$ctx" -n openshift-compliance get all,compliancescans,compliancecheckresults,scansettingbindings > "$ns_out/compliance.txt" 2>&1 || true
            kubectl --context "$ctx" -n openshift-compliance logs deploy/compliance-operator --tail=200 > "$ns_out/co-operator.log" 2>&1 || true
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: compliance-v2-kind-diag-${{ github.run_id }}
          path: /tmp/diag
          retention-days: 3

      - name: Publish test report
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # ratchet:test-summary/action@v2
        with:
          paths: 'tests/report.xml'

      - name: Tear down kind cluster
        if: always()
        run: tests/e2e/kind-compliance/setup-multicluster-compliance-ci.sh down || true
