# cimemo experiment — branch-local replacement of build.yaml.
# Dispatching the REGISTERED build.yaml path with --ref this-branch runs
# THIS content. Master's real build.yaml is untouched.
#
# Legs:
#   control       — plain cold `go build` (baseline)
#   populate      — cimemo memoize: cold build, uploads actions + receipt
#   serve-receipt — fresh runner, same inputs: receipt hit, go never runs
#   serve-change  — fresh runner, one-file change: receipt miss, warm
#                   compile cache from cloud
#
# GOFLAGS=-buildvcs=false + mtime normalization keep action IDs and
# receipts stable across runners (see tools/cimemo/SENSORS.md).

name: cimemo experiment

on:
  workflow_dispatch:
    inputs:
      target:
        description: "go build target (package path)"
        default: "./central"
      commit:
        description: "unused (input-name compat with master's build.yaml)"
        required: false
        default: ""
        type: string

permissions: {}

env:
  GOFLAGS: -buildvcs=false
  CIMEMO_ACCOUNT: cigocache
  CIMEMO_CONTAINER: cimemo-ci

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: plain cold build (baseline)
        run: |
          rm -rf /tmp/gc && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc go build -o /tmp/central-control "${{ inputs.target }}"
          END=$(date +%s%3N)
          echo "CONTROL: $((END-START))ms"
          sha256sum /tmp/central-control

  populate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: build cimemo
        run: cd tools/cimemo && go build -o /tmp/cimemo ./cmd/cimemo
      - name: normalize mtimes
        run: |
          EPOCH=946684800
          sudo find /opt/hostedtoolcache/go -exec touch -d @$EPOCH {} +
          find "$(go env GOMODCACHE)" -exec touch -d @$EPOCH {} + 2>/dev/null || true
          find . -exec touch -d @$EPOCH {} +
      - name: cimemo cold build (compile + upload actions + receipt)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
        run: |
          mkdir -p bin-exp
          START=$(date +%s%3N)
          /tmp/cimemo go build -o bin-exp/central "${{ inputs.target }}"
          END=$(date +%s%3N)
          echo "POPULATE: $((END-START))ms (cold compile + uploads)"
      - id: sha
        run: echo "sha=$(sha256sum bin-exp/central | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  serve-receipt:
    runs-on: ubuntu-latest
    needs: populate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: build cimemo
        run: cd tools/cimemo && go build -o /tmp/cimemo ./cmd/cimemo
      - name: normalize mtimes
        run: |
          EPOCH=946684800
          sudo find /opt/hostedtoolcache/go -exec touch -d @$EPOCH {} +
          find "$(go env GOMODCACHE)" -exec touch -d @$EPOCH {} + 2>/dev/null || true
          find . -exec touch -d @$EPOCH {} +
      - name: receipt hit — restore binary, go never runs
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
        run: |
          mkdir -p bin-exp
          START=$(date +%s%3N)
          /tmp/cimemo go build -o bin-exp/central "${{ inputs.target }}" 2>&1 | tee /tmp/cimemo.log
          END=$(date +%s%3N)
          echo "SERVE-RECEIPT: $((END-START))ms"
          grep -E "CACHE HIT|running:|verified|MISS" /tmp/cimemo.log || true
          SERVE_SHA=$(sha256sum bin-exp/central | cut -d' ' -f1)
          echo "receipt sha:  $SERVE_SHA"
          echo "populate sha: ${{ needs.populate.outputs.sha }}"
          if [ "$SERVE_SHA" = "${{ needs.populate.outputs.sha }}" ]; then
            echo "BYTE-IDENTICAL: yes"
          else
            echo "BINARY MISMATCH"
            exit 1
          fi

  serve-change:
    runs-on: ubuntu-latest
    needs: populate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: build cimemo
        run: cd tools/cimemo && go build -o /tmp/cimemo ./cmd/cimemo
      - name: normalize mtimes
        run: |
          EPOCH=946684800
          sudo find /opt/hostedtoolcache/go -exec touch -d @$EPOCH {} +
          find "$(go env GOMODCACHE)" -exec touch -d @$EPOCH {} + 2>/dev/null || true
          find . -exec touch -d @$EPOCH {} +
      - name: one-file change — receipt miss, warm compile cache
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
        run: |
          printf '// cimemo change %s\n' "$(date +%s)" >> central/main.go
          mkdir -p bin-exp
          START=$(date +%s%3N)
          /tmp/cimemo go build -o bin-exp/central "${{ inputs.target }}" 2>&1 | tee /tmp/cimemo.log
          END=$(date +%s%3N)
          echo "SERVE-CHANGE: $((END-START))ms (receipt miss + warm actions from cloud)"
          grep -E "CACHE HIT|MISS|running:|gocache:|CACHED" /tmp/cimemo.log | head -6 || true

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: build cimemo
        run: cd tools/cimemo && go build -o /tmp/cimemo ./cmd/cimemo
      - name: normalize mtimes
        run: |
          EPOCH=946684800
          sudo find /opt/hostedtoolcache/go -exec touch -d @$EPOCH {} +
          find "$(go env GOMODCACHE)" -exec touch -d @$EPOCH {} + 2>/dev/null || true
          find . -exec touch -d @$EPOCH {} +
      - name: cold pass — three binaries + image
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
        run: |
          mkdir -p bin-exp
          START=$(date +%s%3N)
          for t in ./central ./sensor/kubernetes ./sensor/admission-control; do
            echo "--- building $t"
            /tmp/cimemo go build -o bin-exp/$(basename $t) $t 2>&1 | grep -E "CACHED|gocache:" | head -2
          done
          echo "--- image"
          /tmp/cimemo docker build -f tools/cimemo/pipeline-image/Dockerfile -t cimemo-pipeline:cold . 2>&1 | grep -E "CACHED|\[cimemo\]" | head -2
          echo "PIPELINE-COLD: $(( $(date +%s%3N) - START ))ms"
          sha256sum bin-exp/* | tee /tmp/cold-shas
      - name: receipt pass — everything from receipts
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
        run: |
          rm -rf bin-exp
          mkdir -p bin-exp
          START=$(date +%s%3N)
          for t in ./central ./sensor/kubernetes ./sensor/admission-control; do
            /tmp/cimemo go build -o bin-exp/$(basename $t) $t 2>&1 | grep -E "CACHE HIT|running" | head -1
          done
          /tmp/cimemo docker build -f tools/cimemo/pipeline-image/Dockerfile -t cimemo-pipeline:warm . 2>&1 | grep -E "CACHE HIT|running" | head -1
          echo "PIPELINE-RECEIPT: $(( $(date +%s%3N) - START ))ms"
          sha256sum bin-exp/* | tee /tmp/warm-shas
          if diff -q /tmp/cold-shas /tmp/warm-shas >/dev/null; then
            echo "ALL BINARIES IDENTICAL"
          else
            echo "BINARY MISMATCH"
            exit 1
          fi

  pipeline-warm:
    # The trimmed warm path: commit receipts need neither the module
    # cache nor mtime normalization — only git + the go binary + the
    # vendored cimemo build. This is the true PR-rerun wall-clock.
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: build cimemo (vendored, no network)
        run: cd tools/cimemo && go build -o /tmp/cimemo ./cmd/cimemo
      - name: receipt pass — commit fast path, minimal setup
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
        run: |
          mkdir -p bin-exp
          START=$(date +%s%3N)
          for t in ./central ./sensor/kubernetes ./sensor/admission-control; do
            /tmp/cimemo go build -o bin-exp/$(basename $t) $t 2>&1 | grep -E "CACHE HIT|running" | head -1
          done
          /tmp/cimemo docker build -f tools/cimemo/pipeline-image/Dockerfile -t cimemo-pipeline:warmfast . 2>&1 | grep -E "CACHE HIT|running" | head -1
          echo "PIPELINE-WARM: $(( $(date +%s%3N) - START ))ms"
