name: Build
# Content-addressed build system.
# Each job is a self-contained pipeline: trace backward from the output,
# check what exists, build only the delta. No `needs` chains. The blob
# store IS the coordination mechanism.
#
# Warm run target: ~30s (re-tag only)
# 1-binary-change target: ~2 min
# Full rebuild target: ~5 min

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build'
        required: true
        type: string
      retag_source:
        description: 'Master build tag to copy e2e sidecar images from (empty = skip)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  GOFLAGS: -buildvcs=false
  # Bump when the build RECIPE changes (step logic, flags, transform).
  # Receipts cover source state AND recipe; without this, a recipe fix
  # would silently keep serving images built by the old recipe.
  WORKFLOW_RECIPE: v4

jobs:
  main-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, branding: STACKROX_BRANDING, registry: quay.io/stackrox-io, runs-on: ubuntu-24.04 }
          - { arch: amd64, branding: RHACS_BRANDING, registry: quay.io/rhacs-eng, runs-on: ubuntu-24.04 }
          - { arch: arm64, branding: STACKROX_BRANDING, registry: quay.io/stackrox-io, runs-on: ubuntu-24.04-arm }
          - { arch: arm64, branding: RHACS_BRANDING, registry: quay.io/rhacs-eng, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.setup.outputs.image_tag }}
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.commit || github.event.pull_request.head.sha }}

      - name: Ensure CA build infrastructure present
        # When building a tree that doesn't contain our infrastructure
        # (e.g., a master commit for validation), fetch it from this
        # branch. The source under test is the checkout; the build
        # machinery (tools, Dockerfiles) always comes from here.
        run: |
          if [ ! -f tools/gocache-serve/bin/gocache-serve ] || [ ! -f tools/ca/gen-dockerfile ]; then
            echo 'CA infrastructure not in checkout, fetching from branch...'
            git fetch origin davdhacs/content-addressed-build --depth=1
            git checkout origin/davdhacs/content-addressed-build -- tools/gocache-serve/ tools/ca/ image/base/
          fi

      - name: Setup
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Buildx (docker-container driver for full cache support)
          docker buildx create --name builder --driver docker-container --use 2>/dev/null || true
          # Registry auth (before build, so layer cache can pull)
          if [ "${{ matrix.branding }}" = "RHACS_BRANDING" ]; then
            echo "${{ secrets.QUAY_RHACS_ENG_RW_PASSWORD }}" | docker login quay.io \
              -u "${{ secrets.QUAY_RHACS_ENG_RW_USERNAME }}" --password-stdin
          else
            echo "${{ secrets.QUAY_STACKROX_IO_RW_PASSWORD }}" | docker login quay.io \
              -u "${{ secrets.QUAY_STACKROX_IO_RW_USERNAME }}" --password-stdin
          fi
          # Blob store client
          echo "GOCACHEPROG=${{ github.workspace }}/tools/gocache-serve/bin/gocache-serve" >> "$GITHUB_ENV"
          echo "GOCACHE_SERVE_BACKEND=azure" >> "$GITHUB_ENV"
          echo "GOCACHE_SERVE_CONTAINER=ci-gocache" >> "$GITHUB_ENV"
          # Image tag + version stamps, computed once for all steps.
          # BUILD_TAG feeds both go-build.sh x_def stamps AND the UI's
          # getProductVersion() (make tag → git describe, which is empty
          # on a shallow checkout → invalid semver → webpack fails).
          # Computed shallow-friendly: base tag via ls-remote (remote
          # query), commit count via the GitHub compare API.
          SHA="$(git rev-parse HEAD)"
          # --short=10 to match git describe --abbrev=10 (make tag):
          # e2e-dispatch waits for main:$(make tag) — the SHA
          # abbreviation length must match exactly.
          SHORTSHA="$(git rev-parse --short=10 HEAD)"
          LATEST_TAG="$(git ls-remote --tags --refs origin \
            | awk -F/ '{print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9x]+$' | sort -V | tail -1)"
          if [ -n "$LATEST_TAG" ]; then
            COUNT="$(gh api repos/stackrox/stackrox/compare/${LATEST_TAG}...${SHA} \
              --jq .ahead_by 2>/dev/null || echo 0)"
            BUILD_TAG_VAL="${LATEST_TAG}-${COUNT}-g${SHORTSHA}"
          else
            BUILD_TAG_VAL="0.0.0-g${SHORTSHA}"
          fi
          echo "BUILD_TAG=${BUILD_TAG_VAL}" >> "$GITHUB_ENV"
          echo "SHORTCOMMIT=${SHORTSHA}" >> "$GITHUB_ENV"
          # Image tag in master's format (make tag / git describe):
          # e2e-dispatch waits for main:<this tag>, and master's Build
          # pushes the same scheme.
          echo "IMAGE_TAG=${BUILD_TAG_VAL}" >> "$GITHUB_ENV"
          echo "image_tag=${BUILD_TAG_VAL}" >> "$GITHUB_OUTPUT"
          echo "stamps: BUILD_TAG=${BUILD_TAG_VAL}"

      # =================================================================
      # FAST PATH — does the output already exist for this source state?
      # =================================================================
      - name: Fast path (component-scoped receipt check → re-tag)
        id: fastpath
        run: |
          set -euo pipefail
          # Release guard: tag builds must never take the fast path —
          # re-tagged images embed test-time version stamps, which is
          # unacceptable for releases.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "BUILD PATH: tag build (release guard — no fast path)"
            exit 0
          fi
          # Component-scoped hashing: hash only files that affect each
          # build component. A README or docs change doesn't invalidate
          # the Go binaries or the image. This enables partial fast
          # paths: "Go changed, UI didn't → fetch UI, rebuild binaries."
          GO_HASH=$(git ls-files '*.go' 'go.mod' 'go.sum' 'Makefile' 'scripts/' 2>/dev/null \
            | grep -v '_test.go' | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)
          UI_HASH=$(git ls-files 'ui/' 2>/dev/null \
            | grep -Ev 'node_modules|test|spec' | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)
          DOCKER_HASH=$(git ls-files 'image/' 'Dockerfile*' 'docs/api/' 2>/dev/null \
            | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)
          BUILD_HASH="${GO_HASH}-${UI_HASH}-${DOCKER_HASH}"
          # Recipe hash: the transform script, the recipe version, and
          # the base image digest. Base image is rebuilt weekly; a new
          # base must invalidate receipts, not serve stale-layer images.
          BASE_DIGEST=$(docker buildx imagetools inspect \
            "quay.io/stackrox-io/main:base-${{ matrix.arch }}" 2>/dev/null \
            | grep Digest: | awk '{print $2}' | cut -c8-19)
          RECIPE_HASH=$((cat tools/ca/gen-dockerfile 2>/dev/null; \
            echo "${{ env.WORKFLOW_RECIPE }}${BASE_DIGEST}") | sha256sum | cut -c1-16)
          echo "component hashes: go=${GO_HASH} ui=${UI_HASH} docker=${DOCKER_HASH} recipe=${RECIPE_HASH}"
          
          RECEIPT_KEY="build-receipt-${{ matrix.branding }}-${{ matrix.arch }}-${RECIPE_HASH}-${BUILD_HASH}"

          if "${GOCACHEPROG}" -fetch-any "$RECEIPT_KEY" /tmp/receipt.json 2>/dev/null && [ -s /tmp/receipt.json ]; then
            DIGEST=$(jq -r '.digest // empty' /tmp/receipt.json)
            REG=$(jq -r '.registry // empty' /tmp/receipt.json)
            if [ -n "$DIGEST" ] && [ -n "$REG" ]; then
              if docker buildx imagetools create \
                -t "${REG}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}" \
                "${REG}/main@${DIGEST}" 2>/dev/null; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "FAST PATH: re-tagged from receipt (go=${GO_HASH:0:8} ui=${UI_HASH:0:8})"
                exit 0
              fi
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "BUILD PATH: no receipt for go=${GO_HASH:0:8} ui=${UI_HASH:0:8} docker=${DOCKER_HASH:0:8}"

      # =================================================================
      # BUILD PATH — fetch or compile inputs → docker → push → receipt
      # =================================================================

      - name: Binaries — fetch from blob or compile
        if: steps.fastpath.outputs.skip != 'true'
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stamps come from the Setup step (BUILD_TAG/SHORTCOMMIT in env)
          echo "stamps: BUILD_TAG=$BUILD_TAG SHORTCOMMIT=$SHORTCOMMIT go=$(go version)"

          GO_HASH=$(git ls-files '*.go' 'go.mod' 'go.sum' 'Makefile' 'scripts/' 2>/dev/null \
            | grep -v '_test.go' | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)
          # The key includes BUILD_TAG: version stamps are baked into the
          # binaries (x_defs), so a README-only change (same GO_HASH,
          # different tag) must not reuse the old archive. The compile
          # cache still dedupes the actual compilation; only the link
          # re-runs.
          BIN_KEY="ca-binaries-v3-${{ matrix.arch }}-${GO_HASH}-${BUILD_TAG}"
          # All-platform roxctl set: identical content in every arch's
          # image (the CLI download tarballs), so one shared key.
          ROXCTL_KEY="ca-roxctl-all-v2-${GO_HASH}-${BUILD_TAG}"

          if "${GOCACHEPROG}" -fetch-any "$BIN_KEY" /tmp/go-binaries.tar 2>/dev/null && [ -s /tmp/go-binaries.tar ]; then
            tar -xf /tmp/go-binaries.tar
            echo "binaries: FETCHED from blob store"
          else
            echo "binaries: COMPILING (blob miss)"
            # Vendor restore
            VENDOR_KEY="vendor-cache-$(sha256sum go.sum | cut -c1-16)"
            if "${GOCACHEPROG}" -fetch-any "$VENDOR_KEY" /tmp/vendor.tar.gz 2>/dev/null && [ -s /tmp/vendor.tar.gz ]; then
              tar -xf /tmp/vendor.tar.gz
              echo "vendor: restored"
            else
              unset GOCACHEPROG; go mod vendor; export GOCACHEPROG="${{ github.workspace }}/tools/gocache-serve/bin/gocache-serve"
              tar -czf /tmp/vendor.tar.gz vendor/
              "${GOCACHEPROG}" -store-all "$VENDOR_KEY" /tmp/vendor.tar.gz || true
            fi
            export GOFLAGS="${GOFLAGS} -mod=vendor"

            # Compile via the CHECKOUT's own Makefile targets — the
            # binary set is the tree's source of truth (drift-proof:
            # a tree that adds/removes a binary, e.g. sensor-upgrader,
            # builds correctly without workflow changes). go-build.sh
            # (invoked by make) applies -s -w, x_def stamps, and — on
            # CA-branch trees — deterministic build IDs.
            CGO_ENABLED=0 make build-prep main-build-nodeps roxctl_linux-${{ matrix.arch }}

            # Store for other jobs/legs
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cvf /tmp/go-binaries.tar bin/linux_${{ matrix.arch }}
            "${GOCACHEPROG}" -store-all "$BIN_KEY" /tmp/go-binaries.tar || true
            echo "binaries: compiled and stored"
          fi

          # roxctl for every platform (served as CLI downloads from
          # /assets/downloads/cli/). Built by the checkout's `make cli`,
          # shared across arch legs. (Master stubs these on plain PR
          # builds; master-branch and release builds compile them.)
          if "${GOCACHEPROG}" -fetch-any "$ROXCTL_KEY" /tmp/roxctl-all.tar 2>/dev/null && [ -s /tmp/roxctl-all.tar ]; then
            tar -xf /tmp/roxctl-all.tar
            echo "roxctl (all platforms): FETCHED from blob store"
          else
            echo "roxctl (all platforms): COMPILING (blob miss)"
            make cli
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cvf /tmp/roxctl-all.tar \
              bin/darwin_amd64 bin/darwin_arm64 \
              bin/linux_amd64 bin/linux_arm64 bin/linux_ppc64le bin/linux_s390x \
              bin/windows_amd64
            "${GOCACHEPROG}" -store-all "$ROXCTL_KEY" /tmp/roxctl-all.tar || true
            echo "roxctl (all platforms): compiled and stored"
          fi

      - name: UI — fetch from blob or build
        if: steps.fastpath.outputs.skip != 'true'
        run: |
          set -euo pipefail
          UI_HASH=$(git ls-files ui | grep -Ev 'node_modules' | xargs sha256sum | sort -k2 | sha256sum | cut -c1-16)
          UI_KEY="ui-build-${{ matrix.branding }}-${UI_HASH}"

          if "${GOCACHEPROG}" -fetch-any "$UI_KEY" /tmp/ui-build.tar 2>/dev/null && [ -s /tmp/ui-build.tar ]; then
            tar -xf /tmp/ui-build.tar -C "$GITHUB_WORKSPACE"
            echo "UI: FETCHED from blob store"
          else
            echo "UI: BUILDING (blob miss)"
            # Node.js setup
            NODE_VER=$(jq -r '.engines.node // "22"' ui/package.json | grep -o '[0-9]*' | head -1 || echo "22")
            curl -fsSL "https://deb.nodesource.com/setup_${NODE_VER}.x" | sudo -E bash - >/dev/null 2>&1 || true
            sudo apt-get install -y nodejs >/dev/null 2>&1 || true

            # Deps (content-addressed)
            DEPS_KEY="ui-deps-${{ matrix.arch }}-$(sha256sum ui/apps/platform/package-lock.json | cut -c1-16)"
            if "${GOCACHEPROG}" -fetch-any "$DEPS_KEY" /tmp/ui-deps.tar 2>/dev/null && [ -s /tmp/ui-deps.tar ]; then
              TAR_ARGS=(-C "$GITHUB_WORKSPACE" ui/apps/platform/node_modules)
              [ -d "$HOME/.cache/Cypress" ] && TAR_ARGS=(-C "$HOME/.cache" ./Cypress "${TAR_ARGS[@]}")
              tar -xf /tmp/ui-deps.tar "${TAR_ARGS[@]}" 2>/dev/null || true
              touch ui/deps
              echo "UI deps: fetched"
            else
              ROX_PRODUCT_BRANDING=${{ matrix.branding }} make -C ui deps
              TAR_ARGS=(-C "$GITHUB_WORKSPACE" ui/apps/platform/node_modules)
              [ -d "$HOME/.cache/Cypress" ] && TAR_ARGS=(-C "$HOME/.cache" ./Cypress "${TAR_ARGS[@]}")
              tar -cf /tmp/ui-deps.tar "${TAR_ARGS[@]}"
              "${GOCACHEPROG}" -store-all "$DEPS_KEY" /tmp/ui-deps.tar || true
            fi

            # Build UI
            ROX_PRODUCT_BRANDING=${{ matrix.branding }} make -C ui build

            # Store output
            tar -cf /tmp/ui-build.tar -C "$GITHUB_WORKSPACE" ui/build
            "${GOCACHEPROG}" -store-all "$UI_KEY" /tmp/ui-build.tar || true
            echo "UI: built and stored"
          fi

      - name: OSS notices — fetch or generate
        if: steps.fastpath.outputs.skip != 'true'
        env:
          # Tool installs (go install) must not inherit -mod=vendor:
          # build tools aren't vendored, and vendor/'s mere presence
          # auto-enables vendor mode on go >= 1.14.
          GOFLAGS: -buildvcs=false -mod=mod
        run: |
          set -euo pipefail
          # THIRD_PARTY_NOTICES is generated from the dependency tree —
          # both Go deps (go.sum) and UI deps (package-lock.json).
          NOTICE_KEY="ca-notices-$(sha256sum go.sum ui/apps/platform/package-lock.json | sha256sum | cut -c1-16)"
          if "${GOCACHEPROG}" -fetch-any "$NOTICE_KEY" /tmp/notices.tar 2>/dev/null && [ -s /tmp/notices.tar ]; then
            tar -xf /tmp/notices.tar -C image/rhel/
            echo "notices: FETCHED from blob store"
          else
            echo "notices: GENERATING (blob miss)"
            # ossls audits the UI dependency tree too, so node_modules
            # must be present even when the UI build was blob-fetched.
            if [ ! -d ui/apps/platform/node_modules ]; then
              DEPS_KEY="ui-deps-${{ matrix.arch }}-$(sha256sum ui/apps/platform/package-lock.json | cut -c1-16)"
              if "${GOCACHEPROG}" -fetch-any "$DEPS_KEY" /tmp/ui-deps.tar 2>/dev/null && [ -s /tmp/ui-deps.tar ]; then
                tar -xf /tmp/ui-deps.tar -C "$GITHUB_WORKSPACE" 2>/dev/null || true
                touch ui/deps
              else
                make -C ui deps
              fi
            fi
            make ossls-notice
            tar -cf /tmp/notices.tar -C image/rhel THIRD_PARTY_NOTICES
            "${GOCACHEPROG}" -store-all "$NOTICE_KEY" /tmp/notices.tar || true
          fi

      - name: Static data — external networks + swagger
        if: steps.fastpath.outputs.skip != 'true'
        env:
          # See notices step: build tools need module mode.
          GOFLAGS: -buildvcs=false -mod=mod
        run: |
          set -euo pipefail
          # swagger.json is GENERATED from API protos (make swagger-docs);
          # the Makefile writes it to image/rhel/docs/ (GENERATED_DOC_PATH),
          # which is where the checkout's Dockerfile COPYs it from.
          # Keyed by the proto inputs + merge script.
          SWAGGER_KEY="ca-swagger-v2-$(git ls-files 'proto/' 'central/docs/' 'scripts/mergeswag.sh' 'make/protogen.mk' 2>/dev/null \
            | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)"
          if "${GOCACHEPROG}" -fetch-any "$SWAGGER_KEY" /tmp/swagger.tar 2>/dev/null && [ -s /tmp/swagger.tar ]; then
            tar -xf /tmp/swagger.tar
            echo "swagger: FETCHED from blob store"
          else
            echo "swagger: GENERATING (blob miss)"
            go mod download github.com/stackrox/scanner
            make swagger-docs
            tar -cf /tmp/swagger.tar image/rhel/docs
            "${GOCACHEPROG}" -store-all "$SWAGGER_KEY" /tmp/swagger.tar || true
          fi

          # external-networks.zip is fetched from definitions.stackrox.io
          # (drifts independently of the source tree, like master's build,
          # which also fetches it fresh every time).
          bash image/rhel/fetch-stackrox-data.sh image/rhel/static-data
          echo "static-data: ready"

      - name: Docker build + push
        if: steps.fastpath.outputs.skip != 'true'
        env:
          CI: "1"
        run: |
          set -euo pipefail
          # Stage the image context exactly the way the checkout's own
          # Makefile does (image/rhel/): binaries with the tree's renames
          # (worker→central-worker, kubernetes→kubernetes-sensor, ...),
          # UI build output. Drift-proof by construction.
          make copy-binaries-to-image-dir

          # roxctl tarballs (what /assets/downloads/cli/ serves), like
          # the checkout's cli-tarballs Docker stage.
          (cd image/rhel/bin && \
            for f in roxctl-*; do
              [[ -f "$f" && -x "$f" ]] || continue
              tar -czf "${f%.exe}.tar.gz" "$f"
            done)

          # Generate the Dockerfile from the checkout's own
          # image/rhel/Dockerfile (final stage verbatim, base swapped
          # for the pre-built content-addressed base).
          # Base image lives on stackrox-io (public pull, no auth needed
          # even on rhacs-eng-authenticated legs).
          tools/ca/gen-dockerfile image/rhel/Dockerfile \
            quay.io/stackrox-io/main /tmp/generated.Dockerfile

          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --cache-from "type=registry,ref=${{ matrix.registry }}/main:cache-${{ matrix.arch }}" \
            --cache-to type=inline \
            -t "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}" \
            --build-arg "TARGET_ARCH=${{ matrix.arch }}" \
            --build-arg "LABEL_VERSION=${{ env.IMAGE_TAG }}" \
            --build-arg "LABEL_RELEASE=ci" \
            --build-arg "ROX_IMAGE_FLAVOR=development" \
            --build-arg "ROX_PRODUCT_BRANDING=${{ matrix.branding }}" \
            --file /tmp/generated.Dockerfile \
            image/rhel 2>&1 | tail -5

          # Push
          docker push "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}"

          # Update layer cache tag
          docker buildx imagetools create \
            -t "${{ matrix.registry }}/main:cache-${{ matrix.arch }}" \
            "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}" 2>&1 | tail -1 || true

          # Get digest for receipt
          DIGEST=$(docker buildx imagetools inspect \
            "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}" 2>/dev/null | \
            grep "Digest:" | awk '{print $2}') || DIGEST=""

          # Store build receipt with component hashes (enables partial fast paths)
          if [ -n "$DIGEST" ]; then
            GO_HASH=$(git ls-files '*.go' 'go.mod' 'go.sum' 'Makefile' 'scripts/' 2>/dev/null \
              | grep -v '_test.go' | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)
            UI_HASH=$(git ls-files 'ui/' 2>/dev/null \
              | grep -Ev 'node_modules|test|spec' | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)
            DOCKER_HASH=$(git ls-files 'image/' 'Dockerfile*' 'docs/api/' 2>/dev/null \
              | xargs sha256sum 2>/dev/null | sort -k2 | sha256sum | cut -c1-16)
            BASE_DIGEST=$(docker buildx imagetools inspect \
              "quay.io/stackrox-io/main:base-${{ matrix.arch }}" 2>/dev/null \
              | grep Digest: | awk '{print $2}' | cut -c8-19)
            RECIPE_HASH=$((cat tools/ca/gen-dockerfile 2>/dev/null; \
              echo "${{ env.WORKFLOW_RECIPE }}${BASE_DIGEST}") | sha256sum | cut -c1-16)
            BUILD_HASH="${GO_HASH}-${UI_HASH}-${DOCKER_HASH}"
            cat > /tmp/build-receipt.json <<EOF
          {"go_hash":"${GO_HASH}","ui_hash":"${UI_HASH}","docker_hash":"${DOCKER_HASH}","branding":"${{ matrix.branding }}","arch":"${{ matrix.arch }}","registry":"${{ matrix.registry }}","tag":"${{ env.IMAGE_TAG }}","digest":"${DIGEST}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
            "${GOCACHEPROG}" -store-all "build-receipt-${{ matrix.branding }}-${{ matrix.arch }}-${RECIPE_HASH}-${BUILD_HASH}" /tmp/build-receipt.json
            echo "receipt stored: ${DIGEST:0:20}... (go=${GO_HASH:0:8} ui=${UI_HASH:0:8})"
          fi

      - name: Result
        run: |
          if [ "${{ steps.fastpath.outputs.skip }}" = "true" ]; then
            echo "╔══════════════════════════════════════╗"
            echo "║  FAST PATH: image re-tagged (~30s)   ║"
            echo "╚══════════════════════════════════════╝"
          else
            echo "╔══════════════════════════════════════╗"
            echo "║  BUILD PATH: image built and pushed   ║"
            echo "╚══════════════════════════════════════╝"
          fi

  # The only coordination point in the workflow: assembling the multi-arch
  # manifest requires both arch legs' outputs. This is output assembly,
  # not build coordination — each leg remains self-contained.
  assemble-manifest:
    needs: main-image
    if: always() && !cancelled() && needs.main-image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Assemble multi-arch tags
        env:
          GH_TOKEN: ${{ github.token }}
          QUAY_RHACS_ENG_RW_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RW_PASSWORD }}
          QUAY_RHACS_ENG_RW_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RW_USERNAME }}
          QUAY_STACKROX_IO_RW_PASSWORD: ${{ secrets.QUAY_STACKROX_IO_RW_PASSWORD }}
          QUAY_STACKROX_IO_RW_USERNAME: ${{ secrets.QUAY_STACKROX_IO_RW_USERNAME }}
        run: |
          set -euo pipefail
          TAG="${{ needs.main-image.outputs.image_tag }}"
          echo "assembling multi-arch manifests for tag: ${TAG}"
          # docker holds one quay.io credential at a time — re-login
          # between registries.
          echo "${QUAY_RHACS_ENG_RW_PASSWORD}" | docker login quay.io \
            -u "${QUAY_RHACS_ENG_RW_USERNAME}" --password-stdin
          docker buildx imagetools create \
            -t "quay.io/rhacs-eng/main:${TAG}" \
            "quay.io/rhacs-eng/main:${TAG}-amd64" \
            "quay.io/rhacs-eng/main:${TAG}-arm64"
          echo "created quay.io/rhacs-eng/main:${TAG} (amd64+arm64)"
          docker logout quay.io
          echo "${QUAY_STACKROX_IO_RW_PASSWORD}" | docker login quay.io \
            -u "${QUAY_STACKROX_IO_RW_USERNAME}" --password-stdin
          docker buildx imagetools create \
            -t "quay.io/stackrox-io/main:${TAG}" \
            "quay.io/stackrox-io/main:${TAG}-amd64" \
            "quay.io/stackrox-io/main:${TAG}-arm64"
          echo "created quay.io/stackrox-io/main:${TAG} (amd64+arm64)"

  # Validation aid: e2e-dispatch waits for the FULL image set at the PR
  # tag; the CA system builds only main. This job copies the sidecar
  # images (central-db, collector, fact, roxctl, scanner-v4,
  # scanner-v4-db, operator-bundle) from a known-good master build.
  retag-sidecars:
    if: inputs.retag_source != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full, for make tag)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - name: Retag sidecar images
        env:
          QUAY_RHACS_ENG_RW_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RW_PASSWORD }}
          QUAY_RHACS_ENG_RW_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RW_USERNAME }}
        run: |
          set -euo pipefail
          TARGET_TAG="$(make --quiet --no-print-directory tag)"
          OPERATOR_TARGET="$(BUILD_TAG="${TARGET_TAG}" make -C operator --quiet --no-print-directory tag)"
          SOURCE="${{ inputs.retag_source }}"
          echo "retagging ${SOURCE} -> ${TARGET_TAG}"
          echo "${QUAY_RHACS_ENG_RW_PASSWORD}" | docker login quay.io \
            -u "${QUAY_RHACS_ENG_RW_USERNAME}" --password-stdin
          for repo in central-db collector fact roxctl scanner-v4 scanner-v4-db; do
            docker buildx imagetools create \
              -t "quay.io/rhacs-eng/${repo}:${TARGET_TAG}" \
              "quay.io/rhacs-eng/${repo}:${SOURCE}"
            echo "retagged ${repo}"
          done
          # CI tags expire on quay; discover a live operator-bundle tag
          # via the read bearer token rather than assuming one exists.
          OPERATOR_SOURCE="$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}" \
            "https://quay.io/v2/rhacs-eng/operator-bundle/tags/list" \
            | jq -r '[.tags[] | select(startswith("v"))] | sort | .[-1]')"
          if [ -n "$OPERATOR_SOURCE" ] && [ "$OPERATOR_SOURCE" != "null" ]; then
            echo "operator-bundle source: ${OPERATOR_SOURCE}"
            docker buildx imagetools create \
              -t "quay.io/rhacs-eng/operator-bundle:v${OPERATOR_TARGET}" \
              "quay.io/rhacs-eng/operator-bundle:${OPERATOR_SOURCE}"
            echo "retagged operator-bundle"
          else
            echo "WARNING: no live operator-bundle tag found" >&2
          fi
