name: Build (Content-Addressed)
# PROTOTYPE: content-addressed build system.
#
# Architecture: each matrix leg is a SELF-CONTAINED pipeline that traces
# backward from its output ("the image I need"). No `needs` chains, no
# inter-job coordination. The blob store IS the synchronization mechanism:
# whichever job reaches a shared node first (binaries, UI) stores it;
# the others find it there. Near-duplicate parallel work is accepted —
# wall-clock time is the only metric that matters.
#
# Fast path (warm run, no source change): ~30s
#   checkout → hash → receipt found → re-tag → done
#
# Build path (source changed): ~2-5m
#   checkout → hash → no receipt → fetch-or-build inputs → docker → push → receipt
#
# Jobs disabled during prototyping: unit-tests, style (noise).

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  # Azure blob-store credentials — set once, read by gocache-serve
  # and the shared cache actions from the environment.
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  # Stable version stamping for deterministic binaries.
  BUILD_TAG: 0.0.0
  SHORTCOMMIT: "0000000"
  GOFLAGS: -buildvcs=false

jobs:
  # ===================================================================
  # MAIN IMAGES — the critical path for e2e tests.
  # Each leg: check receipt → (skip | fetch-or-build → docker → push → receipt)
  # ===================================================================
  main-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, branding: STACKROX_BRANDING, registry: quay.io/stackrox-io, runs-on: ubuntu-24.04 }
          - { arch: amd64, branding: RHACS_BRANDING, registry: quay.io/rhacs-eng, runs-on: ubuntu-24.04 }
          - { arch: arm64, branding: STACKROX_BRANDING, registry: quay.io/stackrox-io, runs-on: ubuntu-24.04-arm }
          - { arch: arm64, branding: RHACS_BRANDING, registry: quay.io/rhacs-eng, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - name: Checkout (shallow — no git history needed for content addressing)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.commit || github.event.pull_request.head.sha }}

      - name: Setup (buildx + registry auth + blob store)
        run: |
          set -euo pipefail
          # Buildx with docker-container driver (full --cache-from/to support)
          docker buildx create --name builder --driver docker-container --use 2>/dev/null || true
          # Registry authentication (before build, so layer cache can pull)
          if [ "${{ matrix.branding }}" = "RHACS_BRANDING" ]; then
            echo "${{ secrets.QUAY_RHACS_ENG_RW_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_RHACS_ENG_RW_USERNAME }}" --password-stdin
          else
            echo "${{ secrets.QUAY_STACKROX_IO_RW_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_STACKROX_IO_RW_USERNAME }}" --password-stdin
          fi
          # gocache-serve: the blob store client (self-contained bootstrap)
          echo "GOCACHEPROG=${{ github.workspace }}/tools/gocache-serve/bin/gocache-serve" >> "$GITHUB_ENV"
          echo "GOCACHE_SERVE_BACKEND=azure" >> "$GITHUB_ENV"
          echo "GOCACHE_SERVE_CONTAINER=ci-gocache" >> "$GITHUB_ENV"
          # Build tag (for the image tag, not the ldflags)
          TAG=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Fast path — does the output already exist?
        id: fastpath
        run: |
          chmod +x scripts/ci/fast-path.sh
          scripts/ci/fast-path.sh "${{ matrix.branding }}" "${{ matrix.arch }}" "${{ env.IMAGE_TAG }}"

      # ==================== BUILD PATH (only if fast path missed) ====================

      - name: Fetch or compile binaries
        if: steps.fastpath.outputs.skip != 'true'
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
        run: |
          set -euo pipefail
          BIN_KEY="go-binaries-${{ matrix.arch }}-default"
          if "${GOCACHEPROG}" -fetch-any "$BIN_KEY" /tmp/go-binaries.tar 2>/dev/null && [ -s /tmp/go-binaries.tar ]; then
            tar -xf /tmp/go-binaries.tar
            echo "binaries: fetched from blob store (~2s)"
          else
            echo "binaries: compiling (blob miss)"
            # Setup Go
            GOMODCACHE="/tmp/go-mod-cache"
            mkdir -p "$GOMODCACHE"
            export GOMODCACHE
            # Vendor restore (content-addressed by go.sum)
            VENDOR_KEY="vendor-cache-$(sha256sum go.sum | cut -c1-16)"
            if "${GOCACHEPROG}" -fetch-any "$VENDOR_KEY" /tmp/vendor.tar.gz 2>/dev/null && [ -s /tmp/vendor.tar.gz ]; then
              tar -xf /tmp/vendor.tar.gz
              echo "vendor: restored (~5s)"
            else
              echo "vendor: generating"
              unset GOCACHEPROG; go mod vendor; export GOCACHEPROG="${{ github.workspace }}/tools/gocache-serve/bin/gocache-serve"
              tar -czf /tmp/vendor.tar.gz vendor/
              "${GOCACHEPROG}" -store-all "$VENDOR_KEY" /tmp/vendor.tar.gz || true
            fi
            export GOFLAGS="${GOFLAGS} -mod=vendor"
            # Compile (gocache-serve handles the compile cache).
            # NOTE: CI= is unset to skip the Makefile's multi-arch roxctl
            # copy (copy-go-binaries-to-image-dir copies roxctl for ALL
            # platforms under ifdef CI — we only have the current arch).
            # The docker build step handles the image directory setup.
            unset CI
            GOCACHEPROG="${GOCACHEPROG}" GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
              go build -o bin/linux_${{ matrix.arch }}/central ./central
            GOCACHEPROG="${GOCACHEPROG}" GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
              go build -o bin/linux_${{ matrix.arch }}/roxctl ./roxctl
            GOCACHEPROG="${GOCACHEPROG}" GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
              go build -o bin/linux_${{ matrix.arch }}/config-controller ./central/config-controller
            GOCACHEPROG="${GOCACHEPROG}" GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
              go build -o bin/linux_${{ matrix.arch }}/worker ./central/workerp
            # Store for other jobs
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cvf /tmp/go-binaries.tar bin/linux_${{ matrix.arch }}
            "${GOCACHEPROG}" -store-all "$BIN_KEY" /tmp/go-binaries.tar || true
            echo "binaries: compiled and stored"
          fi

      - name: Fetch or build UI
        if: steps.fastpath.outputs.skip != 'true'
        run: |
          set -euo pipefail
          UI_HASH=$(git ls-files ui | grep -Ev 'node_modules' | xargs sha256sum | sort -k2 | sha256sum | cut -c1-16)
          UI_KEY="ui-build-${{ matrix.branding }}-${UI_HASH}"
          if "${GOCACHEPROG}" -fetch-any "$UI_KEY" /tmp/ui-build.tar 2>/dev/null && [ -s /tmp/ui-build.tar ]; then
            tar -xf /tmp/ui-build.tar -C "$GITHUB_WORKSPACE"
            echo "UI: fetched from blob store (~2s)"
          else
            echo "UI: building (blob miss)"
            # Node setup
            NODE_VER=$(jq -r '.engines.node' ui/package.json 2>/dev/null | grep -o '[0-9]*' | head -1 || echo "22")
            setup-node() {
              curl -fsSL "https://deb.nodesource.com/setup_${NODE_VER}.x" | sudo -E bash - >/dev/null 2>&1
              sudo apt-get install -y nodejs >/dev/null 2>&1
            }
            setup-node || echo "node setup: using system node"
            # Deps (content-addressed by package-lock)
            DEPS_KEY="ui-deps-$(sha256sum ui/apps/platform/package-lock.json | cut -c1-16)"
            if "${GOCACHEPROG}" -fetch-any "$DEPS_KEY" /tmp/ui-deps.tar 2>/dev/null && [ -s /tmp/ui-deps.tar ]; then
              tar -xf /tmp/ui-deps.tar -C "$HOME/.cache" ./Cypress 2>/dev/null || true
              tar -xf /tmp/ui-deps.tar -C "$GITHUB_WORKSPACE" ui/apps/platform/node_modules 2>/dev/null || true
              touch ui/deps
              echo "UI deps: fetched from blob store"
            else
              ROX_PRODUCT_BRANDING=${{ matrix.branding }} make -C ui deps
              # Store deps for other jobs
              TAR_ARGS=(-C "$GITHUB_WORKSPACE" ui/apps/platform/node_modules)
              [ -d "$HOME/.cache/Cypress" ] && TAR_ARGS=(-C "$HOME/.cache" ./Cypress "${TAR_ARGS[@]}")
              tar -cf /tmp/ui-deps.tar "${TAR_ARGS[@]}"
              "${GOCACHEPROG}" -store-all "$DEPS_KEY" /tmp/ui-deps.tar || true
            fi
            # Build UI
            ROX_PRODUCT_BRANDING=${{ matrix.branding }} make -C ui build
            # Store UI output
            tar -cf /tmp/ui-build.tar -C "$GITHUB_WORKSPACE" ui/build
            "${GOCACHEPROG}" -store-all "$UI_KEY" /tmp/ui-build.tar || true
            echo "UI: built and stored"
          fi

      - name: Fetch misc (oss-notice, docs)
        if: steps.fastpath.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if "${GOCACHEPROG}" -fetch-any "oss-notice-LATEST" /tmp/oss-notice.tar 2>/dev/null && [ -s /tmp/oss-notice.tar ]; then
            tar -xf /tmp/oss-notice.tar -C image/rhel
            echo "oss-notice: fetched from blob store"
          else
            echo "oss-notice: not found (non-fatal, placeholder)"
            mkdir -p image/rhel/THIRD_PARTY_NOTICES
            echo "placeholder" > image/rhel/THIRD_PARTY_NOTICES/NOTICE
          fi

      - name: Pre-populate multi-arch roxctl paths
        # The Makefile's copy-go-binaries-to-image-dir (ifdef CI) copies
        # roxctl for ALL platforms into the image. We only have the
        # current arch — create placeholders for the others (the image
        # includes roxctl binaries for download; only the current arch
        # is functional in this prototype).
        if: steps.fastpath.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for a in amd64 arm64 ppc64le s390x darwin_amd64 darwin_arm64; do
            if [ ! -f "bin/linux_\${a}/roxctl" ] && [ ! -f "bin/\${a}/roxctl" ]; then
              mkdir -p "bin/linux_\${a}" 2>/dev/null || mkdir -p "bin/\${a}" 2>/dev/null || true
              # Use the current arch's roxctl as placeholder
              if [ -f "bin/linux_\${GOARCH:-amd64}/roxctl" ]; then
                cp "bin/linux_\${GOARCH:-amd64}/roxctl" "bin/linux_\${a}/roxctl" 2>/dev/null ||                   cp "bin/linux_\${GOARCH:-amd64}/roxctl" "bin/\${a}/roxctl" 2>/dev/null || true
              fi
            fi
          done
          echo "multi-arch roxctl paths populated"

      - name: Docker build + push
        if: steps.fastpath.outputs.skip != 'true'
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          DOCKER_CACHE_FROM: ${{ matrix.registry }}/main:cache-${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Build with layer cache (COPY --link + inline cache)
          ROX_PRODUCT_BRANDING=${{ matrix.branding }} \
          GOARCH=${{ matrix.arch }} \
          TAG="${{ env.IMAGE_TAG }}" \
            make docker-build-main-image

          # Push
          docker push "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}"

          # Update layer cache tag
          docker buildx imagetools create \
            -t "${{ matrix.registry }}/main:cache-${{ matrix.arch }}" \
            "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}" 2>&1 | tail -1

          # Get the digest for the receipt
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}" 2>/dev/null | \
            sed 's/.*@//') || DIGEST=""
          if [ -z "$DIGEST" ]; then
            # Fallback: get from registry
            DIGEST=$(docker buildx imagetools inspect \
              "${{ matrix.registry }}/main:${{ env.IMAGE_TAG }}-${{ matrix.arch }}" 2>/dev/null | \
              grep "Digest:" | awk '{print $2}') || DIGEST=""
          fi

          # Store the build receipt for the fast path
          if [ -n "$DIGEST" ]; then
            chmod +x scripts/ci/store-receipt.sh
            scripts/ci/store-receipt.sh \
              "${{ matrix.branding }}" "${{ matrix.arch }}" \
              "${{ matrix.registry }}" "${{ env.IMAGE_TAG }}" "$DIGEST"
          else
            echo "WARNING: could not determine digest — receipt not stored"
          fi

      - name: Result
        run: |
          if [ "${{ steps.fastpath.outputs.skip }}" = "true" ]; then
            echo "=== FAST PATH: image re-tagged (no build) ==="
          else
            echo "=== BUILD PATH: image built and pushed ==="
          fi
