# cimemo experiment — branch-local replacement of build.yaml.
# Dispatching the REGISTERED build.yaml path with --ref this-branch runs
# THIS content (the mechanism the CA work used for its dispatches).
# Master's real build.yaml is untouched; no PR is opened, no other
# workflows trigger.
name: cimemo experiment

on:
  workflow_dispatch:
    inputs:
      target:
        description: "go build target (package path)"
        default: "./central"
      commit:
        description: "unused (input-name compat with master's build.yaml)"
        required: false
        default: ""
        type: string

permissions: {}

env:
  GOFLAGS: -buildvcs=false
  CIMEMO_ACCOUNT: cigocache
  CIMEMO_CONTAINER: cimemo-ci

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10' # exact pin: patch drift changes every ActionID

      - name: plain cold build (baseline)
        run: |
          rm -rf /tmp/gc && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc go build -o /tmp/central-control "${{ inputs.target }}"
          END=$(date +%s%3N)
          echo "CONTROL: $((END-START))ms"
          sha256sum /tmp/central-control

  populate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      wall_ms: ${{ steps.time.outputs.wall_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10' # exact pin: patch drift changes every ActionID

      - name: build cimemo
        run: cd tools/cimemo && go build -o /tmp/cimemo ./cmd/cimemo
      - name: cold build + upload via proxy
        id: time
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_GOCACHE_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
          CIMEMO_GOCACHE_STATS: /tmp/gc-stats.json
          CIMEMO_GOCACHE_RECORD_GETS: "1"
        run: |
          rm -rf /tmp/gc && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc GOCACHEPROG="/tmp/cimemo gocache" \
            go build -o /tmp/central-populate "${{ inputs.target }}"
          END=$(date +%s%3N)
          echo "wall_ms=$((END-START))" >> "$GITHUB_OUTPUT"
          echo "POPULATE: $((END-START))ms (cold compile + cloud upload)"
          echo "--- stats summary:"
          python3 -c "import json; s=json.load(open('/tmp/gc-stats.json')); s['missed_count']=len(s.get('missed_actions') or []); [s.pop(k,None) for k in ('missed_actions','requested_all')]; print(json.dumps(s))"
          gzip -c /tmp/gc-stats.json > /tmp/gc-stats.json.gz
          echo "--- missed (first 5):"
          python3 -c "import json; s=json.load(open('/tmp/gc-stats.json')); print(s.get('missed_actions') or [])[:5]" 2>/dev/null || true
      - id: sha
        run: echo "sha=$(sha256sum /tmp/central-populate | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: populate-stats
          path: /tmp/gc-stats.json.gz

  serve:
    runs-on: ubuntu-latest
    needs: populate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10' # exact pin: patch drift changes every ActionID

      - name: build cimemo
        run: cd tools/cimemo && go build -o /tmp/cimemo ./cmd/cimemo
      - name: fresh-cache build served from cloud
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_GOCACHE_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
          CIMEMO_GOCACHE_STATS: /tmp/gc-stats.json
          CIMEMO_GOCACHE_RECORD_GETS: "1"
        run: |
          rm -rf /tmp/gc && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc GOCACHEPROG="/tmp/cimemo gocache" \
            go build -o /tmp/central-serve "${{ inputs.target }}"
          END=$(date +%s%3N)
          echo "SERVE: $((END-START))ms (fresh cache, served from cloud)"
          echo "POPULATE was: ${{ needs.populate.outputs.wall_ms }}ms"
          echo "--- stats summary:"
          python3 -c "import json; s=json.load(open('/tmp/gc-stats.json')); s['missed_count']=len(s.get('missed_actions') or []); [s.pop(k,None) for k in ('missed_actions','requested_all')]; print(json.dumps(s))"
          gzip -c /tmp/gc-stats.json > /tmp/gc-stats.json.gz
          echo "--- missed (first 5):"
          python3 -c "import json; s=json.load(open('/tmp/gc-stats.json')); print(s.get('missed_actions') or [])[:5]" 2>/dev/null || true
          SERVE_SHA=$(sha256sum /tmp/central-serve | cut -d' ' -f1)
          echo "serve sha:    $SERVE_SHA"
          echo "populate sha: ${{ needs.populate.outputs.sha }}"
          if [ "$SERVE_SHA" = "${{ needs.populate.outputs.sha }}" ]; then
            echo "BYTE-IDENTICAL: yes"
          else
            echo "BINARY MISMATCH"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: serve-stats
          path: /tmp/gc-stats.json.gz
      - name: bisect — same runner, second fresh cache
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CIMEMO_GOCACHE_REMOTE: "1"
          CIMEMO_AZURE_ACCOUNT: ${{ env.CIMEMO_ACCOUNT }}
          CIMEMO_GOCACHE_CONTAINER: ${{ env.CIMEMO_CONTAINER }}
          CIMEMO_GOCACHE_STATS: /tmp/gc-stats2.json
          CIMEMO_GOCACHE_RECORD_GETS: "1"
        run: |
          rm -rf /tmp/gc && mkdir -p /tmp/gc
          START=$(date +%s%3N)
          GOCACHE=/tmp/gc GOCACHEPROG="/tmp/cimemo gocache"             go build -o /tmp/central-bisect "${{ inputs.target }}"
          END=$(date +%s%3N)
          echo "BISECT (same runner, 2nd fresh cache): $((END-START))ms"
          python3 -c "import json; s=json.load(open('/tmp/gc-stats2.json')); s['missed_count']=len(s.get('missed_actions') or []); [s.pop(k,None) for k in ('missed_actions','requested_all','put_actions')]; print(json.dumps(s))"
          # Cross-build drift on ONE runner: do this build's put IDs match the first build's?
          python3 -c "
import json
a = json.load(open('/tmp/gc-stats.json')).get('put_actions') or []
b = json.load(open('/tmp/gc-stats2.json')).get('put_actions') or []
sa, sb = set(a), set(b)
print(f'build1 puts: {len(a)}, build2 puts: {len(b)}')
print(f'same-runner put ID overlap: {len(sa & sb)} of union {len(sa | sb)}')
"
          gzip -c /tmp/gc-stats2.json > /tmp/gc-stats2.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bisect-stats
          path: /tmp/gc-stats2.json.gz
