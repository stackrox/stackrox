name: Scanner versioned vulnerabilities update

on:
  schedule:
  - cron: "30 */4 * * *"
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  workflow_dispatch:
    inputs:
      stream:
        description: "Vulnerability bundle version stream to build (typically vN, eg. v2)."
        required: false
      ga_ref:
        description: >
          WARNING - THIS WLL UPDATE A GA BUNDLE STREAM if not a dry-run: Sets the git reference
          to build a bundle that will be uploaded to the GA version stream.
        required: false
      rc_ref:
        description: >
          Sets the git reference to build a bundle that will be uploaded to the
          release candidate version stream, appending `-rc` to the version
          stream vN (eg. v2-rc).
        required: false
      vuln_bundles:
        description: >
          Sets a specific updater to run. If unset, all updaters are built.
          Not supported by older git references, please double-check
        required: false
      job:
        type: choice
        description: "Choose the NVD source"
        options:
        - nvd-api
        - nvd-feeds
        required: true
        default: nvd-feeds
      dry_run:
        description: "Dry-run"
        default: false
        type: boolean

jobs:
  parse-versions:
    if: github.repository_owner == 'stackrox' && github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'pr-update-scanner-vulns')
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-versions.outputs.versions }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
    - name: Parse VULNERABILITY_BUNDLE_VERSION
      id: set-versions
      env:
        INPUT_GA_REF: ${{ github.event.inputs.ga_ref || '' }}
        INPUT_RC_REF: ${{ github.event.inputs.rc_ref || '' }}
        INPUT_STREAM: ${{ github.event.inputs.stream || '' }}
        INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      run: |
        set -o pipefail

        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Validate input.
            if [ -n "$INPUT_GA_REF" ] && [ -n "$INPUT_RC_REF" ]; then
                echo >&2 "abort: invalid input: you cannot provide both 'ga_ref' and 'rc_ref'"
                exit 1
            fi
            if [ -z "$INPUT_GA_REF" ] && [ -z "$INPUT_RC_REF" ] && [ -n "$INPUT_STREAM" ]; then
                echo >&2 "abort: invalid input: when specifying 'stream', you must set 'ga_ref' or 'rc_ref'"
                exit 1
            fi

            # Determine the reference.
            if [ -n "$INPUT_GA_REF" ]; then
                ref="$INPUT_GA_REF"
            fi
            if [ -n "$INPUT_RC_REF" ]; then
                ref="$INPUT_RC_REF"
                allow_rc=true
            fi
            if [ -z "$ref" ]; then
                # Allow empty ref when dry_run is true (follow normal flow)
                if [ "$INPUT_DRY_RUN" == "false" ]; then
                    echo >&2 "abort: invalid input: could not determine the reference"
                    exit 1
                fi
            fi

            # Configure environment to generate the matrix with versions and
            # references.
            export SCANNER_BUNDLE_STREAM="$INPUT_STREAM"
            export SCANNER_BUNDLE_REFERENCE="$ref"
            export SCANNER_RELEASE_ALLOW_RC="$allow_rc"
        fi

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "versions<<$EOF" >> "$GITHUB_OUTPUT"
        ./.github/workflows/scripts/scanner-get-released-tags.sh | tee -a "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

  prepare-environment:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'pr-update-scanner-vulns')
    runs-on: ubuntu-latest
    outputs:
      manual_url: ${{ steps.set-manual-url.outputs.manual_url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - name: Download NVD PR
      if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr-update-scanner-nvd')
      run: |
        set -eu
        NVD_BUNDLE_TYPE=${{ github.event.inputs.job || 'nvd-feeds' }}
        case "$NVD_BUNDLE_TYPE" in
            nvd-api)
                nvd_file=nvd-api.zip
                ;;
            nvd-feeds)
                nvd_file=nvd-feeds.zip
                ;;
            *)
                echo >&2 "Warning: invalid NVD bundle type '$NVD_BUNDLE_TYPE'"
                exit 1
        esac
        branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        # Replace / with -, so the branch name isn't truncated when pushed to GCS.
        dir=${branch////-}
        url="https://storage.googleapis.com/scanner-v4-test/nvd/$dir/$nvd_file"
        curl --fail --silent --show-error \
          --retry 3 --retry-all-errors --retry-delay 5 \
          --connect-timeout 10 --max-time 300 \
          -o nvd.zip "$url"

    - name: Download NVD
      if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'pr-update-scanner-nvd')
      run: |
        set -eu
        NVD_BUNDLE_TYPE=${{ github.event.inputs.job || 'nvd-feeds' }}
        case "$NVD_BUNDLE_TYPE" in
            nvd-api)
                nvd_file=nvd-api.zip
                ;;
            nvd-feeds)
                nvd_file=nvd-feeds.zip
                ;;
            *)
                echo >&2 "Warning: invalid NVD bundle type '$NVD_BUNDLE_TYPE'"
                exit 1
        esac
        url="https://definitions.stackrox.io/v4/nvd/$nvd_file"
        curl --fail --silent --show-error \
          --retry 3 --retry-all-errors --retry-delay 5 \
          --connect-timeout 10 --max-time 300 \
          -o nvd.zip "$url"

    - name: Set MANUAL_URL
      id: set-manual-url
      run: |
        if [ "${{ github.event_name }}" == "schedule" ]; then
          # Scheduled workflows should use the master branch
          echo "manual_url=https://raw.githubusercontent.com/stackrox/stackrox/master/scanner/updater/manual/vulns.yaml" >> "$GITHUB_ENV"
        else
          # Determine the SHA to use
          if [ -z "${{ github.event.pull_request.head.sha }}" ]; then
            # Fallback to the current ref or SHA if it's not a pull request event
            sha=${{ github.sha }}
          else
            sha=${{ github.event.pull_request.head.sha }}
          fi

          echo "manual_url=https://raw.githubusercontent.com/stackrox/stackrox/$sha/scanner/updater/manual/vulns.yaml" >> "$GITHUB_ENV"
        fi

    - uses: ./.github/actions/upload-artifact-with-retry
      with:
        name: nvd
        path: nvd.zip
        if-no-files-found: error

  build-and-run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs:
    - parse-versions
    - prepare-environment
    runs-on: ubuntu-latest
    container:
      image: quay.io/stackrox-io/apollo-ci:scanner-test-0.5.11@sha256:cea78f2b3a5a38c9ccda678712daaed90b7c372d6b5df963feb758b32dccebe1 # ratchet:quay.io/stackrox-io/apollo-ci:scanner-test-0.5.11
      volumes:
      # The updater makes heavy use of /tmp files.
      - /tmp:/tmp
      - /usr:/mnt/usr
      - /opt:/mnt/opt
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.parse-versions.outputs.versions) }}
    env:
      SCANNER_BUNDLE_VERSION: ${{ matrix.version }}
      ROX_GIT_REF: ${{ matrix.ref }}
      STACKROX_RHEL_VEX_COMPRESSED_FILE_TIMEOUT: "10m"
    steps:
    # Checkout master to get the latest local actions
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - uses: ./.github/actions/job-preamble
      with:
        free-disk-space: 50
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Checkout specific reference
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ env.ROX_GIT_REF }}

    - name: Download NVD
      uses: ./.github/actions/download-artifact-with-retry
      with:
        name: nvd
        path: .

    - name: Build updater
      run: |
        echo "Building updater for version ${{ env.SCANNER_BUNDLE_VERSION }} based on git ref ${{ env.ROX_GIT_REF }}..."
        make tag
        make -C scanner bin/updater

    - name: Create bundle output directory
      run: mkdir -p definitions/${{ env.SCANNER_BUNDLE_VERSION }}

    - name: Sanity check NVD zip
      run: |
        path="$PWD/nvd.zip"
        echo "checking contents of $path"
        unzip -l "$path"
        echo "STACKROX_NVD_ZIP_PATH=$path" >> "$GITHUB_ENV"

    - name: Run updater (multi bundle)
      env:
        VULN_BUNDLES: ${{ github.event.inputs.vuln_bundles }}
      run: |
        if [ -n "$VULN_BUNDLES" ]; then
            export STACKROX_SCANNER_V4_UPDATER_SOURCES="$VULN_BUNDLES"
        fi
        tag=$(make -s --no-print-directory tag)
        # In pre-4.9, the exporter requires --split to generate multi-bundles.
        case "$tag" in
            4.[0-8].*)
                scanner/bin/updater export --manual-url "${{ needs.prepare-environment.outputs.manual_url }}" --split bundles
                ;;
            *)
                scanner/bin/updater export --manual-url "${{ needs.prepare-environment.outputs.manual_url }}" bundles
                ;;
        esac
        zip definitions/"$SCANNER_BUNDLE_VERSION"/vulnerabilities.zip bundles/*.json.zst

    - name: Validate bundle
      # ROX-33993: fails on any per-source issue; "Upload definitions artifacts"
      # still runs via if: always() so healthy sources still reach users.
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob

        files=(bundles/*.json.zst)
        if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no vulnerability bundle files found in bundles/ directory"
            exit 1
        fi

        # Accumulate failures so all sources are checked before exiting.
        failures=()
        fail() {
            echo "::error::$*"
            failures+=("$*")
        }

        # Counts JSON objects in an NDJSON stream, failing on any non-object value.
        # shellcheck disable=SC2016 # $i is jq syntax, not a shell variable.
        jq_filter='reduce inputs as $i (0; if ($i | type) == "object" then . + 1 else error("malformed JSON value: \($i | type)") end)'
        for f in "${files[@]}"; do
            name=$(basename "$f" .json.zst)

            if [ ! -s "$f" ]; then
                fail "source '$name': file $f is empty (0 bytes)"
                continue
            fi

            if ! zstd -t "$f" >/dev/null 2>&1; then
                fail "source '$name': file $f is not a valid zstd archive (corrupted/truncated?)"
                continue
            fi

            if ! record_count=$(zstd -dc "$f" | jq -n "$jq_filter" 2>/dev/null); then
                fail "source '$name': file $f decompressed successfully, but a malformed JSON value was found"
                continue
            fi

            if [ "$record_count" -eq 0 ]; then
                fail "source '$name': file $f decompresses fine but contains 0 JSON objects (expected >0)"
                continue
            fi

            echo "source '$name': OK ($record_count records)"
        done

        if [ "${#failures[@]}" -gt 0 ]; then
            echo "::error::vulnerability bundle validation failed: ${#failures[@]} of ${#files[@]} source(s) broken (affected source(s) will be missing from the published bundle; this does not block publishing)"
            printf '  - %s\n' "${failures[@]}"
            exit 1
        fi

        echo "vulnerability bundle validation passed: all ${#files[@]} sources OK"

    # Uploads the definitions as a temporary GitHub Actions artifact. The actual publishing to GCS happens on: upload-definitions
    - name: Upload definitions artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
      with:
        name: artifact_${{ env.SCANNER_BUNDLE_VERSION }}
        path: definitions

    # Checkout again to get the latest local actions for cleanup phase
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      if: always()
      with:
        fetch-depth: 0

  build-upload-pr-vulnerabilities:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr-update-scanner-vulns')
    needs:
    - prepare-environment
    runs-on: ubuntu-latest
    container:
      image: quay.io/stackrox-io/apollo-ci:scanner-test-0.5.11@sha256:cea78f2b3a5a38c9ccda678712daaed90b7c372d6b5df963feb758b32dccebe1 # ratchet:quay.io/stackrox-io/apollo-ci:scanner-test-0.5.11
      volumes:
      # The updater makes heavy use of /tmp files.
      - /tmp:/tmp
      - /usr:/mnt/usr
      - /opt:/mnt/opt
    env:
      STACKROX_RHEL_VEX_COMPRESSED_FILE_TIMEOUT: "10m"
    steps:
    # Checkout master to get the latest local actions
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - uses: ./.github/actions/job-preamble
      with:
        free-disk-space: 50
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Checkout specific reference
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Authenticate with test GCS bucket
      if: github.event_name == 'pull_request'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GOOGLE_SA_CIRCLECI_SCANNER }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3

    - name: Download NVD
      uses: ./.github/actions/download-artifact-with-retry
      with:
        name: nvd
        path: .

    - name: Build updater
      run: |
        echo "Building updater for pull request ${{ env.PR_NAME }}..."
        make tag
        make -C scanner bin/updater

    - name: Sanity check NVD zip
      run: |
        path="$PWD/nvd.zip"
        echo "checking contents of $path"
        unzip -l "$path"
        echo "STACKROX_NVD_ZIP_PATH=$path" >> "$GITHUB_ENV"

    - name: Create bundle output directory
      run: mkdir -p definitions/${{ github.event.pull_request.number }}

    - name: Run updater (multi bundle)
      run: |
        scanner/bin/updater export --manual-url "${{ needs.prepare-environment.outputs.manual_url }}" bundles
        zip definitions/${{ github.event.pull_request.number }}/vulnerabilities.zip bundles/*.json.zst

    # PR owner is responsible for verifying vulnerability bundles are generated
    - name: Upload PR vulnerabilities
      run: |
        branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        # Replace / with -, so the branch name isn't truncated when pushed to GCS.
        dir=${branch////-}
        case "$dir" in
        dev|1.0.0)
          echo "Error: branch $dir is protected. Choose a different branch name."
          exit 1
        esac
        mkdir -p "$dir"
        cp -r "definitions/${{ github.event.pull_request.number }}/." "$dir/"
        gsutil -m cp -r "$dir" "gs://scanner-v4-test/vulnerability-bundles/"

    # Checkout again to get the latest local actions for cleanup phase
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      if: always()
      with:
        fetch-depth: 0

  upload-definitions:
    needs:
    - build-and-run
    if: ${{ (failure() || success()) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')) }}
    runs-on: ubuntu-latest
    steps:
    # Checkout to run ./.github/actions/download-artifact-with-retry
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8
      with:
        # Vulnerability bundles are named `artifact_${{ env.SCANNER_BUNDLE_VERSION }}`.
        pattern: "artifact_*"
        path: definitions_files
        # Merge all artifacts (`<version>/<files>`) into the directory.
        merge-multiple: true

    - name: Check vulnerability bundles
      working-directory: ./definitions_files
      run: |
        set -eu

        empty() {
            find "${1:-.}" -maxdepth 0 -type d -empty | grep -q .
        }

        error() {
            echo >&2 "error: $*"
            exit 1
        }

        echo "Listing definitions files:"
        pwd
        ls -l
        empty && error "definitions directory (current directory) is empty"

        # Look for version dirs (use globbing, dot files included).
        shopt -s dotglob
        for d in *; do
            echo "Listing bundle version directory '$d':"
            ls -l "$d"
            [ -d "$d" ] || error "found a non-directory in definitions_files/: $d"
            [[ "$d" = .* ]] && error "version directory name not allowed (starts with dot): $d"
            empty "$d" && error "bundle version directory is empty"
            for f in "$d"/*; do
                case "$f" in
                    */vulnerabilities.zip) ;;
                    */vulns.json.zst) ;;
                    *) error "found unexpected file name in bundle version '$d/': $f" ;;
                esac
                [ -f "$f" ] || error "non-regular file in bundle version '$d/': $f"
                [ -s "$f" ] || error "empty file in bundle version '$d/': $f"
            done
        done

    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GOOGLE_SA_STACKROX_HUB_VULN_DUMP_UPLOADER }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3

    - name: Upload vulnerability bundles to GCS
      working-directory: ./definitions_files
      run: |
        # Upload all bundle directories (preserving the `<verions>/<file>` structure).
        bucket="gs://definitions.stackrox.io/v4/vulnerability-bundles"
        echo "Uploading all dir(s) to $bucket/"
        gsutil -m cp -r . "$bucket/"

    - name: Update downstream dev
      # Run on schedule or when dispatched to build "dev" (only possible if RC was not requested).
      if: github.event_name == 'schedule' || (github.event.inputs.rc_ref == '' && github.event.inputs.stream == 'dev')
      run: |
        echo "Copy upstream dev (dev) to downstream dev (1.0.0)"
        gsutil cp -r gs://definitions.stackrox.io/v4/vulnerability-bundles/dev/* gs://definitions.stackrox.io/v4/vulnerability-bundles/1.0.0/

  send-notification:
    needs:
    - build-and-run
    - upload-definitions
    runs-on: ubuntu-latest
    if: ${{ failure() && github.ref_name == 'master' && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false') }}
    permissions:
      checks: read
      actions: read
    steps:
    - name: Collect failure annotations
      # Pulls ::error:: annotations from every failed job for the Slack
      # message below; jobs with none get a generic fallback line.
      id: annotations
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail

        # --paginate output is multiple JSON docs back-to-back; jq below
        # handles that as a stream, no --slurp needed.
        jobs_json=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate)

        # Plain text: rendered inside a Slack code block, not mrkdwn.
        max_messages_per_job=10
        summary=""
        while IFS=$'\t' read -r job_id job_name failed_step; do
            # Exclude GitHub's generic "Process completed..." annotation (noise).
            # --paginate: a job can have >30 annotations (API's page size).
            if ! messages=$(gh api "repos/${REPO}/check-runs/${job_id}/annotations" --paginate \
                --jq '.[] | select(.annotation_level == "failure") | select(.message | test("^Process completed with exit code") | not) | .message'); then
                # Distinct fallback so an API failure isn't confused with "no annotations".
                messages="(failed to fetch annotations for this job via the GitHub API; see the workflow run directly for details)"
            fi

            # Blank line between job blocks, but not before the first one.
            if [ -n "$summary" ]; then
                summary+=$'\n\n'
            fi
            summary+="${job_name}: ${failed_step}"$'\n'
            if [ -n "$messages" ]; then
                total=$(printf '%s\n' "$messages" | grep -c .)
                summary+="$(printf '%s\n' "$messages" | sed -n "1,${max_messages_per_job}s/^/  - /p")"
                if [ "$total" -gt "$max_messages_per_job" ]; then
                    summary+=$'\n'"  - ... and $((total - max_messages_per_job)) more (see the workflow run for full details)"
                fi
            else
                summary+="  - (no detailed error annotations found; see the workflow run for details)"
            fi
        done < <(printf '%s' "$jobs_json" | jq -r '.jobs[] | select(.conclusion == "failure") | [.id, .name, ([.steps[]? | select(.conclusion == "failure") | .name][0] // "unknown step")] | @tsv')

        if [ -z "$summary" ]; then
            summary="(no failed jobs found; see the workflow run for details)"
        fi

        # Safety-net truncation, on top of the per-job cap above.
        summary="${summary:0:3000}"

        # Status of every job (not just failed ones), icons matching GitHub's own.
        job_status=""
        while IFS=$'\t' read -r job_name job_conclusion; do
            case "$job_conclusion" in
                success) icon="✅" ;;
                skipped) icon="⏭️" ;;
                cancelled) icon="🚫" ;;
                in_progress) icon="🟡" ;;
                failure | timed_out | action_required | neutral | stale | startup_failure) icon="❌" ;;
                *) icon="❔" ;; # genuinely unrecognized future conclusion value
            esac
            job_status+="${icon} ${job_name}"$'\n'
        done < <(printf '%s' "$jobs_json" | jq -r '.jobs[] | [.name, (.conclusion // "in_progress")] | @tsv')

        job_status="${job_status:0:3000}"

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
            echo "summary<<$EOF"
            echo "$summary"
            echo "$EOF"
        } >> "$GITHUB_OUTPUT"

        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        {
            echo "job_status<<$EOF"
            echo "$job_status"
            echo "$EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Send Slack notification on workflow failure
      # Runs even if "Collect failure annotations" failed, so a degraded
      # message still reaches on-call instead of nothing at all.
      if: always()
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WORKFLOW: ${{ github.workflow }}
        REPO: ${{ github.repository }}
        SUMMARY: ${{ steps.annotations.outputs.summary }}
        JOB_STATUS: ${{ steps.annotations.outputs.job_status }}
        ANNOTATIONS_OUTCOME: ${{ steps.annotations.outcome }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_ONCALL_SCANNER_WEBHOOK }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2016 # backticks below are a Slack code-block
        # delimiter, not shell command substitution.
        if [ "$ANNOTATIONS_OUTCOME" != "success" ]; then
            text=$(printf ':warning: *Failed Workflow:* <%s|%s>\n*Repository:* %s\nCould not collect failure annotations for this run (the collection step itself failed) -- please check the workflow run directly for details.' \
                "$RUN_URL" "$WORKFLOW" "$REPO")
        else
            text=$(printf '*Failed Workflow:* <%s|%s>\n*Repository:* %s\n*Job Status:*\n```\n%s```\n*Failed steps:*\n```\n%s\n```' \
                "$RUN_URL" "$WORKFLOW" "$REPO" "$JOB_STATUS" "$SUMMARY")
        fi
        jq -n --arg text "$text" '{text: $text}' \
            | curl --fail --silent --show-error --connect-timeout 10 --max-time 300 \
                -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
