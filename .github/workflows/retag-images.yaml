name: retag-images
# Validation aid: copies a source tag's images to a target tag. Used to
# provide the e2e-required sidecar images (central-db, collector, fact,
# roxctl, scanner-v4, scanner-v4-db, operator-bundle) at the CA-built
# PR tag, sourced from a known-good master build.
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing tag to copy from (e.g. master build tag)'
        required: true
        type: string
      target_tag:
        description: 'Tag to create (e.g. the PR describe tag)'
        required: true
        type: string
      operator_bundle_source:
        description: 'Existing operator-bundle tag (v-prefixed)'
        required: true
        type: string
      operator_bundle_target:
        description: 'Target operator-bundle tag (v-prefixed)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retag images
        env:
          QUAY_RHACS_ENG_RW_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RW_PASSWORD }}
          QUAY_RHACS_ENG_RW_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RW_USERNAME }}
        run: |
          set -euo pipefail
          echo "${QUAY_RHACS_ENG_RW_PASSWORD}" | docker login quay.io \
            -u "${QUAY_RHACS_ENG_RW_USERNAME}" --password-stdin
          for repo in central-db collector fact roxctl scanner-v4 scanner-v4-db; do
            docker buildx imagetools create \
              -t "quay.io/rhacs-eng/${repo}:${{ inputs.target_tag }}" \
              "quay.io/rhacs-eng/${repo}:${{ inputs.source_tag }}"
            echo "retagged ${repo}"
          done
          docker buildx imagetools create \
            -t "quay.io/rhacs-eng/operator-bundle:${{ inputs.operator_bundle_target }}" \
            "quay.io/rhacs-eng/operator-bundle:${{ inputs.operator_bundle_source }}"
          echo "retagged operator-bundle"
