name: e2e-dispatch

on:
  push:
    tags:
    - '*'
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    - labeled
    - unlabeled

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  # This job supplies current labels. Each consumer owns its execution condition.
  should-dispatch:
    needs: detect-changes
    runs-on: ubuntu-24.04
    outputs:
      labels: ${{ steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]' }}
      enforced: ${{ github.event_name == 'pull_request' && steps.labels.outcome == 'success' && contains(fromJSON(steps.labels.outputs.labels || '[]'), 'ci-dispatcher-enforce') }}
    steps:
    - name: Read current PR labels
      id: labels
      if: github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        pr="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
        jq -e --arg head "$EXPECTED_HEAD" '.head.sha == $head' <<< "$pr" > /dev/null
        printf 'labels=%s\n' "$(jq -c '[.labels[].name]' <<< "$pr")" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        persist-credentials: false
    - name: Explain selection
      id: selection
      continue-on-error: true
      uses: ./.github/actions/ci-selection-summary
      with:
        candidate: >-
          ${{ !fromJSON(needs.detect-changes.outputs.facts || '{}').complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'ci-run-all-tests') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'broad') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'proto') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').every, 'roxctl') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-byodb-tests') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-db-backup-restore-tests-gke') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-db-backup-restore-tests-gke-konflux') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-gke-upgrade-tests') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-nongroovy-tests-gke') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-qa-tests-gke') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-nongroovy-tests-gke-konflux') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-qa-tests-gke-konflux') ||
          contains(fromJSON(steps.labels.outputs.labels || toJSON(github.event.pull_request.labels.*.name) || '[]'), 'e2e-qa-tests-ocp-fips-konflux') }}
        enforced: ${{ false }}
        note: Context collection stays enabled; consumers and image waiters apply selection locally.

  wait-for-images:
    needs: [ detect-changes, should-dispatch ]
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    env:
      MAIN_IMAGE_TAG_DIR: "."
      IMAGE_PREFIX: ""
      OPERATOR_IMAGE_PREFIX: "stackrox-"
      DEV_TAG_SUFFIX: ""
      # MAIN_IMAGE_TAG can be used for overriding when you want to run workflows for particular images.
      # MAIN_IMAGE_TAG: 4.12.x-350-gc76d76b0fb
    outputs:
      run: ${{ steps.selection.outputs.run || 'true' }}
      tag: ${{ steps.image-references.outputs.tag }}
      tag_suffix: ${{ steps.image-references.outputs.tag_suffix }}
    concurrency:
      group: wait-for-images-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    # Prerequisite predicates include the consumers' label and path rules.
    - name: Explain selection
      id: selection
      continue-on-error: true
      uses: ./.github/actions/ci-selection-summary
      with:
        candidate: >-
          ${{ !fromJSON(needs.detect-changes.outputs.facts || '{}').complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'ci-run-all-tests') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'broad') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'proto') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').every, 'roxctl') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-byodb-tests') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-db-backup-restore-tests-gke') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-gke-upgrade-tests') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-nongroovy-tests-gke') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-gke') }}
        enforced: ${{ needs.should-dispatch.outputs.enforced == 'true' }}
        eligible: >-
          ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' || (needs.should-dispatch.outputs.enforced == 'true') || !github.event.pull_request.draft || contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-byodb-tests') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-db-backup-restore-tests-gke') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-db-backup-restore-tests-gke-konflux') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-gke-upgrade-tests') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-nongroovy-tests-gke') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-gke') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-nongroovy-tests-gke-konflux') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-gke-konflux') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-ocp-fips-konflux')) }}

    - uses: ./.github/actions/handle-tagged-build
    - name: Determine image references
      id: image-references
      run: &image-references |
        IMAGE_TAG="${MAIN_IMAGE_TAG:-"$(make -C "$MAIN_IMAGE_TAG_DIR" --quiet --no-print-directory tag)"}"
        echo "IMAGE_TAG=$IMAGE_TAG" | tee -a "$GITHUB_ENV"
        echo "tag=$IMAGE_TAG" | tee -a "$GITHUB_OUTPUT"

        OPERATOR_IMAGE_TAG="$(BUILD_TAG="${IMAGE_TAG}" make -C operator --quiet --no-print-directory tag)"
        echo "OPERATOR_IMAGE_TAG=${OPERATOR_IMAGE_TAG}" | tee -a "$GITHUB_ENV"

        # Mirrors the logic in https://github.com/stackrox/konflux-tasks/blob/main/tasks/determine-image-tag-task.yaml.
        source_branch="${GITHUB_HEAD_REF:-}"
        target_branch="${GITHUB_BASE_REF:-${GITHUB_REF}}"
        TAG_SUFFIX=""
        if [[ "${source_branch}" == *konflux-release-like* ]]; then
          echo "Source branch contains 'konflux-release-like', suppressing suffix."
        elif ! grep -qE '^((refs/heads/)?release-[0-9a-z]+\.[0-9a-z]+|refs/tags/[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$' <<< "${target_branch}"; then
          TAG_SUFFIX="${DEV_TAG_SUFFIX}"
        fi
        echo "TAG_SUFFIX=${TAG_SUFFIX}" | tee -a "$GITHUB_ENV"
        echo "tag_suffix=${TAG_SUFFIX}" | tee -a "$GITHUB_OUTPUT"

    - name: Wait for images
      if: steps.selection.outputs.run != 'false'
      uses: stackrox/actions/release/wait-for-image@9238e423c3ae1ac4eb0f254cbb98da9daae24d86 # ratchet:stackrox/actions/release/wait-for-image@v1
      with:
        token: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
        limit: 1800 # Seconds, corresponding to 30m.
        image: &stackrox-required-images |
          rhacs-eng/${{ env.IMAGE_PREFIX }}central-db:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}collector:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}fact:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}main:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}roxctl:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}scanner-v4-db:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}scanner-v4:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.OPERATOR_IMAGE_PREFIX }}operator-bundle:v${{ env.OPERATOR_IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.OPERATOR_IMAGE_PREFIX }}operator:${{ env.OPERATOR_IMAGE_TAG }}${{ env.TAG_SUFFIX }}

  wait-for-konflux-images:
    needs: [ detect-changes, should-dispatch ]
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    env:
      MAIN_IMAGE_TAG_DIR: "operator"
      IMAGE_PREFIX: "release-"
      OPERATOR_IMAGE_PREFIX: "release-"
      DEV_TAG_SUFFIX: "-fast"
    outputs:
      run: ${{ steps.selection.outputs.run || 'true' }}
      tag: ${{ steps.image-references.outputs.tag }}
      tag_suffix: ${{ steps.image-references.outputs.tag_suffix }}
    concurrency:
      group: wait-for-konflux-images-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    # Prerequisite predicates include the consumers' label and path rules.
    - name: Explain selection
      id: selection
      continue-on-error: true
      uses: ./.github/actions/ci-selection-summary
      with:
        candidate: >-
          ${{ !fromJSON(needs.detect-changes.outputs.facts || '{}').complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'ci-run-all-tests') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'broad') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'proto') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-db-backup-restore-tests-gke-konflux') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-nongroovy-tests-gke-konflux') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-gke-konflux') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-ocp-fips-konflux') }}
        enforced: ${{ needs.should-dispatch.outputs.enforced == 'true' }}
        eligible: >-
          ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' || (contains(fromJSON(needs.should-dispatch.outputs.labels), 'konflux-build') && ((needs.should-dispatch.outputs.enforced == 'true') || (github.event_name != 'pull_request' || contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-byodb-tests') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-db-backup-restore-tests-gke') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-db-backup-restore-tests-gke-konflux') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-gke-upgrade-tests') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-nongroovy-tests-gke') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-gke') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-nongroovy-tests-gke-konflux') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-gke-konflux') ||
            contains(fromJSON(needs.should-dispatch.outputs.labels), 'e2e-qa-tests-ocp-fips-konflux') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft))))) }}

    - uses: ./.github/actions/handle-tagged-build
    - name: Determine image references
      id: image-references
      run: *image-references

    - name: Wait for Konflux images
      if: steps.selection.outputs.run != 'false'
      uses: stackrox/actions/release/wait-for-image@9238e423c3ae1ac4eb0f254cbb98da9daae24d86 # ratchet:stackrox/actions/release/wait-for-image@v1
      with:
        token: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
        image: *stackrox-required-images
        limit: 14100 # Seconds, corresponding to 3h55m, which is the timeout for building the operator-index (.tekton/operator-index-build.yaml) + 5m buffer.

  # Each preparation records its decision before the adjacent reusable workflow can skip.
  # A selection-skipped image wait does not obscure the consumer's own selection rejection.
  select-e2e-byodb-tests:
    needs: [ detect-changes, should-dispatch, wait-for-images ]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.selection.outputs.run }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        persist-credentials: false
        sparse-checkout: .github/actions/ci-selection-summary
    - name: Explain selection
      id: selection
      uses: ./.github/actions/ci-selection-summary
      with:
        target: e2e-byodb-tests
        candidate: >-
          ${{ !fromJSON(needs.detect-changes.outputs.facts || '{}').complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'ci-run-all-tests') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'broad') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'proto') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'e2e-byodb-tests') }}
        enforced: ${{ needs.should-dispatch.outputs.enforced == 'true' }}
        eligible: >-
          ${{ needs.detect-changes.result == 'success' && needs.should-dispatch.result == 'success' &&
          needs.wait-for-images.result == 'success' &&
          (needs.wait-for-images.outputs.run == 'true' || needs.should-dispatch.outputs.enforced == 'true') &&
          !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
          needs.should-dispatch.outputs.enforced == 'true' ||
          (needs.should-dispatch.outputs.enforced != 'true' && (contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'e2e-byodb-tests')))) }}
        note: This decision controls the adjacent E2E call. A preparation failure blocks that call.

  e2e-byodb-tests:
    if: needs.wait-for-images.result == 'success' && needs.wait-for-images.outputs.run == 'true' && needs.select-e2e-byodb-tests.result == 'success'
    needs: [ wait-for-images, should-dispatch, detect-changes, select-e2e-byodb-tests ]
    uses: ./.github/workflows/e2e-byodb-tests.yaml
    with:
      tag: ${{ needs.wait-for-images.outputs.tag }}
      should-run: ${{ needs.select-e2e-byodb-tests.outputs.run == 'true' }}
    secrets: inherit
    concurrency:
      group: e2e-byodb-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  select-e2e-db-backup-restore-tests-gke:
    needs: [ detect-changes, should-dispatch, wait-for-images ]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.selection.outputs.run }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        persist-credentials: false
        sparse-checkout: .github/actions/ci-selection-summary
    - name: Explain selection
      id: selection
      uses: ./.github/actions/ci-selection-summary
      with:
        target: e2e-db-backup-restore-tests-gke
        candidate: >-
          ${{ !fromJSON(needs.detect-changes.outputs.facts || '{}').complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'ci-run-all-tests') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'broad') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'proto') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'e2e-db-backup-restore-tests-gke') }}
        enforced: ${{ needs.should-dispatch.outputs.enforced == 'true' }}
        eligible: >-
          ${{ needs.detect-changes.result == 'success' && needs.should-dispatch.result == 'success' &&
          needs.wait-for-images.result == 'success' &&
          (needs.wait-for-images.outputs.run == 'true' || needs.should-dispatch.outputs.enforced == 'true') &&
          !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
          needs.should-dispatch.outputs.enforced == 'true' ||
          (needs.should-dispatch.outputs.enforced != 'true' && (contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'e2e-db-backup-restore-tests-gke') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft)))) }}
        note: This decision controls the adjacent E2E call. A preparation failure blocks that call.

  e2e-db-backup-restore-tests-gke:
    if: needs.wait-for-images.result == 'success' && needs.wait-for-images.outputs.run == 'true' && needs.select-e2e-db-backup-restore-tests-gke.result == 'success'
    needs: [ wait-for-images, should-dispatch, detect-changes, select-e2e-db-backup-restore-tests-gke ]
    uses: ./.github/workflows/e2e-db-backup-restore-tests-gke.yaml
    with:
      tag: ${{ needs.wait-for-images.outputs.tag }}
      should-run: ${{ needs.select-e2e-db-backup-restore-tests-gke.outputs.run == 'true' }}
    secrets: inherit
    concurrency:
      group: e2e-db-backup-restore-tests-gke-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  select-e2e-db-backup-restore-tests-gke-konflux:
    needs: [ detect-changes, should-dispatch, wait-for-konflux-images ]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.selection.outputs.run }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        persist-credentials: false
        sparse-checkout: .github/actions/ci-selection-summary
    - name: Explain selection
      id: selection
      uses: ./.github/actions/ci-selection-summary
      with:
        target: e2e-db-backup-restore-tests-gke-konflux
        candidate: >-
          ${{ !fromJSON(needs.detect-changes.outputs.facts || '{}').complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'ci-run-all-tests') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'broad') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'proto') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'e2e-db-backup-restore-tests-gke-konflux') }}
        enforced: ${{ needs.should-dispatch.outputs.enforced == 'true' }}
        eligible: >-
          ${{ needs.detect-changes.result == 'success' && needs.should-dispatch.result == 'success' &&
          needs.wait-for-konflux-images.result == 'success' &&
          (needs.wait-for-konflux-images.outputs.run == 'true' || needs.should-dispatch.outputs.enforced == 'true') &&
          !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
          (needs.should-dispatch.outputs.enforced == 'true' && contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'konflux-build')) ||
          (needs.should-dispatch.outputs.enforced != 'true' && (contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'e2e-db-backup-restore-tests-gke-konflux') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft && contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'konflux-build'))))) }}
        note: This decision controls the adjacent E2E call. A preparation failure blocks that call.

  e2e-db-backup-restore-tests-gke-konflux:
    if: needs.wait-for-konflux-images.result == 'success' && needs.wait-for-konflux-images.outputs.run == 'true' && needs.select-e2e-db-backup-restore-tests-gke-konflux.result == 'success'
    needs: [ wait-for-konflux-images, should-dispatch, detect-changes, select-e2e-db-backup-restore-tests-gke-konflux ]
    uses: ./.github/workflows/e2e-db-backup-restore-tests-gke-konflux.yaml
    with:
      tag: ${{ needs.wait-for-konflux-images.outputs.tag }}${{ needs.wait-for-konflux-images.outputs.tag_suffix }}
      should-run: ${{ needs.select-e2e-db-backup-restore-tests-gke-konflux.outputs.run == 'true' }}
    secrets: inherit
    concurrency:
      group: e2e-db-backup-restore-tests-gke-konflux-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  select-e2e-gke-upgrade-tests:
    needs: [ detect-changes, should-dispatch, wait-for-images ]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.selection.outputs.run }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        persist-credentials: false
        sparse-checkout: .github/actions/ci-selection-summary
    - name: Explain selection
      id: selection
      uses: ./.github/actions/ci-selection-summary
      with:
        target: e2e-gke-upgrade-tests
        candidate: >-
          ${{ !fromJSON(needs.detect-changes.outputs.facts || '{}').complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'ci-run-all-tests') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'broad') ||
          contains(fromJSON(needs.detect-changes.outputs.facts || '{}').any, 'proto') ||
          contains(fromJSON(needs.should-dispatch.outputs.labels || '[]'), 'e2e-gke-upgrade-tests') }}
        enforced: ${{ needs.should-dispatch.outputs.enforced == 'true' }}
        eligible: >-
          ${{ needs.detect-changes.result == 'success' && needs.should-dispatch.result == 'success' &&
          needs.wait-for-images.result == 'success' &&
          (needs.wait-for-images.outputs.run == 'true' || needs.should-dispatch.outputs.enforced == 'true') &&
          !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
          needs.should-dispatch.outputs.enforced == 'true' ||
