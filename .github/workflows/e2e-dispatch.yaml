      !cancelled() && needs.should-dispatch.result == 'success' &&
      (needs.wait-for-images.result == 'success' ||
       fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-db-backup-restore-tests-gke == 'skip')
    uses: ./.github/workflows/e2e-db-backup-restore-tests-gke.yaml
    with:
      ci-action: ${{ fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-db-backup-restore-tests-gke || 'run' }}
