name: e2e-dispatch

on:
  push:
    branches:
    - master
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

permissions:
  actions: read
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  images:
    needs: [ build ]
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.build-tag.outputs.tag }}
      operator_tag: ${{ steps.build-tag.outputs.operator_tag }}
      ## MAIN_IMAGE_TAG can be used for overriding when you want to run workflows for particular images.
      # env:
      #   MAIN_IMAGE_TAG: 4.12.x-350-gc76d76b0fb
    steps:
    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: ./.github/actions/handle-tagged-build
    - name: Compute build tag
      id: build-tag
      run: |
        tag="${MAIN_IMAGE_TAG:-"$(make --quiet --no-print-directory tag)"}"
        echo "tag=$tag" | tee -a "$GITHUB_OUTPUT" -a "$GITHUB_ENV"
        echo "operator_tag=$(BUILD_TAG="${tag}" make -C operator --quiet --no-print-directory tag)" | tee -a "$GITHUB_OUTPUT" -a "$GITHUB_ENV"
    - name: Wait for images
      uses: stackrox/actions/release/wait-for-image@9238e423c3ae1ac4eb0f254cbb98da9daae24d86 # ratchet:stackrox/actions/release/wait-for-image@v1
      with:
        token: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
        image: |
          rhacs-eng/central-db:${{ env.tag }}
          rhacs-eng/collector:${{ env.tag }}
          rhacs-eng/fact:${{ env.tag }}
          rhacs-eng/main:${{ env.tag }}
          rhacs-eng/roxctl:${{ env.tag }}
          rhacs-eng/scanner-db-slim:${{ env.tag }}
          rhacs-eng/scanner-db:${{ env.tag }}
          rhacs-eng/scanner-slim:${{ env.tag }}
          rhacs-eng/scanner-v4-db:${{ env.tag }}
          rhacs-eng/scanner-v4:${{ env.tag }}
          rhacs-eng/scanner:${{ env.tag }}
          rhacs-eng/stackrox-operator-bundle:v${{ env.operator_tag }}
          rhacs-eng/stackrox-operator:${{ env.operator_tag }}

  e2e-db-backup-restore-tests:
    needs: [ build, images ]
    runs-on: ubuntu-latest
    env:
      MAIN_IMAGE_TAG: ${{ inputs.tag }}
      BUILD_TAG: ${{ inputs.tag }}
      ARTIFACT_DIR: ./junit-reports
      ROX_SCANNER_V4: true
      # Scanner v4's matcher gates readiness on the vuln bundle load. The lib
      # default (9 sources) takes ~30 min on KinD's capped CPU and stalls the
      # deploy, so KinD-v4 uses the configurable scanner_v4_allowlist input
      # (default 'alpine', <1 min); jobs needing more sources override it. GKE
      # keeps the tests/e2e/lib.sh default. (Empty -> that default.)
      SCANNER_V4_CI_VULN_BUNDLE_ALLOWLIST: alpine
      PYTHONUNBUFFERED: "1"
      # Both cluster types expose Central via a LoadBalancer service. On KinD,
      # cloud-provider-kind (started by create-kind-cluster) assigns the service
      # a real, host-reachable IP, so the deploy + wait_for_api path is identical
      # to GKE with no port-forward.
      LOAD_BALANCER: lb
      STORAGE: pvc
      # Running the full stack incl. a scanner (v2 or v4) on one KinD node requires
      # shrinking resource *requests* (so everything schedules) while keeping modest
      # *limits* (ROX_MEMLIMIT -> Go soft GC at 95% of limits.memory, so pods back
      # off instead of OOMing). These overrides only take effect on the Helm deploy
      # path, so a scanner-on KinD run also switches OUTPUT_FORMAT to helm. When
      # scanner=none, KinD stays on the leaner known-good kubectl deploy.
      ROX_CENTRAL_EXTRA_HELM_VALUES_FILE: /home/runner/work/stackrox/stackrox/deploy/common/ci-minimal-values.yaml
      ROX_SENSOR_EXTRA_HELM_VALUES_FILE: /home/runner/work/stackrox/stackrox/deploy/common/ci-minimal-secured-values.yaml
      OUTPUT_FORMAT: helm
    steps:
    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Create KinD cluster
      uses: ./.github/actions/create-kind-cluster
      with:
        cluster-name: dbbr
        tag: ${{ inputs.tag }}
        # Match the deploy's image registry (RHACS_BRANDING -> rhacs-eng) so the
        # pre-pulled image refs are the ones kubelet looks up.
        registry: quay.io/rhacs-eng
        # 14g of the runner's 16g — leaves headroom for the runner agent while
        # giving the full stack (incl. Scanner v4's memory-hungry startup) room.
        memory-limit: 14g
        enable-loadbalancer: "true"
        quay-user: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        quay-pass: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

    - uses: ./.github/actions/e2e
