name: e2e-dispatch

on:
  push:
    tags:
    - '*'
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    - labeled
    - unlabeled

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  native-selection:
    uses: ./.github/workflows/native-ci-selection.yaml
    with:
      live-labels: true

  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  # Fork, draft, and image restrictions remain explicit native conditions.
  should-dispatch:
    needs: [ detect-changes, native-selection ]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' }}
    runs-on: ubuntu-slim
    env:
      PR_LABELS: ${{ needs.native-selection.outputs.labels || toJSON(github.event.pull_request.labels.*.name || fromJSON('[]')) }}
    outputs:
      jobs: ${{ steps.dispatch.outputs.jobs }}
      wait-for-gha-images: ${{ steps.waits.outputs.wait-for-gha-images }}
      wait-for-konflux-images: ${{ steps.waits.outputs.wait-for-konflux-images }}
    steps:
      - name: Evaluate E2E conditions
        id: dispatch
        env:
          SELECT_e2e_byodb_tests: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-byodb-tests != 'false') ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-byodb-tests')))) }}
          SELECT_e2e_db_backup_restore_tests: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-db-backup-restore-tests != 'false') ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-db-backup-restore-tests') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft)))) }}
          SELECT_e2e_gke_upgrade_tests: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-gke-upgrade-tests != 'false') ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-gke-upgrade-tests') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft)))) }}
          SELECT_e2e_nongroovy_tests_gke: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-nongroovy-tests-gke != 'false') ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-nongroovy-tests-gke') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft)))) }}
          SELECT_e2e_nongroovy_tests_gke_konflux: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-nongroovy-tests-gke-konflux != 'false' && contains(fromJSON(env.PR_LABELS), 'konflux-build')) ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-nongroovy-tests-gke-konflux') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft && contains(fromJSON(env.PR_LABELS), 'konflux-build'))))) }}
          SELECT_e2e_qa_tests_gke: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-qa-tests-gke != 'false') ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-qa-tests-gke')))) }}
          SELECT_e2e_qa_tests_gke_konflux: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-qa-tests-gke-konflux != 'false' && contains(fromJSON(env.PR_LABELS), 'konflux-build')) ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-qa-tests-gke-konflux') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft && contains(fromJSON(env.PR_LABELS), 'konflux-build'))))) }}
          SELECT_e2e_qa_tests_ocp_fips_konflux: >-
            ${{ !github.event.pull_request.head.repo.fork && (github.event_name != 'pull_request' ||
              (needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.e2e-qa-tests-ocp-fips-konflux != 'false' && contains(fromJSON(env.PR_LABELS), 'konflux-build')) ||
              (needs.native-selection.outputs.enforced != 'true' && (contains(fromJSON(env.PR_LABELS), 'e2e-qa-tests-ocp-fips-konflux') || (!needs.detect-changes.outputs.ui_only && !github.event.pull_request.draft && contains(fromJSON(env.PR_LABELS), 'konflux-build'))))) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          jobs = {key[7:].replace('_', '-'): value == 'true'
                  for key, value in os.environ.items() if key.startswith('SELECT_')}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('jobs=' + json.dumps(jobs), file=output)
          PYTHON
      - name: Evaluate image waits
        id: waits
        env:
          WAIT_GHA: ${{ !github.event.pull_request.head.repo.fork && ((needs.native-selection.outputs.enforced == 'true' && needs.native-selection.outputs.wait-for-images != 'false') || (needs.native-selection.outputs.enforced != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(fromJSON(steps.dispatch.outputs.jobs).*, true)))) }}
          WAIT_KONFLUX: ${{ (needs.native-selection.outputs.enforced == 'true' && !github.event.pull_request.head.repo.fork && contains(fromJSON(env.PR_LABELS), 'konflux-build') && needs.native-selection.outputs.wait-for-konflux-images != 'false') || (needs.native-selection.outputs.enforced != 'true' && (github.event_name != 'pull_request' || (contains(fromJSON(env.PR_LABELS), 'konflux-build') && contains(fromJSON(steps.dispatch.outputs.jobs).*, true)))) }}
        run: |
          echo "wait-for-gha-images=$WAIT_GHA" >> "$GITHUB_OUTPUT"
          echo "wait-for-konflux-images=$WAIT_KONFLUX" >> "$GITHUB_OUTPUT"

  wait-for-images:
    needs: [ should-dispatch ]
    runs-on: ubuntu-24.04
    env:
      MAIN_IMAGE_TAG_DIR: "."
      IMAGE_PREFIX: ""
      OPERATOR_IMAGE_PREFIX: "stackrox-"
      DEV_TAG_SUFFIX: ""
      # MAIN_IMAGE_TAG can be used for overriding when you want to run workflows for particular images.
      # MAIN_IMAGE_TAG: 4.12.x-350-gc76d76b0fb
    outputs:
      tag: ${{ steps.image-references.outputs.tag }}
      tag_suffix: ${{ steps.image-references.outputs.tag_suffix }}
    concurrency:
      group: wait-for-images-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Checkout repo
      if: needs.should-dispatch.outputs.wait-for-gha-images == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: ./.github/actions/handle-tagged-build
      if: needs.should-dispatch.outputs.wait-for-gha-images == 'true'
    - name: Determine image references
      if: needs.should-dispatch.outputs.wait-for-gha-images == 'true'
      id: image-references
      run: &image-references |
        IMAGE_TAG="${MAIN_IMAGE_TAG:-"$(make -C "$MAIN_IMAGE_TAG_DIR" --quiet --no-print-directory tag)"}"
        echo "IMAGE_TAG=$IMAGE_TAG" | tee -a "$GITHUB_ENV"
        echo "tag=$IMAGE_TAG" | tee -a "$GITHUB_OUTPUT"

        OPERATOR_IMAGE_TAG="$(BUILD_TAG="${IMAGE_TAG}" make -C operator --quiet --no-print-directory tag)"
        echo "OPERATOR_IMAGE_TAG=${OPERATOR_IMAGE_TAG}" | tee -a "$GITHUB_ENV"

        # Mirrors the logic in https://github.com/stackrox/konflux-tasks/blob/main/tasks/determine-image-tag-task.yaml.
        source_branch="${GITHUB_HEAD_REF:-}"
        target_branch="${GITHUB_BASE_REF:-${GITHUB_REF}}"
        TAG_SUFFIX=""
        if [[ "${source_branch}" == *konflux-release-like* ]]; then
          echo "Source branch contains 'konflux-release-like', suppressing suffix."
        elif ! grep -qE '^((refs/heads/)?release-[0-9a-z]+\.[0-9a-z]+|refs/tags/[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$' <<< "${target_branch}"; then
          TAG_SUFFIX="${DEV_TAG_SUFFIX}"
        fi
        echo "TAG_SUFFIX=${TAG_SUFFIX}" | tee -a "$GITHUB_ENV"
        echo "tag_suffix=${TAG_SUFFIX}" | tee -a "$GITHUB_OUTPUT"

    - name: Wait for images
      if: needs.should-dispatch.outputs.wait-for-gha-images == 'true'
      uses: stackrox/actions/release/wait-for-image@9238e423c3ae1ac4eb0f254cbb98da9daae24d86 # ratchet:stackrox/actions/release/wait-for-image@v1
      with:
        token: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
        limit: 1800 # Seconds, corresponding to 30m.
        image: &stackrox-required-images |
          rhacs-eng/${{ env.IMAGE_PREFIX }}central-db:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}collector:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}fact:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}main:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}roxctl:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}scanner-v4-db:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.IMAGE_PREFIX }}scanner-v4:${{ env.IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.OPERATOR_IMAGE_PREFIX }}operator-bundle:v${{ env.OPERATOR_IMAGE_TAG }}${{ env.TAG_SUFFIX }}
          rhacs-eng/${{ env.OPERATOR_IMAGE_PREFIX }}operator:${{ env.OPERATOR_IMAGE_TAG }}${{ env.TAG_SUFFIX }}

  wait-for-konflux-images:
    needs: [ should-dispatch ]
    runs-on: ubuntu-24.04
    env:
      MAIN_IMAGE_TAG_DIR: "operator"
      IMAGE_PREFIX: "release-"
      OPERATOR_IMAGE_PREFIX: "release-"
      DEV_TAG_SUFFIX: "-fast"
    outputs:
      tag: ${{ steps.image-references.outputs.tag }}
      tag_suffix: ${{ steps.image-references.outputs.tag_suffix }}
    concurrency:
      group: wait-for-konflux-images-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Checkout repo
      if: needs.should-dispatch.outputs.wait-for-konflux-images == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: ./.github/actions/handle-tagged-build
      if: needs.should-dispatch.outputs.wait-for-konflux-images == 'true'
    - name: Determine image references
      if: needs.should-dispatch.outputs.wait-for-konflux-images == 'true'
      id: image-references
      run: *image-references

    - name: Wait for Konflux images
      if: needs.should-dispatch.outputs.wait-for-konflux-images == 'true'
      uses: stackrox/actions/release/wait-for-image@9238e423c3ae1ac4eb0f254cbb98da9daae24d86 # ratchet:stackrox/actions/release/wait-for-image@v1
      with:
        token: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
        image: *stackrox-required-images
        limit: 14100 # Seconds, corresponding to 3h55m, which is the timeout for building the operator-index (.tekton/operator-index-build.yaml) + 5m buffer.

  e2e-byodb-tests:
    needs: [ wait-for-images, should-dispatch ]
    uses: ./.github/workflows/e2e-byodb-tests.yaml
    with:
      tag: ${{ needs.wait-for-images.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-byodb-tests }}
    secrets: inherit
    concurrency:
      group: e2e-byodb-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-db-backup-restore-tests:
    needs: [ wait-for-images, should-dispatch ]
    uses: ./.github/workflows/e2e-db-backup-restore-tests.yaml
    with:
      tag: ${{ needs.wait-for-images.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-db-backup-restore-tests }}
    secrets: inherit
    concurrency:
      group: e2e-db-backup-restore-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-gke-upgrade-tests:
    needs: [ wait-for-images, should-dispatch ]
    uses: ./.github/workflows/e2e-gke-upgrade-tests.yaml
    with:
      tag: ${{ needs.wait-for-images.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-gke-upgrade-tests }}
    secrets: inherit
    concurrency:
      group: e2e-gke-upgrade-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-nongroovy-tests-gke:
    needs: [ wait-for-images, should-dispatch ]
    uses: ./.github/workflows/e2e-nongroovy-tests-gke.yaml
    with:
      tag: ${{ needs.wait-for-images.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-nongroovy-tests-gke }}
    secrets: inherit
    concurrency:
      group: e2e-nongroovy-tests-gke-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-nongroovy-tests-gke-konflux:
    needs: [ wait-for-konflux-images, should-dispatch ]
    uses: ./.github/workflows/e2e-nongroovy-tests-gke-konflux.yaml
    with:
      tag: ${{ needs.wait-for-konflux-images.outputs.tag }}${{ needs.wait-for-konflux-images.outputs.tag_suffix }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-nongroovy-tests-gke-konflux }}
    secrets: inherit
    concurrency:
      group: e2e-nongroovy-tests-gke-konflux-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-qa-tests-gke:
    needs: [ wait-for-images, should-dispatch ]
    uses: ./.github/workflows/e2e-qa-tests-gke.yaml
    with:
      tag: ${{ needs.wait-for-images.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-qa-tests-gke }}
    secrets: inherit
    concurrency:
      group: e2e-qa-tests-gke-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-qa-tests-ocp-fips-konflux:
    needs: [ wait-for-konflux-images, should-dispatch ]
    uses: ./.github/workflows/e2e-qa-tests-ocp-fips-konflux.yaml
    with:
      tag: ${{ needs.wait-for-konflux-images.outputs.tag }}${{ needs.wait-for-konflux-images.outputs.tag_suffix }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-qa-tests-ocp-fips-konflux }}
    secrets: inherit
    concurrency:
      group: e2e-qa-tests-ocp-fips-konflux-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-qa-tests-gke-konflux:
    needs: [ wait-for-konflux-images, should-dispatch ]
    uses: ./.github/workflows/e2e-qa-tests-gke-konflux.yaml
    with:
      tag: ${{ needs.wait-for-konflux-images.outputs.tag }}${{ needs.wait-for-konflux-images.outputs.tag_suffix }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-qa-tests-gke-konflux }}
    secrets: inherit
    concurrency:
      group: e2e-qa-tests-gke-konflux-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
