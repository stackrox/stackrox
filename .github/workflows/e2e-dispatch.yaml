       fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-db-backup-restore-tests-gke-konflux == 'skip')
    uses: "./.github/workflows/e2e-db-backup-restore-tests-gke-konflux.yaml"
    with:
      ci-action: "${{ fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-db-backup-restore-tests-gke-konflux
        || 'run' }}"
      tag: "${{ needs.wait-for-konflux-images.outputs.tag }}${{ needs.wait-for-konflux-images.outputs.tag_suffix
        }}"
      should-run: "${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-db-backup-restore-tests-gke-konflux
        }}"
    secrets: inherit
    concurrency:
      group: e2e-db-backup-restore-tests-gke-konflux-${{ github.workflow }}-${{ github.head_ref
        || github.run_id }}
      cancel-in-progress: true
  e2e-gke-upgrade-tests:
