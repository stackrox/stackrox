# Disposable label/check aggregation experiment. Do not merge.
---
name: e2e-dispatch
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  ci-selection:
    name: ACS CI selection
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' &&
      github.event.action != 'unlabeled') || github.event.label.name == 'ci-dispatcher-enforce'
    uses: "./.github/workflows/ci-selection.yaml"
  detect-changes:
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' &&
      github.event.action != 'unlabeled') || github.event.label.name == 'ci-dispatcher-enforce'
    uses: "./.github/workflows/detect-changes.yml"
  should-dispatch:
    needs:
    - detect-changes
    - ci-selection
    if: "!cancelled() && needs.detect-changes.result == 'success' && (github.event_name
      != 'pull_request' || (github.event.action != 'labeled' && github.event.action
      != 'unlabeled') || github.event.label.name == 'ci-dispatcher-enforce')"
    runs-on: ubuntu-slim
    outputs:
      wait-for-gha-images: "${{ steps.determine.outputs.wait-for-gha-images }}"
      wait-for-konflux-images: "${{ steps.determine.outputs.wait-for-konflux-images
        }}"
      jobs: "${{ steps.determine.outputs.jobs }}"
      ci-actions: "${{ steps.determine.outputs.ci-actions }}"
      skip-gha-images: "${{ steps.determine.outputs.skip-gha-images }}"
      skip-konflux-images: "${{ steps.determine.outputs.skip-konflux-images }}"
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        persist-credentials: false
    - name: Determine whether should dispatch workflows
      id: determine
      env:
        GH_TOKEN: "${{ github.token }}"
        PYTHONUNBUFFERED: '1'
        input__event_name: "${{ github.event_name }}"
        input__is_fork: "${{ github.event.pull_request.head.repo.fork }}"
        input__is_draft: 'false'
        input__ui_only_change: "${{ needs.detect-changes.outputs.ui_only }}"
        input__repo: "${{ github.repository }}"
        input__pr_number: "${{ github.event.pull_request.number }}"
        input__ci_decisions: "${{ needs.ci-selection.outputs.decisions }}"
        input__ci_planner_result: "${{ needs.ci-selection.result }}"
      run: python3 ci/select/e2e_dispatch.py
  wait-for-images:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}wait-for-images
    needs:
    - should-dispatch
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-24.04
    env:
      MAIN_IMAGE_TAG_DIR: "."
      IMAGE_PREFIX: ''
      OPERATOR_IMAGE_PREFIX: stackrox-
      DEV_TAG_SUFFIX: ''
    outputs:
      tag: "${{ steps.image-references.outputs.tag }}"
      tag_suffix: "${{ steps.image-references.outputs.tag_suffix }}"
    concurrency:
      group: |-
        wait-for-images-${{ github.workflow }}-${{
          github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce' &&
          format('ignored-label-{0}', github.run_id) || github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ needs.should-dispatch.result == 'success' && needs.should-dispatch.outputs.wait-for-gha-images
          == 'true' && needs.should-dispatch.outputs.skip-gha-images != 'true' &&
          'run' || 'skip' }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: Synthetic image references
      id: image-references
      if: steps.ci-decision.outputs.action != 'skip'
      run: 'printf "tag=0.0.0-label-probe\ntag_suffix=\n" >> "$GITHUB_OUTPUT"

        '
  wait-for-konflux-images:
    needs:
    - should-dispatch
    if: "!cancelled() && needs.should-dispatch.result == 'success' && needs.should-dispatch.outputs.wait-for-konflux-images
      == 'true'"
    runs-on: ubuntu-24.04
    env:
      MAIN_IMAGE_TAG_DIR: operator
      IMAGE_PREFIX: release-
      OPERATOR_IMAGE_PREFIX: release-
      DEV_TAG_SUFFIX: "-fast"
    outputs:
      tag: "${{ steps.image-references.outputs.tag }}"
      tag_suffix: "${{ steps.image-references.outputs.tag_suffix }}"
    concurrency:
      group: wait-for-konflux-images-${{ github.workflow }}-${{ github.head_ref ||
        github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ needs.should-dispatch.outputs.skip-konflux-images ==
          'true' && 'skip' || 'run' }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: Synthetic image references
      id: image-references
      if: steps.ci-decision.outputs.action != 'skip'
      run: 'printf "tag=0.0.0-label-probe\ntag_suffix=\n" >> "$GITHUB_OUTPUT"

        '
  e2e-byodb-tests:
    needs:
    - wait-for-images
    - should-dispatch
    if: |-
      !cancelled() && needs.should-dispatch.result == 'success' && (needs.wait-for-images.result == 'success' ||
       fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-byodb-tests == 'skip')
    uses: "./.github/workflows/e2e-byodb-tests.yaml"
    with:
      ci-action: "${{ fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-byodb-tests
        || 'run' }}"
      tag: "${{ needs.wait-for-images.outputs.tag }}"
      should-run: "${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-byodb-tests
        }}"
    secrets: inherit
    concurrency:
      group: e2e-byodb-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id
        }}
      cancel-in-progress: true
  e2e-db-backup-restore-tests-gke:
