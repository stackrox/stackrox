name: e2e-dispatch

on:
  push:
    tags:
    - '*'
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  # Computes the same deterministic tag build.yaml computes internally. Runs
  # independently (no needs:) so it overlaps with should-dispatch/build rather than
  # waiting on them -- it only depends on the checked-out commit, not on any other
  # job's outcome.
  #
  # This recomputes the tag instead of reading it from build.yaml's own output
  # because referencing needs.build.outputs.<name> anywhere in this file causes a
  # hard startup_failure (zero jobs created) until build.yaml declares that output
  # on the base branch -- confirmed empirically, and not something a runtime `||`
  # fallback can route around since the rejection happens at static schema
  # validation, before any expression evaluates. See #21722, which would let us
  # simplify this once merged, though there's no urgency since this already works.
  compute-tag:
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.build-tag.outputs.tag }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: ./.github/actions/handle-tagged-build
    - name: Compute build tag
      id: build-tag
      run: |
        tag="${MAIN_IMAGE_TAG:-"$(make --quiet --no-print-directory tag)"}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Determines whether we should dispatch jobs that call real E2E workflows.
  # This allows to skip running E2E tests on draft PRs without corresponding labels or on untrusted forks.
  should-dispatch:
    needs: [ detect-changes ]
    runs-on: ubuntu-slim
    outputs:
      dispatch-any: ${{ steps.determine.outputs.dispatch-any }}
      jobs: ${{ steps.determine.outputs.jobs }}
    steps:
    - name: Determine whether should dispatch workflows
      id: determine
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONUNBUFFERED: "1"
        input__event_name: ${{ github.event_name }}
        input__is_fork: ${{ github.event.pull_request.head.repo.fork }}
        input__is_draft: ${{ github.event.pull_request.draft }}
        input__ui_only_change: ${{ needs.detect-changes.outputs.ui_only }}
        input__repo: ${{ github.repository }}
        input__pr_number: ${{ github.event.pull_request.number }}
      run: |
        import json
        import os
        import subprocess
        from types import SimpleNamespace

        input = SimpleNamespace(**{
            key.removeprefix('input__'): val
            for (key, val) in os.environ.items()
            if key.startswith('input__')})
        for k, v in vars(input).items():
            print(f'{k} = {v}')

        if input.event_name != 'pull_request':
            all_labels = []
        else:
            p = subprocess.run(
                ['gh', 'pr', 'view', input.pr_number, '--repo', input.repo, '--json', 'labels', '--jq', '.labels[].name'],
                check=True, encoding='utf-8', stdout=subprocess.PIPE, stdin=subprocess.DEVNULL)
            all_labels = p.stdout.strip().splitlines()
        print(f'all_labels = {", ".join(all_labels)}')

        def should_run(job):
            if input.is_fork == 'true':
                return False
            if input.event_name != 'pull_request':
                return True
            if input.ui_only_change == 'true':
                # For now, all the workflows that we dispatch should be skipped for PRs that only change UI.
                # As we add more E2E test workflows, we may want to make this more flexible.
                return False
            if input.is_draft != 'true':
                return True
            if job in all_labels:
                return True
            return False

        with open(os.environ['GITHUB_OUTPUT'], mode='at', encoding='utf-8') as file:
            def write(job, val):
                line = f'{job}={val}'
                print(line)
                file.write(line + '\n')

            jobs = { job: should_run(job) for job in [
                    'e2e-byodb-tests',
                    'e2e-db-backup-restore-test',
                    'e2e-gke-upgrade-tests',
                    'e2e-nongroovy-tests',
                ]}

            write('jobs', json.dumps(jobs))

            # dispatch_any==False is a shortcut to prevent executing the further workflow for draft PRs which don't
            # qualify for running any actual e2e jobs.
            # We must make sure that dispatch_any is True for non-drafts even if no actual jobs are to be dispatched
            # (the case of UI-only PRs) because this lets GHA enter the corresponding workflows and skip the test jobs
            # inside them "in proper way" that allows to satisfy branch protection rules.
            dispatch_any = any(jobs.values()) or input.is_draft != 'true'
            write('dispatch-any', str(dispatch_any).lower())

  # Builds all images. E2E jobs below wait on this via needs: (a native GHA job
  # dependency) instead of polling the registry for images to appear.
  build:
    if: false
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  e2e-byodb-tests:
    needs: [ build, compute-tag, should-dispatch ]
    uses: ./.github/workflows/e2e-byodb-tests.yaml
    with:
      tag: ${{ needs.compute-tag.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-byodb-tests }}
    secrets: inherit
    concurrency:
      group: e2e-byodb-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-db-backup-restore-test:
    needs: [ build, compute-tag, should-dispatch ]
    uses: ./.github/workflows/e2e-db-backup-restore-test.yaml
    with:
      tag: ${{ needs.compute-tag.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-db-backup-restore-test }}
    secrets: inherit
    concurrency:
      group: e2e-db-backup-restore-test-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-gke-upgrade-tests:
    needs: [ build, compute-tag, should-dispatch ]
    uses: ./.github/workflows/e2e-gke-upgrade-tests.yaml
    with:
      tag: ${{ needs.compute-tag.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-gke-upgrade-tests }}
    secrets: inherit
    concurrency:
      group: e2e-gke-upgrade-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

  e2e-nongroovy-tests:
    needs: [ build, compute-tag, should-dispatch ]
    uses: ./.github/workflows/e2e-nongroovy-tests.yaml
    with:
      tag: ${{ needs.compute-tag.outputs.tag }}
      should-run: ${{ fromJSON(needs.should-dispatch.outputs.jobs).e2e-nongroovy-tests }}
    secrets: inherit
    concurrency:
      group: e2e-nongroovy-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
