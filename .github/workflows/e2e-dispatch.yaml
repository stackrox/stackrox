       fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-gke-upgrade-tests == 'skip')
    uses: "./.github/workflows/e2e-gke-upgrade-tests.yaml"
    with:
      ci-action: "${{ fromJSON(needs.should-dispatch.outputs.ci-actions || '{}').e2e-gke-upgrade-tests
        || 'run' }}"
