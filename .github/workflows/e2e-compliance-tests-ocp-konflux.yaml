name: e2e-compliance-tests-ocp-konflux

on:
  workflow_call:
    inputs:
      tag:
        description: |
          Image tag to test. The caller needs to make sure that the tag carries the
          "-fast" Konflux suffix if required (e.g. for development builds).
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the job should be skipped.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: |
          Image tag to test. You need to make sure that the tag carries the
          "-fast" Konflux suffix if required (e.g. for development builds).
        type: string
        required: true

jobs:
  run:
    uses: ./.github/workflows/e2e-compliance-tests.yaml
    with:
      should-run: ${{ github.event_name == 'workflow_dispatch' || inputs.should-run }}
      tag: ${{ inputs.tag }}
      ci-job-name: ocp-compliance-e2e-tests-konflux
      cluster-name-prefix: e2e-cmpl-ocp-knflx
      cluster-provisioning-method: infra
      cluster-wait-timeout-minutes: 60
      infra-flavor: openshift-4
      infra-args: |
        openshift-version=ocp/stable
        master-node-type=e2-standard-4
        master-node-count=3
        worker-node-type=e2-standard-8
        worker-node-count=3
      infra-lifespan: 5h
      extra-env-vars: |
        ORCHESTRATOR_FLAVOR=openshift
        KUBERNETES_PROVIDER=ocp
        USE_KONFLUX_IMAGES=true
    secrets: inherit
