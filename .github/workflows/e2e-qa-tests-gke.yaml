name: e2e-qa-tests-gke

on:
  workflow_call:
    inputs:
      ci-action:
        description: Applied CI selection decision; missing or invalid values run.
        type: string
        default: run
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the job should be skipped.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true

jobs:
  run:
    uses: ./.github/workflows/e2e-qa-tests.yaml
    with:
      ci-action: ${{ inputs.ci-action }}
      should-run: ${{ github.event_name == 'workflow_dispatch' || inputs.should-run }}
      tag: ${{ inputs.tag }}
      ci-job-name: gke-qa-e2e-tests
      cluster-name-prefix: e2e-qa-tests-gke
      cluster-provisioning-method: direct-gke
      extra-env-vars: |
        ORCHESTRATOR_FLAVOR=k8s
        KUBERNETES_PROVIDER=gke
        STORAGE_CLASS=stackrox-gke-ssd
        SCANNER_V4_DB_STORAGE_CLASS=stackrox-gke-ssd
    secrets: inherit
