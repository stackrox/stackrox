name: e2e-db-backup-restore-tests

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the job should be skipped.
        type: boolean
        required: true
      cluster:
        description: Which cluster type(s) to run on — gke, kind, or both.
        type: string
        required: false
        default: gke
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true
      cluster:
        description: Which cluster type(s) to run on.
        type: choice
        options:
          - kind
          - gke
          - both
        default: kind

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  db-backup-restore-tests:
    if: github.event_name == 'workflow_dispatch' || inputs.should-run
    strategy:
      fail-fast: false
      matrix:
        # Derive the cluster list from the `cluster` input:
        #   both -> [gke, kind]   kind -> [kind]   (default) -> [gke]
        cluster: ${{ fromJSON(inputs.cluster == 'both' && '["gke","kind"]' || (inputs.cluster == 'kind' && '["kind"]' || '["gke"]')) }}
    runs-on: ubuntu-latest
    env:
      MAIN_IMAGE_TAG: ${{ inputs.tag }}
      BUILD_TAG: ${{ inputs.tag }}
      CI_JOB_NAME: ${{ matrix.cluster }}-db-backup-restore-tests
      ARTIFACT_DIR: ./junit-reports
      ROX_SCANNER_V4: "false"
      PYTHONUNBUFFERED: "1"
      # Cluster-specific settings.
      # GKE: cloud LoadBalancer exposure + pd-ssd "faster" storage class + scanner v2.
      # KinD: no cloud LB (deploy falls back to port-forward on localhost:8000),
      #       default local-path storage class, scanner disabled to fit the runner.
      LOAD_BALANCER: ${{ matrix.cluster == 'gke' && 'lb' || 'none' }}
      STORAGE: pvc
      STORAGE_CLASS: ${{ matrix.cluster == 'gke' && 'faster' || '' }}
      SCANNER_SUPPORT: ${{ matrix.cluster == 'gke' && 'true' || 'false' }}
    timeout-minutes: 60
    steps:

    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    # --- GKE provisioning (matrix.cluster == 'gke') ---

    - name: Set up Cloud SDK
      if: matrix.cluster == 'gke'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3
      with:
        install_components: "gke-gcloud-auth-plugin,beta"

    - name: Create GKE cluster
      if: matrix.cluster == 'gke'
      env:
        MACHINE_TYPE: e2-standard-8
        NUM_NODES: "3"
        GKE_SPOT: "false"
      timeout-minutes: 20
      run: |
        scripts/ci/gke.sh provision_gke_cluster dbbr
        echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

    # --- KinD provisioning (matrix.cluster == 'kind') ---

    - name: Create KinD cluster
      if: matrix.cluster == 'kind'
      uses: ./.github/actions/create-kind-cluster
      with:
        cluster-name: dbbr
        tag: ${{ inputs.tag }}
        registry: quay.io/stackrox-io
        memory-limit: 12g
        pull-scanner: "false"
        quay-user: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        quay-pass: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

    # --- Shared: build roxctl (used for central backup/restore) ---

    - name: Build roxctl
      run: |
        make roxctl_linux-amd64
        echo "$(pwd)/bin/linux_amd64" >> "$GITHUB_PATH"

    # --- Cluster readiness ---

    - name: Verify kubectl access and wait for GKE cluster to stabilize
      if: matrix.cluster == 'gke'
      timeout-minutes: 5
      run: |
        kubectl cluster-info
        kubectl get nodes
        scripts/ci/gke.sh wait_for_cluster

    - name: Wait for KinD cluster to be ready
      if: matrix.cluster == 'kind'
      timeout-minutes: 10
      run: |
        echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"
        export KUBECONFIG="${HOME}/.kube/config"
        # create-kind-cluster runs in the background; wait for its readiness file.
        for _ in $(seq 1 120); do
          [[ -f /tmp/kind-ready ]] && break
          sleep 5
        done
        echo "=== KinD creation log ==="
        cat /tmp/kind-create.log 2>/dev/null || true
        if [[ ! -f /tmp/kind-ready ]]; then
          echo "::error::KinD cluster did not become ready in time"
          exit 1
        fi
        kubectl cluster-info
        kubectl wait --for=condition=Ready nodes --all --timeout=180s
        kubectl get nodes

    - name: Create artifact directory
      run: mkdir -p "$ARTIFACT_DIR"

    - name: Run pre-test
      shell: python
      env:
        QUAY_RHACS_ENG_BEARER_TOKEN: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from pre_tests import PreSystemTests
        PreSystemTests().run()

    - name: Deploy StackRox and run DB backup/restore test
      env:
        QUAY_RHACS_ENG_RO_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        QUAY_RHACS_ENG_RO_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
        REGISTRY_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
        ORCHESTRATOR_FLAVOR: k8s
      run: |
        source tests/e2e/lib.sh
        source tests/scripts/setup-certs.sh
        source scripts/ci/sensor-wait.sh
        export_test_environment
        setup_deployment_env false false
        deploy_stackrox
        # Persist API_ENDPOINT for post-test steps (ci_export only sets it in this shell)
        echo "API_ENDPOINT=${API_ENDPOINT}" >> "$GITHUB_ENV"
        db_backup_and_restore_test /tmp/db-backup-restore-test

    - name: Run post-test
      if: always()
      shell: python
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from post_tests import CheckStackroxLogs
        CheckStackroxLogs(
            check_for_errors_in_stackrox_logs=True,
            artifact_destination_prefix="db-test",
        ).run(['/tmp/db-backup-restore-test', '${{ env.ARTIFACT_DIR }}'])

    - name: Run final-post
      if: always()
      shell: python
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from post_tests import FinalPost
        FinalPost(store_qa_tests_data=False).run()

    - name: Teardown GKE cluster
      if: always() && matrix.cluster == 'gke'
      continue-on-error: true
      run: |
        if [[ -z "${CLUSTER_NAME:-}" ]]; then
          echo "No cluster to teardown"
          exit 0
        fi
        if ! scripts/ci/gke.sh teardown_gke_cluster false; then
          echo "::warning::WARNING: Could not tear down cluster ${CLUSTER_NAME}. See Teardown step logs for details."
          exit 6
        fi

    - name: Teardown KinD cluster
      if: always() && matrix.cluster == 'kind'
      continue-on-error: true
      run: |
        kind delete cluster --name dbbr || true

    - name: Publish test summary
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: ${{ env.ARTIFACT_DIR }}/**/*.xml
        show: all

    - name: Report junit failures in jira
      if: (!cancelled())
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: ${{ env.ARTIFACT_DIR }}
