# Disposable label/check aggregation experiment. Do not merge.
---
name: e2e-gke-upgrade-tests
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  gke-upgrade-tests-central:
    if: github.event_name == 'workflow_dispatch' || inputs.should-run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ github.event_name == 'workflow_dispatch' && 'run' ||
          inputs.ci-action }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: steps.ci-decision.outputs.action != 'skip'
  check-postgres-upgrade:
    if: github.event_name == 'workflow_dispatch' || inputs.should-run
    runs-on: ubuntu-latest
    outputs:
      required: "${{ steps.check.outputs.required }}"
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ github.event_name == 'workflow_dispatch' && 'run' ||
          inputs.ci-action }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: Enable PostgreSQL probe
      id: check
      if: steps.ci-decision.outputs.action != 'skip'
      run: 'echo "required=true" >> "$GITHUB_OUTPUT"

        '
  gke-upgrade-tests-postgres:
    needs: check-postgres-upgrade
    if: needs.check-postgres-upgrade.outputs.required == 'true' || inputs.ci-action
      == 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ github.event_name == 'workflow_dispatch' && 'run' ||
          inputs.ci-action }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: steps.ci-decision.outputs.action != 'skip'
  gke-upgrade-tests-sensor:
    if: github.event_name == 'workflow_dispatch' || inputs.should-run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Read CI selection
      id: ci-decision
      env:
        CI_SELECT_ACTION: "${{ github.event_name == 'workflow_dispatch' && 'run' ||
          inputs.ci-action }}"
      run: |
        action=run
        if [[ "$CI_SELECT_ACTION" == skip ]]; then
            action=skip
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'CI selection: %s\n' "$action"
    - name: 'Label/check probe: hold'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: hold"
        echo "Holding this check in progress for ten minutes, then failing."
        sleep 600
        exit 1
      if: steps.ci-decision.outputs.action != 'skip'
'on':
  workflow_call:
    inputs:
      ci-action:
        description: Applied CI selection decision; missing or invalid values run.
        type: string
        default: run
      tag:
        description: Image tag to test.
        type: string
        required: true
      should-run:
        description: true if should really run the job. false - otherwise, i.e. the
          job should be skipped.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to test.
        type: string
        required: true
