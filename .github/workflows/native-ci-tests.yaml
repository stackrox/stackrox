name: Native CI selector tests

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  selector-tests:
    needs: detect-changes
    env:
      CI_FILE_FACTS: ${{ needs.detect-changes.outputs.facts || '{}' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Explain selection
        id: selection
        continue-on-error: true
        uses: ./.github/actions/ci-selection-summary
        with:
          candidate: >-
            ${{ !fromJSON(env.CI_FILE_FACTS).complete ||
            contains(github.event.pull_request.labels.*.name, 'ci-run-all-tests') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'broad') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'proto') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'selector') }}
          enforced: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v6
        if: steps.selection.outputs.run != 'false'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        if: steps.selection.outputs.run != 'false'
        with:
          node-version-file: ui/package.json
      - run: npm ci --ignore-scripts
        if: steps.selection.outputs.run != 'false'
        working-directory: ci/native-selectors
      - run: npm test
        if: steps.selection.outputs.run != 'false'
        working-directory: ci/native-selectors
