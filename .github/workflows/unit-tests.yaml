name: Unit Tests
on:
  push:
    tags:
    - '*'
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - labeled
    - unlabeled

concurrency:
  # Ignored label events must not cancel or replace a pending test run.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ci-dispatcher-enforce' &&
      format('ignored-label-{0}', github.run_id) ||
      github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Stable version ldflags for test caching: Go's test cache keys include
  # link ActionID which includes -X ldflags. Fixed BUILD_TAG/SHORTCOMMIT
  # prevent per-commit cache misses.
  BUILD_TAG: 0.0.0
  SHORTCOMMIT: "0000000"

jobs:
  ci-selection:
    name: ACS CI selection
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-dispatcher-enforce'
    uses: ./.github/workflows/ci-selection.yaml

  detect-changes:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-dispatcher-enforce'
    uses: ./.github/workflows/detect-changes.yml
    with:
      run_all: |
        ^Makefile$
        ^make/
        ^.github/workflows/unit-tests.yaml$
        ^.github/actions/job-preamble/

  go:
    needs: [detect-changes, ci-selection]
    # Explicit status handling keeps planner failures from suppressing tests.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-dispatcher-enforce')
    strategy:
      fail-fast: false
      matrix:
        gotags: [ 'GOTAGS=""', 'GOTAGS=release' ]
        exclude:
          - gotags: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-release-build') && 'GOTAGS=release' }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Select CI job
      id: ci-decision
      env:
        CI_SELECT_PLANNER_RESULT: ${{ needs.ci-selection.result }}
        CI_SELECT_DECISIONS: ${{ needs.ci-selection.outputs.decisions }}
      run: bash ci/select/gha-consume.sh go

    - uses: ./.github/actions/job-preamble
      if: &selected-suite steps.ci-decision.outputs.action != 'skip'
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        free-disk-space: 30

    - name: Cache Go dependencies
      if: *selected-suite
      uses: ./.github/actions/cache-go-dependencies
      with:
        key-suffix: ${{ matrix.gotags }}

    - name: Go Unit Tests
      if: *selected-suite
      run: ${{ matrix.gotags }} make go-unit-tests

    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # ratchet:codecov/codecov-action@v7.1.1
      if: *selected-suite
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: go-unit-tests

    - name: Generate junit report
      if: always() && steps.ci-decision.outputs.action != 'skip'
      run: make generate-junit-reports

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && steps.ci-decision.outputs.action != 'skip'
      with:
        paths: 'junit-reports/report.xml'

    - name: Go Integration Unit Tests
      if: *selected-suite
      run: ${{ matrix.gotags }} make integration-unit-tests

    - name: Go Operator Integration Tests
      if: *selected-suite
      run: ${{ matrix.gotags }} make -C operator/ test-integration

    - name: Go Operator Helm Tests
      if: *selected-suite
      run: ${{ matrix.gotags }} make -C operator/ test-helm

    - name: Generate junit report
      if: always() && steps.ci-decision.outputs.action != 'skip'
      run: make generate-junit-reports

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && steps.ci-decision.outputs.action != 'skip'
      with:
        paths: 'junit-reports/report.xml'

    # Jira observes the final job status, including setup and test failures.
    - name: Report test failures to Jira
      if: (!cancelled()) && steps.ci-decision.outputs.action != 'skip'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'junit-reports'

  go-postgres:
    needs: [detect-changes, ci-selection]
    # Explicit status handling keeps planner failures from suppressing tests.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-dispatcher-enforce')
    strategy:
      fail-fast: false
      matrix:
        gotags: [ 'GOTAGS=""', 'GOTAGS=release' ]
        pg: [ '16' ]
        exclude:
          - gotags: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-release-build') && 'GOTAGS=release' }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    env:
      POSTGRES_PASSWORD: testpassword
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Select CI job
      id: ci-decision
      env:
        CI_SELECT_PLANNER_RESULT: ${{ needs.ci-selection.result }}
        CI_SELECT_DECISIONS: ${{ needs.ci-selection.outputs.decisions }}
      run: bash ci/select/gha-consume.sh go-postgres

    - uses: ./.github/actions/job-preamble
      if: *selected-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    # Runner's postgres is initialized with C.UTF-8 locale (GHA default).
    # Tests (e.g. central/splunk) require byte-order collation.
    - name: Start Postgres (pre-installed)
      if: steps.ci-decision.outputs.action != 'skip' && matrix.pg == 'default'
      run: |
        # Run on tmpfs to avoid disk I/O overhead in tests.
        PG_VER=$(pg_lsclusters -h | awk '{print $1}')
        sudo pg_dropcluster --stop "$PG_VER" main
        sudo mount -t tmpfs -o size=1G tmpfs /var/lib/postgresql
        # the unit tests expect a local postgres with passwordless access.
        sudo pg_createcluster "$PG_VER" main -- --auth=trust
        sudo cp .github/test-images/postgres-ci.conf "/etc/postgresql/$PG_VER/main/conf.d/ci.conf"
        sudo systemctl start postgresql.service

    # Image pinned in .github/test-images/postgres.dockerfile (Dependabot auto-bumps).
    - name: Start Postgres (${{ matrix.pg }})
      if: steps.ci-decision.outputs.action != 'skip' && matrix.pg != 'default'
      run: |
        docker build -t postgres-test -f .github/test-images/postgres.dockerfile .
        docker run --rm -d --name postgres --network=host \
          --tmpfs /var/lib/pgsql/data:rw,size=1G \
          -v "$GITHUB_WORKSPACE/.github/test-images/postgres-ci.conf:/opt/app-root/src/postgresql-cfg/ci.conf:ro" \
          -e POSTGRESQL_ADMIN_PASSWORD="$POSTGRES_PASSWORD" \
          -e LANG=C.UTF-8 \
          postgres-test

    - name: Cache Go dependencies
      if: *selected-suite
      uses: ./.github/actions/cache-go-dependencies
      with:
        key-suffix: ${{ matrix.gotags }}

    - name: Is Postgres ready
      if: *selected-suite
      run: |
        if [ "${{ matrix.pg }}" = "default" ]; then
          timeout 60 bash -c 'until pg_isready; do sleep 1; done' \
            || { sudo journalctl -u postgresql --no-pager -n 20; exit 1; }
        else
          timeout 60 bash -c 'until pg_isready -h 127.0.0.1; do sleep 1; done' \
            || { docker logs postgres; exit 1; }
        fi

    - name: Go Unit Tests
      if: *selected-suite
      run: ${{ matrix.gotags }} make go-postgres-unit-tests

    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # ratchet:codecov/codecov-action@v7.1.1
      if: *selected-suite
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: go-unit-tests

    - name: Generate junit report
      if: always() && steps.ci-decision.outputs.action != 'skip'
      run: make generate-junit-reports

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && steps.ci-decision.outputs.action != 'skip'
      with:
        paths: 'junit-reports/report.xml'

    # Jira observes the final job status, including setup and test failures.
    - name: Report junit failures in jira
      if: (!cancelled()) && steps.ci-decision.outputs.action != 'skip'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'junit-reports'

  # Benchmarks run each bench function once (-benchtime=1x -count=1) to verify
  # they compile and execute without errors. A single postgres version is
  # sufficient since go-postgres already tests against multiple versions.
  go-bench:
    # Start the job so GitHub evaluates its check name before skipping steps.
    name: >-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}go-bench
    needs: [detect-changes, ci-selection]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CI_RUN_SUITE: >-
        ${{ (github.event_name != 'pull_request' ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ci-dispatcher-enforce') &&
        (needs.ci-selection.result != 'success' ||
         (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce')) ||
         !needs.detect-changes.outputs.ui_only) }}
    steps:
    - name: Checkout
      if: &eligible-suite env.CI_RUN_SUITE == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Select CI job
      id: ci-decision
      if: *eligible-suite
      env:
        CI_SELECT_PLANNER_RESULT: ${{ needs.ci-selection.result }}
        CI_SELECT_DECISIONS: ${{ needs.ci-selection.outputs.decisions }}
      run: bash ci/select/gha-consume.sh go-bench

    - uses: ./.github/actions/job-preamble
      if: &eligible-selected-suite env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Start Postgres
      if: *eligible-selected-suite
      run: |
        # Run on tmpfs to avoid disk I/O overhead in tests.
        PG_VER=$(pg_lsclusters -h | awk '{print $1}')
        sudo pg_dropcluster --stop "$PG_VER" main
        sudo mount -t tmpfs -o size=1G tmpfs /var/lib/postgresql
        # the unit tests expect a local postgres with passwordless access.
        sudo pg_createcluster "$PG_VER" main -- --auth=trust
        sudo cp .github/test-images/postgres-ci.conf "/etc/postgresql/$PG_VER/main/conf.d/ci.conf"
        sudo systemctl start postgresql.service

    - name: Cache Go dependencies
      if: *eligible-selected-suite
      uses: ./.github/actions/cache-go-dependencies

    - name: Is Postgres ready
      if: *eligible-selected-suite
      run: |
        timeout 60 bash -c 'until pg_isready -h 127.0.0.1; do sleep 1; done' \
          || { sudo journalctl -u postgresql --no-pager -n 20; exit 1; }

    - name: Go Bench Tests
      if: *eligible-selected-suite
      run: make go-postgres-bench-tests

    - name: Postgres diagnostics
      if: (!cancelled()) && failure() && env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
      run: |
        pg_isready -h 127.0.0.1 || true
        pg_lsclusters || true
        df -h /var/lib/postgresql || true
        sudo journalctl -u postgresql --no-pager -n 40 || true
        sudo cat /var/log/postgresql/postgresql-*-main.log | tail -60 || true

    - name: Generate junit report
      if: always() && env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
      run: make generate-junit-reports

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
      with:
        paths: 'junit-reports/report.xml'

    # Do not create junit report for bench tests:
    # https://github.com/jstemmer/go-junit-report/issues/174

  ui:
    name: >-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}ui
    needs: detect-changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CI_RUN_SUITE: >-
        ${{ needs.detect-changes.result == 'success' &&
        (!needs.detect-changes.outputs.files ||
         contains(needs.detect-changes.outputs.files, '^ui/') ||
         contains(needs.detect-changes.outputs.files, '^.github/actions/cache-ui-dependencies/')) }}
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1

    - name: Checkout
      if: *eligible-suite
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - uses: ./.github/actions/job-preamble
      if: *eligible-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Set up Node.js
      if: *eligible-suite
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
      with:
        node-version-file: ui/package.json

    - name: Cache UI dependencies
      id: cache-ui
      if: *eligible-suite
      uses: ./.github/actions/cache-ui-dependencies

    - name: Install UI dependencies
      if: env.CI_RUN_SUITE == 'true' && steps.cache-ui.outputs.cache-hit != 'true'
      run: make -C ui deps

    - name: Skip UI deps on cache hit
      if: env.CI_RUN_SUITE == 'true' && steps.cache-ui.outputs.cache-hit == 'true'
      run: touch ui/deps

    - name: UI Unit Tests
      if: *eligible-suite
      run: make ui-test

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && env.CI_RUN_SUITE == 'true'
      with:
        paths: 'ui/apps/platform/test-results/reports/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled()) && env.CI_RUN_SUITE == 'true'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'ui/apps/platform/test-results/reports'

  ui-component:
    name: >-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}ui-component
    needs: detect-changes
    if: ${{ !cancelled() }}
    env:
      CI_RUN_SUITE: >-
        ${{ needs.detect-changes.result == 'success' &&
        (!needs.detect-changes.outputs.files ||
         contains(needs.detect-changes.outputs.files, '^ui/') ||
         contains(needs.detect-changes.outputs.files, '^.github/actions/cache-ui-dependencies/')) }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1

    - name: Checkout
      if: *eligible-suite
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - uses: ./.github/actions/job-preamble
      if: *eligible-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Set up Node.js
      if: *eligible-suite
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
      with:
        node-version-file: ui/package.json

    - name: Cache UI dependencies
      if: *eligible-suite
      id: cache-ui
      uses: ./.github/actions/cache-ui-dependencies

    - name: Install UI dependencies
      if: env.CI_RUN_SUITE == 'true' && (steps.cache-ui.outputs.cache-hit != 'true')
      run: make -C ui deps

    - name: Skip UI deps on cache hit
      if: env.CI_RUN_SUITE == 'true' && (steps.cache-ui.outputs.cache-hit == 'true')
      run: touch ui/deps

    - name: UI Component Tests
      if: *eligible-suite
      uses: cypress-io/github-action@dace029018fcdf86e0df89a31bc3cfa5b32570d8 # ratchet:cypress-io/github-action@v7
      with:
        working-directory: ui/apps/platform
        install: false
        command: npm run test-component -- --browser chrome

    - name: Upload Cypress test result artifacts
      uses: ./.github/actions/upload-artifact-with-retry
      if: always() && env.CI_RUN_SUITE == 'true'
      with:
        name: Cypress test results
        path: ui/apps/platform/cypress/test-results/

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && env.CI_RUN_SUITE == 'true'
      with:
        paths: 'ui/apps/platform/cypress/test-results/reports/**/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled()) && env.CI_RUN_SUITE == 'true'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'ui/apps/platform/cypress/test-results/reports'

  local-roxctl-tests:
    name: >-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}local-roxctl-tests
    needs: detect-changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CI_RUN_SUITE: ${{ needs.detect-changes.result == 'success' && !needs.detect-changes.outputs.ui_only }}
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    container:
      image: quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11@sha256:df3459cf038e73775314b3a5d36d14dda41e6df438a0273c9efa8d23e0f2358a # ratchet:quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11
      volumes:
        - /usr:/mnt/usr
        - /opt:/mnt/opt
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1

    - name: Checkout
      if: *eligible-suite
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: ./.github/actions/job-preamble
      if: *eligible-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Cache Go dependencies
      if: *eligible-suite
      uses: ./.github/actions/cache-go-dependencies

    - uses: ./.github/actions/handle-tagged-build
      if: *eligible-suite

    - name: Local roxctl tests
      if: *eligible-suite
      run: ./scripts/ci/jobs/local-roxctl-tests.sh

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && env.CI_RUN_SUITE == 'true'
      with:
        paths: 'roxctl-test-output/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled()) && env.CI_RUN_SUITE == 'true'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'roxctl-test-output'

  shell-unit-tests:
    name: >-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}shell-unit-tests
    needs: detect-changes
    if: ${{ !cancelled() }}
    env:
      CI_RUN_SUITE: >-
        ${{ needs.detect-changes.result == 'success' && !needs.detect-changes.outputs.ui_only }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    container:
      image: quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11@sha256:df3459cf038e73775314b3a5d36d14dda41e6df438a0273c9efa8d23e0f2358a # ratchet:quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1

    - name: Checkout
      if: *eligible-suite
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: ./.github/actions/job-preamble
      if: *eligible-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Shell Unit Tests
      if: *eligible-suite
      run: make shell-unit-tests

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && env.CI_RUN_SUITE == 'true'
      with:
        paths: 'shell-test-output/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled()) && env.CI_RUN_SUITE == 'true'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'shell-test-output'

  openshift-ci-unit-tests:
    name: >-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}openshift-ci-unit-tests
    needs: detect-changes
    if: ${{ !cancelled() }}
    env:
      CI_RUN_SUITE: >-
        ${{ needs.detect-changes.result == 'success' && !needs.detect-changes.outputs.ui_only }}
    runs-on: ubuntu-24.04
    container:
      image: quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11@sha256:df3459cf038e73775314b3a5d36d14dda41e6df438a0273c9efa8d23e0f2358a # ratchet:quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11
    steps:
      - name: Require change detection
        if: needs.detect-changes.result == 'failure'
        run: |
          echo "Change detection failed; suite eligibility is unknown." >&2
          exit 1

      - name: Checkout
        if: *eligible-suite
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/job-preamble
        if: *eligible-suite
        with:
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

      - name: OpenShift CI Wrapper Unit Tests
        if: *eligible-suite
        run: make -C .openshift-ci test

  sensor-integration-tests:
    name: >-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}sensor-integration-tests
    needs: [detect-changes, ci-selection]
    # Explicit status handling keeps planner failures from suppressing tests.
    if: ${{ !cancelled() }}
    env:
      CI_RUN_SUITE: >-
        ${{ (github.event_name != 'pull_request' ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ci-dispatcher-enforce') &&
        (needs.ci-selection.result != 'success' ||
         (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce')) ||
         !needs.detect-changes.outputs.ui_only) }}
      KUBECONFIG: "/tmp/kubeconfig"
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Checkout
      if: *eligible-suite
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Select CI job
      if: *eligible-suite
      id: ci-decision
      env:
        CI_SELECT_PLANNER_RESULT: ${{ needs.ci-selection.result }}
        CI_SELECT_DECISIONS: ${{ needs.ci-selection.outputs.decisions }}
      run: bash ci/select/gha-consume.sh sensor-integration-tests

    - uses: ./.github/actions/job-preamble
      if: *eligible-selected-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Cache Go dependencies
      if: *eligible-selected-suite
      uses: ./.github/actions/cache-go-dependencies

    - name: Login to Quay.io
      if: *eligible-selected-suite
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

    - name: Create k8s Kind Cluster
      if: *eligible-selected-suite
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # ratchet:helm/kind-action@v1.15.0
      with:
        kubeconfig: "${{ env.KUBECONFIG }}"

    - name: Load test images into Kind
      if: *eligible-selected-suite
      run: |
        source scripts/lib.sh
        # Read images from prefetch list (single source of truth)
        while IFS= read -r image; do
          # Skip empty lines and comments
          [[ -z "$image" || "$image" =~ ^# ]] && continue
          echo "Loading $image into Kind..."
          # Pull directly inside Kind node to avoid docker save/import issues with multi-arch
          # This bypasses the problematic "kind load docker-image" which uses --all-platforms
          # GitHub Actions runners are linux/amd64, so we only need that platform
          # Use --user flag to pass quay.io credentials to ctr
          retry 5 true docker exec chart-testing-control-plane ctr -n k8s.io images pull \
            --user "${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}:${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}" \
            --platform linux/amd64 \
            "$image"
        done < sensor/tests/images-to-prefetch.txt

    - name: Run sensor integration tests
      if: *eligible-selected-suite
      run: make sensor-integration-test

    - name: Generate junit report
      if: always() && env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
      run: make generate-junit-reports

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always() && env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
      with:
        paths: 'junit-reports/report.xml'

    # Jira observes the final job status, including setup and test failures.
    - name: Report junit failures in jira
      if: (!cancelled()) && env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'junit-reports'

  slack-on-unit-tests-failure:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_CI_INTEGRATION_TESTING_WEBHOOK: ${{ secrets.SLACK_CI_INTEGRATION_TESTING_WEBHOOK }}
      TEST_FAILURES_NOTIFY_WEBHOOK: ${{ secrets.TEST_FAILURES_NOTIFY_WEBHOOK }}
    if: |
      failure() && (
          github.event_name == 'push' ||
          contains(github.event.pull_request.labels.*.name, 'ci-test-github-action-slack-messages')
      )
    name: Post failure message to Slack
    runs-on: ubuntu-24.04
    needs:
      - go
      - go-bench
      - go-postgres
      - local-roxctl-tests
      - openshift-ci-unit-tests
      - sensor-integration-tests
      - shell-unit-tests
      - ui
      - ui-component
    permissions:
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Slack message
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
        mention_author: true
      run: |
        source scripts/ci/lib.sh
        slack_workflow_failure
