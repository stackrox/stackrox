# Disposable label/check aggregation experiment. Do not merge.
---
name: Unit Tests
concurrency:
  group: |-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ci-dispatcher-enforce' &&
      format('ignored-label-{0}', github.run_id) ||
      github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  BUILD_TAG: 0.0.0
  SHORTCOMMIT: '0000000'
jobs:
  ci-selection:
    name: ACS CI selection
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' &&
      github.event.action != 'unlabeled') || github.event.label.name == 'ci-dispatcher-enforce'
    uses: "./.github/workflows/ci-selection.yaml"
  detect-changes:
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' &&
      github.event.action != 'unlabeled') || github.event.label.name == 'ci-dispatcher-enforce'
    uses: "./.github/workflows/detect-changes.yml"
    with:
      run_all: |
        ^Makefile$
        ^make/
        ^.github/workflows/unit-tests.yaml$
        ^.github/actions/job-preamble/
  go:
    needs:
    - detect-changes
    - ci-selection
    if: "!cancelled() && (github.event_name != 'pull_request' || (github.event.action
      != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name
      == 'ci-dispatcher-enforce')"
    strategy:
      fail-fast: false
      matrix:
        gotags:
        - GOTAGS=""
        - GOTAGS=release
        exclude:
        - gotags: "${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name,
            'ci-release-build') && 'GOTAGS=release' }}"
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
    - name: Select CI job
      id: ci-decision
      env:
        CI_SELECT_PLANNER_RESULT: "${{ needs.ci-selection.result }}"
        CI_SELECT_DECISIONS: "${{ needs.ci-selection.outputs.decisions }}"
      run: bash ci/select/gha-consume.sh go
    - name: 'Label/check probe: fail'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: fail"
        echo "This failure is intentional."
        exit 1
      if: steps.ci-decision.outputs.action != 'skip'
  go-postgres:
    needs:
    - detect-changes
    - ci-selection
    if: "!cancelled() && (github.event_name != 'pull_request' || (github.event.action
      != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name
      == 'ci-dispatcher-enforce')"
    strategy:
      fail-fast: false
      matrix:
        gotags:
        - GOTAGS=""
        - GOTAGS=release
        pg:
        - '16'
        exclude:
        - gotags: "${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name,
            'ci-release-build') && 'GOTAGS=release' }}"
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: testpassword
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
    - name: Select CI job
      id: ci-decision
      env:
        CI_SELECT_PLANNER_RESULT: "${{ needs.ci-selection.result }}"
        CI_SELECT_DECISIONS: "${{ needs.ci-selection.outputs.decisions }}"
      run: bash ci/select/gha-consume.sh go-postgres
    - name: 'Label/check probe: hold'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: hold"
        echo "Holding this check in progress for ten minutes, then failing."
        sleep 600
        exit 1
      if: steps.ci-decision.outputs.action != 'skip'
  go-bench:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}go-bench
    needs:
    - detect-changes
    - ci-selection
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-24.04
    env:
      CI_RUN_SUITE: |-
        ${{ (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci-dispatcher-enforce') && (needs.ci-selection.result != 'success' ||
         (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce')) ||
         !needs.detect-changes.outputs.ui_only) }}
    steps:
    - name: Checkout
      if: env.CI_RUN_SUITE == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
    - name: Select CI job
      id: ci-decision
      if: env.CI_RUN_SUITE == 'true'
      env:
        CI_SELECT_PLANNER_RESULT: "${{ needs.ci-selection.result }}"
        CI_SELECT_DECISIONS: "${{ needs.ci-selection.outputs.decisions }}"
      run: bash ci/select/gha-consume.sh go-bench
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: env.CI_RUN_SUITE == 'true' && steps.ci-decision.outputs.action != 'skip'
  ui:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}ui
    needs: detect-changes
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-24.04
    env:
      CI_RUN_SUITE: |-
        ${{ needs.detect-changes.result == 'success' && (!needs.detect-changes.outputs.files ||
         contains(needs.detect-changes.outputs.files, '^ui/') ||
         contains(needs.detect-changes.outputs.files, '^.github/actions/cache-ui-dependencies/')) }}
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: env.CI_RUN_SUITE == 'true'
  ui-component:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}ui-component
    needs: detect-changes
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-24.04
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: env.CI_RUN_SUITE == 'true'
    env:
      CI_RUN_SUITE: "${{ needs.detect-changes.result == 'success' && (!needs.detect-changes.outputs.files
        || contains(needs.detect-changes.outputs.files, '^ui/') || contains(needs.detect-changes.outputs.files,
        '^.github/actions/cache-ui-dependencies/')) }}"
  local-roxctl-tests:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}local-roxctl-tests
    needs: detect-changes
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-24.04
    env:
      CI_RUN_SUITE: "${{ needs.detect-changes.result == 'success' && !needs.detect-changes.outputs.ui_only
        }}"
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: env.CI_RUN_SUITE == 'true'
  shell-unit-tests:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}shell-unit-tests
    needs: detect-changes
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-24.04
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: env.CI_RUN_SUITE == 'true'
    env:
      CI_RUN_SUITE: "${{ needs.detect-changes.result == 'success' && (!needs.detect-changes.outputs.ui_only)
        }}"
  openshift-ci-unit-tests:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}openshift-ci-unit-tests
    needs: detect-changes
    if: "${{ !cancelled() }}"
    runs-on: ubuntu-24.04
    steps:
    - name: Require change detection
      if: needs.detect-changes.result == 'failure'
      run: |
        echo "Change detection failed; suite eligibility is unknown." >&2
        exit 1
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: env.CI_RUN_SUITE == 'true'
    env:
      CI_RUN_SUITE: "${{ needs.detect-changes.result == 'success' && (!needs.detect-changes.outputs.ui_only)
        }}"
  sensor-integration-tests:
    name: |-
      ${{ github.event.label.name && github.event.label.name != 'ci-dispatcher-enforce'
          && 'ignored-label-' || '' }}sensor-integration-tests
    needs:
    - detect-changes
    - ci-selection
    if: "${{ !cancelled() }}"
    env:
      KUBECONFIG: "/tmp/kubeconfig"
      CI_RUN_SUITE: |-
        ${{ (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci-dispatcher-enforce') && (needs.ci-selection.result != 'success' ||
         (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce')) ||
         !needs.detect-changes.outputs.ui_only) }}
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      if: env.CI_RUN_SUITE == 'true'
    - name: Select CI job
      id: ci-decision
      env:
        CI_SELECT_PLANNER_RESULT: "${{ needs.ci-selection.result }}"
        CI_SELECT_DECISIONS: "${{ needs.ci-selection.outputs.decisions }}"
      run: bash ci/select/gha-consume.sh sensor-integration-tests
      if: env.CI_RUN_SUITE == 'true'
    - name: 'Label/check probe: pass'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        record = {"action": event.get("action"), "label": event.get("label", {}).get("name"), "head_sha": event.get("pull_request", {}).get("head", {}).get("sha"), "tested_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "job": os.environ["GITHUB_JOB"]}
        print(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("```json\n" + json.dumps(record, indent=2) + "\n```\n")
        PY
        echo "Probe outcome: pass"
      if: env.CI_RUN_SUITE == 'true' && (steps.ci-decision.outputs.action != 'skip')
'on':
  push:
    tags:
    - "*"
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - labeled
    - unlabeled
