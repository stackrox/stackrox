name: Unit Tests
on:
  push:
    tags:
    - '*'
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - labeled
    - unlabeled

concurrency:
  # Ignored label events must not cancel or replace a pending test run.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ci-dispatcher-enforce' &&
      format('ignored-label-{0}', github.run_id) ||
      github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Stable version ldflags for test caching: Go's test cache keys include
  # link ActionID which includes -X ldflags. Fixed BUILD_TAG/SHORTCOMMIT
  # prevent per-commit cache misses.
  BUILD_TAG: 0.0.0
  SHORTCOMMIT: "0000000"

jobs:
  detect-changes:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-dispatcher-enforce'
    uses: ./.github/workflows/detect-changes.yml
    with:
      run_all: |
        ^Makefile$
        ^make/
        ^.github/workflows/unit-tests.yaml$
        ^.github/actions/job-preamble/

  go:
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        gotags: [ 'GOTAGS=""', 'GOTAGS=release' ]
        exclude:
          - gotags: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-release-build') && 'GOTAGS=release' }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        # The three-dot PR diff needs the base and head histories.
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    - name: Select CI job
      id: ci-decision
      if: github.event_name == 'pull_request'
      uses: ./.github/actions/ci-select
      with:
        job: go

    - name: Run Go test suite
      if: always() && steps.ci-decision.outputs.action != 'skip'
      uses: ./.github/actions/go-suite
      with:
        gotags: ${{ matrix.gotags }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        codecov-token: ${{ secrets.CODECOV_TOKEN }}

    # Jira needs the final job status after the composite completes.
    - name: Report test failures to Jira
      if: (!cancelled()) && steps.ci-decision.outputs.action != 'skip'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'junit-reports'

  go-postgres:
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        gotags: [ 'GOTAGS=""', 'GOTAGS=release' ]
        pg: [ '16' ]
        exclude:
          - gotags: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-release-build') && 'GOTAGS=release' }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    env:
      POSTGRES_PASSWORD: testpassword
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        # The three-dot PR diff needs the base and head histories.
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    - name: Select CI job
      id: ci-decision
      if: github.event_name == 'pull_request'
      uses: ./.github/actions/ci-select
      with:
        job: go-postgres

    - name: Run PostgreSQL test suite
      if: always() && steps.ci-decision.outputs.action != 'skip'
      uses: ./.github/actions/go-postgres-suite
      with:
        gotags: ${{ matrix.gotags }}
        postgres-version: ${{ matrix.pg }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        codecov-token: ${{ secrets.CODECOV_TOKEN }}

    # Jira needs the final job status after the composite completes.
    - name: Report junit failures in jira
      if: (!cancelled()) && steps.ci-decision.outputs.action != 'skip'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'junit-reports'

  # Benchmarks run each bench function once (-benchtime=1x -count=1) to verify
  # they compile and execute without errors. A single postgres version is
  # sufficient since go-postgres already tests against multiple versions.
  go-bench:
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce')) ||
      !needs.detect-changes.outputs.ui_only
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        # The three-dot PR diff needs the base and head histories.
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    - name: Select CI job
      id: ci-decision
      if: github.event_name == 'pull_request'
      uses: ./.github/actions/ci-select
      with:
        job: go-bench

    - name: Run PostgreSQL benchmark suite
      if: always() && steps.ci-decision.outputs.action != 'skip'
      uses: ./.github/actions/go-bench-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

  ui:
    needs: detect-changes
    if: >-
      !needs.detect-changes.outputs.files ||
      contains(needs.detect-changes.outputs.files, '^ui/') ||
      contains(needs.detect-changes.outputs.files, '^.github/actions/cache-ui-dependencies/')
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
      with:
        node-version-file: ui/package.json

    - name: Cache UI dependencies
      id: cache-ui
      uses: ./.github/actions/cache-ui-dependencies

    - name: Install UI dependencies
      if: steps.cache-ui.outputs.cache-hit != 'true'
      run: make -C ui deps

    - name: Skip UI deps on cache hit
      if: steps.cache-ui.outputs.cache-hit == 'true'
      run: touch ui/deps

    - name: UI Unit Tests
      run: make ui-test

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: 'ui/apps/platform/test-results/reports/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled())
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'ui/apps/platform/test-results/reports'

  ui-component:
    needs: detect-changes
    if: >-
      !needs.detect-changes.outputs.files ||
      contains(needs.detect-changes.outputs.files, '^ui/') ||
      contains(needs.detect-changes.outputs.files, '^.github/actions/cache-ui-dependencies/')
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
      with:
        node-version-file: ui/package.json

    - name: Cache UI dependencies
      id: cache-ui
      uses: ./.github/actions/cache-ui-dependencies

    - name: Install UI dependencies
      if: steps.cache-ui.outputs.cache-hit != 'true'
      run: make -C ui deps

    - name: Skip UI deps on cache hit
      if: steps.cache-ui.outputs.cache-hit == 'true'
      run: touch ui/deps

    - name: UI Component Tests
      uses: cypress-io/github-action@dace029018fcdf86e0df89a31bc3cfa5b32570d8 # ratchet:cypress-io/github-action@v7
      with:
        working-directory: ui/apps/platform
        install: false
        command: npm run test-component -- --browser chrome

    - name: Upload Cypress test result artifacts
      uses: ./.github/actions/upload-artifact-with-retry
      if: always()
      with:
        name: Cypress test results
        path: ui/apps/platform/cypress/test-results/

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: 'ui/apps/platform/cypress/test-results/reports/**/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled())
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'ui/apps/platform/cypress/test-results/reports'

  local-roxctl-tests:
    needs: detect-changes
    if: ${{ !needs.detect-changes.outputs.ui_only }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    container:
      image: quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11@sha256:df3459cf038e73775314b3a5d36d14dda41e6df438a0273c9efa8d23e0f2358a # ratchet:quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11
      volumes:
        - /usr:/mnt/usr
        - /opt:/mnt/opt
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Cache Go dependencies
      uses: ./.github/actions/cache-go-dependencies

    - uses: ./.github/actions/handle-tagged-build

    - name: Local roxctl tests
      run: ./scripts/ci/jobs/local-roxctl-tests.sh

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: 'roxctl-test-output/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled())
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'roxctl-test-output'

  shell-unit-tests:
    needs: detect-changes
    if: ${{ !needs.detect-changes.outputs.ui_only }}
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    container:
      image: quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11@sha256:df3459cf038e73775314b3a5d36d14dda41e6df438a0273c9efa8d23e0f2358a # ratchet:quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Shell Unit Tests
      run: make shell-unit-tests

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: 'shell-test-output/*.xml'

    - name: Report junit failures in jira
      if: (!cancelled())
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'shell-test-output'

  openshift-ci-unit-tests:
    needs: detect-changes
    if: ${{ !needs.detect-changes.outputs.ui_only }}
    runs-on: ubuntu-24.04
    container:
      image: quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11@sha256:df3459cf038e73775314b3a5d36d14dda41e6df438a0273c9efa8d23e0f2358a # ratchet:quay.io/stackrox-io/apollo-ci:stackrox-test-0.5.11
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/job-preamble
        with:
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

      - name: OpenShift CI Wrapper Unit Tests
        run: make -C .openshift-ci test

  sensor-integration-tests:
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce')) ||
      !needs.detect-changes.outputs.ui_only
    env:
      KUBECONFIG: "/tmp/kubeconfig"
    runs-on: ubuntu-24.04
    outputs:
      new-jiras: ${{ steps.junit2jira.outputs.new-jiras }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        # The three-dot PR diff needs the base and head histories.
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    - name: Select CI job
      id: ci-decision
      if: github.event_name == 'pull_request'
      uses: ./.github/actions/ci-select
      with:
        job: sensor-integration-tests

    - name: Run Sensor integration suite
      if: always() && steps.ci-decision.outputs.action != 'skip'
      uses: ./.github/actions/sensor-integration-suite
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        quay-username: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        quay-password: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}

    # Jira needs the final job status after the composite completes.
    - name: Report junit failures in jira
      if: (!cancelled()) && steps.ci-decision.outputs.action != 'skip'
      id: junit2jira
      uses: ./.github/actions/junit2jira
      with:
        create-jiras: ${{ github.event_name == 'push' }}
        jira-user: ${{ secrets.JIRA_USER }}
        jira-token: ${{ secrets.JIRA_TOKEN }}
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
        directory: 'junit-reports'

  slack-on-unit-tests-failure:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_CI_INTEGRATION_TESTING_WEBHOOK: ${{ secrets.SLACK_CI_INTEGRATION_TESTING_WEBHOOK }}
      TEST_FAILURES_NOTIFY_WEBHOOK: ${{ secrets.TEST_FAILURES_NOTIFY_WEBHOOK }}
    if: |
      failure() && (
          github.event_name == 'push' ||
          contains(github.event.pull_request.labels.*.name, 'ci-test-github-action-slack-messages')
      )
    name: Post failure message to Slack
    runs-on: ubuntu-24.04
    needs:
      - go
      - go-bench
      - go-postgres
      - local-roxctl-tests
      - openshift-ci-unit-tests
      - sensor-integration-tests
      - shell-unit-tests
      - ui
      - ui-component
    permissions:
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Slack message
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
        mention_author: true
      run: |
        source scripts/ci/lib.sh
        slack_workflow_failure
