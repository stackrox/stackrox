name: Style
on:
  push:
    tags:
    - '*'
    branches:
    - master
    - release-*
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - labeled
    - unlabeled
env:
  ROX_PRODUCT_BRANDING: RHACS_BRANDING

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  check-generated-files:
    needs: detect-changes
    if: ${{ !needs.detect-changes.outputs.ui_only }}
    env:
      CI_FILE_FACTS: ${{ needs.detect-changes.outputs.facts || '{}' }}
      ARTIFACT_DIR: junit-reports/
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Explain selection
      id: selection
      continue-on-error: true
      uses: ./.github/actions/ci-selection-summary
      with:
        candidate: >-
          ${{ !fromJSON(env.CI_FILE_FACTS).complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'ci-run-all-tests') ||
          contains(fromJSON(env.CI_FILE_FACTS).any, 'broad') ||
          contains(fromJSON(env.CI_FILE_FACTS).any, 'proto') ||
          contains(fromJSON(env.CI_FILE_FACTS).any, 'go') }}
        enforced: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce') }}

    - name: "CI selection: ${{ steps.selection.outputs.decision || 'unavailable' }} | ${{ steps.selection.outputs.target || github.job }} | candidate=${{ steps.selection.outputs.candidate }} | eligible=${{ steps.selection.outputs.eligible }} | enforced=${{ steps.selection.outputs.enforced }}"
      id: selection-record
      if: ${{ !cancelled() }}
      run: ':'

    - uses: ./.github/actions/job-preamble
      if: steps.selection.outputs.run != 'false'
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Create artifacts dir
      if: steps.selection.outputs.run != 'false'
      run: mkdir -p "$ARTIFACT_DIR"

    # No GOCACHE here — this job must validate go.mod/go.sum against
    # real source files, not a cached module index that may be stale.

    - name: Download scanner module for proto generation
      if: steps.selection.outputs.run != 'false'
      run: go mod download github.com/stackrox/scanner

    - name: Check Generated
      if: steps.selection.outputs.run != 'false'
      run: scripts/ci/jobs/check-generated.sh

  misc-checks:
    env:
      ARTIFACT_DIR: junit-reports/
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: ./.github/actions/job-preamble
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Create artifacts dir
      run: mkdir -p "$ARTIFACT_DIR"

    - name: Ensure no trailing whitespaces
      if: github.event_name == 'pull_request'
      # Markdown files aren't checked for trailing whitespaces because it's a valid linebreak there.
      # Batch files are excluded because they are generated (e.g. gradle wrapper) and use Windows line endings.
      run: git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD ':(exclude)*.md' ':(exclude)*.bat'

    - name: Check PR fixes
      run: scripts/ci/jobs/check-pr-fixes.sh

    - name: Check TODOs
      run: scripts/ci/jobs/check-todos.sh

    - name: Check Policies
      run: scripts/ci/jobs/policy-checks.sh

    - name: Check Konflux setup
      run: scripts/ci/jobs/check-konflux-setup.sh

    - name: Check build & test image versions
      run: scripts/ci/jobs/check-image-version.sh

    - name: Check dependabot knows about pinned prefetched images
      run: scripts/ci/jobs/check-dependabot-pinned-image.sh

    - name: Check dependabot gomod configurations match go.mod files
      run: if [ -s scripts/ci/jobs/check-dependabot-gomod.sh ]; then scripts/ci/jobs/check-dependabot-gomod.sh; fi

  style-check:
    needs: detect-changes
    runs-on: ubuntu-24.04
    env:
      CI_FILE_FACTS: ${{ needs.detect-changes.outputs.facts || '{}' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Explain selection
        id: selection
        continue-on-error: true
        uses: ./.github/actions/ci-selection-summary
        with:
          candidate: >-
            ${{ true }}
          enforced: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce') }}

      - name: "CI selection: ${{ steps.selection.outputs.decision || 'unavailable' }} | ${{ steps.selection.outputs.target || github.job }} | candidate=${{ steps.selection.outputs.candidate }} | eligible=${{ steps.selection.outputs.eligible }} | enforced=${{ steps.selection.outputs.enforced }}"
        id: selection-record
        if: ${{ !cancelled() }}
        run: ':'

      - uses: ./.github/actions/job-preamble
        with:
          free-disk-space: '30'
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
        with:
          node-version-file: ui/package.json

      - name: Install xmlstarlet for shellcheck output to junit
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xmlstarlet

      - name: Install pycodestyle
        run: |
          python3 -m pip install -r .openshift-ci/dev-requirements.txt

      - name: Verify tools
        run: |
          yq --version
          xmlstarlet --version
          pycodestyle --version

      - name: Cache Go dependencies
        uses: ./.github/actions/cache-go-dependencies

      - name: Download scanner module for proto generation
        run: go mod download github.com/stackrox/scanner

      - name: Cache UI dependencies
        id: cache-ui
        uses: ./.github/actions/cache-ui-dependencies

      - name: Cache QA Test dependencies
        uses: ./.github/actions/cache-gradle-dependencies

      - name: Fetch UI deps
        if: steps.cache-ui.outputs.cache-hit != 'true'
        run: make -C ui deps

      - name: Skip UI deps on cache hit
        if: steps.cache-ui.outputs.cache-hit == 'true'
        run: touch ui/deps

      - name: Cache ESLint results
        uses: ./.github/actions/cache-eslint

      - name: make style-slim
        run: make style-slim

  golangci-lint:
    needs: detect-changes
    if: ${{ !needs.detect-changes.outputs.ui_only }}
    timeout-minutes: 240
    runs-on: ubuntu-24.04
    env:
      CI_FILE_FACTS: ${{ needs.detect-changes.outputs.facts || '{}' }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Explain selection
      id: selection
      continue-on-error: true
      uses: ./.github/actions/ci-selection-summary
      with:
        candidate: >-
          ${{ !fromJSON(env.CI_FILE_FACTS).complete ||
          needs.detect-changes.outputs.run_all == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'ci-run-all-tests') ||
          contains(fromJSON(env.CI_FILE_FACTS).any, 'broad') ||
          contains(fromJSON(env.CI_FILE_FACTS).any, 'proto') ||
          contains(fromJSON(env.CI_FILE_FACTS).any, 'go-lint') }}
        enforced: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce') }}

    - name: "CI selection: ${{ steps.selection.outputs.decision || 'unavailable' }} | ${{ steps.selection.outputs.target || github.job }} | candidate=${{ steps.selection.outputs.candidate }} | eligible=${{ steps.selection.outputs.eligible }} | enforced=${{ steps.selection.outputs.enforced }}"
      id: selection-record
      if: ${{ !cancelled() }}
      run: ':'

    - uses: ./.github/actions/job-preamble
      if: steps.selection.outputs.run != 'false'
      with:
        gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

    - name: Check Cache golangci-lint
      if: steps.selection.outputs.run != 'false'
      run: make golangci-lint-cache-status

    - name: Cache golangci-lint
      if: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && steps.selection.outputs.run != 'false' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
      with:
        path: ${{ env.HOME }}/.cache/golangci-lint
        key: go-lint-v2-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-lint-v2-

    - name: Restore golangci-lint analysis cache
      if: ${{ (!(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) && steps.selection.outputs.run != 'false' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6
      with:
        path: ${{ env.HOME }}/.cache/golangci-lint
        key: go-lint-v2-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-lint-v2-

    - name: Check cache golangci-lint
      if: steps.selection.outputs.run != 'false'
      run: make golangci-lint-cache-status

    - name: Check Go version is in sync in .golangci.yml and go.mod
      if: steps.selection.outputs.run != 'false'
      run: |
        [ "$(awk '/^go /{print $2}' go.mod | cut -d. -f 1-2)" = "$(yq e .run.go .golangci.yml)" ]

    - name: make golangci-lint
      if: steps.selection.outputs.run != 'false'
      run: make golangci-lint

    - name: Check Cache golangci-lint
      if: steps.selection.outputs.run != 'false'
      run: make golangci-lint-cache-status

  check-dependent-images-exist:
    needs: detect-changes
    if: ${{ !needs.detect-changes.outputs.ui_only }}
    # This job ensures that COLLECTOR_VERSION or FACT_VERSION files cannot be updated to a version
    # for which the image was not successfully built on Konflux (suffix "-fast"). It also verifies that GHA-built image
    # is there (no suffix) so that the failure also happens in this job.
    runs-on: ubuntu-24.04
    env:
      CI_FILE_FACTS: ${{ needs.detect-changes.outputs.facts || '{}' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Explain selection
        id: selection
        continue-on-error: true
        uses: ./.github/actions/ci-selection-summary
        with:
          candidate: >-
            ${{ !fromJSON(env.CI_FILE_FACTS).complete ||
            needs.detect-changes.outputs.run_all == 'true' ||
            contains(github.event.pull_request.labels.*.name, 'ci-run-all-tests') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'broad') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'proto') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'image-versions') }}
          enforced: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce') }}

      - name: "CI selection: ${{ steps.selection.outputs.decision || 'unavailable' }} | ${{ steps.selection.outputs.target || github.job }} | candidate=${{ steps.selection.outputs.candidate }} | eligible=${{ steps.selection.outputs.eligible }} | enforced=${{ steps.selection.outputs.enforced }}"
        id: selection-record
        if: ${{ !cancelled() }}
        run: ':'

      - uses: ./.github/actions/job-preamble
        if: steps.selection.outputs.run != 'false'
        with:
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

      - name: Get image tags from COLLECTOR_|FACT_VERSION file
        if: steps.selection.outputs.run != 'false'
        run: |
          {
            echo "collector_tag=$(make --quiet --no-print-directory collector-tag)"
            echo "fact_tag=$(make --quiet --no-print-directory fact-tag)"
          } >> "$GITHUB_ENV"

      - name: Check GHA-built image exists
        uses: stackrox/actions/release/wait-for-image@9238e423c3ae1ac4eb0f254cbb98da9daae24d86 # ratchet:stackrox/actions/release/wait-for-image@v1
        # Skip for external contributions.
        if: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && steps.selection.outputs.run != 'false' }}
        with:
          token: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
          limit: 300
          image: |
            rhacs-eng/collector:${{ env.collector_tag }}
            rhacs-eng/fact:${{ env.fact_tag }}

      - name: Check Konflux-built image exists
        uses: stackrox/actions/release/wait-for-image@9238e423c3ae1ac4eb0f254cbb98da9daae24d86 # ratchet:stackrox/actions/release/wait-for-image@v1
        # Skip for external contributions.
        if: ${{ (github.event_name == 'push' || !github.event.pull_request.head.repo.fork) && steps.selection.outputs.run != 'false' }}
        with:
          token: ${{ secrets.QUAY_RHACS_ENG_BEARER_TOKEN }}
          limit: 300
          image: |
            rhacs-eng/release-collector:${{ env.collector_tag }}-fast
            rhacs-eng/release-fact:${{ env.fact_tag }}-fast

  github-actions-lint:
    needs: detect-changes
    if: >-
      !needs.detect-changes.outputs.files ||
      contains(needs.detect-changes.outputs.files, '^.github/')
    runs-on: ubuntu-24.04
    env:
      CI_FILE_FACTS: ${{ needs.detect-changes.outputs.facts || '{}' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      - name: Explain selection
        id: selection
        continue-on-error: true
        uses: ./.github/actions/ci-selection-summary
        with:
          candidate: >-
            ${{ !fromJSON(env.CI_FILE_FACTS).complete ||
            needs.detect-changes.outputs.run_all == 'true' ||
            contains(github.event.pull_request.labels.*.name, 'ci-run-all-tests') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'broad') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'proto') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'gha') }}
          enforced: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce') }}

      - name: "CI selection: ${{ steps.selection.outputs.decision || 'unavailable' }} | ${{ steps.selection.outputs.target || github.job }} | candidate=${{ steps.selection.outputs.candidate }} | eligible=${{ steps.selection.outputs.eligible }} | enforced=${{ steps.selection.outputs.enforced }}"
        id: selection-record
        if: ${{ !cancelled() }}
        run: ':'

      - uses: ./.github/actions/job-preamble
        if: steps.selection.outputs.run != 'false'
        with:
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
      - name: Check workflow files
        if: steps.selection.outputs.run != 'false'
        run: make github-actions-lint

  github-actions-shellcheck:
    needs: detect-changes
    if: >-
      !needs.detect-changes.outputs.files ||
      contains(needs.detect-changes.outputs.files, '^.github/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
      - uses: ./.github/actions/job-preamble
        with:
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}
      - name: Check scripts with shellcheck
        run: shellcheck -P SCRIPTDIR -x ./.github/workflows/scripts/*.sh

  openshift-ci-lint:
    needs: detect-changes
    if: >-
      !needs.detect-changes.outputs.files ||
      contains(needs.detect-changes.outputs.files, '^.openshift-ci/')
    runs-on: ubuntu-24.04
    env:
      CI_FILE_FACTS: ${{ needs.detect-changes.outputs.facts || '{}' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Explain selection
        id: selection
        continue-on-error: true
        uses: ./.github/actions/ci-selection-summary
        with:
          candidate: >-
            ${{ !fromJSON(env.CI_FILE_FACTS).complete ||
            needs.detect-changes.outputs.run_all == 'true' ||
            contains(github.event.pull_request.labels.*.name, 'ci-run-all-tests') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'broad') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'proto') ||
            contains(fromJSON(env.CI_FILE_FACTS).any, 'prow') }}
          enforced: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-dispatcher-enforce') }}

      - name: "CI selection: ${{ steps.selection.outputs.decision || 'unavailable' }} | ${{ steps.selection.outputs.target || github.job }} | candidate=${{ steps.selection.outputs.candidate }} | eligible=${{ steps.selection.outputs.eligible }} | enforced=${{ steps.selection.outputs.enforced }}"
        id: selection-record
        if: ${{ !cancelled() }}
        run: ':'

      - uses: ./.github/actions/job-preamble
        if: steps.selection.outputs.run != 'false'
        with:
          gcp-account: ${{ secrets.GCP_SERVICE_ACCOUNT_STACKROX_CI }}

      - name: Install Python linters
        if: steps.selection.outputs.run != 'false'
        run: python3 -m pip install -r .openshift-ci/dev-requirements.txt

      - name: pycodestyle
        if: steps.selection.outputs.run != 'false'
        run: make -C .openshift-ci style

      - name: Pylint
        if: steps.selection.outputs.run != 'false'
        run: make -C .openshift-ci lint

  slack-on-style-failure:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_CI_INTEGRATION_TESTING_WEBHOOK: ${{ secrets.SLACK_CI_INTEGRATION_TESTING_WEBHOOK }}
      TEST_FAILURES_NOTIFY_WEBHOOK: ${{ secrets.TEST_FAILURES_NOTIFY_WEBHOOK }}
    if: |
      failure() && (
          github.event_name == 'push' ||
          contains(github.event.pull_request.labels.*.name, 'ci-test-github-action-slack-messages')
      )
    name: Post failure message to Slack
    runs-on: ubuntu-24.04
    needs:
      - check-generated-files
      - misc-checks
      - style-check
      - golangci-lint
      - check-dependent-images-exist
      - github-actions-lint
      - github-actions-shellcheck
      - openshift-ci-lint
    permissions:
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - name: Slack message
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
      run: |
        source scripts/ci/lib.sh
        slack_workflow_failure
