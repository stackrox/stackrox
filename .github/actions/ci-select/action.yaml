name: Select CI job
description: Build the selector and report or apply the PR decision before expensive setup
inputs:
  job:
    description: Enrolled job name
    required: true
outputs:
  action:
    description: run or skip (selection errors run the job)
    value: ${{ steps.gate.outputs.action }}
runs:
  using: composite
  steps:
    - name: Build CI selector
      id: build
      continue-on-error: true
      shell: bash
      run: GOTOOLCHAIN=auto ci/select/build.sh
    - name: Read CI selection
      id: gate
      shell: bash
      env:
        CI_SELECT_JOB: ${{ inputs.job }}
        CI_SELECT_BUILD_OUTCOME: ${{ steps.build.outcome }}
      run: ci/select/gha-gate.sh "$CI_SELECT_JOB"
