name: e2e-db-backup-restore-tests

inputs:
  tag:
    type: string
    required: true
  kubeconfig:
    description: File location of cluster kubeconfig
    type: string
    required: false
    default: ~/.kube/config

runs:
  using: "composite"
  env:
    MAIN_IMAGE_TAG: ${{ inputs.tag }}
    BUILD_TAG: ${{ inputs.tag }}
    CI_JOB_NAME: e2e-db-backup-restore-tests
    ARTIFACT_DIR: ./junit-reports
    ROX_SCANNER_V4: true
    # Scanner v4's matcher gates readiness on the vuln bundle load. The lib
    # default (9 sources) takes ~30 min on KinD's capped CPU and stalls the
    # deploy, so KinD-v4 uses the configurable scanner_v4_allowlist input
    # (default 'alpine', <1 min); jobs needing more sources override it. GKE
    # keeps the tests/e2e/lib.sh default. (Empty -> that default.)
    SCANNER_V4_CI_VULN_BUNDLE_ALLOWLIST: alpine
    PYTHONUNBUFFERED: "1"
    # Both cluster types expose Central via a LoadBalancer service. On KinD,
    # cloud-provider-kind (started by create-kind-cluster) assigns the service
    # a real, host-reachable IP, so the deploy + wait_for_api path is identical
    # to GKE with no port-forward.
    LOAD_BALANCER: lb
    STORAGE: pvc
    # Running the full stack incl. a scanner (v2 or v4) on one KinD node requires
    # shrinking resource *requests* (so everything schedules) while keeping modest
    # *limits* (ROX_MEMLIMIT -> Go soft GC at 95% of limits.memory, so pods back
    # off instead of OOMing). These overrides only take effect on the Helm deploy
    # path, so a scanner-on KinD run also switches OUTPUT_FORMAT to helm. When
    # scanner=none, KinD stays on the leaner known-good kubectl deploy.
    ROX_CENTRAL_EXTRA_HELM_VALUES_FILE: ${{ format('{0}/deploy/common/ci-minimal-values.yaml', github.workspace) }}
    ROX_SENSOR_EXTRA_HELM_VALUES_FILE: ${{ format('{0}/deploy/common/ci-minimal-secured-values.yaml', github.workspace) }}
    OUTPUT_FORMAT: helm
  steps:

    - name: Verify kubectl access and wait for cluster to stabilize
      timeout-minutes: 5
      run: |
        set +e
        while ! kubectl cluster-info &>/dev/null; do
          sleep 1
        done
        kubectl cluster-info
        kubectl wait --for=condition=Ready nodes --all --timeout=180s
        kubectl get nodes
        scripts/ci/gke.sh wait_for_cluster || true

    - name: Create artifact directory
      run: mkdir -p "$ARTIFACT_DIR"

    # KinD pre-test: the prefetcher/poll above do not apply — images are pre-pulled
    # into the node's containerd by create-kind-cluster (from quay.io/stackrox-io,
    # where PR builds publish) and kubelet pulls any remainder on demand during
    # deploy. Mark images available so downstream junit reporting is accurate.
    - name: Mark images available (KinD)
      run: |
        source scripts/ci/test_state.sh
        touch "${STATE_IMAGES_AVAILABLE}"

    - name: Deploy StackRox and run DB backup/restore test
      env:
        QUAY_RHACS_ENG_RO_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        QUAY_RHACS_ENG_RO_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
        REGISTRY_USERNAME: ${{ secrets.QUAY_RHACS_ENG_RO_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.QUAY_RHACS_ENG_RO_PASSWORD }}
        ORCHESTRATOR_FLAVOR: k8s
      run: |
        source tests/e2e/lib.sh
        source tests/scripts/setup-certs.sh
        source scripts/ci/sensor-wait.sh
        export_test_environment
        setup_deployment_env false false
        deploy_stackrox
        # Persist API_ENDPOINT for post-test steps (ci_export only sets it in this shell)
        echo "API_ENDPOINT=${API_ENDPOINT}" >> "$GITHUB_ENV"
        db_backup_and_restore_test /tmp/db-backup-restore-test

    - name: Run post-test
      if: always()
      shell: python
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from post_tests import CheckStackroxLogs
        CheckStackroxLogs(
            check_for_errors_in_stackrox_logs=True,
            artifact_destination_prefix="db-test",
        ).run(['/tmp/db-backup-restore-test', '${{ env.ARTIFACT_DIR }}'])

    - name: Run final-post
      if: always()
      shell: python
      run: |
        import sys
        sys.path.append('.openshift-ci')
        from post_tests import FinalPost
        FinalPost(store_qa_tests_data=False).run()

    - name: Publish test summary
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: ${{ env.ARTIFACT_DIR }}/**/*.xml
        show: all
