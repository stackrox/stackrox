name: Sensor integration suite
description: Run the complete Sensor integration suite and publish its reports
inputs:
  gcp-account:
    description: Account used to upload test data
    required: true
  quay-username:
    description: Quay pull username
    required: true
  quay-password:
    description: Quay pull password
    required: true
runs:
  using: composite
  # Normal steps require a healthy job as well as a successful composite.
  # The explicit shell keeps the Ubuntu workflow pipeline behavior.
  steps:
    - uses: ./.github/actions/job-preamble
      if: job.status == 'success'
      with:
        gcp-account: ${{ inputs.gcp-account }}

    - name: Cache Go dependencies
      if: job.status == 'success'
      uses: ./.github/actions/cache-go-dependencies

    - name: Login to Quay.io
      if: job.status == 'success'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ inputs.quay-username }}
        password: ${{ inputs.quay-password }}

    - name: Create k8s Kind Cluster
      if: job.status == 'success'
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # ratchet:helm/kind-action@v1.15.0
      with:
        kubeconfig: "${{ env.KUBECONFIG }}"

    - name: Load test images into Kind
      if: job.status == 'success'
      shell: bash -e {0}
      run: |
        source scripts/lib.sh
        # Read images from prefetch list (single source of truth)
        while IFS= read -r image; do
          # Skip empty lines and comments
          [[ -z "$image" || "$image" =~ ^# ]] && continue
          echo "Loading $image into Kind..."
          # Pull directly inside Kind node to avoid docker save/import issues with multi-arch
          # This bypasses the problematic "kind load docker-image" which uses --all-platforms
          # GitHub Actions runners are linux/amd64, so we only need that platform
          # Use --user flag to pass quay.io credentials to ctr
          retry 5 true docker exec chart-testing-control-plane ctr -n k8s.io images pull \
            --user "${{ inputs.quay-username }}:${{ inputs.quay-password }}" \
            --platform linux/amd64 \
            "$image"
        done < sensor/tests/images-to-prefetch.txt

    - name: Run sensor integration tests
      if: job.status == 'success'
      shell: bash -e {0}
      run: make sensor-integration-test

    - name: Generate junit report
      if: always()
      shell: bash -e {0}
      run: make generate-junit-reports

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: 'junit-reports/report.xml'
