name: PostgreSQL test suite
description: Run the complete PostgreSQL test suite and publish its reports
inputs:
  gotags:
    description: Go matrix Make variable assignment
    required: true
  postgres-version:
    description: PostgreSQL matrix version
    required: true
  gcp-account:
    description: Account used to upload test data
    required: true
  codecov-token:
    description: Codecov upload token
    required: true
runs:
  using: composite
  # Normal steps require a healthy job as well as a successful composite.
  # The explicit shell keeps the Ubuntu workflow pipeline behavior.
  steps:
    # Runner's postgres is initialized with C.UTF-8 locale (GHA default).
    # Tests (e.g. central/splunk) require byte-order collation.
    - name: Start Postgres (pre-installed)
      if: job.status == 'success' && inputs.postgres-version == 'default'
      shell: bash -e {0}
      run: |
        # Run on tmpfs to avoid disk I/O overhead in tests.
        PG_VER=$(pg_lsclusters -h | awk '{print $1}')
        sudo pg_dropcluster --stop "$PG_VER" main
        sudo mount -t tmpfs -o size=1G tmpfs /var/lib/postgresql
        # the unit tests expect a local postgres with passwordless access.
        sudo pg_createcluster "$PG_VER" main -- --auth=trust
        sudo cp .github/test-images/postgres-ci.conf "/etc/postgresql/$PG_VER/main/conf.d/ci.conf"
        sudo systemctl start postgresql.service

    # Image pinned in .github/test-images/postgres.dockerfile (Dependabot auto-bumps).
    - name: Start Postgres (${{ inputs.postgres-version }})
      if: job.status == 'success' && inputs.postgres-version != 'default'
      shell: bash -e {0}
      run: |
        docker build -t postgres-test -f .github/test-images/postgres.dockerfile .
        docker run --rm -d --name postgres --network=host \
          --tmpfs /var/lib/pgsql/data:rw,size=1G \
          -v "$GITHUB_WORKSPACE/.github/test-images/postgres-ci.conf:/opt/app-root/src/postgresql-cfg/ci.conf:ro" \
          -e POSTGRESQL_ADMIN_PASSWORD="$POSTGRES_PASSWORD" \
          -e LANG=C.UTF-8 \
          postgres-test

    - uses: ./.github/actions/job-preamble
      if: job.status == 'success'
      with:
        gcp-account: ${{ inputs.gcp-account }}

    - name: Cache Go dependencies
      if: job.status == 'success'
      uses: ./.github/actions/cache-go-dependencies
      with:
        key-suffix: ${{ inputs.gotags }}

    - name: Is Postgres ready
      if: job.status == 'success'
      shell: bash -e {0}
      run: |
        if [ "${{ inputs.postgres-version }}" = "default" ]; then
          timeout 60 bash -c 'until pg_isready; do sleep 1; done' \
            || { sudo journalctl -u postgresql --no-pager -n 20; exit 1; }
        else
          timeout 60 bash -c 'until pg_isready -h 127.0.0.1; do sleep 1; done' \
            || { docker logs postgres; exit 1; }
        fi

    - name: Go Unit Tests
      if: job.status == 'success'
      shell: bash -e {0}
      run: ${{ inputs.gotags }} make go-postgres-unit-tests

    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # ratchet:codecov/codecov-action@v7.1.1
      if: job.status == 'success'
      with:
        token: ${{ inputs.codecov-token }}
        flags: go-unit-tests

    - name: Generate junit report
      if: always()
      shell: bash -e {0}
      run: make generate-junit-reports

    - name: Publish Test Report
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # ratchet:test-summary/action@v2
      if: always()
      with:
        paths: 'junit-reports/report.xml'
