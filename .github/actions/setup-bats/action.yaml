name: Set up Bats
description: Install the pinned Bats packages using the npm download cache
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
      with:
        cache: npm
        cache-dependency-path: .github/ci/bats/package-lock.json
    - shell: bash
      run: |
        set -euo pipefail

        bats_dir="${GITHUB_WORKSPACE}/.github/ci/bats"
        npm ci --prefer-offline --fetch-retries=3 --prefix "$bats_dir" --no-audit --no-fund
        echo "$bats_dir/node_modules/.bin" >> "$GITHUB_PATH"

        # tests/roxctl/bats-tests/helpers.bash, scripts/test_helpers.bats and
        # scripts/ci/store-artifacts.bats look in /usr/lib/node_modules for CI libraries.
        sudo mkdir -p /usr/lib/node_modules
        for package in bats-support bats-assert; do
            sudo ln -sfnT "$bats_dir/node_modules/$package" "/usr/lib/node_modules/$package"
        done
