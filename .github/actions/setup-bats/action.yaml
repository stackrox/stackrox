name: Set up Bats
description: Install the pinned Bats packages using the npm download cache
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v6
      with:
        cache: npm
        cache-dependency-path: .github/ci/bats/package-lock.json
    - shell: bash
      run: bash .github/workflows/scripts/install-bats.sh
