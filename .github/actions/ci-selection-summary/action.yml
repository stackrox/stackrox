name: Explain native CI selection
description: Report an already evaluated candidate and expose the native enforcement condition.
inputs:
  candidate:
    description: Whether the job's file, label, or fallback rule selects it.
    required: true
  enforced:
    description: Whether to apply the candidate decision or only report it in shadow mode.
    required: true
  target:
    description: Optional reusable-workflow job ID whose execution this decision controls.
    default: ''
  note:
    description: Why a prerequisite or reporting job retains work independently of its candidate.
    default: ''
  eligible:
    description: Whether the execution restrictions checked by this step permit work; outer job conditions and dependencies still apply.
    default: 'true'
outputs:
  candidate:
    description: The native candidate input, for reporting without re-evaluation.
    value: ${{ inputs.candidate }}
  eligible:
    description: The native execution restriction input.
    value: ${{ inputs.eligible }}
  enforced:
    description: Whether native enforcement is enabled.
    value: ${{ inputs.enforced }}
  decision:
    description: The recorded native execution decision.
    value: ${{ steps.report.outputs.decision }}
  target:
    description: The job or reusable workflow call described by this record.
    value: ${{ inputs.target || github.job }}
  run:
    description: Whether selection permits the job's test steps to execute.
    value: ${{ steps.report.outputs.run }}
runs:
  using: composite
  steps:
    - id: report
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate }}
        ELIGIBLE: ${{ inputs.eligible }}
        ENFORCED: ${{ inputs.enforced }}
        RUN: ${{ inputs.eligible != 'false' && (inputs.enforced != 'true' || inputs.candidate != 'false') }}
        DECISION: ${{ inputs.eligible == 'false' && 'blocked-by-execution' || inputs.enforced == 'true' && inputs.candidate == 'false' && 'skipped-by-selection' || 'permitted' }}
        TARGET: ${{ inputs.target }}
        NOTE: ${{ inputs.note }}
      run: |
        printf 'run=%s\n' "$RUN" >> "$GITHUB_OUTPUT"
        printf 'decision=%s\n' "$DECISION" >> "$GITHUB_OUTPUT"
        printf 'STACKROX_CI_SELECTION_V1 %s\n' "$DECISION"
        if [[ -n "$TARGET" ]]; then
          printf 'STACKROX_CI_SELECTION_TARGET_V1 %s\n' "$TARGET"
        fi
        # shellcheck disable=SC2016 # Markdown backticks are literal text.
        {
          printf '### Native CI selection\n\n'
          if [[ -n "$TARGET" ]]; then
            printf '**E2E workflow call:** `%s`\n\n' "$TARGET"
          fi
          printf '**Candidate:** `%s`\n\n' "$CANDIDATE"
          printf '`true` means this job\047s selection rule requests work based on changed files, labels, or a fallback when file data is unavailable.\n\n'
          printf '**Eligible:** `%s`\n\n' "$ELIGIBLE"
          printf '`true` means this step\047s execution restrictions permit work. These can include fork, draft, or Konflux build requirements. If the job supplies no extra restriction, this defaults to `true`. Outer job conditions and dependencies still apply.\n\n'
          printf '**Enforced:** `%s`\n\n' "$ENFORCED"
          printf '`true` applies the candidate decision. `false` reports it in shadow mode and keeps existing execution rules.\n\n'
          printf '**Test steps permitted:** `%s`\n\n' "$RUN"
          printf 'With enforcement enabled, candidate and eligible must both be `true`. In shadow mode, only eligible is required here. Permission to execute does not confirm that tests ran; inspect the test steps and reports.\n\n'
          printf 'Inspect this job\047s Explain selection input for its rule, and detect-changes logs for the filenames.\n'
          printf '%s\n' "$NOTE"
        } | tee -a "$GITHUB_STEP_SUMMARY"
