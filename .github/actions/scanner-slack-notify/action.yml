name: Scanner Slack notify
description: |
  Post an enriched Slack failure notification for the current workflow
  run: failed jobs (matrix values included), failed step, and error
  annotations. Falls back to a minimal message if enrichment fails.
  The calling job needs permissions: actions: read, checks: read.
inputs:
  webhook-url:
    description: Slack incoming webhook URL.
    required: true
  description:
    description: Plain-language description of what failed.
    required: true
  github-token:
    description: Token used to read the run's jobs and annotations.
    required: false
    default: ${{ github.token }}
  mention:
    description: Slack mention prefixed to the message.
    required: false
    default: '<!subteam^S04S96AAVND|acs-scanner-primary>'
  inputs-json:
    description: Pass toJson(github.event.inputs) to include dispatch inputs.
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Build enriched payload
    id: enrich
    shell: bash
    continue-on-error: true
    env:
      GH_TOKEN: ${{ inputs.github-token }}
      MENTION: ${{ inputs.mention }}
      DESCRIPTION: ${{ inputs.description }}
      INPUTS_JSON: ${{ inputs.inputs-json }}
    run: |
      "$GITHUB_ACTION_PATH/build-payload.sh" "$RUNNER_TEMP/scanner-slack-payload.json"

  - name: Build fallback payload
    if: steps.enrich.outcome != 'success'
    shell: bash
    env:
      MENTION: ${{ inputs.mention }}
      DESCRIPTION: ${{ inputs.description }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    run: |
      jq -n --arg text "$MENTION $DESCRIPTION: <$RUN_URL|view run> (enriched notification failed; see the notify job log)" \
          '{text: $text}' > "$RUNNER_TEMP/scanner-slack-payload.json"

  - name: Post to Slack
    uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # ratchet:slackapi/slack-github-action@v3.0.3
    with:
      webhook: ${{ inputs.webhook-url }}
      webhook-type: incoming-webhook
      payload-file-path: ${{ runner.temp }}/scanner-slack-payload.json
      errors: true
