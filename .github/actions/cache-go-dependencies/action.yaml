name: Cache Go Dependencies
description: Cache Go Dependencies
inputs:
  save:
    description: Whether this job saves caches on pushes to the default branch.
    required: false
    default: 'true'
  key-suffix:
    description: Extra suffix for cache keys (use to distinguish matrix entries that share github.job).
    required: false
    default: ''
  force-save:
    description: >
      Force a cache save regardless of branch/event. For the
      cache-go-dependencies-regression.yaml test workflow only, which needs
      to prime a cache on a non-default-branch run for a later job to restore.
    required: false
    default: 'false'
  cache-scope:
    description: >
      Overrides the job-identity component of the cache key (normally
      github.job). For the cache-go-dependencies-regression.yaml test
      workflow only, which needs two differently-named jobs (prime/restore)
      to share one cache key.
    required: false
    default: ''
  skip-test-cache-clear:
    description: >
      Skip the "Clear test cache on non-PR runs" step below regardless of
      event type. For the cache-go-dependencies-regression.yaml test
      workflow only, which verifies test-cache hits on schedule/dispatch
      runs, not just pull_request runs.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Determine Go cache paths
      id: cache-paths
      run: |
        echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "GOARCH=$(go env GOARCH)" >> "$GITHUB_OUTPUT"
        echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"
        # Hash go.mod once for use in cache keys. When dependencies change,
        # the GOCACHE must be invalidated because Go's module index caches
        # parsed imports by (filename, mtime, size) and our fixed mtimes
        # can cause stale cached imports when file content changes.
        echo "GOMOD_HASH=$(sha256sum go.mod | cut -c1-16)" >> "$GITHUB_OUTPUT"
        suffix="${{ inputs.key-suffix }}"
        echo "KEY_SUFFIX=${suffix:+-$suffix}" >> "$GITHUB_OUTPUT"  # prepends dash if set
        # Normally the job id; overridable so two differently-named jobs
        # (e.g. in cache-go-dependencies-regression.yaml) can share a key.
        scope="${{ inputs.cache-scope }}"
        echo "SCOPE=${scope:-${{ github.job }}}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache Go Build (save)
      if: "(inputs.save == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || inputs.force-save == 'true'"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v5
      with:
        path: ${{ steps.cache-paths.outputs.GOCACHE }}
        key: go-build-v2-${{ steps.cache-paths.outputs.SCOPE }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-${{ steps.cache-paths.outputs.TAG }}
        restore-keys: |
          go-build-v2-${{ steps.cache-paths.outputs.SCOPE }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-
          go-build-v2-${{ steps.cache-paths.outputs.SCOPE }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-

    - name: Cache Go Build (restore)
      if: ${{ !((inputs.save == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || inputs.force-save == 'true') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v5
      with:
        path: ${{ steps.cache-paths.outputs.GOCACHE }}
        key: go-build-v2-${{ steps.cache-paths.outputs.SCOPE }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-${{ steps.cache-paths.outputs.TAG }}
        restore-keys: |
          go-build-v2-${{ steps.cache-paths.outputs.SCOPE }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-
          go-build-v2-${{ steps.cache-paths.outputs.SCOPE }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-

    - name: Mark GOCACHE entries for stale detection
      run: |
        gocache="${{ steps.cache-paths.outputs.GOCACHE }}"
        if [[ -d "$gocache" ]]; then
          # Backdate all cache entries to year 2000. During the build/test,
          # Go's markUsed() updates mtimes of accessed entries to "now"
          # (it always updates when mtime is >1 hour old). The post-step
          # below trims entries still at year 2000 before cache save.
          timeout 120 find "$gocache" -type f -exec touch -t 200001010000 {} + || true
          # Protect trim.txt: if backdated, Go's built-in Trim() sees
          # "last trim was in year 2000" and deletes ALL backdated entries
          # before the build starts. Setting it to now prevents this.
          echo "$(date +%s)" > "$gocache/trim.txt"
          echo "Marked GOCACHE entries for stale detection"
        fi
      shell: bash

    # Registered AFTER cache steps so the post-step runs BEFORE cache save
    # (GHA runs post-steps in reverse registration order).
    - name: Trim stale GOCACHE entries (post-step)
      uses: gacts/run-and-post-run@598d7a875d5620e0457490555b5e18e46082aa47 # v1.4.0
      with:
        post: >
          set +e;
          gocache="$(go env GOCACHE)";
          [[ -d "$gocache" ]] && [[ -f "$gocache/trim.txt" ]] || { echo "Skipping GOCACHE trim"; exit 0; };
          before=$(du -sm "$gocache" 2>/dev/null | cut -f1);
          cutoff=$(mktemp); touch -t 200001020000 "$cutoff";
          find "$gocache" -type f ! -newer "$cutoff" -delete 2>/dev/null || true;
          rm -f "$cutoff";
          find "$gocache" -mindepth 1 -type d -empty -delete 2>/dev/null || true;
          after=$(du -sm "$gocache" 2>/dev/null | cut -f1);
          echo "GOCACHE trimmed: ${before:-0}MB -> ${after:-0}MB (removed $((${before:-0} - ${after:-0}))MB)"

    - name: Clear test cache on non-PR runs
      if: github.event_name != 'pull_request' && inputs.skip-test-cache-clear != 'true'
      run: |
        # Non-PR runs (master, release branches, nightlies) always run tests
        # from scratch to catch real failures. go clean -testcache removes
        # cached test results while preserving the compilation cache.
        go clean -testcache
        echo "Cleared test cache for fresh run"
      shell: bash

    - name: Stabilize file mtimes for Go test cache
      run: |
        # NEGATIVE CONTROL 3/3: uses the current wall-clock time instead of
        # a fixed constant, so prime-cache and verify-restore stamp
        # different mtimes on byte-identical files. Reintroduces the
        # test-result-cache mtime bug this session discarded (Go's test
        # cache keys runtime-read files like testdata/ by (size, mode,
        # mtime), not content). Proves Assertion 3 catches it. Will be
        # reverted once confirmed.
        git ls-files | xargs touch -d "@$(date +%s)"
      shell: bash

    # VERIFY BRANCH: disable Go's module index entirely. Confirmed locally
    # (real jwt v4->v5 diff, not a stdlib stand-in) that this alone prevents
    # "could not import ... (open : no such file or directory)" even with the
    # old fixed-constant mtime scheme reapplied unconditionally on every run.
    - name: "[test] disable Go module index (GODEBUG=goindex=0)"
      run: echo "GODEBUG=goindex=0" >> "$GITHUB_ENV"
      shell: bash
