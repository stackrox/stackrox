name: Cache Go Dependencies
description: Cache Go Dependencies
inputs:
  save:
    description: Whether this job saves caches on pushes to the default branch.
    required: false
    default: 'true'
  key-suffix:
    description: Extra suffix for cache keys (use to distinguish matrix entries that share github.job).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Determine Go cache paths
      id: cache-paths
      run: |
        echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "GOARCH=$(go env GOARCH)" >> "$GITHUB_OUTPUT"
        echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"
        # Hash go.mod once for use in cache keys. When dependencies change,
        # the GOCACHE must be invalidated because Go's module index caches
        # parsed imports by (filename, mtime, size) and our fixed mtimes
        # can cause stale cached imports when file content changes.
        echo "GOMOD_HASH=$(sha256sum go.mod | cut -c1-16)" >> "$GITHUB_OUTPUT"
        suffix="${{ inputs.key-suffix }}"
        echo "KEY_SUFFIX=${suffix:+-$suffix}" >> "$GITHUB_OUTPUT"  # prepends dash if set
      shell: bash

    - name: Cache Go Build (save)
      # REPRO BRANCH: also save on PRs from this branch so we can verify
      # run 2 restores the blob-hash-built cache rather than the stale one.
      if: "inputs.save == 'true' && ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.head_ref == 'reproduce/jwt-roxvet-stale-cache-index')"
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5
      with:
        path: ${{ steps.cache-paths.outputs.GOCACHE }}
        key: go-build-v2-${{ github.job }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-${{ steps.cache-paths.outputs.TAG }}
        # REPRO BRANCH: GOMOD_HASH fallback first so run 2 picks up the cache
        # saved by run 1 (blob-hash mtimes). Stale master cache second as
        # the seed for run 1.
        restore-keys: |
          go-build-v2-${{ github.job }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-
          go-build-v2-style-check-amd64-be1e0f6e78eb7815-e423ef7381722c55ec96c27903375f4564957f36

    - name: Cache Go Build (restore)
      if: ${{ !(inputs.save == 'true' && ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.head_ref == 'reproduce/jwt-roxvet-stale-cache-index')) }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache/restore@v5
      with:
        path: ${{ steps.cache-paths.outputs.GOCACHE }}
        key: go-build-v2-${{ github.job }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-${{ steps.cache-paths.outputs.TAG }}
        restore-keys: |
          go-build-v2-${{ github.job }}${{ steps.cache-paths.outputs.KEY_SUFFIX }}-${{ steps.cache-paths.outputs.GOARCH }}-${{ steps.cache-paths.outputs.GOMOD_HASH }}-
          go-build-v2-style-check-amd64-be1e0f6e78eb7815-e423ef7381722c55ec96c27903375f4564957f36

    - name: Mark GOCACHE entries for stale detection
      run: |
        gocache="${{ steps.cache-paths.outputs.GOCACHE }}"
        if [[ -d "$gocache" ]]; then
          # Backdate all cache entries to year 2000. During the build/test,
          # Go's markUsed() updates mtimes of accessed entries to "now"
          # (it always updates when mtime is >1 hour old). The post-step
          # below trims entries still at year 2000 before cache save.
          timeout 120 find "$gocache" -type f -exec touch -t 200001010000 {} + || true
          # Protect trim.txt: if backdated, Go's built-in Trim() sees
          # "last trim was in year 2000" and deletes ALL backdated entries
          # before the build starts. Setting it to now prevents this.
          echo "$(date +%s)" > "$gocache/trim.txt"
          echo "Marked GOCACHE entries for stale detection"
        fi
      shell: bash

    # Registered AFTER cache steps so the post-step runs BEFORE cache save
    # (GHA runs post-steps in reverse registration order).
    - name: Trim stale GOCACHE entries (post-step)
      uses: gacts/run-and-post-run@598d7a875d5620e0457490555b5e18e46082aa47 # v1.4.0
      with:
        post: >
          set +e;
          gocache="$(go env GOCACHE)";
          [[ -d "$gocache" ]] && [[ -f "$gocache/trim.txt" ]] || { echo "Skipping GOCACHE trim"; exit 0; };
          before=$(du -sm "$gocache" 2>/dev/null | cut -f1);
          cutoff=$(mktemp); touch -t 200001020000 "$cutoff";
          find "$gocache" -type f ! -newer "$cutoff" -delete 2>/dev/null || true;
          rm -f "$cutoff";
          find "$gocache" -mindepth 1 -type d -empty -delete 2>/dev/null || true;
          after=$(du -sm "$gocache" 2>/dev/null | cut -f1);
          echo "GOCACHE trimmed: ${before:-0}MB -> ${after:-0}MB (removed $((${before:-0} - ${after:-0}))MB)"

    - name: Clear test cache on non-PR runs
      if: github.event_name != 'pull_request'
      run: |
        # Non-PR runs (master, release branches, nightlies) always run tests
        # from scratch to catch real failures. go clean -testcache removes
        # cached test results while preserving the compilation cache.
        go clean -testcache
        echo "Cleared test cache for fresh run"
      shell: bash

    - name: Stabilize file mtimes for Go test cache and module index
      run: |
        # Go's test cache validates inputs by (path, size, mtime) — NOT content.
        # Go's module index caches parsed imports by (filename, mtime, size).
        #
        # FIX: derive each file's mtime from its git blob hash instead of a
        # fixed constant. This means:
        #   - same content across runs  → same blob hash → same mtime → cache hit  ✓
        #   - changed content           → different blob hash → different mtime
        #                               → module index miss → re-parse            ✓
        #
        # Previously all files got the same constant (200101010000), which caused
        # the module index to serve stale import data when content changed but
        # file size didn't (e.g. "jwt/v4" → "jwt/v5", identical string length).
        # All derived mtimes stay in 2001–2019 so GOCACHE trim's year-2000
        # cutoff still correctly evicts unused compiled artifacts.
        #
        # Note: $'...' bash ANSI-C quoting expands \n to real newlines so the
        # entire Python program fits on one YAML-valid line (col 0 would end the block).
        git ls-files -s | python3 -c $'import sys, os, calendar\nfor line in sys.stdin:\n    parts = line.rstrip().split(None, 3)\n    if len(parts) < 4 or not parts[0].startswith("100"):\n        continue\n    blob, path = parts[1], parts[3]\n    val = int(blob[:8], 16)\n    y = 2001 + val % 19\n    mo = 1 + val // 19 % 12\n    d = 1 + val // 228 % 28\n    h = val // 6384 % 24\n    mi = val // 153216 % 60\n    ts = calendar.timegm((y, mo, d, h, mi, 0, 0, 0, 0))\n    try:\n        os.utime(path, (ts, ts))\n    except OSError:\n        pass'
        # Directories have no blob hash; keep them at a fixed constant.
        # Directory mtimes matter for tests using os.ReadDir / filepath.Walk.
        git ls-files | sed 's|/[^/]*$||' | sort -u | xargs touch -t 200101010000
      shell: bash
