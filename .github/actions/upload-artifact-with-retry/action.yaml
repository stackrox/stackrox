name: Upload artifact and retry
description: Retry wrapper of upload-artifact
inputs:
  name:
    description: 'Artifact name'
    default: 'artifact'
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload'
    required: true
  if-no-files-found:
    description: >
      The desired behavior if no files are found using the provided path.

      Available Options:
        warn: Output a warning but do not fail the action
        error: Fail the action with an error message
        ignore: Do not output any warnings or errors, the action does not fail
    default: 'warn'
  compression-level:
    description: 'Compression level: 0 (none) to 9 (max). Default is 6 (zstd default)'
    required: false
    default: '6'
  retention-days:
    description: 'Duration after which artifact will expire in days. 0 means using default retention.'
    required: false
    default: '0'
  archive:
    description: >
      Whether to zip the artifact files before upload.
      If 'false', only a single file can be uploaded.
      The name of the file will be used as the artifact name (the 'name' parameter is ignored).
      Optional. Default is 'true'.
    required: false
    default: 'true'
outputs:
  artifact-url:
    description: >
      URL to download an Artifact.
      Can be used in many scenarios such as linking to artifacts in issues or pull requests.
      Users must be logged-in in order for this URL to work.
      This URL is valid as long as the artifact has not expired or the artifact, run or repository have not been deleted.
    value: ${{ steps.upload-artifact-try1.outputs.artifact-url || steps.upload-artifact-try2.outputs.artifact-url || steps.upload-artifact-try3.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - id: upload-artifact-try1
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        retention-days: ${{ inputs.retention-days }}
        archive: ${{ inputs.archive }}
      continue-on-error: true
    - id: upload-artifact-try2
      if: steps.upload-artifact-try1.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        retention-days: ${{ inputs.retention-days }}
        archive: ${{ inputs.archive }}
      continue-on-error: true
    - id: upload-artifact-try3
      if: steps.upload-artifact-try2.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        retention-days: ${{ inputs.retention-days }}
        archive: ${{ inputs.archive }}
