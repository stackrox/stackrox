# Candidate models to compare. Each is generated independently and scored by the
# judge configured in system.yaml. Edit this list freely — it is the switch point
# for comparing models; nothing else needs to change.
#
# Fields per candidate:
#   name:    label used in output CSV/columns (must be unique, filesystem-safe)
#   model:   LiteLLM model id (see https://docs.litellm.ai/docs/providers)
#   temperature: optional (default 0.0)
#   max_tokens:  optional (default 1024)
#   api_base:    optional (for Azure / vLLM / OpenAI-compatible endpoints)
#   api_key_env: optional env var name holding the key (default provider-standard)

candidates:
  - name: gpt-5.4-mini
    model: openai/gpt-5.4-mini
    max_tokens: 16384
  - name: claude-sonnet-vertex
    model: vertex_ai/claude-sonnet-4-5@20250929
    max_tokens: 16384
  - name: gpt-5.6-luna
    model: openai/gpt-5.6-luna
    temperature: 1.0
    max_tokens: 16384

  # Add more to compare, e.g.:
  # - name: gpt-4o
  #   model: openai/gpt-4o
  # - name: claude
  #   model: anthropic/claude-sonnet-4-5
  # - name: vllm-local
  #   model: openai/my-model
  #   api_base: http://localhost:8000/v1
  #   api_key_env: VLLM_API_KEY
