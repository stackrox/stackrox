# Shared QA/UI/non-Groovy E2E overrides for Roxie's tiny profile.
central:
  resourceProfile: tiny
  spec:
    central:
      db:
        # Leave room for the default 2 GB shared buffers plus other PostgreSQL allocations.
        resources:
          requests:
            memory: 4Gi
          limits:
            memory: 4Gi
    centralWorker:
      # Tiny does not override the worker's 500m CPU / 1 GiB request.
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 128Mi
    scannerV4:
      db:
        # Retain the database memory budget while adopting tiny's CPU request.
        resources:
          requests:
            memory: 4Gi
          limits:
            memory: 4Gi
securedCluster:
  resourceProfile: tiny
  spec:
    # Tiny selects one admission replica but leaves these CPU requests at product defaults.
    admissionControl:
      resources:
        requests:
          cpu: 10m
    perNode:
      collector:
        resources:
          requests:
            cpu: 10m
      compliance:
        resources:
          requests:
            cpu: 10m
      nodeInventory:
        resources:
          requests:
            cpu: 10m
