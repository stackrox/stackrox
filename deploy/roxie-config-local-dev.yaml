# Local development settings using the QA/UI resource budget.
# Reduces resource requests/limits for local dev clusters, disables telemetry,
# monitoring, and scanner autoscaling.
#
# Usage: roxie --config deploy/roxie-config-local-dev.yaml deploy

central:
  namespace: stackrox
  spec:
    central:
      resources:
        requests:
          cpu: 150m
          memory: 1Gi
        limits:
          memory: 1Gi
      db:
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 1Gi
      telemetry:
        enabled: false

    monitoring:
      openshift:
        enabled: false

    centralWorker:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 128Mi
    scannerV4:
      indexer:
        scaling:
          autoScaling: Disabled
          minReplicas: 1
          replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 512Mi
      matcher:
        scaling:
          autoScaling: Disabled
          minReplicas: 1
          replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 256Mi
      db:
        resources:
          requests:
            cpu: 100m
            memory: 4Gi
          limits:
            memory: 4Gi
securedCluster:
  namespace: stackrox
  spec:
    monitoring:
      openshift:
        enabled: false

    sensor:
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 512Mi
    perNode:
      collector:
        collection: CORE_BPF
