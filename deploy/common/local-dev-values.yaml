# Reduced resource overrides for the stackrox-central-services Helm chart that allow deploying
# on Docker for Desktop on a typical developer box.
# Please keep /operator/tests/*/*/*central-cr.yaml in sync

central:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 4Gi

  db:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 4Gi

  telemetry:
    enabled: false

scannerV4:
  indexer:
    scaling:
      autoScaling: Disabled
      minReplicas: 1
      replicas: 1
    resources:
      requests:
        cpu: "400m"
        memory: "1500Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  matcher:
    scaling:
      autoScaling: Disabled
      minReplicas: 1
      replicas: 1
    resources:
      requests:
        cpu: "400m"
        memory: "2Gi"
      limits:
        cpu: "1000m"
        memory: "5500Mi"
  db:
    resources:
      requests:
        cpu: "400m"
        memory: "2Gi"
      limits:
        cpu: "1000m"
        memory: "2500Mi"
