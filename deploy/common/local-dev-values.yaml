# Reduced resource overrides for the stackrox-central-services Helm chart that allow deploying
# on Docker for Desktop on a typical developer box.
# Please keep /operator/tests/*/*/*central-cr.yaml in sync

central:
  resources:
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      memory: 1Gi

  db:
    resources:
      requests:
        cpu: 100m
        memory: 4Gi
      limits:
        memory: 4Gi

  telemetry:
    enabled: false

centralWorker:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

scannerV4:
  indexer:
    scaling:
      autoScaling: Disabled
      minReplicas: 1
      replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "512Mi"
      limits:
        memory: "512Mi"
  matcher:
    scaling:
      autoScaling: Disabled
      minReplicas: 1
      replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        memory: "256Mi"
  db:
    resources:
      requests:
        cpu: "100m"
        memory: "4Gi"
      limits:
        memory: "4Gi"
