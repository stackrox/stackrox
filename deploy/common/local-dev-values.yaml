# Reduced resource overrides for the stackrox-central-services Helm chart that allow deploying
# on Docker for Desktop on a typical developer box.
# Please keep /operator/tests/*/*/*central-cr.yaml in sync

central:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 4Gi

  db:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 4Gi

  telemetry:
    enabled: false

centralWorker:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

scannerV4:
  indexer:
    scaling:
      autoScaling: Disabled
      minReplicas: 1
      replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "1500Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  matcher:
    scaling:
      autoScaling: Disabled
      minReplicas: 1
      replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "5500Mi"
  db:
    resources:
      requests:
        cpu: "400m"
        memory: "2Gi"
      limits:
        cpu: "1000m"
        memory: "2500Mi"

# Minimal CI fixtures provide reduced vulnerability coverage for local development.
# Restore the deployed image's default stream with:
# --set-string customize.scanner-v4-matcher.envVars.SCANNER_V4_MATCHER_VULNERABILITY_VERSION=""
customize:
  scanner-v4-matcher:
    envVars:
      SCANNER_V4_MATCHER_VULNERABILITY_VERSION: ci-minimal-bab3cec6e362f74bbe0c4f6a2e552ce1bac983feb836c449929f20cfd88bf4ce
