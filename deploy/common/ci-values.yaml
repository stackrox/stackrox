# Change resource overrides for the stackrox-central-services Helm chart in CI.

central:
  db:
    resources:
      limits:
        cpu: 8
        memory: 16Gi
      requests:
        cpu: 1
        memory: 1Gi

  telemetry:
    enabled: false

scanner:
  replicas: 1
  autoscaling:
    disable: true

scannerV4:
  matcher:
    replicas: 1
    autoscaling:
      disable: true
    # 4Gi aims at covering the rhel-vex cold-import peak that OOMs at the original 3Gi Helm default.
    # Use embedded ci-minimal bundle (18KB, 109 CVEs) for fast CI testing
    vulnerabilitiesUrl: "file:///etc/scanner/ci-minimal-bundle.zip"
    resources:
      requests:
        cpu: "400m"
        memory: "6Gi"
      limits:
        memory: "6Gi"
  indexer:
    replicas: 1
    autoscaling:
      disable: true
    resources:
      requests:
        cpu: "400m"
  db:
    resources:
      requests:
        cpu: "500m"
