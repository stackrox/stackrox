# Change resource overrides for the stackrox-central-services Helm chart in CI.

central:
  db:
    resources:
      limits:
        cpu: 8
        memory: 16Gi
      requests:
        cpu: 1
        memory: 1Gi

  telemetry:
    enabled: false

scanner:
  replicas: 1
  autoscaling:
    disable: true

scannerV4:
  matcher:
    replicas: 1
    autoscaling:
      disable: true
    # 4Gi aims at covering the rhel-vex cold-import peak that OOMs at the original 3Gi Helm default.
    # Use the repaired ci-minimal bundle from GitHub for fast CI testing.
    vulnerabilitiesUrl: "https://raw.githubusercontent.com/stackrox/stackrox/96f9728c6d/scanner/image/scanner/bundles/ci-minimal/vulnerabilities.zip"
    # 4Gi aims at covering the rhel-vex cold-import peak that OOMs at the original 3Gi Helm default.
    resources:
      requests:
        cpu: "400m"
        memory: "6Gi"
      limits:
        memory: "6Gi"
  indexer:
    replicas: 1
    autoscaling:
      disable: true
    resources:
      requests:
        cpu: "400m"
  db:
    resources:
      requests:
        cpu: "500m"

# Import the distro bundles used by the CI image-scanning tests. NVD is
# enrichment data and cannot produce image vulnerabilities by itself.
customize:
  scanner-v4-matcher:
    envVars:
      SCANNER_V4_MATCHER_VULN_BUNDLE_ALLOWLIST: "alpine,debian,epss,manual,nvd,rhel-vex,stackrox-rhel-csaf"
