# Change resource overrides for the stackrox-central-services Helm chart in CI.

central:
  db:
    resources:
      limits:
        cpu: 8
        memory: 16Gi
      requests:
        cpu: 1
        memory: 1Gi

  telemetry:
    enabled: false

scanner:
  replicas: 1
  autoscaling:
    disable: true

scannerV4:
  matcher:
    replicas: 1
    autoscaling:
      disable: true
    # 4Gi aims at covering the rhel-vex cold-import peak that OOMs at the original 3Gi Helm default.
    resources:
      requests:
        cpu: "400m"
        memory: "6Gi"
      limits:
        memory: "6Gi"
  indexer:
    replicas: 1
    autoscaling:
      disable: true
    resources:
      requests:
        cpu: "400m"
  db:
    resources:
      requests:
        cpu: "500m"

# Import all sources from the reduced bundle used by CI image-scanning tests.
customize:
  scanner-v4-matcher:
    envVars:
      # Use the repaired ci-minimal bundle from GitHub for fast CI testing.
      SCANNER_V4_MATCHER_VULNERABILITIES_URL: "https://raw.githubusercontent.com/stackrox/stackrox/5ad57fb2849616a8db4878c5647a280ac822b5f5/scanner/image/scanner/bundles/ci-minimal/vulnerabilities.zip"
