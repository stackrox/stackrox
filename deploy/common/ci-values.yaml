# CI resource overrides. The resource-policy annotation removes CPU limits
# after chart defaulting and keeps memory limits equal to requests.

central:
  resources:
    requests:
      cpu: 1500m
      memory: 1Gi
    limits:
      memory: 1Gi
  db:
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 1
        memory: 1Gi

  telemetry:
    enabled: false

scanner:
  replicas: 1
  autoscaling:
    disable: true

scannerV4:
  matcher:
    replicas: 1
    autoscaling:
      disable: true
    # Preserve the existing cold-import memory reservation.
    resources:
      requests:
        cpu: "400m"
        memory: "6Gi"
      limits:
        memory: "6Gi"
  indexer:
    replicas: 1
    autoscaling:
      disable: true
    resources:
      requests:
        cpu: "400m"
        memory: "512Mi"
      limits:
        memory: "512Mi"
  db:
    resources:
      requests:
        cpu: "500m"
        memory: "4Gi"
      limits:
        memory: "4Gi"

centralWorker:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

configController:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

customize:
  annotations:
    ci.stackrox.io/resource-policy: requests
