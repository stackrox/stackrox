# Per-updater configuration for the vulnerability update workflow.
#
# storage: GCS location for per-updater data objects. The object path
# pattern is gs://<bucket>/<prefix>/<stream>/sources/<updater>.json.zst,
# constructed by the matrix builder and passed to all downstream consumers.
#
# bundles: defines sources and optional updater environment variables for each
# version stream. The stream-to-ref mapping comes from
# VULNERABILITY_BUNDLE_VERSION. Environment variables that are absent use the
# updater's default behavior.
#
# updaters: per-updater configuration. Each updater inherits from 'default'
# unless it overrides a field. New configuration sections can be added here
# as the pipeline evolves.
#
# interval: minimum age of the last successful upload before a refresh is due.
#
# attempt_cadence: optional spacing between eligible one-hour scheduling windows,
# aligned to UTC epoch hours. Must be a positive whole-hour duration.
# For example, 4h permits attempts during UTC hours 00, 04, 08, 12, 16, and 20.
# If omitted, due refreshes may be attempted on every scheduler run.
# Failed attempts do not change the windows or the last successful upload time.

storage:
  bucket: definitions.stackrox.io
  prefix: v4/vulnerability-bundles

bundles:
  dev:
    sources:
      - alpine
      - aws
      - debian
      - epss
      - manual
      - nvd
      - oracle
      - osv
      - photon
      - rhel-vex
      - stackrox-rhel-csaf
      - suse
      - ubuntu
  v2:
    sources:
      - alpine
      - aws
      - debian
      - epss
      - manual
      - nvd
      - oracle
      - osv
      - photon
      - rhel-vex
      - stackrox-rhel-csaf
      - suse
      - ubuntu
    env:
      STACKROX_RHEL_VEX_IGNORE_KERNEL_PACKAGES: "true"
  v3:
    sources:
      - alpine
      - aws
      - debian
      - epss
      - manual
      - nvd
      - oracle
      - osv
      - photon
      - rhel-vex
      - stackrox-rhel-csaf
      - suse
      - ubuntu
    env:
      STACKROX_RHEL_VEX_IGNORE_KERNEL_PACKAGES: "true"
  v4:
    sources:
      - alpine
      - aws
      - debian
      - epss
      - manual
      - nvd
      - oracle
      - osv
      - photon
      - rhel-vex
      - stackrox-rhel-csaf
      - suse
      - ubuntu
    env:
      STACKROX_RHEL_VEX_IGNORE_KERNEL_PACKAGES: "true"
  v5:
    sources:
      - alpine
      - aws
      - debian
      - epss
      - manual
      - nvd
      - oracle
      - osv
      - photon
      - rhel-vex
      - stackrox-rhel-csaf
      - suse
      - ubuntu

updaters:
  default:
    interval: 4h
