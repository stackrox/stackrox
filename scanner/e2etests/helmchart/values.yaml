# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

app:
  scanner:
    name: scanner-v4
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4
      tag: latest
    # Vulnerability bundle URL
    # Default: Use ci-minimal bundle (18KB) from GitHub for fast CI testing
    # Override: https://definitions.stackrox.io/v4/vulnerability-bundles/dev/vulnerabilities.zip for full bundle
    vulnerabilitiesUrl: "https://raw.githubusercontent.com/stackrox/stackrox/604dc32bb0/scanner/image/scanner/bundles/ci-minimal/vulnerabilities.zip"
  db:
    name: scanner-v4-db
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4-db
      tag: latest
    persistence:
      hostPath: null
