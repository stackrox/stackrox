# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

app:
  scanner:
    name: scanner-v4
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4
      tag: latest
    # Vulnerability bundle URL
    # Default: Use ci-minimal bundle from GitHub for fast CI testing
    # Nightlies use values-full.yaml to retain the versioned production bundle default.
    vulnerabilitiesUrl: "https://raw.githubusercontent.com/stackrox/stackrox/156c10284679f3e00c6d90e7439d40a34842c838/scanner/image/scanner/bundles/ci-minimal/vulnerabilities.zip"
  db:
    name: scanner-v4-db
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4-db
      tag: latest
    persistence:
      hostPath: null
