# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

app:
  scanner:
    name: scanner-v4
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4
      tag: latest
    # Vulnerability bundle URL
    # Default: Use ci-minimal bundle from GitHub for fast CI testing
    # Override: https://definitions.stackrox.io/v4/vulnerability-bundles/dev/vulnerabilities.zip for full bundle
    vulnerabilitiesUrl: "https://raw.githubusercontent.com/stackrox/stackrox/5ad57fb2849616a8db4878c5647a280ac822b5f5/scanner/image/scanner/bundles/ci-minimal/vulnerabilities.zip"
  db:
    name: scanner-v4-db
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4-db
      tag: latest
    persistence:
      hostPath: null
