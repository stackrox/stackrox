# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

app:
  scanner:
    name: scanner-v4
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4
      tag: latest
    # Vulnerability bundle URL
    # Default: Use embedded ci-minimal bundle (18KB) for fast CI testing
    # Override: file:///etc/scanner/ci-minimal-bundle.zip for CI tests
    #           https://definitions.stackrox.io/v4/vulnerability-bundles/dev/vulnerabilities.zip for full bundle
    vulnerabilitiesUrl: "file:///etc/scanner/ci-minimal-bundle.zip"
  db:
    name: scanner-v4-db
    image:
      registry: quay.io/stackrox-io
      name: scanner-v4-db
      tag: latest
    persistence:
      hostPath: null
