syntax = "proto3";

package v1;

option go_package = "./api/v1;v1";
option java_package = "io.stackrox.proto.api.v1";

message ResourceByID {
  string id = 1;
}

// HTTPRequestScope restricts a token to an HTTP method and path.
message HTTPRequestScope {
  string method = 1;
  // A trailing slash denotes a path prefix; otherwise the path matches exactly.
  string path = 2;
}

// EXPERIMENTAL.
//
// Used in combination with MutabilityMode.ALLOW_MUTATE_FORCED to enable forced removal.
message DeleteByIDWithForce {
  string id = 1;
  bool force = 2;
}
