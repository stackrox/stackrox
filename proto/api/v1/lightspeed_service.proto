syntax = "proto3";

package v1;

import "api/v1/common.proto";
import "api/v1/empty.proto";
import weak "google/api/annotations.proto";

option go_package = "./api/v1;v1";
option java_package = "io.stackrox.proto.api.v1";

message ConfigureLightspeedRequest {
  string cluster_id = 1;
  string host = 2;
}

message GetLightspeedConfigResponse {
  string host = 1;
  bool is_ready = 2;
  bool has_query_access = 3;
  string status_error = 4;
}

service LightspeedService {
  rpc ConfigureLightspeed(ConfigureLightspeedRequest) returns (Empty) {
    option (google.api.http) = {
      put: "/v1/clusters/{cluster_id}/lightspeed-config"
      body: "*"
    };
  }

  rpc GetLightspeedConfig(ResourceByID) returns (GetLightspeedConfigResponse) {
    option (google.api.http) = {get: "/v1/clusters/{id}/lightspeed-config"};
  }
}
