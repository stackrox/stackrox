syntax = "proto3";

package storage;

import "google/protobuf/timestamp.proto";

option go_package = "./storage;storage";
option java_package = "io.stackrox.proto.storage";

// CustomResource represents the identity and ownership of a tracked Kubernetes custom resource.
message CustomResource {
  string id = 1; // @gotags: search:"Custom Resource ID,hidden" sql:"pk,type(uuid)"
  string name = 2; // @gotags: search:"Custom Resource Name"
  string namespace = 3; // @gotags: search:"Namespace"
  string cluster_id = 4; // @gotags: search:"Cluster ID,hidden" sql:"type(uuid)"
  string cluster_name = 5; // @gotags: search:"Cluster"
  string api_group = 6;
  string api_version = 7;
  string kind = 8;
  string resource = 9;

  // owner_id is the UID of the controlling parent custom resource, if one is tracked.
  string owner_id = 10; // @gotags: sql:"type(uuid),index=btree"

  map<string, string> labels = 11;
  google.protobuf.Timestamp created = 12; // @gotags: sql:"type(timestamptz)"
}
