syntax = "proto3";

package virtualmachine.v1;

import "google/protobuf/timestamp.proto";
import "internalapi/scanner/v4/index_report.proto";

option go_package = "./internalapi/virtualmachine/v1;v1";

// Protocol for pull-mode VM scanning over VSOCK between Sensor and roxagent.
// See ADR-0006 §2 (Protocol) for the full design, exchange examples, and
// token-based deduplication semantics.

// --- Envelope ---

// VMServiceRequest is sent by Sensor to roxagent over a length-prefixed VSOCK frame.
// One request per connection; the connection closes after the response.
message VMServiceRequest {
  RequestMeta meta = 1;
  oneof method {
    GetReportRequest get_report = 2;
    SyncRepoCPEMappingRequest sync_repo_cpe_mapping = 3;
  }
}

// VMServiceResponse is returned by roxagent. Contains either a successful result
// or an ErrorResponse, never both.
message VMServiceResponse {
  ResponseMeta meta = 1;
  oneof result {
    GetReportResponse get_report = 2;
    ErrorResponse error = 3;
    SyncRepoCPEMappingResponse sync_repo_cpe_mapping = 4;
  }
}

// --- Metadata ---

message RequestMeta {
  // Correlation ID (UUID) for tracing across Sensor and agent logs.
  string request_id = 1;
  // Features this Sensor understands (e.g. "report_v1"). The agent may use
  // this to select response format. See ADR-0006 §3 for negotiation rules.
  repeated string capabilities = 2;
  // Reserved for future contextual metadata (e.g. sensor_version, cluster_id).
  map<string, string> facts = 3;
}

message ResponseMeta {
  // roxagent build version string (e.g. "4.7.0-12-gabcdef"), set via ldflags.
  string agent_version = 1;
  // When the cached scan report was produced by the scanner.
  google.protobuf.Timestamp report_generated_at = 2;
  // Opaque per-scan identifier minted when the cached report is published.
  // Changes on every scan regardless of content, so Sensor always receives
  // a full report at least once per rescan interval.
  string report_token = 3;
  // Methods this agent accepts (e.g. ["get_report"]). Doubles as capability
  // discovery — no separate handshake needed. See ADR-0006 §2.
  repeated string supported_methods = 4;
  // VM metadata from the scan (detected_os, os_version, activation_status, etc.).
  // Future: may also carry roxagent operational metrics.
  map<string, string> facts = 5;
  // XXH64 hex of active mapping; empty string means none. optional so absence
  // means an older agent that does not report mapping metadata.
  optional string repo_cpe_mapping_hash = 6;
  // SENSOR or URL only; UNSPECIFIED means Sensor must not sync.
  optional RepoCPEMappingUpdatePath repo_cpe_mapping_update_path = 7;
}

// --- Methods ---

message GetReportRequest {
  // Token last observed by Sensor for this VM (see ResponseMeta.report_token).
  // Empty when none is known, which forces a full report.
  string last_known_token = 1;
}

message GetReportResponse {
  // Full scan report; set when the token changed or last_known_token is empty.
  scanner.v4.IndexReport index_report = 1;
  // True when the agent's token matches last_known_token; index_report is nil.
  // Sensor may still force a refresh after 4 h.
  bool unchanged = 2;
}

message SyncRepoCPEMappingRequest {
  bytes mapping = 1;
}

message SyncRepoCPEMappingResponse {
  // True when the agent accepted new content (applied or staged).
  bool updated = 1;
}

enum RepoCPEMappingUpdatePath {
  REPO_CPE_MAPPING_UPDATE_PATH_UNSPECIFIED = 0;
  REPO_CPE_MAPPING_UPDATE_PATH_SENSOR = 1;
  REPO_CPE_MAPPING_UPDATE_PATH_URL = 2;
}

// --- Errors ---

message ErrorResponse {
  ErrorCode code = 1;
  // Human-readable error description for logging.
  string message = 2;
  // Structured error metadata for programmatic handling.
  map<string, string> details = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Agent does not support the requested method.
  ERROR_CODE_UNKNOWN_METHOD = 1;
  // Initial scan still in progress; retry next poll cycle.
  ERROR_CODE_NOT_READY = 2;
  // Internal agent failure unrelated to the request's validity (e.g. unexpected
  // panic, local I/O error).
  ERROR_CODE_INTERNAL = 3;
  // Request failed structural or semantic validation (e.g. unset oneof, empty
  // request_id).
  ERROR_CODE_MALFORMED_REQUEST = 4;
  // Request payload exceeded the agent's configured size limit.
  ERROR_CODE_REQUEST_TOO_LARGE = 5;
  // Agent is already serving another connection; retry after a backoff.
  ERROR_CODE_BUSY = 6;
  // No usable mapping yet; guest disk has not been scanned.
  ERROR_CODE_MAPPING_REQUIRED = 7;
  // SyncRepoCPEMapping rejected because updater is not Sensor-managed.
  ERROR_CODE_MAPPING_NOT_SENSOR_MANAGED = 8;
}
