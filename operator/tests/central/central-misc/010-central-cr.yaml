# Same as operator/tests/common/central-cr.yaml but with admin password autogeneration.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  customize:
    envVars:
    - name: SCANNER_V4_MATCHER_VULNERABILITY_VERSION
      value: ci-minimal-bab3cec6e362f74bbe0c4f6a2e552ce1bac983feb836c449929f20cfd88bf4ce
  imagePullSecrets:
  - name: e2e-test-pull-secret
  # Resource settings should be in sync with /deploy/common/local-dev-values.yaml
  central:
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 4Gi
        cpu: 1
    db:
      resources:
        requests:
          memory: 1Gi
          cpu: 250m
        limits:
          memory: 4Gi
          cpu: 1
    telemetry:
      enabled: false
  centralWorker:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
  scannerV4:
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "250m"
          memory: "1500Mi"
        limits:
          cpu: "1000m"
          memory: "2Gi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "250m"
          memory: "1Gi"
        limits:
          cpu: "1000m"
          memory: "5500Mi"
    db:
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          cpu: "1000m"
          memory: "2500Mi"
