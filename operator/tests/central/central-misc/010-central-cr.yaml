# Same as operator/tests/common/central-cr.yaml but with admin password autogeneration.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  overlays:
  - apiVersion: apps/v1
    kind: Deployment
    name: central-worker
    patches:
    - path: spec.template.spec.containers[name:central-worker].env[-1]
      value: |
        name: GOMEMLIMIT
        value: 100MiB
  imagePullSecrets:
  - name: e2e-test-pull-secret
  # Resource settings should be in sync with /deploy/common/local-dev-values.yaml
  central:
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 1
    db:
      resources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 4Gi
          cpu: 1
    telemetry:
      enabled: false
  centralWorker:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
  scannerV4:
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "1500Mi"
        limits:
          cpu: "1000m"
          memory: "2Gi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          cpu: "1000m"
          memory: "5500Mi"
    db:
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          cpu: "1000m"
          memory: "2500Mi"
