# Same as operator/tests/common/central-cr.yaml but with admin password autogeneration.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  overlays:
  - apiVersion: apps/v1
    kind: Deployment
    name: central
    optional: true
    patches:
    - path: spec.template.spec.containers[name:central].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: central-worker
    optional: true
    patches:
    - path: spec.template.spec.containers[name:central-worker].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: config-controller
    optional: true
    patches:
    - path: spec.template.spec.containers[name:manager].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: central-db
    optional: true
    patches:
    - path: spec.template.spec.containers[name:central-db].resources.limits.cpu
    - path: spec.template.spec.initContainers[name:init-db].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-v4-matcher
    optional: true
    patches:
    - path: spec.template.spec.containers[name:matcher].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-v4-indexer
    optional: true
    patches:
    - path: spec.template.spec.containers[name:indexer].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-v4-db
    optional: true
    patches:
    - path: spec.template.spec.containers[name:db].resources.limits.cpu
    - path: spec.template.spec.initContainers[name:init-db].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner
    optional: true
    patches:
    - path: spec.template.spec.containers[name:scanner].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-db
    optional: true
    patches:
    - path: spec.template.spec.containers[name:db].resources.limits.cpu
    - path: spec.template.spec.initContainers[name:init-db].resources.limits.cpu
  customize:
    annotations:
      ci.stackrox.io/resource-policy: requests
  imagePullSecrets:
  - name: e2e-test-pull-secret
  # CI memory limits match requests; the policy removes CPU limits.
  central:
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 1Gi
    db:
      resources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 1Gi
    telemetry:
      enabled: false
  scannerV4:
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "1500Mi"
        limits:
          memory: "1500Mi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          memory: "2Gi"
    db:
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          memory: "2Gi"
