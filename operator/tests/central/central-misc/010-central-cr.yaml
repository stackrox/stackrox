# Same as operator/tests/common/central-cr.yaml but with admin password autogeneration.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  imagePullSecrets:
  - name: e2e-test-pull-secret
  # Resource settings should be in sync with /deploy/common/local-dev-values.yaml
  central:
    resources:
      requests:
        memory: 1Gi
        cpu: 150m
      limits:
        memory: 1Gi
    db:
      resources:
        requests:
          memory: 4Gi
          cpu: 100m
        limits:
          memory: 4Gi
    telemetry:
      enabled: false
  centralWorker:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
  scannerV4:
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "50m"
          memory: "512Mi"
        limits:
          memory: "512Mi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "50m"
          memory: "256Mi"
        limits:
          memory: "256Mi"
    db:
      resources:
        requests:
          cpu: "100m"
          memory: "4Gi"
        limits:
          memory: "4Gi"
