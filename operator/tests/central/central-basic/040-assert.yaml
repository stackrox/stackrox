apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
- type: pod
  selector: app=central
  tail: -1
- type: pod
  selector: app=central-db
  tail: -1
- command: retry-kubectl.sh describe pod -n $NAMESPACE -l app=central
- command: retry-kubectl.sh describe pod -n $NAMESPACE -l app=central-db
- command: retry-kubectl.sh describe pv
- command: retry-kubectl.sh describe pvc -n $NAMESPACE
- command: retry-kubectl.sh describe central.platform.stackrox.io -n $NAMESPACE stackrox-central-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central
  annotations:
    test-step: "40"
status:
  # Wait for pod to be ready again
  availableReplicas: 1
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    test-step: "40"
  labels:
    app: central
