apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  # Restart only Central to re-read the password without rolling the databases.
  overlays:
  - apiVersion: apps/v1
    kind: Deployment
    name: central
    patches:
    - path: metadata.annotations.test-step
      verbatim: "40"
    - path: spec.template.metadata.annotations.test-step
      verbatim: "40"
