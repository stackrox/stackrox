apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  customize:
    annotations:
      ci.stackrox.io/resource-policy: requests
  scannerV4:
    # We are not setting 'scannerComponent' explicitly to test the defaulting behaviour.
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "1500Mi"
        limits:
          memory: "1500Mi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          memory: "2Gi"
    db:
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          memory: "2Gi"
