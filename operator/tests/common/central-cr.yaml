# Please keep operator/tests/central/central-misc/010-central-cr.yaml in sync when changing this file.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  imagePullSecrets:
  - name: e2e-test-pull-secret
  # Small CPU requests let parallel CI stacks fit; limits still allow capped bursts.
  central:
    adminPasswordSecret:
      name: admin-pass
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 4Gi
        cpu: 1
    db:
      resources:
        requests:
          memory: 1Gi
          cpu: 250m
        limits:
          memory: 4Gi
          cpu: 1
    telemetry:
      enabled: false
  centralWorker:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "2000m"
        memory: 4Gi
  scannerV4:
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: 200m
          memory: "1500Mi"
        limits:
          cpu: "1000m"
          memory: "2Gi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: 200m
          memory: "2Gi"
        limits:
          cpu: "1000m"
          memory: "5500Mi"
    db:
      resources:
        requests:
          cpu: 200m
          memory: "2Gi"
        limits:
          cpu: "1000m"
          memory: "2500Mi"
  # NOTE: Unlike the other central-cr*.yaml copies, this file intentionally keeps spec.scanner,
  # so the "keep central-misc/010-central-cr.yaml in sync" note above does not apply to it.
  # TODO(ROX-36705): spec.scanner configures the removed Scanner V2. It is kept here (and only
  # here) because the operator upgrade test reuses this file via a symlink as its pre-upgrade CR,
  # where the previous released operator still deploys Scanner V2. It is an obsolete-but-tolerated
  # field that the current operator ignores, so it is harmless for the non-upgrade suites that also
  # use this file. Remove once the oldest upgrade-from operator version no longer deploys Scanner V2.
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          memory: 500Mi
          cpu: 250m
        limits:
          memory: 2500Mi
          cpu: 2000m
    db:
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 4Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-pass
data:
  # letmein
  password: bGV0bWVpbg==
