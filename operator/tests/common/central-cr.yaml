# Please keep operator/tests/central/central-misc/010-central-cr.yaml in sync when changing this file.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  overlays:
  - apiVersion: apps/v1
    kind: Deployment
    name: central
    optional: true
    patches:
    - path: spec.template.spec.containers[name:central].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: central-worker
    optional: true
    patches:
    - path: spec.template.spec.containers[name:central-worker].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: config-controller
    optional: true
    patches:
    - path: spec.template.spec.containers[name:manager].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: central-db
    optional: true
    patches:
    - path: spec.template.spec.containers[name:central-db].resources.limits.cpu
    - path: spec.template.spec.initContainers[name:init-db].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-v4-matcher
    optional: true
    patches:
    - path: spec.template.spec.containers[name:matcher].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-v4-indexer
    optional: true
    patches:
    - path: spec.template.spec.containers[name:indexer].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-v4-db
    optional: true
    patches:
    - path: spec.template.spec.containers[name:db].resources.limits.cpu
    - path: spec.template.spec.initContainers[name:init-db].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner
    optional: true
    patches:
    - path: spec.template.spec.containers[name:scanner].resources.limits.cpu
  - apiVersion: apps/v1
    kind: Deployment
    name: scanner-db
    optional: true
    patches:
    - path: spec.template.spec.containers[name:db].resources.limits.cpu
    - path: spec.template.spec.initContainers[name:init-db].resources.limits.cpu
  customize:
    annotations:
      ci.stackrox.io/resource-policy: requests
  imagePullSecrets:
  - name: e2e-test-pull-secret
  # CI memory limits match requests; the policy removes CPU limits.
  central:
    adminPasswordSecret:
      name: admin-pass
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 1Gi
    db:
      resources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 1Gi
    telemetry:
      enabled: false
  scannerV4:
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "1500Mi"
        limits:
          memory: "1500Mi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          memory: "2Gi"
    db:
      resources:
        requests:
          cpu: "400m"
          memory: "2Gi"
        limits:
          memory: "2Gi"
  # NOTE: Unlike the other central-cr*.yaml copies, this file intentionally keeps spec.scanner,
  # so the "keep central-misc/010-central-cr.yaml in sync" note above does not apply to it.
  # TODO(ROX-36705): spec.scanner configures the removed Scanner V2. It is kept here (and only
  # here) because the operator upgrade test reuses this file via a symlink as its pre-upgrade CR,
  # where the previous released operator still deploys Scanner V2. It is an obsolete-but-tolerated
  # field that the current operator ignores, so it is harmless for the non-upgrade suites that also
  # use this file. Remove once the oldest upgrade-from operator version no longer deploys Scanner V2.
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          memory: 500Mi
          cpu: 500m
        limits:
          memory: 500Mi
    db:
      resources:
        requests:
          cpu: 400m
          memory: 512Mi
        limits:
          memory: 512Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-pass
data:
  # letmein
  password: bGV0bWVpbg==
