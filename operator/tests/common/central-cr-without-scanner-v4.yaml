# Please keep operator/tests/central/central-misc/010-central-cr.yaml in sync when changing this file.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  imagePullSecrets:
  - name: e2e-test-pull-secret
  # Small CPU requests let parallel CI stacks fit; limits still allow capped bursts.
  central:
    adminPasswordSecret:
      name: admin-pass
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 4Gi
        cpu: 1
    db:
      resources:
        requests:
          memory: 1Gi
          cpu: 250m
        limits:
          memory: 4Gi
          cpu: 1
    telemetry:
      enabled: false
  centralWorker:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "2000m"
        memory: 4Gi
  scannerV4:
    scannerComponent: Disabled
    indexer:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: 200m
          memory: "1500Mi"
        limits:
          cpu: "1000m"
          memory: "2Gi"
    matcher:
      scaling:
        autoScaling: Disabled
        minReplicas: 1
        replicas: 1
      resources:
        requests:
          cpu: 200m
          memory: "2Gi"
        limits:
          cpu: "1000m"
          memory: "5500Mi"
    db:
      resources:
        requests:
          cpu: 200m
          memory: "2Gi"
        limits:
          cpu: "1000m"
          memory: "2500Mi"
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-pass
data:
  # letmein
  password: bGV0bWVpbg==
