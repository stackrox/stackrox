defs: |
  def managerEnv:
    .deployments["rhacs-operator-controller-manager"].spec.template.spec.containers[]
    | select(.name == "manager") | .env;

  def uniqueNames:
    assertThat((map(.name) | length) == (map(.name) | unique | length));

  def relatedImages:
    map(select(.name | startswith("RELATED_IMAGE_")));

tests:
- name: default environment omits related image placeholders and preserves resource references
  expect: |
    managerEnv | [
      uniqueNames,
      (relatedImages | assertThat(length == 0)),
      (map(select(.name == "MEMORY_LIMIT_BYTES")) | assertThat(.[0].valueFrom.resourceFieldRef.resource == "limits.memory"))
      ]
- name: a related image override is rendered once
  set:
    manager.envOverrides.RELATED_IMAGE_MAIN: registry.example.com/stackrox/main:4.11.7-amd64
  expect: |
    managerEnv | [
      uniqueNames,
      (relatedImages | assertThat(length == 1)),
      (map(select(.name == "RELATED_IMAGE_MAIN")) | assertThat(. == [{"name": "RELATED_IMAGE_MAIN", "value": "registry.example.com/stackrox/main:4.11.7-amd64"}]))
      ]
- name: all related images can be configured together
  set:
    manager.envOverrides:
      RELATED_IMAGE_MAIN: registry.example.com/stackrox/main:custom
      RELATED_IMAGE_COLLECTOR: registry.example.com/stackrox/collector:custom
      RELATED_IMAGE_FACT: registry.example.com/stackrox/fact:custom
      RELATED_IMAGE_ROXCTL: registry.example.com/stackrox/roxctl:custom
      RELATED_IMAGE_CENTRAL_DB: registry.example.com/stackrox/central-db:custom
      RELATED_IMAGE_SCANNER_V4_DB: registry.example.com/stackrox/scanner-v4-db:custom
      RELATED_IMAGE_SCANNER_V4: registry.example.com/stackrox/scanner-v4:custom
  expect: |
    managerEnv | [
      uniqueNames,
      (relatedImages | from_entries | assertThat(. == {
        "RELATED_IMAGE_MAIN": "registry.example.com/stackrox/main:custom",
        "RELATED_IMAGE_COLLECTOR": "registry.example.com/stackrox/collector:custom",
        "RELATED_IMAGE_FACT": "registry.example.com/stackrox/fact:custom",
        "RELATED_IMAGE_ROXCTL": "registry.example.com/stackrox/roxctl:custom",
        "RELATED_IMAGE_CENTRAL_DB": "registry.example.com/stackrox/central-db:custom",
        "RELATED_IMAGE_SCANNER_V4_DB": "registry.example.com/stackrox/scanner-v4-db:custom",
        "RELATED_IMAGE_SCANNER_V4": "registry.example.com/stackrox/scanner-v4:custom"
      })),
      (map(select(.name == "MEMORY_LIMIT_BYTES")) | assertThat(.[0].valueFrom.resourceFieldRef.resource == "limits.memory"))
      ]
- name: an explicitly empty related image override is rendered once
  set:
    manager.envOverrides.RELATED_IMAGE_MAIN: ""
  expect: |
    managerEnv | [
      uniqueNames,
      (map(select(.name == "RELATED_IMAGE_MAIN")) | assertThat(. == [{"name": "RELATED_IMAGE_MAIN", "value": ""}]))
      ]
