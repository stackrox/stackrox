---
# ServiceAccount that OLMv1 will impersonate to install the operator bundle
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhacs-operator-installer
  namespace: "${NAMESPACE}"
---
# ClusterRole with permissions needed to install the operator bundle
# The installer SA needs broad permissions to create CRDs, ClusterRoles, etc.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhacs-operator-installer-${NAMESPACE}
rules:
# Need to create CRDs and manage their finalizers
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["*"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions/finalizers"]
  verbs: ["update"]
# Need to create ClusterRoles and ClusterRoleBindings for the operator
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
  verbs: ["*"]
# Need to create operator Deployment, Service, ServiceAccount with finalizers
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments/finalizers"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["services", "serviceaccounts", "secrets", "configmaps"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["services/finalizers", "serviceaccounts/finalizers"]
  verbs: ["update"]
# Console plugin (OpenShift specific)
- apiGroups: ["console.openshift.io"]
  resources: ["consoleplugins"]
  verbs: ["*"]
# Need to read namespaces
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# Need to manage finalizers on ClusterExtension itself (for ownerReferences)
- apiGroups: ["olm.operatorframework.io"]
  resources: ["clusterextensions", "clusterextensions/finalizers"]
  verbs: ["get", "list", "watch", "update", "patch"]
# Need to manage ClusterObjectSets created by OLMv1 for bundle installation
- apiGroups: ["olm.operatorframework.io"]
  resources: ["clusterobjectsets", "clusterobjectsets/finalizers"]
  verbs: ["*"]
---
# Bind the installer SA to the ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhacs-operator-installer-${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhacs-operator-installer-${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: rhacs-operator-installer
  namespace: "${NAMESPACE}"
---
# ClusterCatalog - points to the index image containing operator bundles
apiVersion: olm.operatorframework.io/v1
kind: ClusterCatalog
metadata:
  name: rhacs-operator-catalog-${NAMESPACE}
spec:
  source:
    type: Image
    image:
      ref: "${INDEX_IMAGE_REPO}:${INDEX_IMAGE_TAG}"
---
# ClusterExtension - installs the operator from the catalog
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: rhacs-operator-${NAMESPACE}
spec:
  namespace: "${NAMESPACE}"
  serviceAccount:
    name: rhacs-operator-installer
  source:
    sourceType: Catalog
    catalog:
      packageName: rhacs-operator
      version: ${OPERATOR_VERSION}
  install:
    preflight:
      crdUpgradeSafety:
        # Use None (not Strict) because CI tests jump across many versions (e.g. 4.11.0 -> latest commit)
        # and CRD schemas evolve in ways that the strict validation does not support.
        # We have another GHA-based check which does similar validation
        # with special cases as appropriate.
        # See /.github/workflows/check-crd-compatibility.yaml
        enforcement: None
