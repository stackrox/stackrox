






apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-control
  namespace: stackrox
  labels:
    app.kubernetes.io/component: admission-control
    app.kubernetes.io/instance: stackrox-secured-cluster-services
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stackrox
    app.kubernetes.io/part-of: stackrox-secured-cluster-services
    app.kubernetes.io/version: 5.1.x-646-g094ca6154f
    auto-upgrade.stackrox.io/component: sensor
    helm.sh/chart: sensor-500.1.0-646-g094ca6154f
    app: admission-control
  annotations:
    email: support@stackrox.com
    meta.helm.sh/release-name: stackrox-secured-cluster-services
    meta.helm.sh/release-namespace: stackrox
    owner: stackrox
spec:
  replicas: 3
  minReadySeconds: 0
  selector:
    matchLabels:
      app: admission-control
  template:
    metadata:
      namespace: stackrox
      labels:
        app: admission-control
        app.kubernetes.io/component: admission-control
        app.kubernetes.io/instance: stackrox-secured-cluster-services
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: stackrox
        app.kubernetes.io/part-of: stackrox-secured-cluster-services
        app.kubernetes.io/version: 5.1.x-646-g094ca6154f
        helm.sh/chart: sensor-500.1.0-646-g094ca6154f
        sidecar.istio.io/inject: "false"
      annotations:
        email: support@stackrox.com
        meta.helm.sh/release-name: stackrox-secured-cluster-services
        meta.helm.sh/release-namespace: stackrox
        owner: stackrox
    spec:
      # Attempt to schedule these on master nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
            weight: 50
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: admission-control
              topologyKey: kubernetes.io/hostname
            weight: 60
      securityContext:
        runAsUser: 4000
        fsGroup: 4000
      serviceAccountName: admission-control
      containers:
        - image: "quay.io/rhacs-eng/main:5.1.x-646-g094ca6154f"
          imagePullPolicy: IfNotPresent
          name: admission-control
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /ready
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 1
          ports:
            - containerPort: 8443
              name: webhook
          command:
            - admission-control
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 50m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          env:
          - name: ROX_MEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
          - name: GOMAXPROCS
            valueFrom:
              resourceFieldRef:
                resource: limits.cpu
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ROX_SENSOR_ENDPOINT
            value: sensor.stackrox.svc:443
          - name: ROX_ADMISSION_CONTROL_IMAGE_CACHE_MAX_SIZE
            value: "200"

          - name: "ROX_ACM_ACCESS_CONTROL_DELEGATION"
            value: "false"

          - name: "ROX_ADMISSION_CONTROLLER_CONFIG"
            value: "true"

          - name: "ROX_AGGREGATE_DEPLOYMENT_REFERENCE_OPTIMIZATION"
            value: "true"

          - name: "ROX_ATTEMPT_MANIFEST_DIGEST"
            value: "true"

          - name: "ROX_AUTO_LOCK_PROCESS_BASELINES"
            value: "true"

          - name: "ROX_BACKGROUND_MIGRATION"
            value: "true"

          - name: "ROX_BASE_IMAGE_DETECTION"
            value: "true"

          - name: "ROX_CISA_KEV"
            value: "true"

          - name: "ROX_CLUSTERS_PAGE_MIGRATION_UI"
            value: "true"

          - name: "ROX_CLUSTER_AWARE_DEPLOYMENT_CHECK"
            value: "true"

          - name: "ROX_CLUSTER_REGISTRATION_SECRETS"
            value: "true"

          - name: "ROX_COMPLIANCE_CUSTOM_NODE_ROLES"
            value: "false"

          - name: "ROX_COMPLIANCE_ENHANCEMENTS"
            value: "true"

          - name: "ROX_COMPLIANCE_REMEDIATION"
            value: "true"

          - name: "ROX_COMPLIANCE_REPORTING"
            value: "true"

          - name: "ROX_COMPLIANCE_SURFACE_STALE_DATA"
            value: "false"

          - name: "ROX_CUSTOMIZABLE_PLATFORM_COMPONENTS"
            value: "true"

          - name: "ROX_CVE_FIX_TIMESTAMP"
            value: "true"

          - name: "ROX_DELEGATED_BASE_IMAGE_SCANNING"
            value: "false"

          - name: "ROX_DELEGATE_WATCHED_IMAGE_REPROCESSING"
            value: "true"

          - name: "ROX_DEPLOYMENT_BUILD_OPTIMIZATION"
            value: "true"

          - name: "ROX_EXTERNAL_IPS"
            value: "true"

          - name: "ROX_FLATTEN_IMAGE_DATA"
            value: "true"

          - name: "ROX_IMAGE_LAYER_FILTER"
            value: "false"

          - name: "ROX_LABEL_BASED_POLICY_SCOPING"
            value: "true"

          - name: "ROX_LEGACY_SCANNER"
            value: "false"

          - name: "ROX_LIGHTSPEED_RISK_SUMMARY"
            value: "true"

          - name: "ROX_NETWORK_GRAPH_AGGREGATE_EXT_IPS"
            value: "false"

          - name: "ROX_NETWORK_GRAPH_EXTERNAL_IPS"
            value: "true"

          - name: "ROX_NODE_INDEX_ENABLED"
            value: "true"

          - name: "ROX_NODE_VULNERABILITY_REPORTS"
            value: "true"

          - name: "ROX_OCP_CONSOLE_INTEGRATION"
            value: "true"

          - name: "ROX_OPTIMIZED_BASELINE_MEMORY"
            value: "false"

          - name: "ROX_PLATFORM_COMPONENTS"
            value: "true"

          - name: "ROX_POLICY_WORKLOAD_KIND_EXCLUSION"
            value: "true"

          - name: "ROX_SBOM_SCANNING"
            value: "true"

          - name: "ROX_SCANNER_V4_DEDUPE"
            value: "true"

          - name: "ROX_SCANNER_V4_MAVEN_SEARCH"
            value: "false"

          - name: "ROX_SCANNER_V4_PARTIAL_NODE_JS_SUPPORT"
            value: "false"

          - name: "ROX_SCANNER_V4_RED_HAT_CSAF"
            value: "true"

          - name: "ROX_SCANNER_V4_RED_HAT_CVES"
            value: "true"

          - name: "ROX_SCANNER_V4_RED_HAT_LAYERS_RED_HAT_VULNS_ONLY"
            value: "false"

          - name: "ROX_SCANNER_V4_RED_HAT_VEX_NOT_AFFECTED"
            value: "true"

          - name: "ROX_SCANNER_V4_REINDEX"
            value: "true"

          - name: "ROX_SCANNER_V4_STORE_EXTERNAL_INDEX_REPORTS"
            value: "true"

          - name: "ROX_SCANNER_V4_SUPPRESS_OSV_WITH_RED_HAT_VEX"
            value: "true"

          - name: "ROX_SCAN_SCHEDULE_REPORT_JOBS"
            value: "true"

          - name: "ROX_SENSITIVE_FILE_ACTIVITY"
            value: "true"

          - name: "ROX_SENSOR_INFORMER_WATCHDOG"
            value: "true"

          - name: "ROX_SENSOR_PUBSUB"
            value: "true"

          - name: "ROX_SENSOR_PULL_SECRETS_BY_NAME"
            value: "true"

          - name: "ROX_SENSOR_SINGLE_SCAN"
            value: "true"

          - name: "ROX_SOURCED_AUTOGENERATED_INTEGRATIONS"
            value: "false"

          - name: "ROX_STORE_EVENT_HASHES"
            value: "true"

          - name: "ROX_UI_SECRETS_PAGE_MIGRATION"
            value: "false"

          - name: "ROX_UNQUALIFIED_SEARCH_REGISTRIES"
            value: "false"

          - name: "ROX_VIRTUAL_MACHINES_ENHANCED_DATA_MODEL"
            value: "true"

          - name: "ROX_VULNERABILITY_REPORTS_ENHANCED_FILTERING"
            value: "true"

          - name: "ROX_VULNERABILITY_REPORT_STREAMING_DOWNLOAD"
            value: "true"

          - name: "ROX_VULNERABILITY_VIEW_BASED_REPORTS"
            value: "true"

          - name: "ROX_VULN_MGMT_LEGACY_SNOOZE"
            value: "false"

          volumeMounts:
            - name: config
              mountPath: /run/config/stackrox.io/admission-control/config/
              readOnly: true
            - name: config-store
              mountPath: /var/lib/stackrox/admission-control/
            - name: ca
              mountPath: /run/secrets/stackrox.io/ca/
              readOnly: true
            - name: certs
              mountPath: /run/secrets/stackrox.io/certs/
              readOnly: true
            - name: ssl
              mountPath: /etc/ssl
            - name: pki
              mountPath: /etc/pki/ca-trust/
            - name: additional-cas
              mountPath: /usr/local/share/ca-certificates/
              readOnly: true


      volumes:
        - name: certs
          secret:
            secretName: admission-control-tls
            optional: true
            items:
            - key: admission-control-cert.pem
              path: cert.pem
            - key: admission-control-key.pem
              path: key.pem
            - key: ca.pem
              path: ca.pem
        - name: ca
          secret:
            secretName: service-ca
            optional: true
        - name: config
          configMap:
            name: admission-control
            optional: true
        - name: config-store
          emptyDir: {}
        - name: ssl
          emptyDir: {}
        - name: pki
          emptyDir: {}
        - name: additional-cas
          secret:
            secretName: additional-ca-sensor
            optional: true


---

apiVersion: v1
kind: Service
metadata:
  name: admission-control
  namespace: stackrox
  labels:
    app.kubernetes.io/component: admission-control
    app.kubernetes.io/instance: stackrox-secured-cluster-services
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stackrox
    app.kubernetes.io/part-of: stackrox-secured-cluster-services
    app.kubernetes.io/version: 5.1.x-646-g094ca6154f
    auto-upgrade.stackrox.io/component: sensor
    helm.sh/chart: sensor-500.1.0-646-g094ca6154f
  annotations:
    email: support@stackrox.com
    meta.helm.sh/release-name: stackrox-secured-cluster-services
    meta.helm.sh/release-namespace: stackrox
    owner: stackrox
spec:
  ports:
    - name: https
      port: 443
      targetPort: webhook
      protocol: TCP
  selector:
    app: admission-control
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: stackrox
  labels:
    app.kubernetes.io/component: admission-control
    app.kubernetes.io/instance: stackrox-secured-cluster-services
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stackrox
    app.kubernetes.io/part-of: stackrox-secured-cluster-services
    app.kubernetes.io/version: 5.1.x-646-g094ca6154f
    auto-upgrade.stackrox.io/component: sensor
    helm.sh/chart: sensor-500.1.0-646-g094ca6154f
  annotations:
    email: support@stackrox.com
    meta.helm.sh/release-name: stackrox-secured-cluster-services
    meta.helm.sh/release-namespace: stackrox
    owner: stackrox
webhooks:
  - name: k8sevents.stackrox.io
    sideEffects: NoneOnDryRun
    admissionReviewVersions: [ "v1", "v1beta1" ]
    timeoutSeconds: 12
    rules:
      - apiGroups:
        - '*'
        apiVersions:
        - '*'
        operations:
        - CONNECT
        resources:
          - pods
          - pods/exec
          - pods/portforward
          - pods/attach
    failurePolicy: "Ignore"
    clientConfig:
      caBundle: cGxhY2Vob2xkZXItY2EtY2VydC1ub3QtYS1yZWFsLWNlcnRpZmljYXRl
      service:
        namespace: stackrox
        name: admission-control
        path: /events
