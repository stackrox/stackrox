apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-db
  namespace: stackrox
  labels:
    app: central-db
    app.kubernetes.io/component: central
    app.kubernetes.io/instance: stackrox-central-services
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stackrox
    app.kubernetes.io/part-of: stackrox-central-services
    app.kubernetes.io/version: 5.1.x-353-g0fa6ce3715
    helm.sh/chart: stackrox-central-services-500.1.0-353-g0fa6ce3715
  annotations:
    email: support@stackrox.com
    meta.helm.sh/release-name: stackrox-central-services
    meta.helm.sh/release-namespace: stackrox
    owner: stackrox
spec:
  replicas: 1
  minReadySeconds: 15
  selector:
    matchLabels:
      app: central-db
  strategy:
    type: Recreate
  template:
    metadata:
      namespace: stackrox
      labels:
        app: central-db
        app.kubernetes.io/component: central
        app.kubernetes.io/instance: stackrox-central-services
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: stackrox
        app.kubernetes.io/part-of: stackrox-central-services
        app.kubernetes.io/version: 5.1.x-353-g0fa6ce3715
        helm.sh/chart: stackrox-central-services-500.1.0-353-g0fa6ce3715
        sidecar.istio.io/inject: "false"
      annotations:
        email: support@stackrox.com
        meta.helm.sh/release-name: stackrox-central-services
        meta.helm.sh/release-namespace: stackrox
        owner: stackrox
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-1
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # Central-db is single-homed, so avoid preemptible nodes.
            - weight: 100
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-preemptible
                    operator: NotIn
                    values:
                      - "true"
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/infra
                    operator: Exists
            - weight: 25
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/compute
                    operator: Exists
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      serviceAccountName: central-db
      terminationGracePeriodSeconds: 120
      shareProcessNamespace: true
      initContainers:
        - name: init-db
          image: "quay.io/rhacs-eng/central-db:5.1.x-353-g0fa6ce3715"
          env:
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          command:
            - init-entrypoint.sh
          volumeMounts:
            - name: disk
              mountPath: /var/lib/postgresql/data
            - name: central-db-password
              mountPath: /run/secrets/stackrox.io/secrets
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
            requests:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
      containers:
        - name: central-db
          image: "quay.io/rhacs-eng/central-db:5.1.x-353-g0fa6ce3715"
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "password"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgresql
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - -e
                - |
                  exec pg_isready -U "postgres" -h 127.0.0.1 -p 5432
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
            requests:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
          volumeMounts:
            - name: config-volume
              mountPath: /etc/stackrox.d/config/
            - mountPath: /var/lib/postgresql/data
              name: disk
            - name: central-db-tls-volume
              mountPath: /run/secrets/stackrox.io/certs
            - mountPath: /dev/shm
              name: shared-memory
        - name: cert-watcher
          image: "quay.io/rhacs-eng/central-db:5.1.x-353-g0fa6ce3715"
          command:
            - cert-watcher.sh
          env:
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: central-db-tls-volume
              mountPath: /run/secrets/stackrox.io/certs
              readOnly: true
            - name: disk
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
      securityContext:
        fsGroup: 70
      volumes:
        - name: disk
          hostPath:
            path: /var/lib/stackrox-central
        - name: config-volume
          configMap:
            name: central-db-config
        - name: central-db-password
          secret:
            secretName: central-db-password
        - name: central-db-tls-volume
          secret:
            secretName: central-db-tls
            defaultMode: 0640
            items:
              - key: cert.pem
                path: server.crt
              - key: key.pem
                path: server.key
              - key: ca.pem
                path: root.crt
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
