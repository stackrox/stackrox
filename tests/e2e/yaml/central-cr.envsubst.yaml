apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
spec:
  # Match the values set by deploy/ scripts.
  central:
    adminPasswordSecret:
      name: central-admin-pass
    defaultTLSSecret:
      name: central-default-tls-secret
    exposure:
      loadBalancer:
        enabled: $central_exposure_loadBalancer_enabled
      route:
        enabled: $central_exposure_route_enabled
    declarativeConfiguration:
      configMaps:
      - name: "declarative-configurations"
      secrets:
      - name: "sensitive-declarative-configurations"
    db:
      resources:
        limits:
          cpu: 8
          memory: 16Gi
        requests:
          cpu: 1
          memory: 1Gi
${disableSpecTLS}  tls:
${disableSpecTLS}    additionalCAs:
${disableSpecTLS}    - name: additional-ca
${disableSpecTLS}      content: |
$centralAdditionalCAIndented
  customize:
    envVars:$customize_envVars
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
  scannerV4:
    scannerComponent: "$scannerV4ScannerComponent"
    indexer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: "400m"
    matcher:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: "400m"
          # Test-only bump: the default (1.5Gi req / 3Gi limit) OOM-kills the
          # matcher under heavy scan load (e.g. compliance). Requesting 3Gi also
          # raises the Go soft limit (ROX_MEMLIMIT=95% of requests) to ~2.85Gi,
          # and the 6Gi limit gives spike headroom. Not a product default.
          memory: "3Gi"
        limits:
          memory: "6Gi"
    db:
$scannerV4DbPersistenceYaml
      resources:
        requests:
          cpu: "500m"
---
apiVersion: v1
kind: Secret
metadata:
  name: central-admin-pass
data:
  password: $centralAdminPasswordBase64
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: central-default-tls-secret
data:
  tls.key: $centralDefaultTlsSecretKeyBase64
  tls.crt: $centralDefaultTlsSecretCertBase64
