apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
spec:
  centralEndpoint: $central_endpoint
  clusterName: remote
  admissionControl:
    resources:
      requests:
        memory: "100Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"
  sensor:
    resources:
      requests:
        memory: "100Mi"
        cpu: "300m"
      limits:
        memory: "100Mi"
  perNode:
    fileActivityMonitoring:
      mode: $fam_mode_setting
    collector:
      resources:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
    compliance:
      resources:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
    nodeInventory:
      resources:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
  virtualMachines:
    scraper:
      pollInterval: $vm_scraper_poll_interval
  processIndicators:
    excludeNamespaceRegex: namespace-without-persistence
  scanner:
    scannerComponent: $scanner_component_setting
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          memory: 500Mi
          cpu: 500m
        limits:
          memory: 500Mi
    db:
      resources:
        requests:
          cpu: 400m
          memory: 512Mi
        limits:
          memory: 512Mi
  scannerV4:
    scannerComponent: AutoSense
    indexer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: "1000m"
          memory: "1500Mi"
        limits:
          memory: "1500Mi"
    db:
$scannerV4DbPersistenceYaml
      resources:
        requests:
          cpu: "200m"
          memory: "2Gi"
        limits:
          memory: "2Gi"
  customize:
    annotations:
      ci.stackrox.io/resource-policy: requests
    envVars:$customize_envVars
