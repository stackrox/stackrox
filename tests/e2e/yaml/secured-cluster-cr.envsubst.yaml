apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
spec:
  centralEndpoint: $central_endpoint
  clusterName: remote
  perNode:
    fileActivityMonitoring:
      mode: $fam_mode_setting
  virtualMachines:
    scraper:
      pollInterval: $vm_scraper_poll_interval
  processIndicators:
    excludeNamespaceRegex: namespace-without-persistence
  scanner:
    scannerComponent: $scanner_component_setting
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          memory: 500Mi
          cpu: 500m
        limits:
          memory: 500Mi
    db:
      resources:
        requests:
          cpu: 400m
          memory: 512Mi
        limits:
          memory: 512Mi
  customize:
    annotations:
      ci.stackrox.io/resource-policy: requests
    envVars:$customize_envVars
