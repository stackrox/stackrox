# Namespaces backing the objects below. These normally exist on real OpenShift;
# kind needs them created explicitly before namespaced objects (ConfigMaps,
# IngressController, DaemonSet) can be applied into them.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-kube-apiserver
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-apiserver
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-kube-controller-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-etcd
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-sdn
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-ingress-operator
---
# --- config.openshift.io/v1 singletons -------------------------------------
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
spec:
  audit:
    profile: Default
  clientCA:
    name: ""
  encryption:
    type: identity
  servingCerts: {}
  tlsSecurityProfile:
    type: Intermediate
---
apiVersion: config.openshift.io/v1
kind: Infrastructure
metadata:
  name: cluster
spec:
  platformSpec:
    type: None
status:
  apiServerURL: https://api.kind-platform.example.com:6443
  controlPlaneTopology: HighlyAvailable
  cpuPartitioning: None
  infrastructureName: kind-platform
  infrastructureTopology: HighlyAvailable
  platform: None
  platformStatus:
    type: None
---
apiVersion: config.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  externalIP:
    policy: {}
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
status:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  clusterNetworkMTU: 1400
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
---
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - name: htpasswd_provider
    mappingMethod: claim
    type: HTPasswd
    htpasswd:
      fileData:
        name: htpass-secret
  tokenConfig:
    accessTokenMaxAgeSeconds: 86400
---
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
spec:
  allowedRegistriesForImport: []
  registrySources:
    insecureRegistries: []
    blockedRegistries: []
status:
  externalRegistryHostnames:
  - default-route-openshift-image-registry.apps.kind-platform.example.com
  internalRegistryHostname: image-registry.openshift-image-registry.svc:5000
---
apiVersion: config.openshift.io/v1
kind: ClusterOperator
metadata:
  name: kube-apiserver
spec: {}
status:
  conditions:
  - type: Available
    status: "True"
    lastTransitionTime: "2026-10-31T00:00:00Z"
    reason: AsExpected
  - type: Progressing
    status: "False"
    lastTransitionTime: "2026-10-31T00:00:00Z"
    reason: AsExpected
  - type: Degraded
    status: "False"
    lastTransitionTime: "2026-10-31T00:00:00Z"
    reason: AsExpected
  - type: Upgradeable
    status: "True"
    lastTransitionTime: "2026-10-31T00:00:00Z"
    reason: AsExpected
  relatedObjects:
  - group: ""
    resource: namespaces
    name: openshift-kube-apiserver
  versions:
  - name: operator
    version: 4.17.0
---
# --- operator.openshift.io/v1 singletons ------------------------------------
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  defaultNetwork:
    ovnKubernetesConfig:
      genevePort: 6081
      mtu: 1400
    type: OVNKubernetes
  deployKubeProxy: false
  logLevel: Normal
  managementState: Managed
  operatorLogLevel: Normal
  serviceNetwork:
  - 172.30.0.0/16
---
apiVersion: operator.openshift.io/v1
kind: KubeAPIServer
metadata:
  name: cluster
spec:
  logLevel: Normal
  managementState: Managed
  operatorLogLevel: Normal
---
apiVersion: operator.openshift.io/v1
kind: OpenShiftAPIServer
metadata:
  name: cluster
spec:
  logLevel: Normal
  managementState: Managed
  operatorLogLevel: Normal
---
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
