apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: compliance-operator
    olm.owner: compliance-operator.v1.11.0-dev
  name: compliance-operator
  namespace: openshift-compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      name: compliance-operator
  strategy: {}
  template:
    metadata:
      annotations:
        workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        name: compliance-operator
    spec:
      containers:
      - command:
        - compliance-operator
        - operator
        env:
        - name: WATCH_NAMESPACE
          value: openshift-compliance
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RELATED_IMAGE_OPENSCAP
          value: quay.io/redhat-user-workloads/ocp-isc-tenant/compliance-operator-openscap-dev:master
        - name: RELATED_IMAGE_OPERATOR
          value: quay.io/redhat-user-workloads/ocp-isc-tenant/compliance-operator-dev:master
        - name: RELATED_IMAGE_PROFILE
          value: quay.io/redhat-user-workloads/ocp-isc-tenant/compliance-operator-content-dev:master
        - name: PLATFORM
          value: Generic
        image: quay.io/redhat-user-workloads/ocp-isc-tenant/compliance-operator-dev:master
        imagePullPolicy: IfNotPresent
        name: compliance-operator
        resources:
          limits:
            cpu: 200m
            memory: 500Mi
          requests:
            cpu: 10m
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /var/run/secrets/serving-cert
          name: serving-cert
          readOnly: true
      serviceAccountName: compliance-operator
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      volumes:
      - name: serving-cert
        secret:
          optional: true
          secretName: compliance-operator-serving-cert
