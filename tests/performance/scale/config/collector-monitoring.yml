apiVersion: v1
kind: Service
metadata:
  name: collector-monitoring
  namespace: stackrox
  labels:
    app.kubernetes.io/component: collector-monitoring
spec:
  selector:
    app: collector
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: collector-monitoring
  namespace: openshift-monitoring
spec:
  namespaceSelector:
    matchNames:
    - stackrox
  selector:
    matchLabels:
      app.kubernetes.io/component: collector-monitoring
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-monitoring-to-collector-metrics
  namespace: stackrox
spec:
  podSelector:
    matchLabels:
      app: collector
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - protocol: TCP
      port: 9090
