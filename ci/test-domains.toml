# Rules are walked from top to bottom. A later run overrides an earlier skip.
# A later skip does not override an earlier run: the plan warns, and the
# job runs. A job no rule has mentioned stays unsure until the last rule,
# which skips whatever is left. Rules do not say unsure.
#
# The jobs list is every target a pull request can hit: GitHub Actions
# job ids, then Prow job names. A prerequisite is a target too.

version = 1

jobs = [
  "style-check",
  "misc-checks",
  "golangci-lint",
  "check-generated-files",
  "github-actions-lint",
  "github-actions-shellcheck",
  "openshift-ci-lint",
  "check-dependent-images-exist",
  "check-crd-compatibility",
  "go",
  "go-postgres",
  "go-bench",
  "ui",
  "ui-component",
  "local-roxctl-tests",
  "shell-unit-tests",
  "openshift-ci-unit-tests",
  "sensor-integration-tests",
  "db-integration-tests",
  "scanner-ft-images",
  "scanner-ft-run",
  "e2e-byodb-tests",
  "e2e-db-backup-restore-tests",
  "e2e-gke-upgrade-tests",
  "e2e-nongroovy-tests",
  "e2e-qa-tests-gke",
  "e2e-qa-tests-gke-konflux",
  "e2e-qa-tests-ocp-4-22",
  "e2e-test-on-kind",
  "should-dispatch",
  "wait-for-images",
  "wait-for-konflux-images",
  "aks-qa-e2e-tests",
  "aro-qa-e2e-tests",
  "eks-qa-e2e-tests",
  "gke-external-pg-17-qa-e2e-tests",
  "gke-nongroovy-compatibility-tests",
  "gke-nongroovy-e2e-tests",
  "gke-operator-e2e-tests",
  "gke-qa-e2e-tests",
  "gke-race-condition-qa-e2e-tests",
  "gke-scale-tests",
  "gke-scanner-v4-install-tests",
  "gke-ui-e2e-tests",
  "gke-version-compatibility-tests",
  "ibmcloudz-qa-e2e-tests",
  "ocp-compliance-e2e-tests",
  "ocp-nongroovy-e2e-tests",
  "ocp-operator-e2e-tests",
  "ocp-perf-scale-tests",
  "ocp-qa-e2e-tests",
  "ocp-scanner-v4-install-tests",
  "ocp-ui-e2e-tests",
  "ocp-vm-scanning-e2e-tests",
  "osd-aws-qa-e2e-tests",
  "osd-gcp-qa-e2e-tests",
  "powervs-qa-e2e-tests",
  "rosa-qa-e2e-tests",
  "ui-component-tests",
]

# The run-all label starts every job. A later skip does not undo that.
[[rules]]
name = "run-all-label"
when = "label-exists"
label = "ci-run-all-tests"
run = ["*"]

# A missing diff may be the whole tree.
[[rules]]
name = "no-files"
when = "no-file-changed"
run = ["*"]

# One of these files means the whole tree may have changed.
[[rules]]
name = "tree-may-have-changed"
when = "any-file-changed"
paths = ['^go\.mod$', '^go\.sum$', '^proto/', '^generated/']
run = ["*"]

# Every changed file is documentation. Go tests do not run.
[[rules]]
name = "docs-only"
when = "all-files-changed"
paths = ['\.md$', '^docs/', '^CHANGELOG']
run = ["style-check"]
skip = ["go"]

# Any Go source runs the Go unit tests. A directory rule does not hide this.
[[rules]]
name = "go-sources"
when = "any-file-changed"
paths = ['\.go$']
run = ["go"]

# Any diff that has a file runs style.
[[rules]]
name = "style"
when = "any-file-changed"
paths = ['.*']
run = ["style-check"]

# Sensor changes run the Sensor integration job and skip Central Postgres.
[[rules]]
name = "sensor"
when = "any-file-changed"
paths = ['^sensor/']
run = ["sensor-integration-tests"]
skip = ["go-postgres"]

# Policy package changes run Central Postgres and skip Sensor integration.
[[rules]]
name = "central-policy"
when = "any-file-changed"
paths = ['^central/policy/']
run = ["go-postgres"]
skip = ["sensor-integration-tests"]

# The image wait has to pass before an image-backed test can start.
[[rules]]
name = "image-wait"
when = "always"
run = ["wait-for-images"]

# A change to the Prow entrypoint keeps two suites: one Prow starts on
# every pull request, and vm-scanning, which stays off unless someone asks.
[[rules]]
name = "prow-demo-run"
when = "any-file-changed"
paths = ['^\.openshift-ci/dispatch\.sh$']
run = ["gke-nongroovy-e2e-tests", "ocp-vm-scanning-e2e-tests"]

# That same change skips the other suites Prow starts on every pull request.
[[rules]]
name = "prow-demo-skip"
when = "any-file-changed"
paths = ['^\.openshift-ci/dispatch\.sh$']
skip = ["gke-ui-e2e-tests", "gke-qa-e2e-tests"]

# Mandatory. Skips every job that is still unsure.
[[rules]]
name = "remaining"
when = "remaining"
skip = ["*"]

[requires]
wait-for-images = ["should-dispatch"]
wait-for-konflux-images = ["should-dispatch"]
e2e-byodb-tests = ["wait-for-images"]
e2e-db-backup-restore-tests = ["wait-for-images"]
e2e-gke-upgrade-tests = ["wait-for-images"]
e2e-nongroovy-tests = ["wait-for-images"]
e2e-qa-tests-gke = ["wait-for-images"]
e2e-qa-tests-ocp-4-22 = ["wait-for-images"]
e2e-qa-tests-gke-konflux = ["wait-for-konflux-images"]
scanner-ft-run = ["scanner-ft-images"]
