# Rules are walked from top to bottom.
# One rule saying run and another saying skip runs the target. The last
# rule covers every target that no earlier rule decided. default = ["*"]
# reads ci/decision-defaults.

version = 1

jobs = [
  "style-check",
  "go",
  "go-postgres",
  "sensor-integration-tests",
  "should-dispatch",
  "wait-for-images",
  "e2e-byodb-tests",
  "e2e-db-backup-restore-tests",
  "e2e-gke-upgrade-tests",
  "e2e-nongroovy-tests",
  "e2e-qa-tests-gke",
  "e2e-qa-tests-gke-konflux",
  "e2e-qa-tests-ocp-4-22",
  "gke-nongroovy-e2e-tests",
  "gke-qa-e2e-tests",
  "gke-ui-e2e-tests",
  "ocp-vm-scanning-e2e-tests",
]

# The label votes run for every target. A skip from another rule clashes,
# and that clash runs the job.
[[rules]]
name = "run-all-label"
when = "label-exists"
label = "ci-run-all-tests"
run = ["*"]

# These files can change code the path rules do not name.
[[rules]]
name = "tree-may-have-changed"
when = "any-file-matches"
paths = ['^go\.mod$', '^go\.sum$', '^proto/', '^generated/']
run = ["*"]

# A docs-only change skips every target. style-check and wait-for-images
# still get a run vote, so those clashes run.
[[rules]]
name = "docs-only"
when = "every-file-matches"
paths = ['\.md$', '^docs/', '^CHANGELOG']
skip = ["*"]

# Workflow hooks and the selector do not change the product under test.
# The rule applies only when every changed file is one of these paths.
[[rules]]
name = "ci-tooling"
when = "every-file-matches"
paths = [
  '^\.github/workflows/',
  '^\.openshift-ci/',
  '^ci/select/',
  '^ci/decision-defaults$',
  '^ci/test-domains\.toml$',
]
skip = [
  "e2e-byodb-tests",
  "e2e-db-backup-restore-tests",
  "e2e-gke-upgrade-tests",
  "e2e-nongroovy-tests",
  "e2e-qa-tests-gke",
  "e2e-qa-tests-gke-konflux",
  "e2e-qa-tests-ocp-4-22",
  "gke-nongroovy-e2e-tests",
  "gke-qa-e2e-tests",
  "gke-ui-e2e-tests",
  "ocp-vm-scanning-e2e-tests",
]

[[rules]]
name = "go-sources"
when = "any-file-matches"
paths = ['\.go$']
run = ["go"]

[[rules]]
name = "style"
when = "always"
run = ["style-check"]

[[rules]]
name = "sensor"
when = "any-file-matches"
paths = ['^sensor/']
run = ["sensor-integration-tests"]
skip = ["go-postgres"]

[[rules]]
name = "central-policy"
when = "any-file-matches"
paths = ['^central/policy/']
run = ["go-postgres"]
skip = ["sensor-integration-tests"]

[[rules]]
name = "image-wait"
when = "always"
run = ["wait-for-images"]

[[rules]]
name = "remaining"
when = "remaining"
default = ["*"]

[requires]
wait-for-images = ["should-dispatch"]
e2e-byodb-tests = ["wait-for-images"]
e2e-db-backup-restore-tests = ["wait-for-images"]
e2e-gke-upgrade-tests = ["wait-for-images"]
e2e-nongroovy-tests = ["wait-for-images"]
e2e-qa-tests-gke = ["wait-for-images"]
e2e-qa-tests-ocp-4-22 = ["wait-for-images"]
e2e-qa-tests-gke-konflux = ["wait-for-images"]
