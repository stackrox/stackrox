version: 1
jobs: [go, go-postgres, go-bench, sensor-integration-tests]
rules:
  - name: frontend-and-docs-only
    when: safe-paths
    paths: ['^ui/', '^docs/', '^[^/]+\.md$']
    skip: [go, go-postgres, go-bench, sensor-integration-tests]

  - name: central-only-domains
    when: safe-paths
    paths:
      - '^central/(sac|search|auth|authprovider|apitoken|user|group|role|rbac|jwt|serviceidentities)/'
      - '^central/(postgres|globaldb|globalindex|graphdb|dackbox|blob|views)/'
      - '^central/(notifier|notifiers|reports|reportconfigurations)/'
      - '^central/(externalbackups|declarativeconfig|config|installation)/'
      - '^central/(ui|graphql|grpc|endpoints)/'
      - '^central/(featureflags|development|audit|logimbue|trace)/'
      - '^central/(helmcharts|ping|version|systeminfo|docs|internal)/'
    skip: [sensor-integration-tests]

  - name: sensor-only-domains
    when: safe-paths
    paths:
      - '^sensor/(admission-control|upgrader|debugger|testutils|tests)/'
      - '^sensor/kubernetes/(fake|client|enforcer)/'
    skip: [go-postgres, go-bench]

  - name: scanner-only
    when: safe-paths
    paths: ['^scanner/']
    skip: [go-postgres, go-bench, sensor-integration-tests]

  - name: operator-only
    when: safe-paths
    # operator/api is imported by PostgreSQL and Sensor tests. New roots
    # require review before joining this allowlist.
    paths:
      - '^operator/(build|bundle|bundle_helpers|cmd|config|hack|install|internal|midstream|tests|tools)/'
      - '^operator/[^/]+$'
    skip: [go-postgres, go-bench, sensor-integration-tests]

  - name: remaining
    when: remaining
    run: ['*']
