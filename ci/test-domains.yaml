# Rules are walked from top to bottom.
# One rule saying run and another saying skip runs the target. The last
# rule skips every target that no earlier rule decided for the PR demonstration.
# ci/decision-defaults supplies decisions when resolution fails.

version: 1

jobs:
  - style-check
  - selector-tests
  - go
  - go-postgres
  - go-bench
  - build-images
  - check-dependent-images-exist
  - sensor-integration-tests
  - should-dispatch
  - wait-for-images
  - wait-for-konflux-images
  - e2e-byodb-tests
  - e2e-db-backup-restore-tests
  - e2e-gke-upgrade-tests
  - e2e-nongroovy-tests-gke
  - e2e-nongroovy-tests-gke-konflux
  - e2e-qa-tests-gke
  - e2e-qa-tests-gke-konflux
  - e2e-qa-tests-ocp-fips-konflux
  - gke-nongroovy-e2e-tests
  - gke-qa-e2e-tests
  - gke-ui-e2e-tests
  - ocp-vm-scanning-e2e-tests
  - check-generated-files
  - check-crd-compatibility
  - golangci-lint
  - github-actions-lint
  - openshift-ci-lint
  - shell-unit-tests
  - ui
  - ui-component
  - local-roxctl-tests
  - db-integration-tests

rules:

  # Tier 1: Label Overrides (highest priority)
  # The label votes run for every target. A skip from another rule clashes,
  # and that clash runs the job.
  - name: run-all-label
    when: label-exists
    label: ci-run-all-tests
    run:
      - '*'

  - name: area-label-sensor
    when: label-exists
    label: area/sensor
    run:
      - sensor-integration-tests

  - name: area-label-central
    when: label-exists
    label: area/central
    run:
      - go-postgres

  - name: area-label-scanner
    when: label-exists
    label: area/scanner
    run:
      - db-integration-tests

  - name: area-label-ui
    when: label-exists
    label: area/ui
    run:
      - ui
      - ui-component
      - gke-ui-e2e-tests

  - name: area-label-operator
    when: label-exists
    label: area/operator
    run:
      - check-crd-compatibility

  - name: area-label-roxctl
    when: label-exists
    label: area/roxctl
    run:
      - local-roxctl-tests

  - name: job-label-e2e-byodb-tests
    when: label-exists
    label: e2e-byodb-tests
    run:
      - e2e-byodb-tests

  - name: job-label-e2e-db-backup-restore-tests
    when: label-exists
    label: e2e-db-backup-restore-tests
    run:
      - e2e-db-backup-restore-tests

  - name: job-label-e2e-gke-upgrade-tests
    when: label-exists
    label: e2e-gke-upgrade-tests
    run:
      - e2e-gke-upgrade-tests

  - name: job-label-e2e-nongroovy-tests-gke
    when: label-exists
    label: e2e-nongroovy-tests-gke
    run:
      - e2e-nongroovy-tests-gke

  - name: job-label-e2e-nongroovy-tests-gke-konflux
    when: label-exists
    label: e2e-nongroovy-tests-gke-konflux
    run:
      - e2e-nongroovy-tests-gke-konflux

  - name: job-label-e2e-qa-tests-gke
    when: label-exists
    label: e2e-qa-tests-gke
    run:
      - e2e-qa-tests-gke

  - name: job-label-e2e-qa-tests-gke-konflux
    when: label-exists
    label: e2e-qa-tests-gke-konflux
    run:
      - e2e-qa-tests-gke-konflux

  - name: job-label-e2e-qa-tests-ocp-fips-konflux
    when: label-exists
    label: e2e-qa-tests-ocp-fips-konflux
    run:
      - e2e-qa-tests-ocp-fips-konflux

  # Tier 2: High-Impact Changes (run everything)
  # These files can change code the path rules do not name.
  - name: tree-may-have-changed
    when: any-file-matches
    paths:
      - '^go\.mod$'
      - '^go\.sum$'
      - '^proto/'
      - '^generated/'
    run:
      - '*'

  # Tier 3: Docs-Only (aggressive skip)
  # A docs-only change skips almost everything. style-check still runs due to clash with always-run rule.
  - name: docs-only
    when: every-file-matches
    paths:
      - '\.md$'
      - '^docs/'
      - '^CHANGELOG'
      - '^README'
    skip:
      - go
      - go-postgres
      - sensor-integration-tests
      - db-integration-tests
      - check-generated-files
      - check-crd-compatibility
      - golangci-lint
      - github-actions-lint
      - openshift-ci-lint
      - ui
      - ui-component
      - local-roxctl-tests
      - shell-unit-tests
      - e2e-byodb-tests
      - e2e-db-backup-restore-tests
      - e2e-gke-upgrade-tests
      - e2e-nongroovy-tests-gke
      - e2e-nongroovy-tests-gke-konflux
      - e2e-qa-tests-gke
      - e2e-qa-tests-gke-konflux
      - e2e-qa-tests-ocp-fips-konflux
      - gke-nongroovy-e2e-tests
      - gke-qa-e2e-tests
      - gke-ui-e2e-tests
      - ocp-vm-scanning-e2e-tests

  # Tier 4: CI Tooling Changes
  # Workflow hooks and the selector do not change the product under test.
  - name: ci-tooling
    when: every-file-matches
    paths:
      - '^\.github/workflows/'
      - '^\.github/actions/ci-select/'
      - '^tools/roxvet/analyzers/validateimports/analyzer\.go$'
      - '^\.openshift-ci/'
      - '^ci/select/'
      - '^ci/decision-defaults$'
      - '^ci/test-domains\.(toml|yaml)$'
    skip:
      - e2e-byodb-tests
      - e2e-db-backup-restore-tests
      - e2e-gke-upgrade-tests
      - e2e-nongroovy-tests-gke
      - e2e-nongroovy-tests-gke-konflux
      - e2e-qa-tests-gke
      - e2e-qa-tests-gke-konflux
      - e2e-qa-tests-ocp-fips-konflux
      - gke-nongroovy-e2e-tests
      - gke-qa-e2e-tests
      - gke-ui-e2e-tests
      - ocp-vm-scanning-e2e-tests
      - db-integration-tests
      - go-postgres
      - sensor-integration-tests

  - name: selector-tests
    when: any-file-matches
    paths:
      - '^\.github/actions/ci-select/'
      - '^\.github/workflows/(build|unit-tests|style|e2e-dispatch|check-crd-compatibility|scanner-db-integration-tests|ci-select-tests|ci-decision)\.yaml$'
      - '^ci/select/'
      - '^ci/test-domains\.(toml|yaml)$'
      - '^ci/decision-defaults$'
    run:
      - selector-tests

  - name: skip-selector-tests
    when: always
    skip:
      - selector-tests

  # Tier 5: Always-Run Tests
  - name: style
    when: always
    run:
      - style-check

  - name: shell-tests
    when: any-file-matches
    paths:
      - '\.sh$'
      - '^scripts/'
      - '^tests/.*\.sh$'
    run:
      - shell-unit-tests

  - name: github-actions-linting
    when: any-file-matches
    paths:
      - '^\.github/workflows/'
    run:
      - github-actions-lint

  - name: openshift-ci-linting
    when: any-file-matches
    paths:
      - '^\.openshift-ci/'
    run:
      - openshift-ci-lint

  # Tier 6: Go Code & Linting
  - name: go-sources
    when: any-file-matches
    paths:
      - '\.go$'
    run:
      - go

  - name: go-linting
    when: any-file-matches
    paths:
      - '\.go$'
      - '^\.golangci\.yml$'
    run:
      - golangci-lint

  - name: skip-golangci-for-non-go
    when: every-file-matches
    paths:
      - '^ui/'
      - '^docs/'
      - '\.md$'
      - '^\.github/'
      - '^\.openshift-ci/'
      - '^scripts/ci/'
    skip:
      - golangci-lint

  - name: go-benchmarks
    when: any-file-matches
    paths:
      - '^(central|sensor|pkg|roxctl|operator|scanner)/.*\.go$'
    run:
      - go-bench

  - name: dependent-image-versions
    when: any-file-matches
    paths:
      - '^COLLECTOR_VERSION$'
      - '^FACT_VERSION$'
    run:
      - check-dependent-images-exist

  # Tier 7: Generated Files
  - name: generated-files
    when: any-file-matches
    paths:
      - '^proto/'
      - '^generated/'
      - '\.proto$'
    run:
      - '*'

  # Tier 8: Subsystem-Specific Rules

  # UI-Only
  - name: ui-only
    when: every-file-matches
    paths:
      - '^ui/'
    run:
      - ui
      - ui-component
      - gke-ui-e2e-tests
    skip:
      - go
      - sensor-integration-tests
      - go-postgres
      - db-integration-tests
      - check-generated-files
      - check-crd-compatibility
      - golangci-lint
      - github-actions-lint
      - openshift-ci-lint
      - local-roxctl-tests
      - shell-unit-tests
      - e2e-byodb-tests
      - e2e-db-backup-restore-tests
      - e2e-gke-upgrade-tests
      - e2e-nongroovy-tests-gke
      - e2e-nongroovy-tests-gke-konflux
      - gke-nongroovy-e2e-tests
      - gke-qa-e2e-tests
      - e2e-qa-tests-gke
      - e2e-qa-tests-gke-konflux
      - e2e-qa-tests-ocp-fips-konflux
      - ocp-vm-scanning-e2e-tests

  # Scanner-Only
  - name: scanner-only
    when: every-file-matches
    paths:
      - '^scanner/'
    run:
      - db-integration-tests
      - go
    skip:
      - sensor-integration-tests
      - go-postgres
      - e2e-gke-upgrade-tests
      - e2e-db-backup-restore-tests
      - e2e-byodb-tests

  # Operator/CRD-Only
  - name: operator-only
    when: every-file-matches
    paths:
      - '^operator/'
      - '\.crd\.yaml$'
      - '^config-controller/'
    run:
      - check-crd-compatibility
      - go
    skip:
      - sensor-integration-tests
      - go-postgres
      - db-integration-tests
      - e2e-nongroovy-tests-gke
      - e2e-nongroovy-tests-gke-konflux
      - gke-nongroovy-e2e-tests

  # roxctl-Only
  - name: roxctl-only
    when: every-file-matches
    paths:
      - '^roxctl/'
    run:
      - local-roxctl-tests
      - go
      - e2e-nongroovy-tests-gke
    skip:
      - sensor-integration-tests
      - go-postgres
      - db-integration-tests
      - gke-ui-e2e-tests
      - e2e-byodb-tests
      - e2e-db-backup-restore-tests
      - e2e-gke-upgrade-tests

  # Tier 9: Central/Sensor Separation (Aggressive)

  # Central-Only Paths
  - name: central-only-domains
    when: every-file-matches
    paths:
      - '^central/(sac|search|auth|authprovider|apitoken|user|group|role|rbac|jwt|serviceidentities)/'
      - '^central/(postgres|globaldb|globalindex|graphdb|dackbox|blob|views)/'
      - '^central/(notifier|notifiers|reports|reportconfigurations)/'
      - '^central/(externalbackups|declarativeconfig|config|installation)/'
      - '^central/(ui|graphql|grpc|endpoints)/'
      - '^central/(featureflags|development|audit|logimbue|trace)/'
      - '^central/(helmcharts|ping|version|systeminfo|docs|internal)/'
      - '^pkg/(sac|search|postgres|notifiers|migrations|renderer|backup)/'
    run:
      - go-postgres
    skip:
      - sensor-integration-tests

  # Sensor-Only Paths
  - name: sensor-only-domains
    when: every-file-matches
    paths:
      - '^sensor/(admission-control|upgrader|debugger|testutils|tests)/'
      - '^sensor/kubernetes/(fake|client|enforcer)/'
      - '^pkg/(admissioncontrol|docker|enforcers|complianceoperator|k8sintrospect|protocompat|compliance/checks|binenc)/'
    run:
      - sensor-integration-tests
    skip:
      - go-postgres

  # Central-Sensor Shared Paths (run both)
  - name: central-sensor-shared-pkg
    when: any-file-matches
    paths:
      - '^pkg/(grpc|sync|concurrency|features|logging|utils|set|retry|env|errorhelpers|testutils|mtls|x509utils|buildinfo|version|cryptoutils|urlfmt|stringutils|timestamps|cloudproviders|cloudsources|roxctl)/'
      - '^pkg/(centralsensor|kubernetes|detection|networkgraph|protoconv|sensor|alerts|images|metrics|telemetry)/'
    run:
      - go-postgres
      - sensor-integration-tests

  # Central domains that talk to Sensor (run both)
  - name: central-sensor-communication
    when: any-file-matches
    paths:
      - '^central/(cluster|deployment|image|baseimage|node|pod|namespace|secret|serviceaccount|virtualmachine)/'
      - '^central/(alert|detection|policy|policycat)/'
      - '^central/(networkbaseline|networkgraph|networkpolicies)/'
      - '^central/(complianceoperator|processindicator)/'
      - '^central/(imageintegration|delegatedregistryconfig|enrichment|reprocessor)/'
      - '^central/(sensor|sensorupgrade|clusterinit|securedclustercertgen)/'
      - '^central/(metrics|telemetry|debug|scrape|vulnmgmt|hash)/'
    run:
      - go-postgres
      - sensor-integration-tests

  # Sensor domains that talk to Central (run both)
  - name: sensor-central-communication
    when: any-file-matches
    paths:
      - '^sensor/common/(admissioncontroller|centralclient|centralproxy|compliance|config|detector|enforcer|networkflow|sensor|image|scannerclient|virtualmachine)/'
      - '^sensor/kubernetes/(eventpipeline|listener|complianceoperator|networkpolicies|telemetry|upgrade|clusterhealth|clustermetrics|clusterstatus|certrefresh)/'
    run:
      - go-postgres
      - sensor-integration-tests

  # Tier 10: E2E Test Selective Execution

  - name: skip-e2e-byodb
    when: every-file-matches
    paths:
      - '^ui/'
      - '^roxctl/'
      - '^operator/'
      - '^sensor/'
      - '^docs/'
      - '^scripts/ci/'
      - '^\.github/'
      - '\.md$'
    skip:
      - e2e-byodb-tests

  - name: skip-e2e-db-backup-restore
    when: every-file-matches
    paths:
      - '^ui/'
      - '^roxctl/'
      - '^operator/'
      - '^sensor/'
      - '^scanner/'
      - '^docs/'
      - '\.md$'
    skip:
      - e2e-db-backup-restore-tests

  - name: skip-e2e-nongroovy
    when: every-file-matches
    paths:
      - '^ui/'
      - '^docs/'
      - '\.md$'
      - '^operator/'
    skip:
      - e2e-nongroovy-tests-gke
      - e2e-nongroovy-tests-gke-konflux
      - gke-nongroovy-e2e-tests

  - name: skip-e2e-upgrade-all
    when: every-file-matches
    paths:
      - '^ui/'
      - '^docs/'
      - '\.md$'
    skip:
      - e2e-gke-upgrade-tests

  # Tier 12: Remaining (temporary PR demonstration policy)
  - name: remaining
    when: remaining
    skip:
      - '*'

requires:
  wait-for-images:
    - should-dispatch
    - build-images
  wait-for-konflux-images:
    - should-dispatch
  e2e-byodb-tests:
    - wait-for-images
  e2e-db-backup-restore-tests:
    - wait-for-images
  e2e-gke-upgrade-tests:
    - wait-for-images
  e2e-nongroovy-tests-gke:
    - wait-for-images
  e2e-nongroovy-tests-gke-konflux:
    - wait-for-konflux-images
  e2e-qa-tests-gke:
    - wait-for-images
  e2e-qa-tests-ocp-fips-konflux:
    - wait-for-konflux-images
  e2e-qa-tests-gke-konflux:
    - wait-for-konflux-images
