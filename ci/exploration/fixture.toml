# Small rule list for the resolver tests.

version = 1

jobs = [
  "style",
  "go",
  "sensor-integration-tests",
  "go-postgres",
  "wait-for-images",
  "should-dispatch",
  "other",
]

[[rules]]
name = "run-all-label"
when = "label-exists"
label = "ci-run-all-tests"
run = ["*"]

[[rules]]
name = "no-files"
when = "no-file-changed"
run = ["*"]

[[rules]]
name = "docs-only"
when = "all-files-changed"
paths = ['\.md$', '^docs/']
run = ["style"]
skip = ["go"]

[[rules]]
name = "go-sources"
when = "any-file-changed"
paths = ['\.go$']
run = ["go"]

[[rules]]
name = "sensor"
when = "any-file-changed"
paths = ['^sensor/']
run = ["sensor-integration-tests"]
skip = ["go-postgres"]

[[rules]]
name = "central-policy"
when = "any-file-changed"
paths = ['^central/policy/']
run = ["go-postgres"]
skip = ["sensor-integration-tests"]

[[rules]]
name = "image-wait"
when = "always"
run = ["wait-for-images"]

[[rules]]
name = "remaining"
when = "remaining"
skip = ["*"]

[requires]
wait-for-images = ["should-dispatch"]
